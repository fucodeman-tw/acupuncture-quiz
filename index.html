<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f7f9">
<title>針灸題庫練習</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1f2328; --muted:#5f6b7a; --line:#dde2e8;
  --pri:#2563c9; --pri-bg:#e8f0fe; --ok:#1f8a46; --ok-bg:#e6f6ec; --ng:#c9302c; --ng-bg:#fdecec;
  --warn:#b45309; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體","Source Han Sans TC",sans-serif;
  font-size:17px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
header.top h1{font-size:22px;margin:6px 0 2px;letter-spacing:.04em}
header.top .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin:12px 0 10px;background:#e9edf2;border-radius:12px;padding:4px}
.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:16px;min-height:46px;color:var(--muted);font-weight:600}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-block;min-width:1.6em;padding:0 .4em;border-radius:99px;background:var(--ng);color:#fff;font-size:12px;line-height:1.6em;margin-left:4px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ctrls label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:2px}
select,input[type=number]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:46px;font-size:16px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--ng);border-color:#f0c4c3}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;min-height:44px;font-size:15px}
.seg button.on{background:var(--pri-bg);color:var(--pri);font-weight:600}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;margin:0 -2px}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:#e3e7ec;border-radius:99px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)} .bar .b-ans{background:var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:18px}
.timer.low{color:var(--ng)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:12px;scroll-margin-top:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;background:#eef1f5;color:var(--muted);line-height:1.7}
.chip.num{background:var(--pri-bg);color:var(--pri);font-weight:700}
.chip.d-易{background:#e6f6ec;color:#1f7a3f}.chip.d-中{background:#fff4dc;color:#94600a}.chip.d-高,.chip.d-難{background:#fdecec;color:#b42b27}
.stem{font-size:18px;white-space:pre-wrap;word-break:break-word;margin:4px 0 12px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:56px;font-size:17px;line-height:1.6;transition:background .12s,border-color .12s}
.opt:not(:disabled):hover{border-color:#b9c4d2}
.opt:not(:disabled):active{background:#f1f4f8}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-top:1px}
.opt .t{flex:1;white-space:pre-wrap;word-break:break-word}
.opt .mk{flex:none;font-weight:700;font-size:15px;margin-top:2px}
.opt.sel{border-color:var(--pri);background:var(--pri-bg)} .opt.sel .k{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok);color:#fff} .opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)} .opt.wrong .k{background:var(--ng);color:#fff} .opt.wrong .mk{color:var(--ng)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:#fafbfc}
.fb .res{font-weight:700;font-size:18px;margin-bottom:4px}
.fb.ok{border-color:#b7e1c5;background:#f3fbf6} .fb.ok .res{color:var(--ok)}
.fb.ng{border-color:#f1c2c0;background:#fff6f6} .fb.ng .res{color:var(--ng)}
.fb.na .res{color:var(--warn)}
.fb h4{margin:10px 0 2px;font-size:15px;color:var(--muted)}
.fb .ex{white-space:pre-wrap;word-break:break-word;font-size:16px}
.fb .src{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--muted)}
.fb .note{font-size:14px;color:var(--muted);margin-top:6px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.nav .btn{min-height:52px;font-size:17px}
details.grid-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;margin-bottom:12px}
details.grid-wrap summary{padding:10px 0;cursor:pointer;font-weight:600;color:var(--muted);list-style-position:inside}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:4px 0 12px}
.grid button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:14px;font-weight:600;padding:0;font-variant-numeric:tabular-nums}
.grid button.g-ok{background:var(--ok-bg);border-color:#9fd6b3;color:var(--ok)}
.grid button.g-ng{background:var(--ng-bg);border-color:#efb1af;color:var(--ng)}
.grid button.g-ans{background:var(--pri-bg);border-color:#a9c3f2;color:var(--pri)}
.grid button.cur{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:#fff;border:1px solid var(--line)}
.legend .l-ok::before{background:var(--ok-bg);border-color:#9fd6b3}.legend .l-ng::before{background:var(--ng-bg);border-color:#efb1af}.legend .l-ans::before{background:var(--pri-bg);border-color:#a9c3f2}
.sum h2{margin:4px 0 8px;font-size:20px}
.big{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.big div{flex:1;min-width:96px;background:#f4f6f9;border-radius:12px;padding:10px;text-align:center}
.big b{display:block;font-size:26px;line-height:1.3}
.big small{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0 14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:13px;color:var(--muted);font-weight:600}
.pct-bar{display:inline-block;width:46px;height:6px;background:#e3e7ec;border-radius:9px;vertical-align:middle;margin-left:6px;overflow:hidden}
.pct-bar i{display:block;height:100%;background:var(--ok)}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.warn{background:#fff7e6;border:1px solid #f3d39b;color:#7a4b00;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
footer .btn{font-size:13px;min-height:36px;padding:4px 10px}
.hide{display:none!important}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-head .chips{margin-bottom:0}
.star-btn{flex:none;border:1.5px solid #dcc58a;background:#fff;color:#7a5c00;border-radius:99px;padding:5px 12px;min-height:40px;font-size:15px;font-weight:600;white-space:nowrap}
.star-btn.on{background:#fff4cc;border-color:#e0a800;color:#7a4f00}
.quick-star{display:block;width:100%;margin:8px 0 2px;border:1.5px dashed #dcc58a;background:#fffbea;color:#7a5c00;border-radius:10px;padding:8px 12px;min-height:44px;font-size:15px;font-weight:600;text-align:left}
.star-note{margin-top:8px;font-size:14px;color:#7a5c00;background:#fffbea;border-radius:8px;padding:6px 10px}
.badge.gold{background:#e0a800}
.grid button{position:relative}
.grid button.starred::after{content:"★";position:absolute;top:-3px;right:1px;font-size:12px;line-height:1;color:#e0a800;text-shadow:0 0 2px #fff}
.legend .l-star::before{content:"★";background:none;border:0;color:#e0a800;width:auto;height:auto;font-size:12px;vertical-align:0}
.slist{margin:4px 0 0;padding:0;list-style:none}
.slist li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.slist .sl-main{flex:1;min-width:0;cursor:pointer}
.slist .sl-main b{font-size:14px;color:var(--pri)}
.slist .sl-main div{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .sl-main small{font-size:12px;color:var(--muted)}
details.sl-wrap summary{cursor:pointer;font-weight:600;color:var(--muted);padding:8px 0 4px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 10px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal h4{margin:14px 0 6px;font-size:15px}
.modal textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal .msg{font-size:14px;margin-top:8px;white-space:pre-wrap}
.modal .msg.ok{color:var(--ok)} .modal .msg.ng{color:var(--ng)}
.modal label.rad{display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:15px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:15px;z-index:60;pointer-events:none;transition:opacity .25s;opacity:0}
.toast.show{opacity:1}
@media (max-width:420px){ .tabs button{font-size:14px;padding:10px 1px} .tabs .badge{font-size:11px;min-width:1.4em;margin-left:2px} .star-btn{font-size:14px;padding:4px 10px} body{font-size:16px} .stem{font-size:17px} .opt{font-size:16px;padding:11px 10px} .wrap{padding:8px 10px 36px} }
@media print{.tabs,.panel.ctrl,.nav,details.grid-wrap,footer,.sticky{display:none!important}}
</style>
</head>

<script type="application/json" id="quiz-data">{"meta":{"total":50,"days":[{"day":1,"date":"2026-10-08","count":50}],"updated":"2026-10-08"},"questions":[{"day":1,"date":"2026-10-08","number":1,"topic":"Day1｜經絡總論：十二經脈交接","group":"經絡總論","qtype":"非題","stem":"十二經脈依「相表裡的陰陽經交於四肢末端、同名陽經交於頭面、手足陰經交於胸中」的規律銜接。下列交接部位，何者錯誤？","options":[["A","手少陰心經→手太陽小腸經：交於小指端"],["B","足少陽膽經→足厥陰肝經：交於足小趾外側端"],["C","手太陽小腸經→足太陽膀胱經：交於目內眥"],["D","足少陰腎經→手厥陰心包經：交於胸中"]],"answer":"B","difficulty":"易","explanation":"《靈樞‧經脈》膽經「其支者，別跗上，入大指之間，循大指歧骨內出其端，還貫爪甲，出三毛」，於足大趾（叢毛處）交足厥陰；肝經亦「起於大指叢毛之際」。足小趾是足太陽交足少陰之處（膀胱經「至小指外側」，腎經「起於小指之下」）。其餘三項正確：心經「循小指之內出其端」交小腸；小腸經「至目內眥」交膀胱；腎經「從肺出絡心，注胸中」交心包。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷一‧手足陰陽流注論","id":"D1-001","h":"50cf136a78"},{"day":1,"date":"2026-10-08","number":2,"topic":"Day1｜經絡總論：營氣流注（十四經）","group":"經絡總論","qtype":"經典填空","stem":"《靈樞‧營氣》述營氣「從肝上注肺，上循喉嚨，入頏顙之竅，究於畜門。其支別者，上額，循巔，下項中，循脊，入骶，是____脈也，絡陰器，上過毛中，入臍中，上循腹裏，入缺盆，下注肺中，復出太陰」。空格應填何脈？","options":[["A","督"],["B","帶"],["C","陽蹻"],["D","衝"]],"answer":"A","difficulty":"中","explanation":"原文明言「是督脈也」。營氣循十二經一周後，其支別沿督脈上額循巔、下項循脊，再「入臍中，上循腹裏」（即任脈所行）而入缺盆注肺，復出手太陰，故後世稱營氣為「十四經流注」。衝脈「起於氣街，並少陰之經，俠臍上行」；陽蹻「起於跟中，循外踝上行」；帶脈「起於季脅，迴身一周」，均與本段不符。（本資料庫靈樞底本此處作「入焔」，屬傳鈔訛字，《甲乙經》卷二引作「循脊入骶，是督脈也」。）","source":"《靈樞經》卷四‧營氣第十六；《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-002","h":"5531aa246e"},{"day":1,"date":"2026-10-08","number":3,"topic":"Day1｜經絡總論：十二經脈分布規律","group":"經絡總論","qtype":"非題","stem":"關於十二經脈在四肢與軀幹的分布，下列何者錯誤？","options":[["A","腹部足少陰腎經距前正中線2寸，足陽明胃經距前正中線4寸"],["B","內踝上8寸以下，小腿內側前緣為足厥陰、中線為足太陰"],["C","上肢內側前緣為手太陰、中線為手厥陰、後緣為手少陰"],["D","胸部足少陰距前正中線2寸、足陽明4寸、足太陰6寸"]],"answer":"A","difficulty":"中","explanation":"腹部足少陰距前正中線0.5寸、足陽明2寸、足太陰4寸；《甲乙經》卷三篇名即作「腹自幽門挾巨闕兩傍各半寸」（足少陰）、「腹自不容俠幽門兩傍各一寸五分」（足陽明，即距中線2寸）。小腿內側：肝經「上踝八寸，交出太陰之後」、脾經「交出厥陰之前」，故內踝上8寸以下厥陰在前、太陰居中。胸部2、4、6寸之說正確。","source":"《靈樞經》卷三‧經脈第十；《針灸甲乙經》卷三‧第二十、第二十一","id":"D1-003","h":"764011b601"},{"day":1,"date":"2026-10-08","number":4,"topic":"Day1｜經絡總論：經脈走向與衝脈","group":"經絡總論","qtype":"經典","stem":"《靈樞‧逆順肥瘦》說明「手之三陰，從藏走手……足之三陰，從足走腹」後，黃帝問：「少陰之脈獨下行，何也？」岐伯答「不然」，並以何脈之下行支「注少陰之大絡，出於氣街，循陰股內廉，入膕中……下至內踝之後屬而別」加以解釋？","options":[["A","陰維脈"],["B","足少陰經別"],["C","陰蹻脈"],["D","衝脈"]],"answer":"D","difficulty":"高","explanation":"岐伯指出下行者乃「衝脈者，五藏六府之海也……其下者，注少陰之大絡，出於氣街……下至內踝之後屬而別。其下者，並於少陰之經，滲三陰；其前者……入大指間，滲諸絡而溫肌肉」，故「別絡結則跗上不動，不動則厥，厥則寒矣」。足少陰經本身仍是從足走腹。陰蹻「起於然骨之後，上內踝之上」上行；陰維起於諸陰交（築賓）上行；足少陰經別「至膕中，別走太陽而合」，均非下行支。","source":"《靈樞經》卷六‧逆順肥瘦第三十八；《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-004","h":"7aa4f297f9"},{"day":1,"date":"2026-10-08","number":5,"topic":"Day1｜靈樞經脈：足陽明是動病","group":"靈樞經脈","qtype":"臨床情境","stem":"28歲男性，家屬代訴近一週惡寒振慄、頻頻呻吟呵欠，討厭見人與火光，聽到木頭聲響即驚惕不安，常獨自關門閉窗而居；昨夜突然爬上高處唱歌、脫衣奔走，並腹脹腸鳴。若依《靈樞‧經脈》病候歸經，此表現最符合下列何者？","options":[["A","手太陰肺經是動病，稱為「臂厥」"],["B","足陽明胃經是動病，稱為「骭厥」"],["C","足少陽膽經是動病，稱為「陽厥」"],["D","足少陰腎經是動病，稱為「骨厥」"]],"answer":"B","difficulty":"中","explanation":"胃經：「是動則病洒洒振寒，善呻數欠，顏黑，病至則惡人與火，聞木聲則惕然而驚，心欲動，獨閉戶塞牖而處，甚則欲上高而歌，棄衣而走，賁響腹脹，是為骭厥。」腎經骨厥為「飢不欲食，面如漆柴……心惕惕如人將捕之」；肺經臂厥為「肺脹滿，膨膨而喘欬……甚則交兩手而瞀」；膽經陽厥為「口苦，善太息，心脇痛，不能轉側」。臨床提醒：急性躁狂或精神病樣發作有自傷、傷人風險，應會同精神科急診評估，並排除物質使用、甲狀腺亢進、腦炎等器質性原因，針灸僅能作為輔助。","source":"《靈樞經》卷三‧經脈第十","id":"D1-005","h":"afd4063260"},{"day":1,"date":"2026-10-08","number":6,"topic":"Day1｜靈樞經脈：手太陰病候＋急症轉診","group":"靈樞經脈","qtype":"臨床情境","stem":"66歲男性，吸菸40包年，慢性咳喘多年，平素「肺脹滿，膨膨而喘欬，缺盆中痛」。今日搬重物後突發右側胸痛、呼吸急促、坐立不安，唇色發紺，血氧飽和度86%，右側呼吸音減弱。下列處置何者最適當？","options":[["A","先於少商、商陽點刺放血，觀察半小時再決定是否轉診"],["B","於膻中、定喘施隔薑灸後，囑回家休息"],["C","判定為急重症（疑自發性氣胸或慢性阻塞性肺病急性惡化），暫停針灸，給氧並維持呼吸道，立即轉送急診"],["D","依《靈樞‧經脈》屬手太陰是動病，深刺中府、肺俞以宣肺平喘"]],"answer":"C","difficulty":"易","explanation":"平素症狀雖符合《靈樞‧經脈》肺經「是動則病肺脹滿，膨膨而喘欬，缺盆中痛，甚則交兩手而瞀，此為臂厥」，但本次出現突發單側胸痛、發紺、血氧\u003c90%、患側呼吸音減弱，屬紅旗徵象，須優先排除氣胸與急性呼吸衰竭並立即轉診。中府不可向內深刺、背部俞穴不宜深刺（皆有氣胸風險）；放血觀察或灸後回家都會延誤處置。","source":"《靈樞經》卷三‧經脈第十；本資料庫 acupoints（中府、肺俞注意事項）；notes「針刺異常情況處理」","id":"D1-006","h":"ad37c3a113"},{"day":1,"date":"2026-10-08","number":7,"topic":"Day1｜靈樞經脈：足太陰是動病","group":"靈樞經脈","qtype":"經典填空","stem":"《靈樞‧經脈》：「是動則病舌本強，食則嘔，胃脘痛，腹脹善噫，得____與氣，則快然如衰，身體皆重。」空格與所屬經脈應為？","options":[["A","食；足陽明胃經"],["B","後；足太陰脾經"],["C","汗；足太陰脾經"],["D","後；足陽明胃經"]],"answer":"B","difficulty":"中","explanation":"此為脾經是動病。「得後與氣」指排便或矢氣之後，腹脹即覺輕快（快然如衰）。脾經「入腹，屬脾，絡胃，上膈，挾咽，連舌本，散舌下」，故有舌本強、食則嘔、胃脘痛。胃經是動病為「骭厥」（洒洒振寒、惡人與火等），不是這段。","source":"《靈樞經》卷三‧經脈第十","id":"D1-007","h":"74b1c2d0ec"},{"day":1,"date":"2026-10-08","number":8,"topic":"Day1｜靈樞經脈：手陽明循行（交人中）＋面癱紅旗","group":"靈樞經脈","qtype":"臨床情境","stem":"35歲女性，兩天前右耳後疼痛，今晨發現右側額紋消失、閉眼不全、口角歪向左側、鼓腮漏氣。依《靈樞‧經脈》手陽明大腸經「還出挾口，交人中，左之右，右之左，上挾鼻孔」之循行特點，並考量安全評估，下列何者正確？","options":[["A","遠端可取左側（健側）合谷，配合患側陽白、四白、地倉、頰車等；急性期面部取穴宜少、刺激宜輕"],["B","應檢查外耳道與耳廓有無皰疹；若有，須考慮 Ramsay Hunt 症候群，宜會同西醫評估抗病毒治療"],["C","若病程中出現肢體無力、言語不清、複視等神經學症狀，應懷疑中樞性病變並立即轉診急診"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"手陽明經左右交叉於人中，故面口病可取對側合谷（亦合「面口合谷收」）；周圍性面癱急性期面部宜少針、輕刺激。耳後痛加上耳部皰疹時，須考慮帶狀皰疹病毒引起的 Ramsay Hunt 症候群，宜及早會同西醫給予抗病毒治療。額紋消失屬周圍性面癱，但若合併肢體無力、構音障礙等，應懷疑中風等中樞病變而立即轉診。三項皆正確。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷四‧四總穴歌","id":"D1-008","h":"38b43e056e"},{"day":1,"date":"2026-10-08","number":9,"topic":"Day1｜十五絡脈：絡穴位置（原文）","group":"十五絡脈","qtype":"非題","stem":"《靈樞‧經脈》記載十五絡穴「去腕」「去踝」的距離，下列何者與原文不符？","options":[["A","足陽明之別，名曰豐隆，去踝五寸，別走太陰"],["B","手心主之別，名曰內關，去腕二寸，出於兩筋之間"],["C","足太陽之別，名曰飛揚，去踝七寸，別走少陰"],["D","手少陰之別，名曰通里，去腕一寸半，別而上行"]],"answer":"A","difficulty":"中","explanation":"原文為「足陽明之別，名曰豐隆，去踝八寸」。「去踝五寸」的是足少陽光明（去踝五寸，別走厥陰）與足厥陰蠡溝（去內踝五寸）。另應注意古今差異：原文列缺「取之去腕半寸」、通里「去腕一寸半……取之掌後一寸」，與現代定位（列缺腕上1.5寸、通里腕上1寸）不同，作答時要分清「原文」與「現行定位」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-009","h":"7d6d8fe983"},{"day":1,"date":"2026-10-08","number":10,"topic":"Day1｜十五絡脈：絡脈病候","group":"十五絡脈","qtype":"非題","stem":"下列《靈樞‧經脈》十五絡脈之病候與絡穴配對，何者錯誤？","options":[["A","實則脊強，虛則頭重，高搖之──任脈之別尾翳（鳩尾）"],["B","實則腸中切痛，虛則鼓脹──足太陰之別公孫"],["C","實則支膈，虛則不能言──手少陰之別通里"],["D","實則狂癲，虛則足不收、脛枯──足陽明之別豐隆"]],"answer":"A","difficulty":"中","explanation":"「實則脊強，虛則頭重，高搖之」屬督脈之別長強。任脈之別尾翳（即鳩尾；《針灸大成‧十五絡脈歌》作「屏翳」）的病候為「實則腹皮痛，虛則癢搔」。其餘三項皆與原文相符：通里「其實則支膈，虛則不能言」；公孫「實則腸中切痛，虛則鼓脹」；豐隆「實則狂癲，虛則足不收，脛枯」。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷九‧十五絡脈歌","id":"D1-010","h":"7459755773"},{"day":1,"date":"2026-10-08","number":11,"topic":"Day1｜十二經別：離入出合","group":"十二經別","qtype":"經典","stem":"關於《靈樞‧經別》十二經別的「離、入、出、合」，下列何者正確？","options":[["A","經別多從四肢末端井穴分出，淺行於體表"],["B","手太陰經別最後復合於手太陰本經"],["C","足少陰之正至膕中，別走太陽而合，上至腎，當十四椎，出屬帶脈"],["D","足厥陰經別上行至巔頂，合於督脈"]],"answer":"C","difficulty":"中","explanation":"原文：「足少陰之正，至膕中，別走太陽而合，上至腎，當十四椎，出屬帶脈。」陰經經別合於相表裡的陽經：手太陰之正「上出缺盆，循喉嚨，復合陽明」；足厥陰之正「上至毛際，合於少陽」。經別多從肘膝上下的正經分出（離），深入胸腹（入），淺出頭項（出），再合於陽經（合），並非從井穴淺行。","source":"《靈樞經》卷三‧經別第十一","id":"D1-011","h":"fd1c232727"},{"day":1,"date":"2026-10-08","number":12,"topic":"Day1｜十二經筋：寒熱病機與治法","group":"十二經筋","qtype":"非題","stem":"依《靈樞‧經筋》，下列敘述何者錯誤？","options":[["A","足陽明筋病頰筋有寒則急引頰移口，「治之以馬膏，膏其急者，以白酒和桂，以塗其緩者」"],["B","經筋病屬熱而筋弛縱不收者，仍以燔鍼劫刺為首選"],["C","足陽明之筋病可見「卒口僻，急者，目不合」"],["D","經筋之病，寒則反折筋急"]],"answer":"B","difficulty":"高","explanation":"原文：「經筋之病，寒則反折筋急，熱則筋弛縱不收……焠刺者，刺寒急也，熱則筋縱不收，無用燔鍼。」所以「以知為數，以痛為輸」的燔鍼劫刺是治寒急，熱證筋縱不用燔鍼。足陽明之筋「卒口僻，急者，目不合，熱則筋縱，目不開」，並以馬膏、白酒和桂外治，皆為原文。","source":"《靈樞經》卷四‧經筋第十三","id":"D1-012","h":"881f96e931"},{"day":1,"date":"2026-10-08","number":13,"topic":"Day1｜十二經筋：與經脈比較","group":"十二經筋","qtype":"非題","stem":"關於十二經筋與十二經脈的比較，下列何者為非？","options":[["A","經筋多結聚於關節與骨骼周圍"],["B","經筋病候以拘攣、轉筋、強直或弛縱為主"],["C","十二經筋皆起於四肢末端，向心性循行"],["D","經筋與經脈一樣內屬臟腑，且各有專屬的腧穴"]],"answer":"D","difficulty":"易","explanation":"經筋是十二經脈之氣「結、聚、散、絡」於筋肉關節的體系，不入臟腑，也沒有專屬腧穴，治療「以痛為輸」（取壓痛點）。其起於四末、向心而行、結聚關節、病候以筋肉拘攣弛縱為主，皆為正確敘述。","source":"《靈樞經》卷四‧經筋第十三；notes「十二經別、十五絡脈、十二經筋比較」","id":"D1-013","h":"d3dd14d64a"},{"day":1,"date":"2026-10-08","number":14,"topic":"Day1｜奇經八脈：病候","group":"奇經八脈","qtype":"非題","stem":"《針灸甲乙經‧奇經八脈第二》綜合《素問》《難經》論奇經病候，下列何者錯誤？","options":[["A","任脈為病，男子內結七疝，女子帶下瘕聚"],["B","陽蹻為病，陽緩而陰急"],["C","衝脈為病，逆氣裏急"],["D","督脈為病，脊強反折"]],"answer":"B","difficulty":"中","explanation":"原文：「陰蹺為病，陽緩而陰急；陽蹺為病，陰緩而陽急。」題目把陰、陽蹻互換。任脈「男子內結七疝，女子帶下瘕聚」、衝脈「逆氣裏急」、督脈「脊強反折」皆為原文。記憶法：哪條蹻脈病，哪一側就「急」（陽蹻病→外側陽急，陰蹻病→內側陰急）。","source":"《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-014","h":"cfc01a7ed7"},{"day":1,"date":"2026-10-08","number":15,"topic":"Day1｜奇經八脈：陰維、陽維起穴（歌訣）","group":"奇經八脈","qtype":"經典填空","stem":"《針灸大成‧奇經八脈歌（醫經小學）》：「諸陰交起陰維脈，發足少陰____郄。諸陽會起陽維脈，太陽之郄____穴。」空格依序為？","options":[["A","照海；申脈"],["B","交信；跗陽"],["C","築賓；陽交"],["D","築賓；金門"]],"answer":"D","difficulty":"高","explanation":"陰維脈起於諸陰之交，其郄為足少陰築賓；陽維脈起於諸陽之會，「別於金門」（金門為足太陽膀胱經郄穴），「郄於陽交」。所以歌訣第二空是金門而非陽交──陽交是陽維脈郄穴，但歌中「太陽之郄」指的是膀胱經郄穴金門。交信、跗陽分別是陰蹻、陽蹻郄穴；照海、申脈是二蹻的八脈交會穴。","source":"《針灸大成》卷九‧奇經八脈歌（醫經小學）、奇經八脈簡要","id":"D1-015","h":"3e3f21056c"},{"day":1,"date":"2026-10-08","number":16,"topic":"Day1｜奇經八脈：帶脈病證取穴","group":"奇經八脈","qtype":"臨床情境","stem":"42歲女性，白帶量多、清稀無臭三個月，自覺腰部冷重「如坐水中」，腹部脹滿；舌淡胖、苔白滑，脈沉緩。婦科內診、子宮頸抹片與超音波檢查皆正常。依奇經八脈辨證，最適當的歸經與選穴為？","options":[["A","衝脈；取公孫，配內關"],["B","帶脈；取帶脈穴，配足臨泣、外關"],["C","陽蹻脈；取申脈，配跗陽"],["D","陰維脈；取內關，配築賓"]],"answer":"B","difficulty":"易","explanation":"《針灸大成‧奇經八脈簡要》：「帶脈者，起於季脅，迴身一周，其為病也，腹滿，腰溶溶如坐水中。」帶脈穴（GB26）為足少陽與帶脈之會；足臨泣通帶脈，「與外關主客相應」。本案已先完成婦科檢查；若有血性或惡臭分泌物、停經後出血、腹部腫塊，仍應優先轉介婦科。","source":"《針灸大成》卷九‧奇經八脈簡要；卷七‧帶脈（考穴治病）","id":"D1-016","h":"6db7f720f7"},{"day":1,"date":"2026-10-08","number":17,"topic":"Day1｜奇經八脈：蹻脈與睡眠","group":"奇經八脈","qtype":"臨床情境","stem":"50歲女性，失眠半年，入睡困難、易醒，兩目乾澀，手足心熱；舌紅少苔，脈細數。依《靈樞‧大惑論》「衛氣不得入於陰，常留於陽，留於陽則陽氣滿，陽氣滿則陽蹻盛，不得入於陰則陰氣虛，故目不瞑矣」，下列配穴與補瀉何者最適當？","options":[["A","補照海、瀉申脈"],["B","單灸申脈，不取照海"],["C","補申脈、瀉照海"],["D","照海、申脈皆用瀉法"]],"answer":"A","difficulty":"中","explanation":"照海通陰蹻，申脈通陽蹻。陽蹻盛、陰氣虛而目不瞑，治宜瀉陽蹻（申脈）、補陰蹻（照海），可配神門、三陰交、安眠等。補申脈、瀉照海會使陽更盛。臨床提醒：失眠合併大聲打鼾、白天嗜睡，應評估睡眠呼吸中止症；合併情緒低落或自殺意念，應轉介精神科。","source":"《靈樞經》卷十二‧大惑論第八十；《靈樞經》卷四‧脈度第十七","id":"D1-017","h":"4d5681c004"},{"day":1,"date":"2026-10-08","number":18,"topic":"Day1｜四海：衝脈之輸","group":"四海","qtype":"經典填空","stem":"《靈樞‧海論》：「衝脈者，為十二經之海，其輸上在於____，下出於巨虛之上下廉。」空格為？","options":[["A","風府"],["B","氣街"],["C","大杼"],["D","人迎"]],"answer":"C","difficulty":"中","explanation":"四海之輸：胃為水穀之海，「其輸上在氣街，下至三里」；衝脈為十二經之海（血海），「其輸上在於大杼，下出於巨虛之上下廉」；膻中為氣之海，「其輸上在柱骨之上下，前在於人迎」；腦為髓之海，「其輸上在於其蓋，下在風府」。大杼同時也是八會穴中的骨會。","source":"《靈樞經》卷六‧海論第三十三；《針灸甲乙經》卷一‧四海第八","id":"D1-018","h":"ea3f633462"},{"day":1,"date":"2026-10-08","number":19,"topic":"Day1｜四海：髓海不足（情境）","group":"四海","qtype":"臨床情境","stem":"76歲男性，近一年漸覺頭暈、耳鳴，小腿痠軟無力，視物昏花，終日倦怠欲臥；舌淡、脈沉細尺弱，神經學檢查無局部缺損。依《靈樞‧海論》，此屬何者不足？其所輸之穴為何？","options":[["A","氣海不足；上在柱骨之上下，前在人迎"],["B","水穀之海不足；上在氣街，下至三里"],["C","血海不足；上在大杼，下出巨虛上下廉"],["D","髓海不足；上在其蓋（百會），下在風府"]],"answer":"D","difficulty":"中","explanation":"原文：「髓海不足，則腦轉耳鳴，脛痠眩冒，目無所見，懈怠安臥。」腦為髓之海，「其輸上在於其蓋，下在風府」（其蓋即百會）。風府須伏案正坐、向下頜方向緩刺0.5–1寸，不可向上深刺以免傷及延髓。紅旗：若突發眩暈並出現複視、構音障礙、吞嚥困難、肢體無力或步態不穩（疑後循環中風），應立即轉送急診。","source":"《靈樞經》卷六‧海論第三十三；本資料庫 acupoints（風府）","id":"D1-019","h":"8687435b52"},{"day":1,"date":"2026-10-08","number":20,"topic":"Day1｜根結：開闔樞","group":"根結","qtype":"經典填空","stem":"《靈樞‧根結》：「太陽為開，陽明為闔，少陽為樞……闔折則氣無所止息，而____起矣。」空格及其取經為？","options":[["A","骨繇；取之少陽"],["B","暴病；取之太陽"],["C","痿疾；取之陽明"],["D","膈洞；取之太陰"]],"answer":"C","difficulty":"高","explanation":"三陽：開折則「肉節瀆而暴病起」，取太陽；闔折則「氣無所止息，而痿疾起」，取陽明；樞折則「骨繇而不安於地」，取少陽。「膈洞」是三陰中太陰開折（倉廩無所輸）。此與《甲乙經》「治痿者獨取陽明」之說相互呼應。","source":"《靈樞經》卷二‧根結第五；《針灸甲乙經》卷十‧熱在五臟發痿第四","id":"D1-020","h":"4e64fdb097"},{"day":1,"date":"2026-10-08","number":21,"topic":"Day1｜根結與標本：出處與意義","group":"根結與標本","qtype":"非題","stem":"關於根結、標本理論，下列何者錯誤？","options":[["A","根結與標本皆強調四肢末端（根、本）與頭面軀幹（結、標）的上下聯繫"],["B","《靈樞‧衛氣》論標本之候：「下虛則厥，下盛則熱，上虛則眩，上盛則熱痛」"],["C","《靈樞‧根結》謂足太陰「根於隱白，結於太倉」"],["D","根結理論主要見於《靈樞‧衛氣》，標本理論主要見於《靈樞‧根結》"]],"answer":"D","difficulty":"易","explanation":"出處相反：根結出自《靈樞‧根結第五》，十二經標本與氣街出自《靈樞‧衛氣第五十二》（《甲乙經》卷二〈十二經標本第四〉同）。兩者都說明四肢末端穴位能治頭面軀幹病。足太陰「根於隱白，結於太倉」、標本之候「下虛則厥……上盛則熱痛」皆為原文。","source":"《靈樞經》卷二‧根結第五、卷八‧衛氣第五十二","id":"D1-021","h":"ab85ee48c7"},{"day":1,"date":"2026-10-08","number":22,"topic":"Day1｜九鍼十二原：十二原","group":"九鍼十二原","qtype":"經典填空","stem":"《靈樞‧九鍼十二原》：「五藏有疾，當取之十二原。」十二原除五臟原穴左右各一外，另有「膏之原，出於____」及「肓之原，出於脖胦」。空格與「脖胦」的今名依序為？","options":[["A","鳩尾；氣海"],["B","中脘；氣海"],["C","膻中；關元"],["D","巨闕；神闕"]],"answer":"A","difficulty":"中","explanation":"原文：「膏之原，出於鳩尾，鳩尾一。肓之原，出於脖胦，脖胦一。」五臟原穴（太淵、大陵、太衝、太白、太谿）左右各一共10穴，再加鳩尾、脖胦（即氣海，臍下1.5寸）共12，稱十二原；這和後世「十二經原穴」不同。鳩尾同時是任脈絡穴。","source":"《靈樞經》卷一‧九鍼十二原第一；《針灸甲乙經》卷一‧十二原第六","id":"D1-022","h":"29e96c7bf9"},{"day":1,"date":"2026-10-08","number":23,"topic":"Day1｜九鍼十二原：心之原","group":"九鍼十二原","qtype":"經典","stem":"依《靈樞‧九鍼十二原》所列，「陽中之太陽，心也，其原出於____」。空格為何？","options":[["A","太淵"],["B","少府"],["C","大陵"],["D","神門"]],"answer":"C","difficulty":"高","explanation":"《靈樞》十二原中，心之原取手厥陰心包經的大陵。《靈樞‧邪客》解釋：「諸邪之在於心者，皆在於心之包絡……故獨無腧焉」，少陰「獨取其經於掌後銳骨之端」；《靈樞‧本輸》也作「心出於中衝……注於大陵」。現代以神門為心經原穴（陰經以輸代原），是後世之說。太淵為肺之原；少府為心經滎穴。","source":"《靈樞經》卷一‧九鍼十二原第一、本輸第二；卷十‧邪客第七十一","id":"D1-023","h":"e91bc3d836"},{"day":1,"date":"2026-10-08","number":24,"topic":"Day1｜九鍼十二原：刺法要旨","group":"九鍼十二原","qtype":"非題","stem":"依《靈樞‧九鍼十二原》，下列敘述何者錯誤？","options":[["A","「刺寒清者，如人不欲行」，指寒證宜深刺留針以候氣"],["B","「刺諸熱者，如以手探湯」，指熱證宜淺刺疾出"],["C","「疾高而內者，取之陰之陵泉」"],["D","「陰有陽疾者，取之陽之陵泉」"]],"answer":"D","difficulty":"高","explanation":"原文：「陰有陽疾者，取之下陵三里，正往無殆，氣下乃止，不下復始也。疾高而內者，取之陰之陵泉。疾高而外者，取之陽之陵泉也。」所以「陰有陽疾」取的是足三里（下陵），不是陽陵泉。以手探湯指輕觸即起（淺而疾），人不欲行指遲留不去（深而留），與《經脈》「熱則疾之，寒則留之」意思相通。","source":"《靈樞經》卷一‧九鍼十二原第一","id":"D1-024","h":"196205670d"},{"day":1,"date":"2026-10-08","number":25,"topic":"Day1｜九鍼十二原：九鍼形制","group":"九鍼十二原","qtype":"經典","stem":"《靈樞‧九鍼十二原》九鍼中，「末如劍鋒，以取大膿」者為何？其長度為何？","options":[["A","大鍼；長四寸"],["B","鋒鍼；長一寸六分"],["C","員利鍼；長一寸六分"],["D","鈹鍼；長四寸，廣二分半"]],"answer":"D","difficulty":"易","explanation":"「鈹鍼者，末如劍鋒，以取大膿」，「長四寸，廣二分半」，是後世外科切開排膿刀的前身（九刺中的「大寫刺」即用鈹鍼）。鋒鍼「刃三隅以發痼疾」（三稜針前身）；員利鍼「大如氂，且員且銳，中身微大，以取暴氣」；大鍼「尖如挺，其鋒微員，以寫機關之水也」。","source":"《靈樞經》卷一‧九鍼十二原第一","id":"D1-025","h":"55f026485b"},{"day":1,"date":"2026-10-08","number":26,"topic":"Day1｜靈樞經脈：人迎寸口脈法","group":"靈樞經脈","qtype":"經典","stem":"《靈樞‧經脈》以人迎與寸口比較判斷經脈盛衰。「盛者人迎大再倍於寸口」所指為何經之盛？","options":[["A","手太陽小腸經"],["B","足陽明胃經"],["C","足太陰脾經"],["D","手少陽三焦經"]],"answer":"A","difficulty":"高","explanation":"陽經以人迎大於寸口為盛：陽明（大腸、胃）「人迎大三倍於寸口」，太陽（小腸、膀胱）「人迎大再倍於寸口」，少陽（三焦、膽）「人迎大一倍於寸口」。陰經以寸口大於人迎為盛：太陰（肺、脾）三倍，少陰（心、腎）再倍，厥陰（心包、肝）一倍。足太陰為「寸口大三倍於人迎」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-026","h":"31479e9e0b"},{"day":1,"date":"2026-10-08","number":27,"topic":"Day1｜靈樞經脈：經脈與絡脈之別、絡脈色診","group":"靈樞經脈","qtype":"非題","stem":"依《靈樞‧經脈》對經脈與絡脈的論述，下列何者錯誤？","options":[["A","諸脈之浮而常見者，皆絡脈也"],["B","經脈十二者，伏行分肉之間，深而不見"],["C","胃中寒，則手魚際之絡多赤"],["D","凡診絡脈，脈色青則寒且痛，赤則有熱"]],"answer":"C","difficulty":"中","explanation":"原文：「胃中寒，手魚之絡多青矣；胃中有熱，魚際絡赤。」所以寒為青、熱為赤，題目將寒熱顛倒。原文又說：「經脈十二者，伏行分肉之間，深而不見……諸脈之浮而常見者，皆絡脈也」；「凡診絡脈，脈色青則寒且痛，赤則有熱」；並指出刺絡應「刺其結上，甚血者雖無結，急取之」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-027","h":"463b8b29c6"},{"day":1,"date":"2026-10-08","number":28,"topic":"Day1｜十二經氣血多少","group":"十二經氣血多少","qtype":"經典","stem":"《刺灸心法要訣‧十二經氣血多少歌》：「多氣多血惟陽明，少氣太陽厥陰同，二少太陰常少血。」依其注文，下列何組四經全屬「多血少氣」？","options":[["A","三焦、膽、腎、心"],["B","心包絡、膀胱、小腸、肝"],["C","脾、肺、三焦、膽"],["D","大腸、胃、膀胱、肝"]],"answer":"B","difficulty":"中","explanation":"注：「手陽明大腸、足陽明胃，此二經多氣多血之經也；三焦、膽、腎、心、脾、肺，此六經多氣少血也；心包絡、膀胱、小腸、肝，此四經乃多血少氣也。」也就是太陽（小腸、膀胱）與厥陰（心包、肝）多血少氣，少陽、少陰、太陰多氣少血。","source":"《刺灸心法要訣》卷一‧十二經氣血多少歌","id":"D1-028","h":"920dc56baa"},{"day":1,"date":"2026-10-08","number":29,"topic":"Day1｜腧穴總論：骨度分寸古今差異","group":"腧穴總論","qtype":"經典","stem":"《靈樞‧骨度》記載「眾人之度」。下列哪一項與現行教材（WHO 2008 標準）的骨度分寸「不一致」？","options":[["A","內輔下廉下至內踝，長一尺三寸"],["B","膝以下至外踝，長一尺六寸"],["C","髀樞以下至膝中，長一尺九寸"],["D","兩乳之間，廣九寸半"]],"answer":"D","difficulty":"高","explanation":"現行骨度以兩乳頭間為8寸；《刺灸心法要訣‧骨度尺寸》在「兩乳之間，廣九寸半」下也注明「當折八寸為當」。其餘三項與現行一致：股骨大轉子至膕橫紋19寸、膕橫紋至外踝尖16寸、脛骨內側髁下緣至內踝尖13寸。另一個古今不一致的例子：原文「肘至腕長一尺二寸半」，現行為12寸。（《刺灸心法要訣》傳本作「內輔下廉下至內踝，長一尺二寸」，與《靈樞》不同，作答以《靈樞》為準。）","source":"《靈樞經》卷四‧骨度第十四；《刺灸心法要訣》卷二‧骨度尺寸","id":"D1-029","h":"25690038ab"},{"day":1,"date":"2026-10-08","number":30,"topic":"Day1｜腧穴總論：頭部直寸","group":"腧穴總論","qtype":"經典填空","stem":"《刺灸心法要訣‧骨度尺寸》按語：頭部以前髮際至後髮際折為一尺二寸；「如髮際不明，則取眉心直上，後至大杼骨，折作____」。空格為？","options":[["A","二尺"],["B","一尺二寸"],["C","一尺八寸"],["D","一尺五寸"]],"answer":"C","difficulty":"中","explanation":"髮際不明時，由眉心經頭頂至大杼骨（第7頸椎）折作一尺八寸。換算現行骨度：眉間至前髮際3寸＋前後髮際12寸＋後髮際至第7頸椎棘突3寸＝18寸。同書又說頭部橫寸「以眼內角至外角，此為一寸」。","source":"《刺灸心法要訣》卷二‧周身名位骨度／骨度尺寸","id":"D1-030","h":"2e523c17ce"},{"day":1,"date":"2026-10-08","number":31,"topic":"Day1｜腧穴總論：手指同身寸","group":"腧穴總論","qtype":"非題","stem":"關於腧穴定位的指寸法與骨度法，下列何者錯誤？","options":[["A","中指同身寸以中指屈曲時，中節橈側兩端紋頭之間為1寸"],["B","拇指同身寸以拇指指間關節的寬度為1寸"],["C","為5歲兒童取四肢穴時，以醫師本人的中指同身寸量取最準確"],["D","骨度分寸不論患者高矮胖瘦，皆按同一分寸等分折量"]],"answer":"C","difficulty":"易","explanation":"指寸法須以「患者本人」的手指為準（《針灸大成》中指同身寸圖：「手中指第二節內廷，兩橫紋頭相去為一寸」，並取男左女右；底本作「男左如右」）；醫師與兒童手指大小差很多，用醫師的手指量會嚴重偏差。兒童及體型特殊者應以骨度折量為主、指寸為輔。骨度法依比例等分，因此不受高矮胖瘦影響。","source":"《針灸大成》卷五‧中指同身寸圖；notes「腧穴定位法與骨度分寸」","id":"D1-031","h":"9683c16fbc"},{"day":1,"date":"2026-10-08","number":32,"topic":"Day1｜腧穴總論：腧穴作用","group":"腧穴總論","qtype":"概念","stem":"下列何者屬於腧穴「相對特異性」作用的典型例子？","options":[["A","艾灸至陰矯正胎位"],["B","合谷治頭面口齒疾病"],["C","膝眼治膝關節疼痛"],["D","天樞既能止瀉又能通便"]],"answer":"A","difficulty":"易","explanation":"腧穴作用分近治、遠治與特殊作用。特殊作用包括「相對特異性」（如至陰矯正胎位、大椎退熱）與「雙向調節」（如天樞止瀉又通便、內關可升可降心率）。合谷治頭面是「經脈所過，主治所及」的遠治作用；膝眼治膝痛是近治作用。","source":"notes「腧穴分類、作用與命名」","id":"D1-032","h":"fa4d030d95"},{"day":1,"date":"2026-10-08","number":33,"topic":"Day1｜特定穴總論：分布部位","group":"特定穴總論","qtype":"非題","stem":"關於特定穴的分布部位，下列何者錯誤？","options":[["A","六腑下合穴均位於下肢足三陽經上"],["B","募穴均位於胸腹及脅腹部，但並非全在任脈上"],["C","十六郄穴全部位於肘、膝關節以下"],["D","背俞穴均位於足太陽膀胱經背腰部第一側線（後正中線旁開1.5寸）"]],"answer":"C","difficulty":"高","explanation":"郄穴「多數」在肘膝以下，但胃經郄穴梁丘在髕底上2寸，是例外。募穴中的期門、章門、京門、日月、中府、天樞都不在任脈上。下合穴：足三里、上巨虛、下巨虛（足陽明），委中、委陽（足太陽），陽陵泉（足少陽），都位於下肢足三陽經上。","source":"本資料庫 acupoints（梁丘：髕底上2寸，胃經郄穴）；《靈樞經》卷一‧邪氣藏府病形第四","id":"D1-033","h":"b4355d845b"},{"day":1,"date":"2026-10-08","number":34,"topic":"Day1｜經絡現代研究：結締組織假說","group":"經絡現代研究","qtype":"實證研究","stem":"關於經絡與腧穴的現代形態學研究，Langevin 與 Yandow（2002, Anat Rec）在人體上臂的連續大體解剖切面中比對穴位位置，主要發現為何？","options":[["A","約80%的穴位位置與肌間或肌內結締組織平面相對應，並提出經絡網絡可能反映間質結締組織網絡的假說"],["B","穴位分布與結締組織平面完全沒有關聯，經絡僅為古人想像"],["C","所有穴位處皆有密集的肥大細胞聚集，可作為經絡實質的唯一證據"],["D","在穴位下方發現獨立於血管、神經的管狀實體結構，直接證實經絡是特殊管道"]],"answer":"A","difficulty":"中","explanation":"該研究以超音波觀察到穴位處有結締組織裂隙平面，並在人體上臂連續大體切面中比對穴位，發現約80%的穴位與肌間或肌內結締組織平面相對應，因而提出「穴位與經絡網絡可視為間質結締組織網絡的表現」的假說，認為這與針刺作用機轉有關。研究沒有找到獨立管道結構，也沒有否定兩者的關聯；肥大細胞說並非本研究內容。\n文獻：Langevin HM, Yandow JA. Relationship of acupuncture points and meridians to connective tissue planes. Anat Rec. 2002;269(6):257-265. doi:10.1002/ar.10185（PMID 12467083）","source":"Langevin HM, Yandow JA. Anat Rec. 2002;269(6):257-265. doi:10.1002/ar.10185","id":"D1-034","h":"3ae1fed4af"},{"day":1,"date":"2026-10-08","number":35,"topic":"Day1｜腧穴現代研究：腧穴特異性（足三里 vs 天樞）","group":"腧穴現代研究","qtype":"實證研究","stem":"在腧穴特異性研究中，Liu 等（2021, Nature）以小鼠內毒素（LPS）全身性發炎模型，比較電針「足三里（ST36）」與「天樞（ST25）」。下列何者最符合其結果？","options":[["A","高強度電針只能在ST36誘發脊髓交感反射，在ST25則完全無效"],["B","剔除 PROKR2-Cre 神經元後，低強度電針ST36的抗炎作用反而增強"],["C","低強度電針ST36經由支配後肢深筋膜（如骨膜）、以 PROKR2-Cre 標記的感覺神經元，驅動迷走神經—腎上腺軸釋放兒茶酚胺而抑制全身發炎；低強度電針ST25則無此效應"],["D","低強度電針ST25與ST36同樣能驅動迷走—腎上腺抗炎軸，顯示穴位沒有特異性"],["E","研究證實穴位特異性取決於經絡歸屬，與神經支配分布無關"]],"answer":"C","difficulty":"高","explanation":"研究發現：支配後肢深層筋膜（如骨膜）但不支配腹膜的 PROKR2-Cre 感覺神經元，是低強度電針ST36驅動迷走—腎上腺軸（兒茶酚胺釋放）並抑制內毒素引起的全身發炎所必需；剔除這群神經元後，抗炎效果消失。高強度電針在ST25與ST36兩處都能誘發脊髓交感反射，且不受影響。作者也發現 PROKR2-Cre 神經纖維的分布可以預測哪些部位的低強度電針有抗炎效果，為腧穴的選擇性與特異性提供神經解剖基礎（以神經支配解釋，而非經絡歸屬）。注意這是小鼠研究，不能直接推論到人體療效。\n文獻：Liu S, Wang Z, Su Y, Qi L, Yang W, Fu M, Jing X, Wang Y, Ma Q. A neuroanatomical basis for electroacupuncture to drive the vagal–adrenal axis. Nature. 2021;598(7882):641-645. doi:10.1038/s41586-021-04001-4（PMID 34646018）","source":"Liu S, et al. Nature. 2021;598(7882):641-645. doi:10.1038/s41586-021-04001-4","id":"D1-035","h":"b6e170c40f"},{"day":1,"date":"2026-10-08","number":36,"topic":"其他｜腧穴安全：肩井與氣胸","group":"腧穴安全","qtype":"臨床情境","stem":"30歲瘦高男性上班族，因肩頸痠痛在某處接受毫針治療，右側肩井直刺約1.5寸並留針20分鐘。返家約3小時後出現右胸刺痛、呼吸短促、乾咳，平躺時加劇。下列處置何者最適當？","options":[["A","高度懷疑針刺所致氣胸，囑立即至急診安排胸部X光確認，必要時抽氣或胸管引流"],["B","可能是暈針延遲反應，飲溫糖水平臥即可"],["C","屬針後遺留痠痛，局部按揉熱敷即可"],["D","再針內關、膻中以寬胸理氣，觀察一晚"]],"answer":"A","difficulty":"易","explanation":"肩井位於第7頸椎棘突與肩峰端連線中點，宜直刺0.5–0.8寸，深部為肺尖，不可深刺；孕婦禁針。《刺灸心法要訣‧禁針穴歌》有「肩井深時人悶倒」的警語。針刺性氣胸的症狀可能延遲數小時才出現，瘦高體型更危險，須立即轉急診照X光。","source":"本資料庫 acupoints（肩井）；《刺灸心法要訣》卷八‧禁針穴歌；notes「針刺異常情況處理」","id":"D1-036","h":"e573b3fb18"},{"day":1,"date":"2026-10-08","number":37,"topic":"其他｜腧穴刺法與禁忌","group":"腧穴刺法與禁忌","qtype":"非題","stem":"下列腧穴刺法與注意事項，何者錯誤？","options":[["A","中府：向外斜刺或平刺0.5–0.8寸，不可向內深刺"],["B","風府：伏案正坐，向下頜方向緩慢刺入0.5–1寸，不可向上深刺"],["C","章門：肝脾腫大者宜深刺，以疏肝健脾"],["D","承泣：推眼球向上固定，沿眶下緣緩慢直刺，不提插捻轉，出針後按壓"]],"answer":"C","difficulty":"易","explanation":"章門在第11肋游離端下際，其下為肝、脾，肝脾腫大者不可深刺，以免刺傷臟器出血。風府向上深刺可能傷及延髓；承泣容易出血，禁灸、不提插；中府向內深刺可能造成氣胸。","source":"本資料庫 acupoints（章門、風府、承泣、中府）","id":"D1-037","h":"553d59f3e7"},{"day":1,"date":"2026-10-08","number":38,"topic":"其他｜特定穴：交會穴","group":"特定穴","qtype":"概念","stem":"關於下列交會穴的敘述，何者正確？","options":[["A","會陰為任、督、衝三脈之會"],["B","承泣為陽蹻、任脈與足陽明之會"],["C","大杼為手、足太陽之會，亦為八會穴中的骨會"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"會陰是任、督、衝「一源三歧」的交會處；《針灸大成‧奇經八脈簡要》記載陽蹻「又與任脈足陽明會於承泣」；大杼為手、足太陽之會，也是《難經》八會中的骨會。三項皆正確。","source":"本資料庫 acupoints（會陰、承泣、大杼）；《針灸大成》卷九‧奇經八脈簡要","id":"D1-038","h":"5ced10f75e"},{"day":1,"date":"2026-10-08","number":39,"topic":"其他｜腧穴急症：下合穴與轉診","group":"腧穴急症","qtype":"臨床情境","stem":"22歲男性，12小時前臍周疼痛，之後轉移到右下腹，伴噁心、發燒38.3°C，右下腹壓痛及反跳痛。下列處置何者最適當？","options":[["A","委中刺絡放血以瀉熱，次日回診"],["B","依「合治內府」針上巨虛、闌尾穴止痛後，囑回家觀察"],["C","於天樞、神闕重灸以溫通腑氣"],["D","高度懷疑急性闌尾炎，應立即轉介急診外科評估，不宜以針刺止痛延誤診斷"]],"answer":"D","difficulty":"易","explanation":"轉移性右下腹痛加上發燒、腹膜刺激徵（反跳痛），是急性闌尾炎的典型表現，屬外科急症，延誤可能導致穿孔或腹膜炎。雖然《靈樞‧邪氣藏府病形》有「合治內府……大腸入合於巨虛上廉」，上巨虛（大腸下合穴）與闌尾穴也是傳統腸癰用穴，但只能在西醫評估後作為輔助，不能拿來止痛後讓病人回家，以免掩蓋病情。","source":"《靈樞經》卷一‧邪氣藏府病形第四；本資料庫 acupoints（上巨虛）","id":"D1-039","h":"6dfd9d6bcd"},{"day":1,"date":"2026-10-08","number":40,"topic":"其他｜刺灸法：靈樞官鍼十二刺","group":"刺灸法","qtype":"經典","stem":"《靈樞‧官鍼》十二刺中，「傍入而浮之，以治肌急而寒者」稱為？","options":[["A","陰刺"],["B","浮刺"],["C","短刺"],["D","直鍼刺"]],"answer":"B","difficulty":"中","explanation":"原文：「九曰浮刺，浮刺者，傍入而浮之，以治肌急而寒者也。」直鍼刺「引皮乃刺之，以治寒氣之淺者」；短刺「刺骨痹，稍搖而深之，致鍼骨所，以上下摩骨也」；陰刺「左右率刺之，以治寒厥，中寒厥，足踝後少陰也」。","source":"《靈樞經》卷二‧官鍼第七；《針灸甲乙經》卷五‧九針九變十二節五刺五邪第二","id":"D1-040","h":"8706d229e0"},{"day":1,"date":"2026-10-08","number":41,"topic":"其他｜刺灸法：皮下血腫處理","group":"刺灸法","qtype":"臨床情境","stem":"68歲女性長期服用阿斯匹靈，太陽穴出針後局部迅速腫起、皮下青紫，患者十分緊張。下列處置何者最適當？","options":[["A","囑患者自行停用阿斯匹靈一週後再來治療"],["B","先以乾棉球加壓止血並冷敷，24–48小時後改熱敷促進吸收；記錄抗血小板藥物史，日後頭面部取穴宜精簡、出針確實按壓"],["C","立即熱敷並用力揉按，以促進瘀血消散"],["D","於血腫中央再以三稜針點刺，放出瘀血"]],"answer":"B","difficulty":"易","explanation":"急性出血期應先加壓、冷敷止血；24–48小時後再熱敷促進吸收。立即熱敷揉按會加重出血；再刺放血會擴大出血並增加感染風險。抗血小板藥物通常因心血管疾病而開立，不可由針灸醫師囑咐自行停藥，必要時應與處方醫師討論。","source":"notes「針刺異常情況處理」（血腫）","id":"D1-041","h":"96d240569e"},{"day":1,"date":"2026-10-08","number":42,"topic":"其他｜刺灸法：金針賦（男女氣之上下）","group":"刺灸法","qtype":"經典填空","stem":"《針灸大成‧金針賦》：「男子之氣，早在____而晚在____；女子之氣，早在下而晚在上……午前為早屬陽，午後為晚屬陰。男女上下，憑____分之。」空格依序為？","options":[["A","上、下；腰"],["B","內、外；膈"],["C","上、下；臍"],["D","下、上；腰"]],"answer":"A","difficulty":"高","explanation":"原文：「頭有病而足取之，左有病而右取之，男子之氣，早在上而晚在下，取之必明其理；女子之氣，早在下而晚在上，用之必識此時，午前為早屬陽，午後為晚屬陰。男女上下，憑腰分之。」《針灸大成‧南豐李氏補瀉》也說「男女上下，平腰分之」。金針賦作者為明代泉石心（一說出自徐鳳《針灸大全》），收於《針灸大成》卷二。","source":"《針灸大成》卷二‧金針賦；卷五‧南豐李氏補瀉","id":"D1-042","h":"d2afd75316"},{"day":1,"date":"2026-10-08","number":43,"topic":"其他｜特殊針法：焦氏頭針分區","group":"特殊針法","qtype":"臨床情境","stem":"70歲男性，右手靜止性顫抖、動作遲緩一年，神經科診斷為帕金森氏病，目前規律服藥，希望加上頭皮針輔助治療。依焦順發頭針分區，下列何者最適當？","options":[["A","取雙側暈聽區"],["B","取左側舞蹈震顫控制區（運動區向前平移1.5 cm的平行線）"],["C","取右側舞蹈震顫控制區"],["D","取左側視區"]],"answer":"B","difficulty":"中","explanation":"焦氏頭針依大腦皮質功能定位，肢體症狀取「對側」區。舞蹈震顫控制區位於運動區前方1.5 cm的平行線，主治舞蹈病、帕金森氏症候群；右手症狀取左側。暈聽區主眩暈、耳鳴；視區主皮質性視力障礙。頭皮針僅為輔助，應提醒患者不可自行停用抗帕金森藥物。","source":"notes「頭針（頭皮針）」；特殊針法（李育臣）範圍——標準教學大綱","id":"D1-043","h":"7722287259"},{"day":1,"date":"2026-10-08","number":44,"topic":"其他｜特殊針法：耳針安全","group":"特殊針法","qtype":"非題","stem":"關於耳針的操作與禁忌，下列何者錯誤？","options":[["A","有習慣性流產史的孕婦，可常規刺激內生殖器、內分泌等耳穴以安胎"],["B","耳穴須嚴格消毒，以防耳軟骨膜炎"],["C","毫針刺耳穴時，深度以不穿透耳軟骨為度"],["D","耳郭凍傷或有炎症的部位不宜針刺"]],"answer":"A","difficulty":"易","explanation":"孕婦使用耳針應謹慎，有習慣性流產史者禁用，更不可刺激內生殖器、內分泌等穴。耳郭血液循環較差，感染後容易造成耳軟骨膜炎甚至耳郭變形，所以要嚴格消毒、深度不穿透軟骨；凍傷、發炎部位禁針。","source":"notes「耳針」；特殊針法範圍——標準教學大綱","id":"D1-044","h":"7b42b1939c"},{"day":1,"date":"2026-10-08","number":45,"topic":"其他｜特殊針法：針刀四步規程","group":"特殊針法","qtype":"概念","stem":"朱漢章創立的針刀療法，進針「四步規程」中的「定向」，要求刀口線應如何？","options":[["A","一律與皮膚呈45°並斜向頭側"],["B","與施術部位重要血管、神經及肌纖維走向平行"],["C","與重要血管、神經走向垂直，以便切斷粘連"],["D","依經絡循行方向，順經為補、逆經為瀉"]],"answer":"B","difficulty":"中","explanation":"四步規程為：定點→定向→加壓分離→刺入。定向時刀口線要與重要血管、神經及肌纖維走向平行，以免橫斷造成損傷；加壓分離則是讓血管神經被推開後再刺入。迎隨補瀉是毫針刺法的概念，與針刀定向無關。","source":"notes「小針刀、浮針、其他微針系統」；特殊針法範圍——標準教學大綱","id":"D1-045","h":"4c81c4672c"},{"day":1,"date":"2026-10-08","number":46,"topic":"其他｜特殊針法：電針安全","group":"特殊針法","qtype":"非題","stem":"關於電針的操作安全，下列何者錯誤？","options":[["A","延髓、脊髓附近使用電針時，電流量宜小，避免強刺激"],["B","開機前輸出旋鈕應歸零，電流量由小到大逐步調整"],["C","同一對輸出電極可分別接在左右上肢，讓電流橫貫胸部以加強療效"],["D","曾行溫針灸、針柄已氧化者，不宜再接電針夾"]],"answer":"C","difficulty":"易","explanation":"同一對電極不宜跨越心臟（避免左右上肢對接），以免電流通過心臟引起心律不整。其他三項都是正確的電針安全原則；心臟節律器使用者禁用電針，孕婦慎用。","source":"notes「火針、電針、穴位注射、穴位埋線」；特殊針法範圍——標準教學大綱","id":"D1-046","h":"564d2f0419"},{"day":1,"date":"2026-10-08","number":47,"topic":"其他｜治療學：壓力性尿失禁電針（實證）","group":"治療學","qtype":"實證研究","stem":"56歲女性，咳嗽、打噴嚏或提重物時漏尿兩年，尿液檢查無感染，婦科評估無需手術處理的骨盆腔器官脫垂，診斷為壓力性尿失禁。若參考 Liu 等（2017, JAMA）多中心隨機對照試驗設計電針處方，下列何者最符合該研究？","options":[["A","電針雙側中髎（BL33，第3骶後孔）與會陽（BL35，尾骨端旁開0.5寸），每週3次、共6週18次；第6週1小時尿墊試驗漏尿量比假電針組多減少約7.4 g"],["B","電針中髎、會陽雖可減少漏尿，但不良事件發生率顯著高於假電針，因此不建議使用"],["C","電針雙側次髎與白環俞，每週1次共4週，結果與假電針無差異"],["D","電針關元、中極、三陰交，每日1次共4週，主要結局為尿動力學最大尿道閉合壓"],["E","該研究以皮膚穿刺的真針刺於非穴位作為假電針對照"]],"answer":"A","difficulty":"高","explanation":"該試驗在中國12家醫院收納504位壓力性尿失禁女性，電針組取雙側中髎（BL33）與會陽（BL35），進針約50–60 mm，連續波50 Hz、1–5 mA，每次30分鐘，每週3次共6週（18次）。主要結局（第6週1小時尿墊試驗漏尿量變化）：電針組−9.9 g，假電針組−2.6 g，平均差7.4 g（95% CI 4.8–10.0）。治療相關不良事件為1.6%比2.0%，皆屬輕微。假電針是在假穴位上不穿透皮膚。\n文獻：Liu Z, Liu Y, Xu H, et al. Effect of electroacupuncture on urinary leakage among women with stress urinary incontinence: a randomized clinical trial. JAMA. 2017;317(24):2493-2501. doi:10.1001/jama.2017.7220（PMID 28655016；全文 PMC5815072）","source":"Liu Z, et al. JAMA. 2017;317(24):2493-2501. doi:10.1001/jama.2017.7220","id":"D1-047","h":"8e2ca6c5c2"},{"day":1,"date":"2026-10-08","number":48,"topic":"其他｜治療學：慢性功能性便秘電針（實證）＋紅旗","group":"治療學","qtype":"實證研究","stem":"48歲女性，慢性嚴重功能性便秘多年，每週完全自發排便約1次。參考 Liu 等（2016, Ann Intern Med）的電針試驗與特定穴理論，下列何者正確？","options":[["A","該試驗電針雙側天樞、腹結（疏密波10/50 Hz），並針刺雙側上巨虛，8週共28次"],["B","天樞為大腸募穴，上巨虛為大腸下合穴，選穴符合俞募與「合治內府」理論"],["C","8週治療期間，電針組每週完全自發排便次數的增加顯著大於假電針組，且效果持續至第20週追蹤"],["D","若為50歲以上新發便秘，或合併血便、體重減輕、貧血，應先轉介大腸鏡等檢查以排除器質性病變"],["E","以上皆是"]],"answer":"E","difficulty":"高","explanation":"該試驗在15家醫院收納1075位慢性嚴重功能性便秘患者，電針組取雙側天樞（ST25）、腹結（SP14）接電（疏密波10/50 Hz、0.1–1.0 mA，刺至腹肌層），雙側上巨虛（ST37）常規針刺，前2週每週5次、後6週每週3次，共28次。第1–8週每週完全自發排便（CSBM）增加1.76次，假電針組0.87次（組間差0.90，P\u003c0.001）；第9–20週追蹤仍有差異（1.09）。天樞為大腸募穴，上巨虛為大腸下合穴（《靈樞‧邪氣藏府病形》「大腸入合於巨虛上廉」）。紅旗徵象須先排除大腸癌等器質性疾病。四項皆正確。\n文獻：Liu Z, Yan S, Wu J, et al. Acupuncture for chronic severe functional constipation: a randomized trial. Ann Intern Med. 2016;165(11):761-769. doi:10.7326/M15-3118（PMID 27618593；試驗登錄 NCT01726504，選穴與參數依 ClinicalTrials.gov 登錄資料核對）","source":"Liu Z, et al. Ann Intern Med. 2016;165(11):761-769. doi:10.7326/M15-3118；《靈樞經》卷一‧邪氣藏府病形第四","id":"D1-048","h":"5bb67a9049"},{"day":1,"date":"2026-10-08","number":49,"topic":"其他｜治療學：慢性膝痛針刺（實證判讀）","group":"治療學","qtype":"實證研究","stem":"關於 Hinman 等（2014, JAMA）針刺治療慢性膝痛的隨機臨床試驗，下列敘述何者錯誤？","options":[["A","與不治療對照相比，毫針與雷射針在12週時疼痛有小幅改善，但1年時未能維持"],["B","研究結論支持雷射針灸與毫針針刺對50歲以上慢性膝痛的療效顯著優於假雷射，建議作為首選治療"],["C","採 Zelen 設計，收納282位50歲以上慢性膝痛患者，分為不治療對照、毫針、雷射與假雷射四組，治療12週"],["D","12週時，毫針與雷射針在疼痛與功能上均未優於假雷射"]],"answer":"B","difficulty":"中","explanation":"結果：12週時毫針與雷射針在疼痛（平均差−0.4與−0.1）與功能上都沒有優於假雷射；與不治療對照相比，毫針（−1.1）與雷射（−0.8）疼痛有小幅改善，但1年時沒有維持。作者結論是「不支持」對這類患者使用針刺。判讀重點：「優於不治療」不等於「優於假治療」，要分清特異性療效與非特異性（安慰、期待）效應。\n文獻：Hinman RS, McCrory P, Pirotta M, et al. Acupuncture for chronic knee pain: a randomized clinical trial. JAMA. 2014;312(13):1313-1322. doi:10.1001/jama.2014.12660（PMID 25268438）","source":"Hinman RS, et al. JAMA. 2014;312(13):1313-1322. doi:10.1001/jama.2014.12660","id":"D1-049","h":"992dd82c10"},{"day":1,"date":"2026-10-08","number":50,"topic":"其他｜治療學：盜汗（百症賦）＋結核紅旗","group":"治療學","qtype":"臨床情境","stem":"45歲男性，近兩個月夜間盜汗、睡醒衣被濕透，伴午後低熱、乾咳，體重減輕5公斤；舌紅少苔，脈細數。下列敘述何者正確？","options":[["A","依《針灸大成‧百症賦》「陰郄後谿，治盜汗之多出」，可取陰郄、後谿"],["B","陰郄為手少陰心經郄穴，位於腕掌側橫紋上0.5寸、尺側腕屈肌腱橈側"],["C","因合併低熱、慢性咳嗽與體重減輕，應先轉介胸部X光與痰液抗酸菌檢查，排除肺結核等疾病"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"《百症賦》原文：「陰郄後谿，治盜汗之多出。」陰郄是心經郄穴（腕橫紋上0.5寸），後谿是小腸經輸穴、通督脈。但盜汗合併午後低熱、慢性咳嗽、體重減輕是肺結核（或淋巴瘤等）的紅旗組合，應先轉介檢查，確診結核須依法通報並接受標準治療，針灸僅能輔助。三項皆正確。","source":"《針灸大成》卷二‧百症賦；本資料庫 acupoints（陰郄、後谿）","id":"D1-050","h":"f6e0d4af50"}]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
var META = DATA.meta, Q = DATA.questions, BYID = {};
Q.forEach(function(q){ BYID[q.id] = q; });
var DIFF_ORDER = ['易','中','難','高'];
var LS_KEY = 'acuQuiz.v1';

/* ---------- 儲存 ---------- */
var lsOK = true, S;
try { S = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch(e){ lsOK = false; S = {}; }
if (typeof S !== 'object' || Array.isArray(S)) S = {};
S.ans = S.ans || {};           // 練習模式作答：{id:{s,h}}
S.wb = S.wb || {};             // 錯題本：{id:{n,h}}
S.ui = S.ui || {};
S.wbs = S.wbs || null;         // 錯題本練習進度
S.exam = S.exam || null;       // 模擬考
S.star = (S.star && typeof S.star === 'object') ? S.star : {};   // 難題收藏：{id:{t,u,streak,tries}}
S.sts = S.sts || null;         // 難題收藏練習進度
var U = S.ui;
if (!U.mode) U.mode = 'practice';
if (!U.view) U.view = 'single';
if (U.set === undefined) U.set = META.days.length ? 'day:' + META.days[META.days.length-1].day : 'all';
U.diff = U.diff || ''; U.topic = U.topic || ''; U.qtype = U.qtype || '';
U.stDay = U.stDay || ''; U.stTopic = U.stTopic || '';
U.idx = U.idx || 0;
// 有新的一天題目加入時，自動切到最新一天（只切一次）
var MAXDAY = META.days.length ? META.days[META.days.length-1].day : 0;
if (U.seenDay !== undefined && U.seenDay !== MAXDAY && U.mode === 'practice' && U.set !== 'all' && U.set !== 'rand'){ U.set = 'day:' + MAXDAY; U.idx = 0; U.summary = false; }
U.seenDay = MAXDAY;
// 題目內容若改變（hash 不同）則丟棄舊紀錄
// （題目不在本檔時保留，例如從較新裝置匯入的紀錄）
Object.keys(S.wb).forEach(function(id){ if (BYID[id] && (!S.wb[id] || BYID[id].h !== S.wb[id].h)) delete S.wb[id]; });
function wbCount(){ var n = 0; Q.forEach(function(q){ if (S.wb[q.id]) n++; }); return n; }
function starCount(){ var n = 0; Q.forEach(function(q){ if (S.star[q.id]) n++; }); return n; }
function save(){
  if (!lsOK) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ lsOK = false; showLsWarn(); }
}
function showLsWarn(){ if (!lsOK) document.getElementById('lswarn').classList.remove('hide'); }
showLsWarn();

/* ---------- 小工具 ---------- */
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined && txt !== null) e.textContent = txt; return e; }
function opt(value, label, cur){ var o = el('option', null, label); o.value = value; if (String(value) === String(cur)) o.selected = true; return o; }
function mmdd(d){ var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(d || ''); return m ? (('0'+m[2]).slice(-2) + '/' + ('0'+m[3]).slice(-2)) : (d || ''); }
function dayLabel(n){ var d = META.days.filter(function(x){ return x.day === n; })[0]; return 'Day ' + n + (d && d.date ? '（' + mmdd(d.date) + '）' : ''); }
function shuffle(a, seed){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(a, b){ return b ? Math.round(a * 1000 / b) / 10 : 0; }
function isRight(q, s){ return !!s && q.answer.indexOf(s) >= 0; }
function getAns(map, id){ var a = map && map[id]; var q = BYID[id]; if (!a || !q || a.h !== q.h) return null; return a.s; }
function uniq(arr){ var seen = {}, out = []; arr.forEach(function(x){ if (x && !seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
function diffSort(a, b){ var ia = DIFF_ORDER.indexOf(a), ib = DIFF_ORDER.indexOf(b); if (ia < 0) ia = 99; if (ib < 0) ib = 99; return ia - ib || (a < b ? -1 : a > b ? 1 : 0); }
function fmtTime(ms){ ms = Math.max(0, ms); var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + ('0'+m).slice(-2) : m) + ':' + ('0'+ss).slice(-2); }
function qLabel(q){ return 'Day ' + q.day + ' 第 ' + q.number + ' 題'; }

/* ---------- 題組 ---------- */
function setPool(set){
  if (set && set.indexOf('day:') === 0){ var n = +set.slice(4); return Q.filter(function(q){ return q.day === n; }); }
  return Q.slice();
}
function applyFilters(list){
  return list.filter(function(q){
    return (!U.diff || q.difficulty === U.diff) && (!U.topic || q.group === U.topic) && (!U.qtype || q.qtype === U.qtype);
  });
}
function practiceOrder(){
  if (U.set === 'rand'){
    var key = [U.diff, U.topic, U.qtype].join('|');
    var ok = U.rand && U.randKey === key && U.rand.length && U.rand.every(function(id){ return BYID[id]; });
    if (!ok){ U.rand = shuffle(applyFilters(Q)).slice(0, 50).map(function(q){ return q.id; }); U.randKey = key; save(); }
    return U.rand.map(function(id){ return BYID[id]; });
  }
  if (U.set !== 'all' && !(U.set && U.set.indexOf('day:') === 0 && META.days.some(function(d){ return 'day:' + d.day === U.set; }))) U.set = 'all';
  return applyFilters(setPool(U.set));
}

/* ---------- Session 抽象 ---------- */
function getSession(){
  if (U.mode === 'practice'){
    var list = practiceOrder();
    return { kind:'practice', list:list, map:S.ans, reveal:true, lock:true,
      getIdx:function(){ return U.idx; }, setIdx:function(i){ U.idx = i; },
      summary:function(v){ if (v === undefined) return !!U.summary; U.summary = v; },
      onAnswer:function(q, k){ S.ans[q.id] = {s:k, h:q.h, t:Date.now()}; var r = isRight(q, k); noteResult(q, r); if (!r) addWrong(q); }
    };
  }
  if (U.mode === 'wrong'){
    if (!S.wbs) S.wbs = newWrongSession();
    var w = S.wbs;
    return { kind:'wrong', list:w.order.map(function(id){ return BYID[id]; }).filter(Boolean), map:w.ans, reveal:true, lock:true,
      getIdx:function(){ return w.idx || 0; }, setIdx:function(i){ w.idx = i; },
      summary:function(v){ if (v === undefined) return !!w.summary; w.summary = v; },
      onAnswer:function(q, k){ w.ans[q.id] = {s:k, h:q.h}; var r = isRight(q, k); noteResult(q, r); if (r) delete S.wb[q.id]; else addWrong(q); }
    };
  }
  if (U.mode === 'star'){
    if (!S.sts) S.sts = newStarSession();

    return { kind:'star', list:z.order.map(function(id){ return BYID[id]; }).filter(Boolean), map:z.ans, reveal:true, lock:true,
      getIdx:function(){ return z.idx || 0; }, setIdx:function(i){ z.idx = i; },
      summary:function(v){ if (v === undefined) return !!z.summary; z.summary = v; },
      // 收藏練習：獨立作答紀錄，不覆寫「練習」；答對不會自動移出收藏
      onAnswer:function(q, k){ z.ans[q.id] = {s:k, h:q.h}; var r = isRight(q, k); noteResult(q, r); if (!r) addWrong(q); }
    };

  };
}

function buildCard(q, i, sess){

  sb.title = '收藏難題（快捷鍵 S）'; sb.setAttribute('aria-pressed', starred ? 'true' : 'false');

  var chips = el('div', 'chips');
  if (q.qtype) chips.appendChild(el('span', 'chip', q.qtype));
  if (q.group) chips.appendChild(el('span', 'chip', q.group));

  if (sess.kind === 'wrong' && S.wb[q.id]) chips.appendChild(el('span', 'chip', '錯 ' + S.wb[q.id].n + ' 次'));
  if (sess.kind === 'star' && starred) chips.appendChild(el('span', 'chip', '已連續答對 ' + (S.star[q.id].streak || 0) + ' 次'));
  if (chips.childNodes.length) card.appendChild(chips);
  card.appendChild(el('div', 'stem', q.stem));
  var box = el('div', 'opts');
  q.options.forEach(function(o){
    var k = o[0], b = el('button', 'opt'); b.type = 'button'; b.setAttribute('data-k', k);
    b.appendChild(el('span', 'k', k)); b.appendChild(el('span', 't', o[1]));
    if (shown){
      if (q.answer.indexOf(k) >= 0){ b.classList.add('right'); b.appendChild(el('span', 'mk', '✓ 正解')); }
      else if (k === sel){ b.classList.add('wrong'); b.appendChild(el('span', 'mk', '✗')); }
    } else if (k === sel) b.classList.add('sel');
    if (sess.lock && (sel || shown)) b.disabled = true;

      var qs = el('button', 'quick-star', '🤔 猜對的／沒把握 → 加入難題收藏'); qs.type = 'button';
      qs.addEventListener('click', function(){ toggleStar(q, true); }); fb.appendChild(qs);
    } else if (starred){
      var stt = S.star[q.id];

function answer(q, k){
  var sess = getSession(); if (!sess) return;

  save();
  var i = sess.list.indexOf(q);

var timerId = null;
function renderSticky(sess){

  } else {
    p.appendChild(el('span', null, '已作答 ' + st.answered + ' / ' + st.total));
    p.appendChild(el('span', null, '答對 ' + st.right + '　答錯 ' + st.wrong + (st.answered ? '　正確率 ' + pct(st.right, st.answered) + '%' : '')));

  } else { var c = el('i', 'b-ans'); c.style.width = pct(st.answered, st.total) + '%'; bar.appendChild(c); }
  sticky.appendChild(bar);

function tickTimer(){
  var e = S.exam;
  if (!e || e.state !== 'running'){ if (timerId){ clearInterval(timerId); timerId = null; } return; }
  var left = e.start + e.dur * 60000 - Date.now();
  var t = document.getElementById('timer');
  if (t){ t.textContent = '⏱ ' + fmtTime(left); t.classList.toggle('low', left < 5 * 60000); }
  if (left <= 0){ submitExam(true); return; }
  if (!timerId) timerId = setInterval(tickTimer, 1000);
}
function submitExam(auto){
  var e = S.exam; if (!e || e.state !== 'running') return;
  if (!auto){
    var sess = getSession(), st = stats(sess), un = st.total - st.answered;
    if (!confirm(un ? '還有 ' + un + ' 題未作答，確定交卷？' : '確定交卷？')) return;
  }
  e.state = 'done'; e.end = Math.min(Date.now(), e.start + e.dur * 60000); e.summary = true; e.auto = !!auto;
  e.order.forEach(function(id){ var q = BYID[id], s = getAns(e.ans, id); if (!q || !s) return; var r = isRight(q, s); noteResult(q, r); if (!r) addWrong(q); });
  if (timerId){ clearInterval(timerId); timerId = null; }
  save(); render(); window.scrollTo(0, 0);
  if (auto) setTimeout(function(){ alert('時間到，已自動交卷。'); }, 50);
}

/* ---------- 匯出／匯入 ---------- */
function safeKey(k){ return typeof k === 'string' && k.length > 0 && k.length <= 120 && k !== '__proto__' && k !== 'constructor' && k !== 'prototype'; }
function num(v){ return typeof v === 'number' && isFinite(v) ? v : 0; }
var CLEAN = {
  ans: function(v){ return (v && typeof v.s === 'string' && /^[A-H]$/.test(v.s) && typeof v.h === 'string') ? {s:v.s, h:v.h.slice(0, 40), t:num(v.t)} : null; },
  wb: function(v){ return (v && typeof v.h === 'string') ? {n:Math.max(1, Math.min(9999, Math.floor(num(v.n)) || 1)), h:v.h.slice(0, 40), t:num(v.t)} : null; },

};
function newer(kind, a, b){ // a 是否比 b 新
  if (kind === 'wb') return a.n > b.n || (a.n === b.n && a.t > (b.t || 0));
  if (kind === 'star') return a.u > (b.u || b.t || 0);
  return a.t > (b.t || 0);
}
function exportObj(){ return {app:'acuQuiz', v:1, exportedAt:new Date().toISOString(), data:{ans:S.ans, wb:S.wb, star:S.star}}; }
function doImport(text, mode){

  var d = o && o.data && typeof o.data === 'object' ? o.data : o;
  if (!d || typeof d !== 'object' || !(d.ans || d.wb || d.star)) throw new Error('不是本練習頁匯出的紀錄（找不到 ans／wb／star）');
  if (o.app && o.app !== 'acuQuiz') throw new Error('不是本練習頁匯出的紀錄');
  var next = mode === 'replace' ? {ans:{}, wb:{}, star:{}} : {ans:JSON.parse(JSON.stringify(S.ans)), wb:JSON.parse(JSON.stringify(S.wb)), star:JSON.parse(JSON.stringify(S.star))};
  var cnt = {ans:0, wb:0, star:0};
  ['ans', 'wb', 'star'].forEach(function(kind){
    var src = d[kind]; if (!src || typeof src !== 'object' || Array.isArray(src)) return;
    Object.keys(src).forEach(function(id){
      if (!safeKey(id)) return;
      var v = CLEAN[kind](src[id]); if (!v) return;
      var cur = Object.prototype.hasOwnProperty.call(next[kind], id) ? next[kind][id] : null;

}

    var mode = (m.querySelector('input[name=ioMode]:checked') || {}).value || 'merge';
    if (mode === 'replace' && !confirm('取代會清除本機現有的作答、錯題本與難題收藏，確定？')) return;
    try { var c = doImport(text, mode); msg.className = 'msg ok'; msg.textContent = '匯入完成：作答 ' + c.ans + '、錯題 ' + c.wb + '、收藏 ' + c.star + ' 筆。\n目前：錯題本 ' + wbCount() + ' 題、難題收藏 ' + starCount() + ' 題。'; renderTabs(); }
    catch(e){ msg.className = 'msg ng'; msg.textContent = '匯入失敗：' + (e && e.message ? e.message : e) + '\n本機紀錄未變更。'; }
  });
  var cl = el('button', 'btn sm', '關閉'); cl.type = 'button'; cl.id = 'ioClose'; cl.addEventListener('click', closeIO);
  r2.appendChild(im); r2.appendChild(cl); m.appendChild(r2);
  var msg = el('div', 'msg'); msg.id = 'ioMsg'; m.appendChild(msg);
  if (!lsOK) m.appendChild(el('div', 'warn', '注意：此瀏覽器無法永久儲存，匯入的紀錄關閉頁面後會消失。'));
  ov.appendChild(m);
  ov.addEventListener('click', function(ev){ if (ev.target === ov) closeIO(); });
  document.body.appendChild(ov);
}
document.getElementById('ioBtn').addEventListener('click', openIO);
document.getElementById('ioBtn2').addEventListener('click', openIO);
window.addEventListener('pageshow', tickTimer);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tickTimer(); });
render();
})();
</script>
