，外踝或內踝後緣、尖端有骨壓痛，或受傷當下與就診時都無法承重走四步，就應安排X光檢查。排除骨折後，急性扭傷的瘀腫可考慮刺絡拔罐（避開大血管、注意出血傾向與無菌操作）。走罐用於背、腰、臀、大腿等肌肉豐厚處，不適合踝部；急性期宜冷敷，不宜熱敷重灸。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第六章第四節 刺絡拔罐法；特殊針法 第八章 拔罐與刺絡拔罐之安全）；Stiell IG, et al. JAMA. 1993;269(9):1127-1132（Ottawa ankle rules；PMID 8433468）","id":"D6-031","h":"f6f7c7ff3b"},{"day":6,"date":"2026-10-13","number":32,"topic":"Day6｜拔罐安全","group":"拔罐安全","qtype":"概念","stem":"下列拔罐相關情況，何者應該避免？","options":[["A","在胸背部肌肉淺薄處留針拔罐（罐底可能壓到針柄，使針刺入過深而致氣胸）"],["B","在孕婦的腹部與腰骶部拔罐"],["C","前次罐印還沒消退，就在同一部位再拔"],["D","拔罐後立刻洗冷水澡"],["E","以上皆是"]],"answer":"E","difficulty":"易","explanation":"四項都應避免：留針拔罐要注意罐底壓迫針柄使針深入，胸背部尤其危險；孕婦腹部、腰骶部屬拔罐禁忌部位；同一部位要等罐印消退後再拔；拔罐後立即洗冷水澡是常見的衛教禁忌。其他禁忌還有高熱抽搐、凝血障礙、皮膚過敏或潰瘍、水腫、大血管處、心臟搏動處、骨骼凹凸不平或毛髮多處。起罐時一手扶罐、一手按壓罐口邊緣皮膚讓空氣進入，不可硬拔。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第六章第三、四節；特殊針法 第八章 拔罐與刺絡拔罐之安全）；notes（拔罐、刮痧）","id":"D6-032","h":"47c79bbec6"},{"day":6,"date":"2026-10-13","number":33,"topic":"Day6｜刮痧操作與暈刮","group":"刮痧操作與暈刮","qtype":"非題","stem":"關於刮痧，下列何者錯誤？","options":[["A","刮拭中若頭暈、面色蒼白、冒冷汗（暈刮），應停止刮拭、平臥保暖，比照暈針處理"],["B","刮痧不必強求出痧；刮後宜飲溫開水、避風寒，短時間內勿洗冷水"],["C","痧痕未退前，隔天可在同一部位再重刮，以加強療效"],["D","刮拭一般由上而下、由內而外，單方向進行，刮板與皮膚約呈45°"]],"answer":"C","difficulty":"易","explanation":"痧痕一般3–7日消退，應等痧退後再刮同一部位，不可在未退的痧痕上反覆重刮。刮痧以牛角板、玉石等邊緣光滑的器具蘸潤滑介質操作，常用面刮、角刮、點按、拍打等法；禁忌包括出血傾向、皮膚破損感染、孕婦腹部腰骶、極度虛弱與急重症。清代郭志邃《痧脹玉衡》是痧證專書。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第七章 刮痧療法）；notes（拔罐、刮痧）","id":"D6-033","h":"22f45eefd6"},{"day":6,"date":"2026-10-13","number":34,"topic":"Day6｜刮痧與熱中暑紅旗","group":"刮痧與熱中暑紅旗","qtype":"臨床情境","stem":"70歲男性在酷暑中下田工作數小時，被家人扶回時意識混亂、答非所問，皮膚灼熱乾燥、已不再出汗，耳溫40.6°C。家屬要求立刻在頸背刮痧並放血「解暑」。下列處置何者最適當？","options":[["A","在頸背刮到大量出痧後，即可讓患者返家休息"],["B","十宣放血後，大量灌冰水"],["C","這是熱中暑急症：立即撥打119，同時移到陰涼處積極降溫（解開衣物、噴水搧風、冰敷頸部、腋下、鼠蹊），不可用刮痧或放血延誤送醫"],["D","隔鹽灸神闕、關元以回陽"]],"answer":"C","difficulty":"中","explanation":"刮痧可用於輕症中暑（頭暈、噁心、倦怠而意識清楚）。高齡、高溫環境、意識改變、皮膚乾熱、核心體溫約40°C以上，要考慮熱中暑（heat stroke），可能致命，必須立即降溫並送醫。意識不清時不可灌水，以免嗆入。中醫重症中暑雖有水溝、十宣、曲澤、委中放血等法，但只能作為等待救護時的輔助，不能取代急救。","source":"本資料庫 notes（針灸治療學：常見病證處方速記（二）中暑）；textbook_notes（新編彩圖針灸學 第七章 刮痧療法 適應症與禁忌症）","id":"D6-034","h":"77d4fcaabf"},{"day":6,"date":"2026-10-13","number":35,"topic":"Day6｜實證：艾灸至陰矯正臀位（Cochrane 2023）","group":"實證","qtype":"實證研究","stem":"Coyle ME 等2023年更新的 Cochrane 系統性回顧（doi:10.1002/14651858.CD003928.pub4；13項研究、2181名婦女）評估艾灸至陰（BL67）矯正臀位。下列何者最符合其結論？","options":[["A","與常規照護相比，艾灸對分娩時胎位完全沒有影響"],["B","艾灸加常規照護「可能」降低分娩時非頭位的機會（中等確定性），但對剖腹產率可能幾乎沒有影響，且多數試驗的不良事件報告不足"],["C","艾灸可明顯降低剖腹產率，證據確定性高"],["D","艾灸已證實可取代外轉胎位術，需要外轉胎位術的比例顯著下降且證據明確"]],"answer":"B","difficulty":"高","explanation":"艾灸加常規照護相較於單純常規照護：分娩時非頭位 RR 0.87（95% CI 0.78–0.99；7項試驗、1152人；中等確定性）；需要外轉胎位術 RR 0.62（95% CI 0.32–1.21；低確定性，不確定）；剖腹產 RR 0.94（95% CI 0.83–1.05；可能幾乎無差異）；可能減少催產素使用。不良事件（噁心、氣味、腹痛、子宮收縮）報告不足。臨床上至陰灸須在產科同意、定期超音波追蹤下進行。","source":"Coyle ME, Smith C, Peat B. Cochrane Database Syst Rev. 2023;5:CD003928. doi:10.1002/14651858.CD003928.pub4（PMID 37158339）","id":"D6-035","h":"51b8f95578"},{"day":6,"date":"2026-10-13","number":36,"topic":"其他｜靈龜八法：開穴計算","group":"靈龜八法","qtype":"概念","stem":"依《針灸大成》〈八法逐日干支歌〉〈八法臨時干支歌〉與〈八法歌〉，以靈龜八法推算「己巳日辛未時」應開何穴？","options":[["A","列缺"],["B","公孫"],["C","照海"],["D","臨泣"]],"answer":"C","difficulty":"高","explanation":"日干己＝10（甲己辰戌丑未十），日支巳＝7（戊癸巳午七），時干辛＝7（丙辛寅申七），時支未＝8（乙庚丑未八），合計32。己為陰日，「陽日除九陰除六」：32−30＝2，對應「照海坤二五」，所以開照海（常配列缺）。己日時辰依〈五虎建元〉「甲己之辰起丙寅」推得未時為辛未。","source":"《針灸大成》卷五‧八法逐日干支歌、八法臨時干支歌、八法歌、八法五虎建元日時歌","id":"D6-036","h":"feb77c8da8"},{"day":6,"date":"2026-10-13","number":37,"topic":"其他｜子午流注納甲法：陰經逢輸過原","group":"子午流注納甲法","qtype":"經典填空","stem":"《針灸大成‧徐氏子午流注逐日按時定穴歌》：「己日巳時隱白始，辛未時中魚際取，癸酉____太白原，乙亥中封內踝比，丁丑時合少海心，己卯間使包絡止。」關於空格與此時同開太白的理由，下列何者正確？","options":[["A","然谷（腎經滎穴）；太白為脾經合穴"],["B","湧泉（腎經井穴）；太白只是陪穴，沒有特別意義"],["C","復溜（腎經經穴）；太白為脾經絡穴，用來配穴"],["D","太谿（腎經輸穴）；陰經以輸代原，開輸穴時同開當日值日經（脾經）的原穴太白，即返本還原"]],"answer":"D","difficulty":"高","explanation":"己日（脾）巳時開脾井隱白，之後依「經生經、穴生穴」：辛未肺滎魚際→癸酉腎輸太谿→乙亥肝經中封→丁丑心合少海→己卯血歸包絡（間使）。陰經沒有獨立原穴，以輸代原，所以開腎輸太谿時同開值日經脾的原穴太白（返本還原）。陽經則是開輸穴時另開本經原穴（如甲日戊寅陷谷配丘墟）。","source":"《針灸大成》卷五‧徐氏子午流注逐日按時定穴歌；本資料庫 notes（子午流注與靈龜八法：納甲法、納子法）","id":"D6-037","h":"175b7cc962"},{"day":6,"date":"2026-10-13","number":38,"topic":"其他｜耳針：耳穴分布","group":"耳針","qtype":"非題","stem":"關於耳穴的分布與定位，下列何者錯誤？","options":[["A","胸腔臟器（心、肺）的耳穴在耳甲艇，腹腔臟器在耳甲腔"],["B","神門位於三角窩，常用於鎮靜、止痛、安神"],["C","耳尖在耳輪頂端，可點刺放血以退熱、降壓，或治目赤、麥粒腫"],["D","上肢的耳穴主要分布在耳舟，眼穴在耳垂"]],"answer":"A","difficulty":"中","explanation":"兩者顛倒：胸腔臟器（心、肺）在耳甲腔，腹腔臟器（如肝）在耳甲艇。耳穴分布像倒置的胎兒：頭面在耳垂與對耳屏，上肢在耳舟，軀幹與下肢在對耳輪及其上下腳，消化道環繞耳輪腳，盆腔在三角窩。耳穴毫針深度以不穿透軟骨為度，要嚴格消毒以防耳軟骨膜炎。","source":"本資料庫 notes（特殊針法：耳針）；textbook_notes（針灸學 第八章 耳針）","id":"D6-038","h":"7257ed856f"},{"day":6,"date":"2026-10-13","number":39,"topic":"其他｜頭針：焦氏刺激區主治","group":"頭針","qtype":"非題","stem":"下列焦順發頭針刺激區與主治的配對，何者錯誤？","options":[["A","足運感區（前後正中線中點旁開1 cm，向後引3 cm）：對側下肢癱瘓麻痛、夜尿、子宮脫垂"],["B","言語三區（暈聽區中點向後引4 cm）：運動性失語"],["C","平衡區（枕外隆凸頂端旁開3.5 cm，向下引4 cm）：小腦性平衡障礙"],["D","言語二區（頂骨結節後下方2 cm處向下引3 cm）：命名性失語"]],"answer":"B","difficulty":"中","explanation":"言語三區治「感覺性失語」。運動性失語要取運動區下2/5（言語一區），它同時治中樞性面癱、流涎、發音障礙。運用區治失用症；視區（枕外隆凸頂端旁開1 cm向上4 cm）治皮質性視力障礙；暈聽區治眩暈、耳鳴。","source":"本資料庫 notes（特殊針法：頭針）；textbook_notes（針灸學 第八章 頭針）","id":"D6-039","h":"ad53cc01b2"},{"day":6,"date":"2026-10-13","number":40,"topic":"其他｜穴位貼敷：三伏貼","group":"穴位貼敷","qtype":"非題","stem":"關於三伏貼（穴位貼敷、天灸），下列何者錯誤？","options":[["A","常用穴有肺俞、大椎、定喘、膏肓、天突、膻中"],["B","一般在初伏、中伏、末伏各貼一次，屬「冬病夏治」"],["C","貼敷處起水泡代表效果最好，小兒也應與成人一樣貼足一整夜"],["D","常用白芥子、延胡索、細辛、甘遂研末，以薑汁調敷"]],"answer":"C","difficulty":"易","explanation":"三伏貼成人一般貼2–4小時，小兒要縮短；局部灼痛、起泡屬過度反應，要撕除並處理，不是越起泡越好，更不可貼整夜。三伏貼屬天灸（發泡灸）的一種，不需點火，常用於哮喘、過敏性鼻炎等的「冬病夏治」。","source":"本資料庫 textbook_notes（針灸學 第八章 穴位注射、穴位貼敷、埋線）","id":"D6-040","h":"62621bf677"},{"day":6,"date":"2026-10-13","number":41,"topic":"其他｜針刺麻醉","group":"針刺麻醉","qtype":"非題","stem":"關於針刺麻醉（針麻），下列何者錯誤？","options":[["A","誘導期約20–30分鐘；現代多採針藥複合麻醉或經皮穴位電刺激（TEAS）輔助"],["B","1958年上海首次將針麻用於扁桃腺切除術"],["C","針麻的肌肉鬆弛效果良好，能完全阻斷內臟牽拉反應，可全面取代藥物麻醉"],["D","優點包括生理干擾小、術中清醒可配合、術後恢復快"]],"answer":"C","difficulty":"中","explanation":"針麻的缺點正是鎮痛不全、肌肉鬆弛不足、內臟牽拉反應難以完全控制、個體差異大，所以不能取代藥物麻醉。現代稱「針刺輔助麻醉」或「針藥複合麻醉」。常用取穴原則有循經取穴、耳穴、依神經節段取穴。","source":"本資料庫 textbook_notes（針灸科學 附錄 肆、針灸麻醉述要）","id":"D6-041","h":"84276a08c4"},{"day":6,"date":"2026-10-13","number":42,"topic":"其他｜治療學（兒）：熱性痙攣急救","group":"治療學（兒）","qtype":"臨床情境","stem":"18個月大男童發燒39.4°C一天，在針灸診所候診時突然雙眼上吊、四肢強直陣攣，至今約2分鐘。下列處置何者最適當？","options":[["A","讓孩童側躺、移開周圍危險物品，不要把任何東西塞進嘴裡，並記錄發作時間；若超過5分鐘、反覆發作或意識未恢復，立即撥打119；發作停止後仍須就醫找出發燒原因"],["B","立刻用筷子撬開牙關以防咬舌，並用力掐水溝直到哭出聲"],["C","十宣三稜針放血，抽搐停止後即可回家，不需就醫"],["D","抽搐中立即餵退燒藥水"]],"answer":"A","difficulty":"易","explanation":"發作時以保護與觀察為主：側躺讓分泌物流出、保持呼吸道通暢、移開危險物、計時；不可塞物入口（會傷牙、阻塞呼吸道），抽搐中也不可餵藥餵水（易嗆入）。持續超過5分鐘、反覆發作、意識未恢復，或有頸部僵硬、紫斑等腦膜炎徵象，都要緊急送醫。中醫急驚風雖取水溝、合谷、太衝、十宣等穴，但不能延誤急救與病因評估。","source":"本資料庫 notes（針灸治療學：小兒驚風）；textbook_notes（針灸科學 第十節 小兒科病）","id":"D6-042","h":"15c560431d"},{"day":6,"date":"2026-10-13","number":43,"topic":"其他｜治療學（五官）：牙痛與心因性轉移痛","group":"治療學（五官）","qtype":"臨床情境","stem":"58歲男性，糖尿病、吸菸，主訴左下排牙齒與下頜疼痛三天，常在爬樓梯時發作、休息約5分鐘緩解；今天發作時伴胸悶、冒冷汗。牙科檢查沒有齲齒或牙周膿腫。下列處置何者最適當？","options":[["A","在下關刺絡拔罐止痛"],["B","取合谷、頰車、下關、內庭行瀉法清胃火即可"],["C","運動誘發、休息緩解的下頜痛，伴胸悶冷汗，應懷疑心絞痛或急性冠心症的轉移痛，立即轉急診做心電圖與心肌酵素檢查，不宜只當牙痛針刺"],["D","取太谿、行間滋陰降火，每週治療兩次觀察"]],"answer":"C","difficulty":"中","explanation":"一般牙痛選穴是合谷（「面口合谷收」）、頰車、下關，胃火加內庭、二間，腎虛加太谿、行間。但本例牙科檢查陰性，疼痛與用力有關、休息緩解，又有胸悶冷汗與心血管危險因子，是典型的心因性轉移痛紅旗，必須先排除急性冠心症。","source":"本資料庫 notes（針灸治療學：常見病證處方速記（二）牙痛）","id":"D6-043","h":"cae744edb0"},{"day":6,"date":"2026-10-13","number":44,"topic":"其他｜治療學急症：睪丸扭轉紅旗","group":"治療學急症","qtype":"臨床情境","stem":"15歲男生打球後2小時突發左側陰囊劇痛，伴噁心嘔吐，左睪丸位置偏高、觸痛明顯，提睪反射消失。家長認為是「疝氣」，要求針灸大敦、三陰交止痛。下列何者最適當？","options":[["A","隔薑灸關元、氣海以溫經散寒"],["B","先回家觀察一晚，隔天再來針灸"],["C","依繆刺法刺對側大敦出血，痛止即可"],["D","高度懷疑睪丸扭轉，屬泌尿科急症（多在約6小時內處理才能保住睪丸），應立即轉急診，不可用針灸止痛延誤"]],"answer":"D","difficulty":"易","explanation":"青少年突發單側陰囊劇痛、睪丸位置偏高、提睪反射消失，是睪丸扭轉的典型表現，延誤處理會導致睪丸壞死。古籍雖有「邪客於足厥陰之絡，令人卒疝暴痛」刺大敦的記載，但現代臨床遇到這類急性陰囊痛，必須先轉診排除外科急症。","source":"《針灸甲乙經》卷五‧繆刺第三；本資料庫 textbook_notes（新編彩圖針灸學 第四章第八節 針灸在急症上的應用）","id":"D6-044","h":"c1b17835f6"},{"day":6,"date":"2026-10-13","number":45,"topic":"其他｜針灸安全：醫護人員針扎","group":"針灸安全","qtype":"臨床情境","stem":"針灸醫師替一位B型肝炎帶原（HBsAg陽性）的患者起針時，不慎被用過的毫針刺傷手指。下列處置何者最適當？","options":[["A","用漂白水浸泡傷口十分鐘"],["B","用酒精擦一擦即可繼續看診，不需通報"],["C","把用過的針回套進針管，再丟入一般垃圾桶"],["D","立即用肥皂和清水沖洗傷口，依院所流程通報並記錄；檢驗自身B型肝炎表面抗體（anti-HBs），若沒有保護力，應盡速（最好24小時內）接受B型肝炎免疫球蛋白（HBIG）與疫苗，並定期追蹤"]],"answer":"D","difficulty":"易","explanation":"針扎後應立刻以肥皂和清水沖洗，不要用漂白水等刺激性消毒劑；接著通報、記錄，評估來源病人（HBV、HCV、HIV）與自身免疫狀態，必要時接受暴露後預防（HBIG＋疫苗；若有HIV暴露風險，暴露後預防要盡早開始）。預防方面：用過的針不可回套，直接丟入防穿刺的銳器收集盒。","source":"本資料庫 textbook_notes（新編彩圖針灸學 文獻附錄二 針灸標準作業程序；特殊針法 第八章 感染控制）","id":"D6-045","h":"5ddfd1d7ea"},{"day":6,"date":"2026-10-13","number":46,"topic":"其他｜針灸醫籍與作者","group":"針灸醫籍與作者","qtype":"非題","stem":"下列針灸醫籍與作者、特色的配對，何者錯誤？","options":[["A","《醫宗金鑑‧刺灸心法要訣》為清代吳謙等奉敕編纂（1742）"],["B","《針灸大全》為清代吳謙所編，書中收錄《標幽賦》"],["C","元代滑壽著《十四經發揮》"],["D","唐代王燾《外台秘要》重灸輕針"]],"answer":"B","difficulty":"中","explanation":"《針灸大全》是明代徐鳳所編，收錄《金針賦》（序署泉石心）。《標幽賦》作者是金元竇漢卿，收在其《針經指南》。其他：《針灸甲乙經》晉皇甫謐；《銅人腧穴針灸圖經》宋王惟一；《針灸資生經》宋王執中；《針灸聚英》明高武；《針灸大成》明楊繼洲（1601）。","source":"本資料庫 textbook_notes（針灸學 第十一章 歷代主要針灸醫籍；新編彩圖針灸學 文獻附錄一）","id":"D6-046","h":"9ee422b998"},{"day":6,"date":"2026-10-13","number":47,"topic":"其他｜實證：芳香環酶抑制劑關節痛針刺","group":"實證","qtype":"實證研究","stem":"Hershman DL 等2018年發表於《JAMA》的多中心隨機試驗（doi:10.1001/jama.2018.8907），納入226名因服用芳香環酶抑制劑而關節痛的早期乳癌停經後婦女，分為真針刺、假針刺、候補對照三組。下列敘述何者正確？","options":[["A","真針刺與假針刺沒有差異，兩者都只優於候補組"],["B","改善幅度達到預設的2分臨床意義門檻，且完全沒有不良事件"],["C","6週時，真針刺組的最嚴重疼痛分數（BPI-WP）比假針刺組與候補組都顯著較低（調整後差約0.9–1.0分），但改善的臨床重要性不確定；真針刺組輕度瘀青較多"],["D","主要終點是1年的乳癌復發率"]],"answer":"C","difficulty":"中","explanation":"主要終點是6週的 BPI-WP。真針刺 vs 假針刺調整後差0.92分（95% CI 0.20–1.65），真針刺 vs 候補0.96分（95% CI 0.24–1.67），均 P = .01；但未達預設的2分臨床意義門檻，作者認為臨床重要性不確定。真針刺組的第1級瘀青比假針刺組多（47% vs 25%）。","source":"Hershman DL, Unger JM, Greenlee H, et al. JAMA. 2018;320(2):167-176. doi:10.1001/jama.2018.8907（PMID 29998338）","id":"D6-047","h":"4430185c53"},{"day":6,"date":"2026-10-13","number":48,"topic":"其他｜實證：慢性疼痛個別病人資料統合分析","group":"實證","qtype":"實證研究","stem":"Vickers AJ 等2018年發表於《J Pain》的個別病人資料統合分析（doi:10.1016/j.jpain.2017.11.005；39項試驗、20,827人），評估針刺治療慢性疼痛。下列何者錯誤？","options":[["A","若假針刺採用穿刺皮膚的針，或對照組介入強度較高，針刺的效應值較小"],["B","針刺的療效在1年後幾乎完全消失，顯示效果短暫"],["C","針刺優於假針刺，也優於無針刺對照；與無針刺相比差約0.5個標準差，與假針刺相比差約0.2個標準差"],["D","納入的病症包括非特異性肌肉骨骼痛、骨關節炎、慢性頭痛與肩痛"]],"answer":"B","difficulty":"高","explanation":"該研究發現針刺效果會持續，1年時療效只下降約15%。各病症中，針刺都優於假針刺與無針刺對照（皆 P \u003c .001）。效應大小主要受對照組設計影響（穿刺型假針、高強度對照時效應較小），與針刺本身的治療特徵沒有明顯關聯。作者認為針刺對慢性疼痛有效，效果不能只用安慰劑解釋。","source":"Vickers AJ, Vertosick EA, Lewith G, et al. J Pain. 2018;19(5):455-474. doi:10.1016/j.jpain.2017.11.005（PMID 29198932）","id":"D6-048","h":"0804846ba8"},{"day":6,"date":"2026-10-13","number":49,"topic":"其他｜治療學（消化）：呃逆","group":"治療學（消化）","qtype":"臨床情境","stem":"55歲男性飯後受涼，呃逆連聲兩小時、聲音響亮，無胸痛、無吞嚥困難、無腹痛或嘔血，生命徵象穩定。下列針灸處方何者最常用？","options":[["A","膈俞、內關、中脘，配合攢竹點按"],["B","少商、商陽點刺放血"],["C","至陰、隱白艾灸"],["D","委中、承山刺絡"]],"answer":"A","difficulty":"易","explanation":"呃逆的常用處方是膈俞、內關、中脘、膻中，可配合攢竹點按，寒證可加灸。至陰多用於胎位不正、隱白用於崩漏；委中、承山多用於腰腿病；少商、商陽放血用於咽喉腫痛。若呃逆持續超過48小時，或伴吞嚥困難、體重減輕、神經學症狀，要轉介檢查（如中樞神經、橫膈或腫瘤問題）。","source":"本資料庫 notes（針灸治療學：常見病證處方速記（一）嘔吐、呃逆）；textbook_notes（針灸科學 第三節 消化系統病）","id":"D6-049","h":"34daa5d4a0"},{"day":6,"date":"2026-10-13","number":50,"topic":"其他｜特殊針法：其他微針系統","group":"特殊針法","qtype":"非題","stem":"關於眼針、腹針與全息穴等微針系統，下列何者錯誤？","options":[["A","第二掌骨側全息穴由遠心端（掌指關節側）往近心端，依序對應足到頭"],["B","腹針為薄智雲所創，是以神闕為中心的腹部全息系統"],["C","眼針為彭靜山所創，依八卦將眼眶周圍分為八區十三穴，沿眼眶邊緣平刺、不行手法"],["D","手針、足針、鼻針、舌針、面針也屬於微針系統"]],"answer":"A","difficulty":"中","explanation":"張穎清的第二掌骨側全息穴，是由遠而近（掌指關節側往腕側）依序對應頭到足，方向剛好相反。其他：眼針（彭靜山）八區十三穴、眶內或眶外沿邊緣平刺；腹針（薄智雲）以神闕為中心；腕踝針（張心曙）皮下淺刺、不求酸麻脹痛。","source":"本資料庫 textbook_notes（特殊針法 第四章 眼針、腕踝針、腹針、手足針與全息穴）；notes（眼針、腹針、腕踝針、手足針）","id":"D6-050","h":"1dae549a61"},{"day":7,"date":"2026-10-14","number":1,"topic":"Day7｜國際標準頭針：額區四線","group":"國際標準頭針","qtype":"非題","stem":"關於國際標準頭針（WHO 西太區頭皮針穴名標準化方案）額區各刺激線，以及與焦氏頭針分區的對應，下列何者錯誤？","options":[["A","額旁3線相當於焦氏「胸腔區」，主治心悸、胸悶、咳喘等胸部病證"],["B","額旁2線由頭臨泣穴向前引一直線、長1寸，屬足少陽經，相當於焦氏胃區，主治脾胃、肝膽病證"],["C","額中線屬督脈，自神庭穴向前引一直線、長1寸，主治癲癇、失眠等神志病及頭面病"],["D","額旁1線由眉衝穴向前引一直線、長1寸，屬足太陽經，相當於焦氏胸腔區"]],"answer":"A","difficulty":"中","explanation":"額旁3線自頭維穴內側0.75寸起向下引1寸，位於足少陽與足陽明之間，相當焦氏「生殖區」，主治功能性子宮出血、陽痿遺精、子宮脫垂、尿頻尿急等下焦病。胸腔區對應的是額旁1線。\n記法：額旁1、2、3線由內往外，依序對應胸腔區（上焦心肺）、胃區（中焦）、生殖區（下焦）。","source":"本資料庫 notes（特殊針法：頭針）；textbook_notes（特殊針法 第二章；楊甲三 第八章 頭針）","id":"D7-001","h":"59e9384f05"},{"day":7,"date":"2026-10-14","number":2,"topic":"Day7｜耳針理論：《靈樞‧口問》耳者宗脈之所聚","group":"耳針理論","qtype":"經典填空","stem":"《靈樞‧口問》：「黃帝曰：人之耳中鳴者，何氣使然。歧伯曰：耳者，____之所聚也，故胃中空則宗脈虛，虛則下溜，脈有所竭者，故耳鳴，補____，手大指爪甲上與肉交者也。」此句常被引為耳穴診治的古典依據。兩空格依序應填？","options":[["A","宗氣；聽會"],["B","十二經脈；翳風"],["C","宗筋；聽宮"],["D","宗脈；客主人"]],"answer":"D","difficulty":"高","explanation":"原文「耳者，宗脈之所聚也」，同篇論泣涕也說「目者，宗脈之所聚也」。耳鳴的機轉是胃中空、宗脈虛而下溜；治法為補客主人（即上關，手少陽、足陽明、足少陽之會），以及「手大指爪甲上與肉交者」（一般認為指手太陰井穴少商）。現代耳針分區另以 Nogier（1957）「倒置胎兒」圖為基礎。","source":"《靈樞經》卷五‧口問第二十八；本資料庫 notes（特殊針法：耳針）；acupoints（上關 GB3）","id":"D7-002","h":"eb34ea7aa3"},{"day":7,"date":"2026-10-14","number":3,"topic":"Day7｜耳針：常用耳穴定位","group":"耳針","qtype":"非題","stem":"下列常用耳穴的位置與主要作用，何者錯誤？","options":[["A","腎上腺：位於對耳屏內側面，主治神經衰弱、失眠等大腦皮質功能失調"],["B","內分泌：位於屏間切跡內、耳甲腔底部，用於內分泌失調及婦科病"],["C","交感：位於對耳輪下腳末端與耳輪內緣交界處，用於內臟痙攣疼痛與自律神經功能失調"],["D","胃：位於耳輪腳消失處，用於胃痛、嘔吐、消化不良"]],"answer":"A","difficulty":"中","explanation":"對耳屏內側面是「皮質下」，能調節大腦皮質興奮與抑制，治神經衰弱、失眠、疼痛。「腎上腺」在耳屏下部隆起的尖端，用於過敏、炎症、低血壓等。其他常考：神門在三角窩後1/3上部（鎮靜止痛），耳尖在耳輪頂端（放血退熱、降壓）。","source":"本資料庫 notes（特殊針法：耳針，依 GB/T 13734-2008）；textbook_notes（特殊針法 第三章）","id":"D7-003","h":"1bcadb64fa"},{"day":7,"date":"2026-10-14","number":4,"topic":"Day7｜耳針安全：耳郭軟骨膜炎","group":"耳針安全","qtype":"臨床情境","stem":"58歲男性，糖尿病多年，3天前在右耳神門、皮質下以毫針刺，並留置揿針。今日回診：右耳郭紅腫熱痛逐漸擴大、觸之有波動感，耳垂沒有紅腫，體溫38.2°C。下列處置何者最適當？","options":[["A","屬正常針後反應，局部熱敷，並囑每日按壓揿針3–5次"],["B","在同側耳尖點刺放血以「清熱解毒」，揿針繼續留置"],["C","立即移除耳穴揿針；疑為耳郭軟骨膜炎（感染），應盡速轉介耳鼻喉科給予抗生素、必要時切開引流，並記錄不良事件"],["D","改貼王不留行籽壓丸，觀察兩週後再評估"]],"answer":"C","difficulty":"中","explanation":"耳郭軟骨幾乎沒有血管，感染後容易軟骨壞死、耳郭變形。耳郭紅腫熱痛擴大、有波動感並發燒，而耳垂（沒有軟骨）不受累，是軟骨膜炎的典型表現；糖尿病是高危險群。處置：停止耳穴刺激並移除針具，及早轉介給予抗生素（常需涵蓋綠膿桿菌），必要時引流。\n預防：耳穴嚴格消毒；毫針深度以不穿透軟骨為度；耳郭有炎症、凍傷者禁針，糖尿病患者慎用埋針。","source":"本資料庫 notes（特殊針法：耳針「嚴格消毒，防耳軟骨膜炎」）；textbook_notes（特殊針法 第八章 安全與作業規範）","id":"D7-004","h":"48a6c33061"},{"day":7,"date":"2026-10-14","number":5,"topic":"Day7｜實證：耳針與術後疼痛（Usichenko 2008）","group":"實證","qtype":"實證研究","stem":"Usichenko TI、Lehmann C、Ernst E 於2008年在《Anaesthesia》發表系統性回顧（doi:10.1111/j.1365-2044.2008.05632.x），評估耳針控制術後疼痛的隨機臨床試驗。下列何者最符合其結果與結論？","options":[["A","耳針與假耳針相比完全沒有差異，作者建議停止相關研究"],["B","統合23篇高品質試驗，耳針使術後鴉片類止痛藥用量減半，建議列為術後止痛第一線療法"],["C","納入試驗的 Jadad 品質評分均達滿分5分，證據等級高"],["D","9篇隨機試驗符合納入條件，其中8篇耳針優於對照；因研究異質性太大而無法統合分析，作者認為證據「有希望，但尚不具說服力」"]],"answer":"D","difficulty":"高","explanation":"檢索至2007年9月，23篇文章中有9篇符合納入條件；其中8篇耳針優於對照。7篇 Jadad 分數≥3，但沒有一篇達到滿分5分。由於主要研究異質性高，無法做統合分析。結論：耳針減輕術後疼痛的證據 promising but not compelling。臨床上耳針可當術後止痛的輔助，不能取代標準止痛。","source":"Usichenko TI, Lehmann C, Ernst E. Anaesthesia. 2008;63(12):1343-1348. doi:10.1111/j.1365-2044.2008.05632.x（PMID 19032304）","id":"D7-005","h":"5c1bde9a90"},{"day":7,"date":"2026-10-14","number":6,"topic":"Day7｜眼針：操作要點","group":"眼針","qtype":"非題","stem":"關於眼針療法，下列何者錯誤？","options":[["A","在距眼眶緣約2 mm處沿皮橫刺，或在眶內緊靠眼眶直刺，留針約5–15分鐘"],["B","由彭靜山創立，依八卦將眼眶周圍劃分為8區13穴"],["C","眼針進針後應大幅提插捻轉，直到眼周出現強烈酸脹感才算得氣"],["D","眼周血管豐富，出針時應以乾棉球按壓片刻，以防皮下血腫"]],"answer":"C","difficulty":"易","explanation":"眼針手法要輕巧：刺入後不行提插捻轉，也不強求得氣，以免損傷眼球與血管。出針要按壓防血腫；若出現眼球突出、視力下降、劇痛、眼球運動受限等眶內出血徵象，須立即轉介眼科。","source":"本資料庫 notes（特殊針法：眼針、腹針、腕踝針、手足針）；textbook_notes（特殊針法 第四章）","id":"D7-006","h":"3631a29784"},{"day":7,"date":"2026-10-14","number":7,"topic":"Day7｜腕踝針：取點與針刺方向","group":"腕踝針","qtype":"臨床情境","stem":"42歲男性伏案工作後左側頸肩痛兩天，無上肢麻木無力、無外傷，神經學檢查正常。醫師擬用腕踝針治療，下列操作何者最符合其取點與刺法原則？","options":[["A","取雙側踝部進針點，針尖朝向足趾方向斜刺，得氣後行提插瀉法"],["B","取右側踝部進針點，直刺至骨面後強刺激，以出現觸電感為佳"],["C","取左側腕部進針點，直刺1寸並大幅捻轉，至局部痠脹明顯"],["D","取左側腕部（腕橫紋上約2橫指）相應區的進針點，針尖朝向心端（病所方向），沿皮下淺層平刺，以無明顯酸麻脹痛為宜"]],"answer":"D","difficulty":"中","explanation":"腕踝針原則：病在橫膈以上取腕部（上1–上6），以下取踝部（下1–下6）；左病取左、右病取右，中線病兩側同取；針尖一般朝向病所（病在手足末端時才朝向遠端）。以約30°進針後，沿皮下淺層平刺約1.4寸，不要求得氣；若出現酸麻脹痛表示太深，應退至皮下調淺。","source":"本資料庫 notes（特殊針法：眼針、腹針、腕踝針、手足針）；textbook_notes（特殊針法 第四章）","id":"D7-007","h":"18fe66d3f4"},{"day":7,"date":"2026-10-14","number":8,"topic":"Day7｜腹針：引氣歸元","group":"腹針","qtype":"概念","stem":"薄智雲腹針以神闕為中心（「神闕布氣」假說）。其基本處方「引氣歸元」由下列哪一組穴位組成？","options":[["A","雙側滑肉門、外陵"],["B","中脘、下脘、氣海、關元"],["C","中脘、雙側天樞、關元"],["D","上脘、中脘、建里、下脘"]],"answer":"B","difficulty":"中","explanation":"引氣歸元＝中脘、下脘（調中焦脾胃）＋氣海、關元（培腎固本），多用於內傷久病、虛證。「天地針」只用中脘、關元；「腹四關」為雙側滑肉門與外陵，通調氣血、引氣至四肢。腹針刺法分天（淺）、人（中）、地（深）三部，痛症多淺刺，不強求得氣。","source":"本資料庫 notes（特殊針法：眼針、腹針、腕踝針、手足針）；textbook_notes（特殊針法 第四章）","id":"D7-008","h":"517dc0459b"},{"day":7,"date":"2026-10-14","number":9,"topic":"Day7｜全息穴：第二掌骨側定位","group":"全息穴","qtype":"概念","stem":"張穎清依「生物全息律」提出第二掌骨側全息穴：頭穴在第二掌骨橈側遠端（掌指關節側），足穴在近端（腕側）。頭穴與足穴連線的中點是哪一穴？","options":[["A","胃穴"],["B","腰穴"],["C","肺心穴"],["D","腎穴"]],"answer":"A","difficulty":"高","explanation":"第二掌骨側由遠而近依序為：頭、頸、上肢、肺心、肝、胃、十二指腸、腎、腰、下腹、腿、足。定位法：頭、足連線的中點為胃；頭與胃的中點為肺心；胃與足的中點為腰；其餘各穴在其間等分。按壓最痛的點，提示相應部位可能有病變，也可在該點針刺或按壓治療。","source":"本資料庫 textbook_notes（特殊針法 第四章：第二掌骨側全息穴，由遠而近對應頭→足）；notes（小針刀、浮針、其他微針系統）","id":"D7-009","h":"470536f914"},{"day":7,"date":"2026-10-14","number":10,"topic":"Day7｜三稜針：鋒針源流（刺灸心法要訣）","group":"三稜針","qtype":"經典填空","stem":"《刺灸心法要訣‧九針主治法歌》：「鋒針即今____名，主刺瘤邪時氣壅，發於經絡痼不解，瀉熱出血榮衛通。」空格應填？","options":[["A","劍針"],["B","箭頭"],["C","跳針"],["D","三稜"]],"answer":"D","difficulty":"易","explanation":"鋒針「刃三隅」，即今三稜針，用於瀉熱出血、治經絡痼疾（《靈樞‧九鍼十二原》「刃三隅以發痼疾」）。易混：《要訣》稱「鑱針即今箭頭針」；《針灸大成‧九針圖》稱鈹針「今名劍針」、長針「今之名跳針」（《要訣》則說長針即今「環跳針」）。","source":"《刺灸心法要訣》卷一‧九針式圖並九針主治法歌；《針灸大成》卷五‧九針圖","id":"D7-010","h":"0c08f8c74c"},{"day":7,"date":"2026-10-14","number":11,"topic":"Day7｜火針：與九針中大針（燔針）的淵源","group":"火針","qtype":"經典","stem":"現代火針古稱燔針，刺法稱焠刺。比對《針灸大成‧九針圖》與《刺灸心法要訣‧九針主治法歌》，火針與九針中哪一種針的淵源最直接？","options":[["A","鋒針：刃三隅，燒紅後用以刺痹"],["B","鈹針：末如劍鋒，燒紅後用以排膿"],["C","大針：《要訣》注「大針者，即古人之燔針也」；《九針圖》在第九針的位置改列「火針，一名燔針，長四寸」"],["D","員利針：尖如犛，燒紅後用以取暴痹"]],"answer":"C","difficulty":"高","explanation":"《刺灸心法要訣》大針歌注：「大針者，即古人之燔針也」，主治周身淫邪、或風或水溢於肌體、關節不利。《針灸大成‧九針圖》九針中沒有大針，而列「〔火針〕一名燔針，長四寸，風虛腫毒，解肌排毒用此」，長度與大針同為四寸。鋒針是三稜針前身，鈹針用於排膿，員利針取暴痹。火針刺法的出處是《靈樞‧官鍼》九刺「焠刺者，刺燔鍼則取痹也」。","source":"《針灸大成》卷五‧九針圖；《刺灸心法要訣》卷一‧九針主治法歌（大針）；《靈樞經》卷二‧官鍼第七","id":"D7-011","h":"a5c294c6a6"},{"day":7,"date":"2026-10-14","number":12,"topic":"Day7｜皮膚針：《靈樞‧官鍼》毛刺與半刺","group":"皮膚針","qtype":"經典填空","stem":"皮膚針（梅花針、七星針）的淺刺理論常溯源於《靈樞‧官鍼》。原文：「七曰毛刺，毛刺者，刺____皮膚也。」「一曰半刺，半刺者，淺內而疾發鍼，無鍼傷肉，如拔毛狀，以取____，此肺之應也。」兩空格依序應填？","options":[["A","骨痹；皮氣"],["B","浮痹；皮氣"],["C","寒痹；衛氣"],["D","浮痹；肺氣"]],"answer":"B","difficulty":"中","explanation":"九刺之「毛刺」刺浮痹在皮膚者；五刺之「半刺」淺刺疾出、如拔毛狀，以取皮氣，應肺（肺主皮毛）。另十二刺之「揚刺」（正內一，傍內四而浮之）也是多針淺刺，同為皮膚針叢針淺刺的理論來源。","source":"《靈樞經》卷二‧官鍼第七；本資料庫 notes（三稜針、皮膚針、皮內針）","id":"D7-012","h":"af2343b27c"},{"day":7,"date":"2026-10-14","number":13,"topic":"Day7｜芒針：源流與操作","group":"芒針","qtype":"非題","stem":"關於芒針，下列何者錯誤？","options":[["A","芒針針身細長，進針後應以大幅度、快速提插加強得氣，刺激越強療效越好"],["B","進針多以雙手夾持、配合捻轉緩慢推進，並注意避開血管與內臟"],["C","由九鍼中的長鍼演變而來，《靈樞‧官鍼》謂「病在中者，取以長鍼」"],["D","常用於深刺或沿皮透刺，例如秩邊、環跳治坐骨神經痛"]],"answer":"A","difficulty":"中","explanation":"芒針長、細、易彎，操作以雙手配合、輕捻緩進為原則，不宜大幅提插，以免彎針、滯針或傷及深部組織與器官；胸背、腹部臟器附近更要控制方向與深度。古代長鍼「鋒利身薄，可以取遠痹」，《針灸大成‧九針圖》說長針用於「痺深居骨解腰脊節腠之間者」。","source":"本資料庫 textbook_notes（特殊針法 第五章；楊甲三 第八章：芒針為長針，用於深部、透刺）；《靈樞經》卷二‧官鍼第七；《針灸大成》卷五‧九針圖","id":"D7-013","h":"2cc909b25f"},{"day":7,"date":"2026-10-14","number":14,"topic":"Day7｜針刀：抗凝治療與禁忌篩檢","group":"針刀","qtype":"臨床情境","stem":"62歲女性右手中指扳機指半年，局部類固醇注射後復發，希望接受針刀鬆解。病史：心房顫動，服用 warfarin，上週 INR 3.4；手掌局部無紅腫破損。下列處置何者最適當？","options":[["A","針刀屬閉合性微創，出血很少，抗凝治療不影響，可照常施術"],["B","請患者自行停用 warfarin 兩天後即可施術"],["C","出血傾向屬針刀的禁忌或須審慎評估的情況，應先與處方醫師討論凝血狀態，條件許可並取得書面知情同意後再施術，並記錄評估結果"],["D","改在同部位以三稜針放血代替，以免出血"]],"answer":"C","difficulty":"中","explanation":"針刀是在閉合狀態下對組織切割、剝離，屬侵入性較高的操作；出血傾向、施術部位感染、全身發熱、重要臟器病變急性期、體質極虛者都是禁忌或須審慎。INR 偏高時不可自行停藥（有栓塞中風風險），也不宜貿然施術，應與處方醫師共同評估。三稜針放血同樣有出血風險。施術前要完成禁忌篩檢與書面知情同意，並記錄。","source":"本資料庫 notes（小針刀、浮針、其他微針系統：針刀禁忌）；textbook_notes（特殊針法 第八章 安全與作業規範）","id":"D7-014","h":"dcb1736acd"},{"day":7,"date":"2026-10-14","number":15,"topic":"Day7｜電針波型：疏密波（情境）","group":"電針波型","qtype":"臨床情境","stem":"24歲籃球員右踝內翻扭傷第3天，X 光已排除骨折，外踝前下方仍腫脹瘀痛。欲以電針促進局部循環、消腫止痛，並希望刺激不易產生適應，下列波型何者最適當？","options":[["A","疏密波"],["B","斷續波"],["C","疏波"],["D","鋸齒波"]],"answer":"A","difficulty":"易","explanation":"疏密波是疏波與密波自動交替，可避免單一波型容易產生的適應，能促進代謝與血液循環、改善組織營養、消炎消腫，常用於扭挫傷、關節周圍炎、坐骨神經痛、面癱等。密波（高頻）偏抑制、止痛、解痙；疏波（低頻）與斷續波偏興奮、引起肌肉收縮，用於痿證癱瘓；鋸齒波可刺激膈神經作人工電呼吸。","source":"本資料庫 notes（火針、電針、穴位注射、穴位埋線）；textbook_notes（特殊針法 第六章；楊甲三 第八章 電針）","id":"D7-015","h":"2ca7d97d62"},{"day":7,"date":"2026-10-14","number":16,"topic":"Day7｜電針波型特點辨析","group":"電針波型特點辨析","qtype":"非題","stem":"關於電針常用波型的特點，下列何者錯誤？","options":[["A","鋸齒波的脈衝幅度呈鋸齒狀起伏，頻率接近人體呼吸頻率，可刺激膈神經作人工電呼吸"],["B","斷續波時斷時續（例如斷1.5秒、續1.5秒密波），機體不易適應，對肌肉有強烈興奮作用，常用於痿證、癱瘓"],["C","密波頻率低（約2–5 Hz），以引起肌肉明顯收縮為主，常用於痿證、癱瘓"],["D","疏波頻率低（約2–5 Hz），刺激作用較強，能引起肌肉收縮，提高肌肉韌帶張力"]],"answer":"C","difficulty":"中","explanation":"密波為高頻（一般50–100 Hz），能降低神經應激性，先抑制感覺神經、再抑制運動神經，用於止痛、鎮靜、緩解肌肉與血管痙攣及針刺麻醉。「低頻、引起肌肉收縮」是疏波的特點。疏密波為疏、密交替，能促進代謝與循環、消腫止痛，且不易產生適應。","source":"本資料庫 notes（火針、電針、穴位注射、穴位埋線：電針波型）；textbook_notes（特殊針法 第六章）；十天計畫 Day7 自我測驗（密波、疏波、疏密波、斷續波作用）","id":"D7-016","h":"b92ba3640b"},{"day":7,"date":"2026-10-14","number":17,"topic":"Day7｜實證：電針頻率與神經胜肽（Han 2003）","group":"實證","qtype":"實證研究","stem":"韓濟生（Han JS）2003年於《Trends in Neurosciences》發表的回顧（doi:10.1016/S0166-2236(02)00006-1），整理不同頻率電針所釋放的神經胜肽。下列何者正確？","options":[["A","在身體不同部位同時給予2 Hz與100 Hz（2+100），可同時釋放四種鴉片胜肽，效果最好"],["B","100 Hz 主要釋放腦啡肽與β-內啡肽，2 Hz 主要釋放強啡肽"],["C","2 Hz 低頻主要促進腦啡肽、β-內啡肽與內嗎啡肽釋放；100 Hz 高頻主要促進強啡肽釋放；2 Hz 與 100 Hz 每3秒自動交替（2/100 Hz）可同時動員兩類系統，鎮痛比固定頻率更強"],["D","電針鎮痛與頻率無關，只取決於電流強度"]],"answer":"C","difficulty":"高","explanation":"該文指出頻率是決定電針釋放哪一類胜肽的關鍵：低頻（2 Hz）→腦啡肽、β-內啡肽、內嗎啡肽（μ、δ受體）；高頻（100 Hz）→強啡肽（κ受體，作用在脊髓）。2/100 Hz 疏密交替可產生協同鎮痛；不同部位同時給2 Hz與100 Hz（2+100）時，主要只活化κ系統，沒有交替模式的效果。這也呼應臨床上疏密波不易適應、止痛較好的說法。","source":"Han JS. Trends Neurosci. 2003;26(1):17-22. doi:10.1016/S0166-2236(02)00006-1（PMID 12495858）","id":"D7-017","h":"bb777323ed"},{"day":7,"date":"2026-10-14","number":18,"topic":"Day7｜實證：電針治療膝骨關節炎（Tu 2021）","group":"實證","qtype":"實證研究","stem":"Tu JF 等2021年於《Arthritis \u0026 Rheumatology》發表多中心、假針對照的隨機試驗（doi:10.1002/art.41584），比較電針、手針與假針刺治療膝骨關節炎（每週3次、共8週）。下列敘述何者正確？","options":[["A","手針組在第8週療效顯著優於電針與假針組，電針組則與假針無差異"],["B","三組在第8週與追蹤期均無差異，作者認為針刺效果完全來自安慰劑"],["C","電針在第8週有效，但第16週後療效就消失，且不良事件顯著較多"],["D","第8週反應率（疼痛與功能同時達最小臨床重要改善）電針組60.3%、手針組58.6%、假針組47.3%；電針顯著優於假針，手針在第8週未達顯著，但兩組在第16、26週都優於假針"]],"answer":"D","difficulty":"高","explanation":"480人隨機分組，442人納入療效分析。第8週反應率：電針60.3%、手針58.6%、假針47.3%；電針對假針相差13.0%（P=0.0234，達顯著），手針對假針相差11.3%（P=0.0507，未達）。第16、26週時，電針與手針的反應率都顯著高於假針。結論：密集電針能改善膝 OA 的疼痛與功能，效果持續到第26週。","source":"Tu JF, Yang JW, Shi GX, et al. Arthritis Rheumatol. 2021;73(3):448-458. doi:10.1002/art.41584（PMID 33174383）","id":"D7-018","h":"f343dd264b"},{"day":7,"date":"2026-10-14","number":19,"topic":"Day7｜雷射針灸：劑量計算與紀錄","group":"雷射針灸","qtype":"概念","stem":"以半導體雷射照射合谷穴，輸出功率 50 mW、光斑面積 0.1 cm²、照射 40 秒。病歷應記錄的能量與能量密度各為多少？","options":[["A","能量 2 J；能量密度 0.2 J/cm²"],["B","能量 2 J；能量密度 20 J/cm²"],["C","能量 2,000 J；能量密度 200 J/cm²"],["D","能量 0.2 J；能量密度 2 J/cm²"]],"answer":"B","difficulty":"中","explanation":"能量（J）＝功率（W）×時間（s）＝0.05 W × 40 s＝2 J（注意 50 mW 要先換算成 0.05 W，否則會算成 2,000）。能量密度（J/cm²）＝能量÷光斑面積＝2 J ÷ 0.1 cm²＝20 J/cm²。雷射針灸應記錄波長、功率、照射時間或能量密度及部位；施作時醫病雙方都要配戴對應波長的護目鏡，避免直射眼睛。","source":"本資料庫 textbook_notes（特殊針法 第六章 雷射針灸；第八章：雷射紀錄波長、功率、照射時間，劑量以 J/cm² 表示）","id":"D7-019","h":"219bcbb4c5"},{"day":7,"date":"2026-10-14","number":20,"topic":"Day7｜穴位磁療：禁忌","group":"穴位磁療","qtype":"非題","stem":"關於穴位磁療，下列何者錯誤？","options":[["A","可用磁片（磁珠）貼敷穴位，或以磁療儀產生磁場作用於穴位"],["B","少數人會出現頭暈、噁心、乏力、心悸等反應，多數在減量或停用後消失"],["C","耳穴也可用磁珠貼壓，代替王不留行籽"],["D","裝有心臟節律器者，可在膻中、內關等胸前與上肢穴位貼敷強磁片，以加強寧心安神"]],"answer":"D","difficulty":"易","explanation":"強磁場可能干擾心臟節律器及其他植入式電子醫療裝置，屬禁忌；孕婦下腹部、皮膚破損潰瘍處、有出血傾向及體質極度虛弱者也不宜。磁療的副作用多半輕微短暫，出現時移除磁片觀察即可。","source":"本資料庫 textbook_notes（特殊針法 第六章 物理刺激類：穴位磁療；第八章 禁忌篩檢：心臟節律器）；notes（耳針：壓丸法）","id":"D7-020","h":"715d967efc"},{"day":7,"date":"2026-10-14","number":21,"topic":"Day7｜穴位注射：觸及神經幹的處理","group":"穴位注射","qtype":"臨床情境","stem":"腰腿痛患者在足三里行穴位注射（維生素 B12）。針尖刺入、回抽無血後開始推藥，患者突然有觸電樣麻感，向下放射到足背。下列處置何者最適當？","options":[["A","改將藥液注入膝關節腔，以擴大治療範圍"],["B","立即停止推藥，將針退出少許並略改變方向，待觸電感消失、回抽無血後再緩慢注入"],["C","在原位把藥液推完，之後局部熱敷即可"],["D","觸電感代表「得氣」，應加快推藥速度以加強療效"]],"answer":"B","difficulty":"中","explanation":"觸電樣放射感表示針尖碰到神經幹（足三里深部附近有腓深神經）；把藥注入神經幹可能造成神經損傷，應立即退針、調整方向。穴位注射原則：回抽無血才推藥；避開神經幹與血管；不可注入關節腔、脊髓腔、血管；注意藥物過敏與配伍禁忌；四肢穴位一般每穴1–2 ml。","source":"本資料庫 notes（火針、電針、穴位注射、穴位埋線）；textbook_notes（特殊針法 第七章）","id":"D7-021","h":"00db6786cc"},{"day":7,"date":"2026-10-14","number":22,"topic":"Day7｜穴位埋線：糖尿病控制不良","group":"穴位埋線","qtype":"臨床情境","stem":"46歲女性 BMI 33，第2型糖尿病控制不佳（HbA1c 10.6%），希望接受腹部穴位埋線減重。下列處置何者最適當？","options":[["A","血糖控制不良時，感染與傷口癒合不良的風險高，宜暫緩埋線，先轉介新陳代謝科調整血糖，並給予飲食運動衛教"],["B","術後局部稍有發紅就表示感染，一律立即切開取線"],["C","改用不可吸收的尼龍線，可以減少反覆施術"],["D","把線埋在皮下脂肪的最淺層，比較不容易感染"]],"answer":"A","difficulty":"易","explanation":"埋線的禁忌與慎用：皮膚感染潰瘍、出血傾向、孕婦、糖尿病控制不良、肺結核活動期、嚴重心臟病、瘢痕體質等。應使用可吸收線（羊腸線、PGA/PDO），深度以皮下組織與肌層之間為宜，太淺容易排異外露。術後數日輕度紅腫熱痛、低熱多屬無菌性炎症反應；持續加重或化膿才按感染處理。","source":"本資料庫 notes（火針、電針、穴位注射、穴位埋線）；textbook_notes（特殊針法 第七章；楊甲三 第八章 埋線）","id":"D7-022","h":"9f5c124db2"},{"day":7,"date":"2026-10-14","number":23,"topic":"Day7｜三伏貼：入伏日的推算","group":"三伏貼","qtype":"概念","stem":"三伏貼依傳統曆法在「三伏」施貼。下列關於入伏日期的推算何者正確？","options":[["A","立秋後第三個庚日為初伏，處暑為末伏"],["B","夏至後第三個庚日為初伏，第四個庚日為中伏，立秋後第一個庚日為末伏"],["C","夏至當日為初伏，小暑為中伏，大暑為末伏"],["D","小暑後第一個丙日為初伏，以後每隔10天依次為中伏、末伏"]],"answer":"B","difficulty":"中","explanation":"三伏依干支記日：夏至後第三個庚日入初伏，第四個庚日入中伏，立秋後第一個庚日入末伏（初伏、末伏各10天，中伏10或20天）。三伏貼多在初、中、末伏各貼一次，常用肺俞、大椎、定喘、膏肓、天突、膻中，藥用白芥子、延胡索、細辛、甘遂等研末薑汁調敷；成人一般貼2–4小時，小兒縮短。「三九貼」則從冬至起算。","source":"本資料庫 textbook_notes（特殊針法 第七章；楊甲三 第八章 穴位貼敷）；傳統曆法「三伏」定義","id":"D7-023","h":"2f7b0f2d7b"},{"day":7,"date":"2026-10-14","number":24,"topic":"Day7｜安全規範：知情同意與紀錄","group":"安全規範","qtype":"概念","stem":"關於特殊針法的知情同意與病歷紀錄，下列何者正確？","options":[["A","火針、刺絡放血、埋線、穴位注射等侵入性較高的處置，宜事先說明疤痕、感染、出血、疼痛等風險，並取得書面同意"],["B","電針應記錄穴位、波型、頻率、強度與通電時間"],["C","穴位注射應記錄藥名、劑量、批號與注射部位；雷射應記錄波長、功率與照射時間或能量密度"],["D","發生暈針、血腫、感染等不良事件時，應即時處置、如實記錄並追蹤"],["E","以上皆是"]],"answer":"E","difficulty":"易","explanation":"所有特殊針法都要遵守無菌操作、禁忌篩檢、知情同意與紀錄規範；侵入性越高，說明與書面同意越重要。完整紀錄（器材批號、參數、劑量、不良反應）是醫療品質與醫療爭議防範的基礎。新式針具及技術（如浮針、揿針、針刀）仍屬侵入性醫療行為，須由中醫師執行。","source":"本資料庫 textbook_notes（特殊針法 第八章 特殊針法的安全與作業規範：感染控制、知情同意、禁忌篩檢與紀錄）","id":"D7-024","h":"8a44cfac2d"},{"day":7,"date":"2026-10-14","number":25,"topic":"Day7｜安全規範：懷孕篩檢","group":"安全規範","qtype":"臨床情境","stem":"29歲女性經痛多年，要求在三陰交行穴位注射，並在腰骶部（次髎）埋線。問診發現月經已延遲10天、近期未避孕，尚未驗孕。下列處置何者最適當？","options":[["A","先確認是否懷孕（驗孕）；未排除懷孕前，不在三陰交、合谷等穴強刺激或注射，也不在下腹部、腰骶部埋線"],["B","改在合谷行強刺激瀉法，就不必考慮懷孕"],["C","經痛屬實證，三陰交注射可以止痛，是否懷孕不影響處置"],["D","先完成埋線，下次回診再驗孕"]],"answer":"A","difficulty":"易","explanation":"懷孕是多數特殊針法（埋線、穴位注射、電針、耳穴內生殖器等）的禁忌或慎用條件；孕婦下腹部、腰骶部及合谷、三陰交、至陰、崑崙等穴不宜強刺激。月經延遲者應先排除懷孕（也要想到子宮外孕），再決定處置，並記錄篩檢結果。","source":"本資料庫 textbook_notes（特殊針法 第八章 禁忌篩檢）；notes（針刺注意事項與禁忌；穴位注射、穴位埋線）","id":"D7-025","h":"014ace5810"},{"day":7,"date":"2026-10-14","number":26,"topic":"Day7｜子午流注：天干配臟腑（大成 vs 要訣）","group":"子午流注","qtype":"經典","stem":"比較《針灸大成‧十二經納天干歌》與《刺灸心法要訣‧天干十二經表裡歌》對三焦、心包絡配天干的記載，下列何者正確？","options":[["A","兩書都以庚配肺、辛配大腸，三焦、包絡不配天干"],["B","《針灸大成》作三焦歸丙、包絡歸丁；《刺灸心法要訣》改為三焦寄壬、包絡歸癸"],["C","《針灸大成》作「三焦亦向壬中寄，包絡同歸入癸方」；《刺灸心法要訣》認為兩者表裡皆屬相火，改為「三焦陽府須歸丙，包絡從陰丁火旁」"],["D","兩書都作三焦歸丙、包絡歸丁"]],"answer":"C","difficulty":"高","explanation":"兩書其餘十經配法相同：甲膽乙肝丙小腸，丁心戊胃己脾鄉，庚屬大腸辛屬肺，壬屬膀胱癸腎。《要訣》按語：「舊云：三焦亦向壬中寄，包絡同歸入癸方。夫三焦為決瀆之官，猶可言壬，而包絡附於心主，烏可云癸？況二臟表裡，皆相火也，故改正之。」並注明陽干為表為腑、陰干為裡為臟。徐氏〈論子午流注法〉則說三焦、包絡「雖寄於壬癸，亦分派於十干」。","source":"《針灸大成》卷七‧十二經納天干歌、論子午流注法（徐氏）；《刺灸心法要訣》卷一‧天干十二經表裡歌","id":"D7-026","h":"8d2a539c34"},{"day":7,"date":"2026-10-14","number":27,"topic":"Day7｜子午流注納甲法：乙日開穴推演","group":"子午流注納甲法","qtype":"概念","stem":"依《針灸大成‧徐氏子午流注逐日按時定穴歌》納甲法，乙日乙酉時開肝經井穴大敦，之後按「經生經、穴生穴」每隔一個陰時依次開穴。同日癸巳時應開何穴？","options":[["A","陰谷"],["B","湧泉"],["C","復溜"],["D","太谿"]],"answer":"A","difficulty":"高","explanation":"乙日（肝木值日）：乙酉開大敦（肝井木）→丁亥少府（心滎火，木生火）→己丑太白（脾輸土），同時返本還原開肝原太衝→辛卯經渠（肺經金）→癸巳陰谷（腎合水）→乙未勞宮（日干重見，血納包絡，取包絡滎火，木生火）。原文：「乙日酉時肝大敦，丁亥時榮少府心，己丑太白太沖穴，辛卯經渠是肺經，癸巳腎宮陰谷合，乙未勞宮火穴榮。」","source":"《針灸大成》卷七‧徐氏子午流注逐日按時定穴歌、論子午流注法","id":"D7-027","h":"fa676f4b8f"},{"day":7,"date":"2026-10-14","number":28,"topic":"Day7｜子午流注納甲法：氣納三焦","group":"子午流注納甲法","qtype":"經典填空","stem":"《針灸大成‧徐氏子午流注逐日按時定穴歌》甲日：「……庚辰經注陽谿穴，壬午膀胱委中尋，甲申時納三焦水，榮合天干取____。」空格應填哪一穴？為什麼取此穴？","options":[["A","中渚；三焦輸木與甲木同氣"],["B","液門；日干重見（甲申時），陽經「氣納三焦」，取三焦滎水穴，水生甲木"],["C","陽池；陽經逢輸過原"],["D","關衝；三焦井金剋甲木以瀉其實"]],"answer":"B","difficulty":"中","explanation":"〈論子午流注法〉：「甲申時氣納三焦，榮穴屬水，甲屬木，是以水生木。」陽干重見時氣納三焦，取生我（日干）之穴；陰干重見時血歸包絡，取我生之穴（如乙未時取包絡滎火勞宮，木生火）。","source":"《針灸大成》卷七‧徐氏子午流注逐日按時定穴歌、論子午流注法","id":"D7-028","h":"d1e55bf8a2"},{"day":7,"date":"2026-10-14","number":29,"topic":"Day7｜子午流注：閉穴與合日互用","group":"子午流注","qtype":"概念","stem":"依《針灸大成‧流注時日》，納甲法遇到「陽日遇陰時、陰日遇陽時」前穴已閉，或急症不能等待開穴時，處理原則為何？","options":[["A","取天干相合之日、同一時辰所開的穴（甲與己合、乙與庚合、丙與辛合、丁與壬合、戊與癸合），即「夫妻子母互用」"],["B","閉穴時針刺最能引邪外出，應優先針閉穴"],["C","一律改用靈龜八法，不可再用子午流注"],["D","改以甲與庚、乙與辛等相剋之日互用"]],"answer":"A","difficulty":"高","explanation":"原文：「閉則以本時天干，與某穴相合者針之……取其合穴針之，合者，甲與己合化土，乙與庚合化金，丙與辛合化水，丁與壬合化木，戊與癸合化火，五門十變」；「夫妻子母互用……妻閉則針其夫，夫閉則針其妻，子閉針其母，母閉針其子，必穴與病相宜，乃可針也。」〈流注開闔〉也指出闔閉之時「氣血正值衰絕……誤刺妄引邪氣，壞亂真氣」。","source":"《針灸大成》卷七‧流注時日、流注開闔（醫學入門）","id":"D7-029","h":"694ce5c4f8"},{"day":7,"date":"2026-10-14","number":30,"topic":"Day7｜子午流注納子法：腎經補母瀉子","group":"子午流注納子法","qtype":"臨床情境","stem":"50歲男性腰膝痠軟、耳鳴、畏寒，辨為腎虛。若依《針灸大成‧十二經病井榮俞經合補瀉虛實》，以納子法配合本經子母補瀉，下列何者正確？","options":[["A","虛則戌時補太谿（輸土）；實則酉時瀉然谷（滎火）"],["B","虛則酉時補至陰（井金）；實則申時瀉束骨（輸木）"],["C","虛則酉時補復溜；實則戌時瀉湧泉"],["D","虛則戌時（腎經氣血方過）補復溜（經金，金生水）；若為實證，則酉時瀉湧泉（井木，水生木）"]],"answer":"D","difficulty":"中","explanation":"納子法：酉時氣血注腎。實證在本經氣血正盛之時（酉時）迎而奪之、瀉其子穴；虛證在氣血方過之時（戌時）隨而濟之、補其母穴。腎屬水，母為金（經穴復溜），子為木（井穴湧泉）。「酉時補至陰、申時瀉束骨」是膀胱經的補瀉時穴。","source":"《針灸大成》卷五‧十二經病井榮俞經合補瀉虛實；卷七‧十二經納地支歌","id":"D7-030","h":"5faa8f95b9"},{"day":7,"date":"2026-10-14","number":31,"topic":"Day7｜靈龜八法：九宮與八法歌","group":"靈龜八法","qtype":"經典填空","stem":"《針灸大成‧靈龜取法飛騰針圖》：「戴九履一，左三右七，二四為肩，八六為足，五十居中，寄於坤局。」配合〈八法歌〉，「巽四」與「艮八」依序對應哪兩穴？","options":[["A","照海；內關"],["B","臨泣；內關"],["C","外關；公孫"],["D","臨泣；後谿"]],"answer":"B","difficulty":"易","explanation":"八法歌：「坎一聯申脈，照海坤二五，震三屬外關，巽四臨泣數，乾六是公孫，兌七後谿府，艮八繫內關，離九列缺主。」洛書九宮：戴九（離九）、履一（坎一）、左三（震三）、右七（兌七）、二四為肩（坤二、巽四）、八六為足（艮八、乾六），五居中宮寄坤，所以五也開照海。","source":"《針灸大成》卷七‧靈龜取法飛騰針圖（徐氏）、八法歌","id":"D7-031","h":"7a1710c8ce"},{"day":7,"date":"2026-10-14","number":32,"topic":"Day7｜靈龜八法計算：癸酉日子時","group":"靈龜八法計算","qtype":"概念","stem":"以靈龜八法推算「癸酉日子時」應開何穴？（需先依日干推出時干）","options":[["A","後谿（常配申脈）"],["B","申脈（常配後谿）"],["C","照海（常配列缺）"],["D","公孫（常配內關）"]],"answer":"B","difficulty":"高","explanation":"①時干：〈八法五虎建元日時歌〉「戊癸甲寅定時候」，戊癸日寅時為甲寅，往前推兩個時辰，子時為壬子。\n②代數：日干癸7、日支酉9（逐日干支歌）；時干壬6、時支子9（臨時干支歌）；合計7＋9＋6＋9＝31。\n③癸為陰日，除6：31－30＝餘1。\n④坎一聯申脈→開申脈，常配後谿（「後谿申脈亦相從」）。","source":"《針灸大成》卷七‧八法五虎建元日時歌、八法逐日干支歌、八法臨時干支歌、八法歌、八法交會歌","id":"D7-032","h":"9abe1d259b"},{"day":7,"date":"2026-10-14","number":33,"topic":"Day7｜靈龜八法計算：庚午日丙子時（寄坤）","group":"靈龜八法計算","qtype":"概念","stem":"以靈龜八法推算「庚午日丙子時」應開何穴？","options":[["A","臨泣"],["B","公孫"],["C","列缺"],["D","照海（餘數5，五寄坤）"]],"answer":"D","difficulty":"中","explanation":"日干庚9、日支午7；時干丙7、時支子9；合計9＋7＋7＋9＝32。庚為陽日，除9：32－27＝餘5。五居中宮「寄於坤局」，與坤二同開照海（「照海坤二五」），常配列缺。\n易錯：把逐日數與臨時數混用（例如日干庚誤用臨時數8、日支午誤用9，得33，餘6而誤開公孫）。","source":"《針灸大成》卷七‧八法五虎建元日時歌、八法逐日干支歌、八法臨時干支歌、八法歌、八法交會歌；靈龜取法飛騰針圖","id":"D7-033","h":"3b1f1190ad"},{"day":7,"date":"2026-10-14","number":34,"topic":"Day7｜靈龜八法計算：辛卯日癸巳時（整除）","group":"靈龜八法計算","qtype":"概念","stem":"以靈龜八法推算「辛卯日癸巳時」應開何穴？","options":[["A","臨泣"],["B","公孫（整除時取除數6，乾六）"],["C","內關"],["D","列缺"]],"answer":"B","difficulty":"中","explanation":"日干辛7、日支卯8；時干癸5、時支巳4；合計7＋8＋5＋4＝24。辛為陰日，除6：24÷6＝4，剛好整除。沒有餘數時取除數本身（陰日取6、陽日取9），六為乾卦，開公孫，常配內關。原文：「陽日除九陰除六，不及零餘穴下推。」","source":"《針灸大成》卷七‧八法五虎建元日時歌、八法逐日干支歌、八法臨時干支歌、八法歌、八法交會歌","id":"D7-034","h":"72d5e7eff4"},{"day":7,"date":"2026-10-14","number":35,"topic":"Day7｜飛騰八法：按時干開穴","group":"飛騰八法","qtype":"概念","stem":"甲日巳時想用「飛騰八法」開穴，下列何者正確？","options":[["A","甲日巳時為丁巳時，開照海"],["B","須將甲日與巳時的干支代數相加後除九，依餘數開穴"],["C","只看時支「巳」，開照海"],["D","甲日巳時為己巳時，只看時干「己」，開列缺"]],"answer":"D","difficulty":"中","explanation":"飛騰八法只依時干開穴，不論日干支，也不必計算：「壬甲公孫即是乾，丙居艮上內關然，戊為臨泣生坎水，庚屬外關震相連，辛上後谿裝巽卦，乙癸申脈到坤傳，己土列缺南離上，丁居照海兌金全。」\n時干推法：〈八法五虎建元日時歌〉「甲己之辰起丙寅」，寅時為丙寅，往後為丁卯、戊辰、己巳，故巳時為己巳→列缺。靈龜八法才需把日、時干支代數相加，陽日除九、陰日除六。","source":"本資料庫 notes（子午流注與靈龜八法：靈龜八法與飛騰八法，徐鳳《針灸大全》）；《針灸大成》卷七‧八法五虎建元日時歌","id":"D7-035","h":"355ca4f687"},{"day":7,"date":"2026-10-14","number":36,"topic":"其他｜經絡：足少陰經筋病候","group":"經絡","qtype":"經典填空","stem":"《靈樞‧經筋》足少陰之筋：「其病足下轉筋，及所過而結者，皆痛及轉筋。病在此者，主癇瘛及痙，在外者，不能____，在內者，不能____，故陽病者，腰反折不能俛，陰病者，不能仰。」兩空格依序應填？","options":[["A","俛；仰"],["B","行；臥"],["C","屈；伸"],["D","仰；俛"]],"answer":"A","difficulty":"中","explanation":"背為陽、腹為陰：病在外（陽、背側）則腰反折、不能俯（俛）；病在內（陰、腹側）則不能仰。治法：「治在燔鍼劫刺，以知為數，以痛為輸，在內者，熨引飲藥。此筋折紐，紐發甚者，死不治，名曰仲秋痹也。」","source":"《靈樞經》卷四‧經筋第十三","id":"D7-036","h":"d674f25aaa"},{"day":7,"date":"2026-10-14","number":37,"topic":"其他｜經絡：十二經別六合","group":"經絡","qtype":"非題","stem":"依《靈樞‧經別》十二經別的「六合」，下列何者錯誤？","options":[["A","手少陽與手心主之正為「四合」，合於目內眥"],["B","足太陽與足少陰之正為「一合」，足少陰之正「直者，繫舌本，復出於項，合於太陽」"],["C","足少陽與足厥陰之正為「二合」，足少陽之正「繫目系，合少陽於外眥」"],["D","手陽明與手太陰之正為「六合」，手太陰之正「循喉嚨，復合陽明」"]],"answer":"A","difficulty":"中","explanation":"「四合」是手太陽與手少陰（手少陰之正「上走喉嚨，出於面，合目內眥」）；手少陽與手心主是「五合」，手心主之正「出循喉嚨，出耳後，合少陽完骨之下」。三合為足陽明與足太陰。陰經經別都合入相表裡的陽經，所以陰經穴也能治頭面病。","source":"《靈樞經》卷三‧經別第十一","id":"D7-037","h":"081ccd277e"},{"day":7,"date":"2026-10-14","number":38,"topic":"其他｜經絡：十二經標本（足少陰）","group":"經絡","qtype":"經典填空","stem":"《靈樞‧衛氣》論十二經標本：「足少陰之本，在內踝下上三寸中，標在____與舌下兩脈也。」並說：「凡候此者，下虛則厥，下盛則熱，上虛則____，上盛則熱痛。」兩空格依序應填？","options":[["A","窗籠；痛"],["B","背俞；眩"],["C","廉泉；厥"],["D","命門；眩"]],"answer":"B","difficulty":"高","explanation":"足少陰之本在內踝下上三寸中，標在背俞（腎俞）與舌下兩脈。標本診察：下（本）虛則厥、下盛則熱；上（標）虛則眩、上盛則熱痛。治則：「實者，絕而止之，虛者，引而起之。」對照：足太陽標在兩絡命門（目），足少陽標在窗籠（耳）。","source":"《靈樞經》卷八‧衛氣第五十二","id":"D7-038","h":"b005c1185a"},{"day":7,"date":"2026-10-14","number":39,"topic":"其他｜經絡：十二皮部","group":"經絡","qtype":"經典填空","stem":"《針灸大成》卷一收錄〈皮部論〉：「皮者，脈之部也。邪客於皮，則腠理開，開則邪入，客於____，____滿則注於經脈，經脈滿，則入舍於腑臟也。」此段也常作為皮膚針叩刺的理論基礎。空格應填？","options":[["A","分肉"],["B","經筋"],["C","孫脈"],["D","絡脈"]],"answer":"D","difficulty":"易","explanation":"邪氣由淺入深的傳變：皮→絡脈→經脈→腑臟，所以「皮者有分部，不與而生大病也」（原注：「不與」疑為「不愈」）。十二皮部是十二經脈在體表的分區，皮膚針循經叩刺、刮痧、拔罐等體表療法多以此為依據。","source":"《針灸大成》卷一‧皮部論；本資料庫 notes（三稜針、皮膚針、皮內針）","id":"D7-039","h":"4474b21a4e"},{"day":7,"date":"2026-10-14","number":40,"topic":"其他｜靈樞刺節真邪：刺有五節","group":"靈樞刺節真邪","qtype":"非題","stem":"《靈樞‧刺節真邪》論「刺有五節」，下列何者錯誤？","options":[["A","解惑：大風在身、血脈偏虛，瀉其有餘、補其不足，使陰陽平復"],["B","發矇：耳無所聞、目無所見，必於日中刺聽宮"],["C","徹衣：指寒邪在表、惡寒無汗，盡刺諸陰經的滎穴並久留針以溫之"],["D","振埃：陽氣大逆、上滿胸中、喘喝坐伏，取天容；咳而上氣、胸痛者取廉泉"]],"answer":"C","difficulty":"高","explanation":"徹衣是「盡刺諸陽之奇輸」，治陽氣有餘、陰氣不足，內外皆熱、「熱於懷炭」、汗不出；取天府、大杼三痏，又刺中膂以去其熱，補足手太陰以去其汗，「熱去汗稀，疾於徹衣」。五節依序為振埃、發矇、去爪、徹衣、解惑；去爪是刺關節支絡，治水留於睪，「鈹石所取」。","source":"《靈樞經》卷十一‧刺節真邪第七十五","id":"D7-040","h":"d9c33beb66"},{"day":7,"date":"2026-10-14","number":41,"topic":"其他｜刺灸心法要訣：頭部要穴（上星、通天）","group":"刺灸心法要訣","qtype":"經典填空","stem":"《刺灸心法要訣‧頭部主病針灸要穴歌》：「上星通天主____，瘜肉痔塞灸能痊，兼治頭風目諸疾，炷如小麥灼相安。」空格應填？","options":[["A","口喎"],["B","目翳"],["C","耳聾"],["D","鼻淵"]],"answer":"D","difficulty":"易","explanation":"注：上星、通天二穴主治鼻淵、鼻塞、瘜肉、鼻痔，「左鼻灸右，右鼻灸左，左右鼻俱病者，左右俱灸」，艾炷如小麥大；上星「一云宜三稜針出血，以瀉諸陽之熱氣」。","source":"《刺灸心法要訣》卷七‧頭部主病針灸要穴歌","id":"D7-041","h":"52e2b68791"},{"day":7,"date":"2026-10-14","number":42,"topic":"其他｜刺灸心法要訣：手部要穴（魚際灸法）","group":"刺灸心法要訣","qtype":"經典","stem":"《刺灸心法要訣‧手部主病針灸要穴歌》：「魚際主灸牙齒痛，在左灸左右同然，更刺傷寒汗不出，兼治瘧疾方欲寒。」依其注文，魚際穴的灸法規定為何？","options":[["A","牙痛時左病灸右、右病灸左"],["B","一律禁灸，只可用三稜針出血"],["C","惟牙痛可灸，其餘病證禁灸"],["D","各種病證都宜灸七壯，炷如小麥"]],"answer":"C","difficulty":"易","explanation":"注：「魚際穴，主治牙齒痛，瘧疾初起先覺發寒，傷寒汗不出等證。針二分。惟牙痛可灸，餘證禁灸。」歌中「在左灸左右同然」是病在左灸左、在右灸右（同側），和間使治瘰癧「患左灸右，患右灸左」、內庭「左右繆灸」的交叉灸法不同。","source":"《刺灸心法要訣》卷七‧手部主病針灸要穴歌、足部主病針灸要穴歌（內庭）","id":"D7-042","h":"f69b35e168"},{"day":7,"date":"2026-10-14","number":43,"topic":"其他｜刺灸心法要訣：足部要穴（晝夜發痓）","group":"刺灸心法要訣","qtype":"經典","stem":"《刺灸心法要訣‧足部主病針灸要穴歌》論痓（痙）證：「照海穴治夜發痓」「晝發痓證治若何，金針____起沉疴」。下列配對何者正確？","options":[["A","晝發取申脈（通陽蹻）；夜發取照海（通陰蹻）"],["B","晝發取公孫；夜發取內關"],["C","晝發取後谿；夜發取列缺"],["D","晝發取照海；夜發取申脈"]],"answer":"A","difficulty":"易","explanation":"陽蹻主晝、陰蹻主夜：申脈通陽蹻，主「晝發痓證，足腫牙疼」；照海通陰蹻，主「夜發痓證，及消渴大便閉」。同理，失眠常補照海、瀉申脈。","source":"《刺灸心法要訣》卷七‧足部主病針灸要穴歌","id":"D7-043","h":"325f06515c"},{"day":7,"date":"2026-10-14","number":44,"topic":"其他｜刺灸心法要訣：胸腹部要穴刺灸規定","group":"刺灸心法要訣","qtype":"非題","stem":"依《刺灸心法要訣‧胸腹部主病針灸要穴歌》及其注，下列何者錯誤？","options":[["A","水分主治鼓脹堅硬、肚臍突出、小便不利，灸五壯，禁針，孕婦不可灸"],["B","神闕灸三壯，禁針；一法納炒乾淨鹽填滿臍上，加厚薑一片，上加艾炷灸之"],["C","膻中主治哮喘、肺癰、咳嗽、氣癭，針三分，禁灸"],["D","章門主治痞塊，多灸左邊；腎積則兩邊齊灸"]],"answer":"C","difficulty":"高","explanation":"注：「膻中穴，主治哮喘，肺癰，咳嗽，氣癭等證。灸七壯，禁針。」是禁針、可灸，與題目所述相反（膻中也列在禁針穴歌中；現代多平刺，避免直刺過深）。其他三項都與原文相符。","source":"《刺灸心法要訣》卷七‧胸腹部主病針灸要穴歌；本資料庫 notes（禁針禁灸與孕婦禁忌）","id":"D7-044","h":"0066722c97"},{"day":7,"date":"2026-10-14","number":45,"topic":"其他｜經絡：脾之大絡","group":"經絡","qtype":"經典填空","stem":"《靈樞‧經脈》：「脾之大絡，名曰大包，出____下三寸，布胸脇。實則____，虛則百節盡皆縱，此脈若羅絡之血者，皆取之脾之大絡脈也。」兩空格依序應填？","options":[["A","缺盆；身盡痛"],["B","淵液；身盡痛"],["C","天池；脊強"],["D","淵液；腹皮痛"]],"answer":"B","difficulty":"中","explanation":"大包在腋中線上、第6肋間隙（淵液下3寸），為脾之大絡，統絡全身；實則全身盡痛，虛則百節弛縱。對照：任脈之別尾翳「實則腹皮痛，虛則癢搔」；督脈之別長強「實則脊強，虛則頭重」。大包不可深刺，以防氣胸。","source":"《靈樞經》經脈第十；本資料庫 acupoints（大包 SP21）","id":"D7-045","h":"d882d1d211"},{"day":7,"date":"2026-10-14","number":46,"topic":"其他｜刺灸心法要訣：隨皮刺（頭維）","group":"刺灸心法要訣","qtype":"概念","stem":"《刺灸心法要訣‧頭部主病針灸要穴歌》：「頭維主刺頭風疼，目痛如脫淚不明，禁灸隨皮三分刺，兼刺攢竹更有功。」注文所說的「隨皮」，相當於現代哪一種進針角度？","options":[["A","斜刺：針與皮膚呈45°刺向骨面"],["B","點刺：刺入即出，擠出血滴"],["C","平刺（沿皮刺）：「針入即眠，針隨皮刺去也」"],["D","直刺：針與皮膚呈90°刺入三分"]],"answer":"C","difficulty":"中","explanation":"注：「頭維穴隨皮針三分，禁灸……隨皮者，針入即眠，針隨皮刺去也。」即針身倒伏、沿皮下平刺（約15°），適用於頭皮等皮肉淺薄處，與頭針沿帽狀腱膜下層平刺的道理相通。頭維、攢竹都禁灸。","source":"《刺灸心法要訣》卷七‧頭部主病針灸要穴歌；本資料庫 notes（毫針基本操作：針刺角度）","id":"D7-046","h":"2a2a9e9dd7"},{"day":7,"date":"2026-10-14","number":47,"topic":"其他｜靈樞刺節真邪：解結","group":"靈樞刺節真邪","qtype":"經典填空","stem":"《靈樞‧刺節真邪》：「一經上實下虛而不通者，此必有橫絡盛加於大經，令之不通，視而寫之，此所謂____也。」空格應填？","options":[["A","振埃"],["B","發矇"],["C","解惑"],["D","解結"]],"answer":"D","difficulty":"易","explanation":"「解結」是看到橫絡（淺表瘀滯的絡脈）壓迫大經、使經氣上實下虛不通時，刺絡瀉血以通經，是刺絡放血的重要理論依據。同篇強調「用鍼者，必先察其經絡之實虛，切而循之，按而彈之，視其應動者，乃後取之而下之」。解惑、發矇、振埃則屬「五節」刺法。","source":"《靈樞經》卷十一‧刺節真邪第七十五","id":"D7-047","h":"bf5ba2f4f2"},{"day":7,"date":"2026-10-14","number":48,"topic":"其他｜刺灸心法要訣：足三里灸法年齡","group":"刺灸心法要訣","qtype":"經典填空","stem":"《刺灸心法要訣‧足部主病針灸要穴歌》注足三里：「針五分，留七呼，灸三壯。此穴____外方可灸，不爾反生疾。」空格應填？","options":[["A","二十"],["B","三十"],["C","四十"],["D","五十"]],"answer":"B","difficulty":"易","explanation":"原注認為足三里要年過三十才可灸，否則「反生疾」。歌訣：「足三里治風濕中，諸虛耳聾上牙疼，噎膈鼓脹水腫喘，寒濕腳氣及痹風。」","source":"《刺灸心法要訣》卷七‧足部主病針灸要穴歌","id":"D7-048","h":"ac42a7744f"},{"day":7,"date":"2026-10-14","number":49,"topic":"其他｜經絡：足三陰根結","group":"經絡","qtype":"經典填空","stem":"《靈樞‧根結》：「太陰根於隱白，結於____。少陰根於湧泉，結於____。厥陰根於大敦，結於玉英，絡於膻中。」兩空格依序應填？","options":[["A","太倉；廉泉"],["B","命門；窗籠"],["C","廉泉；太倉"],["D","顙大；太倉"]],"answer":"A","difficulty":"中","explanation":"足三陰根結：太陰根隱白、結太倉（中脘）；少陰根湧泉、結廉泉；厥陰根大敦、結玉英（玉堂）、絡膻中。足三陽：太陽根至陰結命門（目），陽明根厲兌結顙大（鉗耳），少陽根竅陰結窗籠（耳中）。根在四肢末端井穴、結在頭面胸腹，說明井穴可治頭身病。","source":"《靈樞經》根結第五","id":"D7-049","h":"426f477582"},{"day":7,"date":"2026-10-14","number":50,"topic":"其他｜刺灸心法要訣：翳風取穴法","group":"刺灸心法要訣","qtype":"經典","stem":"《刺灸心法要訣‧頭部主病針灸要穴歌》：「翳風專刺耳聾病，兼刺瘰癧項下生。」注文引《針經》所述翳風的取穴方法為何？","options":[["A","讓患者側臥、屈上足取之"],["B","讓患者仰頭，按到動脈應手處取之"],["C","先讓患者咬住約二十文銅錢，再尋取穴中"],["D","讓患者張口取之，閉口則穴閉"]],"answer":"C","difficulty":"易","explanation":"注：「翳風穴，主治耳聾及瘰癧。《針經》云：先將銅錢約二十文，令患者咬之，尋取穴中。針三分，禁灸。」咬物可固定下頜、使耳垂後凹陷明顯，方便取穴。張口取穴的是耳前的耳門、聽宮、聽會；側臥屈上足是環跳的取穴體位。","source":"《刺灸心法要訣》卷七‧頭部主病針灸要穴歌","id":"D7-050","h":"8979d28230"},{"day":8,"date":"2026-10-15","number":1,"topic":"Day8｜治則：《靈樞‧禁服》經刺","group":"治則","qtype":"經典填空","stem":"《靈樞‧禁服》以人迎、寸口脈的倍數判斷病在何經，並提出治則：「盛則寫之，虛則補之，緊痛則取之分肉，代則取血絡，且飲藥，陷下則灸之，不盛不虛，以經取之，名曰____。」空格應填？","options":[["A","輸刺"],["B","巨刺"],["C","繆刺"],["D","經刺"]],"answer":"D","difficulty":"高","explanation":"原文為「名曰經刺」。「不盛不虛，以經取之」是指病在本經、沒有明顯的虛實偏盛，就取本經腧穴調治，所以叫「經刺」。這段治則和《靈樞‧經脈》每條經脈末尾的「盛則寫之，虛則補之，熱則疾之，寒則留之，陷下則灸之，不盛不虛，以經取之」相同，但〈禁服〉多了「緊痛則取之分肉，代則取血絡，且飲藥」兩句。\n繆刺是左病取右、刺絡脈；巨刺是左病取右、刺經脈；輸刺見於〈官鍼〉，與此無關。","source":"《靈樞經》卷八‧禁服第四十八；卷三‧經脈第十","id":"D8-001","h":"a7875e02d2"},{"day":8,"date":"2026-10-15","number":2,"topic":"Day8｜治則：補虛瀉實、清熱溫寒的臨床應用","group":"治則","qtype":"非題","stem":"《靈樞‧經脈》：「盛則寫之，虛則補之，熱則疾之，寒則留之，陷下則灸之，不盛不虛，以經取之。」下列臨床應用何者錯誤？","options":[["A","「陷下則灸之」：中氣下陷的久瀉、脫肛、胃下垂，可灸百會、氣海、足三里"],["B","「不盛不虛，以經取之」是說病證沒有明顯虛實時，不必辨經，只需在疼痛局部任取阿是穴"],["C","「熱則疾之」：外感高熱可取大椎、曲池淺刺疾出，或點刺出血，不久留針"],["D","「寒則留之」：寒邪凝滯的痛痹宜深刺久留針，可加溫針灸"]],"answer":"B","difficulty":"中","explanation":"「不盛不虛，以經取之」是指本經自病、沒有他經虛實牽連，應取本經腧穴，多用平補平瀉。它強調的仍是循經取穴，並不是放棄辨經、只取局部。《難經》解釋為「是正經自生病，不中他邪也」，應「自取其經」。\n其餘三項：熱證淺刺疾出（或刺血），寒證深刺久留，陽氣下陷或脈陷下則用灸，都符合原文。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷五‧難經補瀉；notes（針灸治療學：治療原則與選穴配穴）","id":"D8-002","h":"d2b0beb29c"},{"day":8,"date":"2026-10-15","number":3,"topic":"Day8｜《難經》法則：六十九難「以經取之」","group":"《難經》法則","qtype":"經典填空","stem":"《針灸大成‧難經補瀉》引《難經》：「經言虛者補之，實者瀉之，不虛不實，以經取之，何謂也？然虛者補其母，實者瀉其子，當先補之，然後瀉之，不虛不實，以經取之者，是____，不中他邪也？當自取其經，故言以經取之。」空格應填？","options":[["A","正經自生病"],["B","虛實夾雜"],["C","五邪相干"],["D","奇經受病"]],"answer":"A","difficulty":"中","explanation":"這是《難經‧六十九難》。前半是子母補瀉的總綱「虛者補其母，實者瀉其子」，並強調「當先補之，然後瀉之」（虛實並見時先補後瀉）；後半解釋「不虛不實，以經取之」：病只在本經（正經自生病），不是被他經之邪所傳（不中他邪），所以就取本經的腧穴。\n記法：有母子傳變才用子母補瀉；本經自病就取本經。","source":"《針灸大成》卷五‧難經補瀉（即《難經‧六十九難》）","id":"D8-003","h":"50d57d9e6d"},{"day":8,"date":"2026-10-15","number":4,"topic":"Day8｜《難經》法則：七十五難「瀉南補北」","group":"《難經》法則","qtype":"經典填空","stem":"《針灸大成‧難經補瀉》引《難經》：「經言東方實，西方虛，瀉南方，補北方，何謂也？……東方肝也。則知肝實，西方肺也。則知肺虛。瀉南方火，補北方水，南方火，火者，木之____也。北方水，水者，木之____也。水勝火。子能令母實，母能令子虛，故瀉火補水，欲令金不得平木也。」兩空格依序應填？","options":[["A","母；子"],["B","子；子"],["C","子；母"],["D","所勝；所不勝"]],"answer":"C","difficulty":"中","explanation":"這是《難經‧七十五難》。肝木實、肺金虛時，不直接補肺，而是瀉心火（木之子）、補腎水（木之母）。原理是「子能令母實，母能令子虛」：瀉其子（火）可以奪去肝木之氣；補北方水又能制火，火弱就不再剋金，肺金得以恢復。\n臨床上常用來解釋肝實肺虛（如木火刑金的咳嗽脅痛）時，可瀉心經或肝經的火穴、補腎經或肝經的水穴。","source":"《針灸大成》卷五‧難經補瀉（即《難經‧七十五難》）；textbook_notes（黃維三 下編第一章 第四節）","id":"D8-004","h":"c8e044adab"},{"day":8,"date":"2026-10-15","number":5,"topic":"Day8｜《難經》法則：井穴瀉其滎","group":"《難經》法則","qtype":"經典填空","stem":"《針灸大成‧難經補瀉》引《難經》：「諸井者，肌肉淺薄，氣少不足使也。刺之奈何？然諸井者木也。榮者火也。……當刺井者，以____瀉之。故經言補者不可以為瀉，瀉者不可以為補，此之謂也。」（底本「榮」即「滎」）空格應填？","options":[["A","合"],["B","經"],["C","榮（滎）"],["D","俞（輸）"]],"answer":"C","difficulty":"高","explanation":"這是《難經‧七十三難》。井穴在指（趾）端，肌肉淺薄、氣少，不便施行瀉法；陰經井屬木、滎屬火，火是木之子，依「實則瀉其子」，該瀉井時改瀉滎穴。這和《難經‧七十九難》「迎而奪之者，瀉其子也」同一邏輯。\n應用：例如肝經實證，本應瀉井穴大敦，可改瀉滎穴行間。","source":"《針灸大成》卷五‧難經補瀉（即《難經‧七十三難》）；acupoints（大敦 LR1、行間 LR2）","id":"D8-005","h":"c47ed52f40"},{"day":8,"date":"2026-10-15","number":6,"topic":"Day8｜《難經》法則：七十七難治未病","group":"《難經》法則","qtype":"經典填空","stem":"《針灸大成‧難經補瀉》引《難經》：「經言上工治未病……何謂也。然所謂治未病者，見肝之病，則知肝當傳之於脾。故先實其____氣，無令得受肝之邪，故曰治未病焉。」空格應填？","options":[["A","脾"],["B","心"],["C","腎"],["D","肺"]],"answer":"A","difficulty":"易","explanation":"這是《難經‧七十七難》。肝木剋脾土，肝病容易傳脾，所以上工先補脾，讓脾不受肝邪；中工「但一心治肝」，只治已病。臨床例子：肝氣鬱結的脅痛、腹脹，在太衝、期門疏肝之外，同時取足三里、中脘、脾俞健脾。","source":"《針灸大成》卷五‧難經補瀉（即《難經‧七十七難》）","id":"D8-006","h":"cb3cfccdcf"},{"day":8,"date":"2026-10-15","number":7,"topic":"Day8｜配穴方法：分類辨識","group":"配穴方法","qtype":"非題","stem":"關於針灸配穴方法的舉例，下列何者錯誤？","options":[["A","肺經先病、再累及大腸經者，依原絡主客配穴應取列缺配合谷"],["B","胃心胸疾患取公孫配內關，屬上下配穴（八脈交會穴配對）"],["C","胃脘痛取中脘配胃俞，屬前後配穴中的俞募配穴"],["D","左側周圍性面癱除患側局部穴外，加取右側合谷，屬左右配穴"]],"answer":"A","difficulty":"中","explanation":"原絡配穴（主客配穴）的原則是：先病的經取原穴（主），後病的表裡經取絡穴（客）。肺經先病應取肺經原穴太淵，配大腸經絡穴偏歷。題中的「合谷配列缺」是大腸經先病、累及肺經時的取法。《刺灸心法要訣》：「肺原太淵大偏歷，大肺合谷列缺端」。\n其餘三項：俞募配穴屬前後配穴；公孫配內關是八脈交會穴的上下配對；手陽明「左之右，右之左」，面癱取對側合谷，屬左右配穴。","source":"《刺灸心法要訣》卷一‧十二經表裡原絡總歌；textbook_notes（新編彩圖 第四章 第八節 二；楊甲三 第九章）","id":"D8-007","h":"b3b1ff62bd"},{"day":8,"date":"2026-10-15","number":8,"topic":"Day8｜中風：《針灸大成‧中風論》五不治","group":"中風","qtype":"經典","stem":"《針灸大成‧中風論》：「且夫中風者，有五不治也。」並說中臟者難治、中腑者易治。下列何者「不屬於」該篇所列的五不治惡候？","options":[["A","開口"],["B","撒屎、遺尿"],["C","喉中雷鳴"],["D","牙關緊閉"]],"answer":"D","difficulty":"中","explanation":"原文：「中風者，有五不治也。開口，閉眼，撒屎，遺尿，喉中雷鳴，皆惡候也。」口開、眼合、二便失禁、痰聲如鋸，是元氣外脫的表現，相當於後世所說的脫證。牙關緊閉、兩手握固則是閉證（邪實內閉）的表現，不在五不治之中。\n同篇：「中於臟者，則令人不省人事，痰涎壅，喉中雷鳴……故難治也。中於腑者，則令人半身不遂，口眼喎斜，知痒痛，能言語，形色不變，故易治也。」現代處置：凡疑中風都要先撥119、送有血栓溶解或取栓能力的醫院。","source":"《針灸大成》卷十‧中風論；notes（常見病證處方速記（一）內科：中風）","id":"D8-008","h":"de273900ae"},{"day":8,"date":"2026-10-15","number":9,"topic":"Day8｜中風：醒腦開竅法主穴","group":"中風","qtype":"概念","stem":"石學敏院士提出的「醒腦開竅針法」常用於中風（中經絡及恢復期）。其主穴組合為何？","options":[["A","肩髃、曲池、合谷、足三里"],["B","百會、四神聰、神庭"],["C","內關、水溝、三陰交"],["D","關元、神闕、氣海"]],"answer":"C","difficulty":"易","explanation":"醒腦開竅法主穴為內關、水溝（人中）、三陰交，輔穴為極泉、尺澤、委中；吞嚥困難加風池、完骨、翳風，語言不利加廉泉、通里。方義：水溝屬督脈，督脈入腦，可醒神開竅；內關為心包絡穴，可寧心調神；三陰交滋補肝腎。\n肩髃、曲池、合谷、足三里屬「治痿獨取陽明」的思路；關元、神闕、氣海重灸用於中臟腑脫證。","source":"textbook_notes（黃維三 下編第一章 第五節「醒腦開竅法主穴為內關、水溝、三陰交」）；notes（處方速記（一）：中風）","id":"D8-009","h":"ef40e96871"},{"day":8,"date":"2026-10-15","number":10,"topic":"Day8｜面癱：急性期處置","group":"面癱","qtype":"非題","stem":"32歲男性，兩天前吹冷氣睡覺，今晨發現左側額紋消失、閉眼不全、口角歪向右側，無肢體無力、無耳郭水疱、無聽力喪失，診斷為周圍性面神經麻痺（Bell 麻痺）。下列處置何者錯誤？","options":[["A","急性期面部取穴宜少、刺激宜輕、淺刺，可取陽白、四白、地倉、頰車、翳風"],["B","閉眼不全需以人工淚液、眼罩保護角膜，並建議盡早（約72小時內）轉介評估口服類固醇"],["C","為加速恢復，急性期即在患側地倉、頰車施化膿灸"],["D","遠端取右側（對側）合谷，依「面口合谷收」及手陽明「左之右，右之左」"]],"answer":"C","difficulty":"易","explanation":"面部屬禁用化膿灸的部位，會留疤且易感染，急性期更不宜重刺激。教材的原則是：急性期面部取穴少、手法輕；遠端穴（合谷、太衝）可正常刺激；恢復期再逐漸加強局部刺激，可加電針。\n安全重點：Bell 麻痺應盡早評估類固醇；若有耳郭或外耳道水疱（Ramsay Hunt 症候群）、多條腦神經受損、肢體無力或只有下半臉麻痺（中樞性），需另行轉介。","source":"notes（處方速記（一）：面癱）；textbook_notes（新編彩圖 第八章 第一節；楊甲三 第十章 神經與頭面病證）","id":"D8-010","h":"3a7c00a414"},{"day":8,"date":"2026-10-15","number":11,"topic":"Day8｜實證：面癱得氣強刺激（Xu 2013）","group":"實證","qtype":"實證研究","stem":"Xu SB 等於2013年在《CMAJ》發表多中心隨機試驗（doi:10.1503/cmaj.121108），比較 Bell 麻痺患者針刺時「行手法至得氣」與「進針後不行手法」的差異。下列何者最符合其設計與結果？","options":[["A","共338人隨機分組，兩組都併用 prednisone；6個月時得氣組顏面神經功能較佳（調整後 OR 約4.16），且得氣強度越高效果越好"],["B","試驗比較針刺與類固醇的療效，結果針刺可完全取代類固醇"],["C","得氣組與不行手法組在6個月時的顏面神經功能相同，作者認為得氣並不重要"],["D","試驗只納入發病超過6個月的頑固性面癱，主要結果為3個月時的復發率"]],"answer":"A","difficulty":"高","explanation":"該試驗338人：得氣組167人（手法操作直到得氣）、對照組171人（只進針不行手法），兩組都接受 prednisone 作為基本治療。主要結果是6個月時的顏面神經功能：得氣組較佳（調整後 OR 4.16，95% CI 2.23–7.78），失能與生活品質評分也較好；迴歸分析顯示得氣分數越高療效越好（OR 1.07）。\n臨床意義：它支持「得氣與刺激量影響療效」，但針刺是在類固醇基礎治療之外的輔助，不是取代。","source":"Xu SB, et al. CMAJ. 2013;185(6):473-479. doi:10.1503/cmaj.121108（PMID: 23439629，已於 PubMed 查證）","id":"D8-011","h":"d6f407798b"},{"day":8,"date":"2026-10-15","number":12,"topic":"Day8｜三叉神經痛：分支取穴","group":"三叉神經痛","qtype":"臨床情境","stem":"62歲女性，右側下唇、下巴及下排牙齦反覆出現像觸電般的劇痛，每次數秒；咀嚼、刷牙會誘發，兩次發作之間無痛。神經學檢查無感覺缺損，牙科檢查正常。下列局部取穴何者最符合疼痛所在的分支？","options":[["A","魚腰、攢竹、陽白，配合谷、太衝"],["B","頭維、率谷、太陽，配外關、足臨泣"],["C","四白、顴髎、迎香，配合谷、內庭"],["D","下關、頰車、夾承漿，配合谷、內庭"]],"answer":"D","difficulty":"中","explanation":"下唇、下巴、下排牙齦屬三叉神經第三支（下頜支），常用下關、頰車、夾承漿（承漿旁開1寸）。第一支（眼支，前額、眼眶上）取魚腰、攢竹、陽白；第二支（上頜支，顴部、上唇、上牙）取四白、顴髎、下關。遠端配合谷（面口合谷收）、內庭（清胃火）或太衝（平肝）。\n紅旗：年輕患者（小於40歲）、兩側發作、有感覺缺損或其他腦神經症狀，要轉介做 MRI，排除多發性硬化或腫瘤。","source":"textbook_notes（新編彩圖 第八章 第一節；楊甲三 第十章）；acupoints（夾承漿：承漿旁開1寸）","id":"D8-012","h":"7519488e8c"},{"day":8,"date":"2026-10-15","number":13,"topic":"Day8｜頭痛分經取穴（計畫指定練習）","group":"頭痛分經取穴（計畫指定練習）","qtype":"非題","stem":"頭痛依部位分經論治。下列「頭痛部位—所屬經脈—常用取穴」的配對，何者錯誤？","options":[["A","側頭痛、兩顳部痛—少陽—率谷、太陽、風池、外關、足臨泣"],["B","巔頂痛，或連及目系—厥陰—百會、四神聰、太衝、內關"],["C","後頭痛連項背—足太陽—率谷、外關、足臨泣"],["D","前額、眉稜骨痛—陽明—印堂、上星、陽白、合谷、內庭"]],"answer":"C","difficulty":"易","explanation":"太陽頭痛（後頭部、連項背）應取天柱、後谿、申脈、崑崙。率谷、外關、足臨泣屬少陽頭痛的取穴。\n口訣：前額屬陽明，兩側屬少陽，後頭屬太陽，巔頂屬厥陰（足厥陰「與督脈會於巔」）。遠端取穴依「經脈所過，主治所及」：陽明取合谷、內庭；少陽取外關、足臨泣；太陽取後谿、申脈、崑崙；厥陰取太衝、內關。","source":"notes（處方速記（一）：頭痛分經）；plan/十天衝刺複習計畫 Day 8 自我測驗","id":"D8-013","h":"45eb76a2cf"},{"day":8,"date":"2026-10-15","number":14,"topic":"Day8｜靈樞厥病：厥頭痛取穴","group":"靈樞厥病","qtype":"經典填空","stem":"《靈樞‧厥病》論厥頭痛：「厥頭痛，項先痛，腰脊為應，先取____，後取足太陽。」又說：「厥頭痛，頭痛甚，耳前後脈湧有熱，寫出其血，後取____。」兩空格依序應填？","options":[["A","天柱；足少陽"],["B","天柱；足厥陰"],["C","風池；足陽明"],["D","風府；手少陽"]],"answer":"A","difficulty":"高","explanation":"頭痛從項部先起，牽連腰脊，是足太陽經受病，所以先取項部足太陽的天柱，再取足太陽遠端穴。耳前後是足少陽所過，脈搏湧動而有熱，先刺血瀉熱，後取足少陽。\n同篇還說「真頭痛，頭痛甚，腦盡痛，手足寒至節，死不治」，相當於現代的危急頭痛，要立即送醫。這是頭痛分經論治的古典根據。","source":"《靈樞經》卷五‧厥病第二十四","id":"D8-014","h":"08043b6883"},{"day":8,"date":"2026-10-15","number":15,"topic":"Day8｜頭痛紅旗：雷擊樣頭痛","group":"頭痛紅旗","qtype":"臨床情境","stem":"48歲女性，有高血壓，1小時前搬重物時突然出現「這輩子最痛」的爆裂樣頭痛，1分鐘內達到最劇烈，伴嘔吐、頸部僵硬，意識稍嗜睡。家屬希望先針刺百會、風池、太陽止痛。下列處置何者最適當？","options":[["A","屬厥陰頭痛，取百會、太衝強瀉，留針30分鐘"],["B","不予針刺；這是雷擊樣頭痛，須懷疑蜘蛛膜下腔出血，立即撥打119送急診做腦部影像檢查"],["C","屬肝陽上亢，針刺後囑其回家臥床休息、多喝水"],["D","先在太陽、耳尖點刺放血以「瀉熱止痛」，觀察半小時再決定是否就醫"]],"answer":"B","difficulty":"易","explanation":"突發、數秒到1分鐘內達到最高峰的劇烈頭痛（雷擊樣頭痛），合併嘔吐、頸部僵硬或意識改變，是蜘蛛膜下腔出血等致命疾病的紅旗，必須立即送急診做 CT 等檢查，不可用針灸延誤。《靈樞‧厥病》也說「真頭痛，頭痛甚，腦盡痛，手足寒至節，死不治」。\n其他頭痛紅旗：發燒合併頸部僵硬、50歲以後新發頭痛、伴神經學缺損、癌症或免疫不全病史、頭痛型態明顯改變。","source":"《靈樞經》卷五‧厥病第二十四；textbook_notes（特殊針法 第八章 安全與作業規範）","id":"D8-015","h":"689613b3cd"},{"day":8,"date":"2026-10-15","number":16,"topic":"Day8｜坐骨神經痛：分經取穴","group":"坐骨神經痛","qtype":"臨床情境","stem":"45歲男性，腰痛半年，近一個月疼痛由臀部沿大腿後側、膕窩、小腿後側放射到足跟及足小趾外側，直腿抬高試驗陽性；肌力、排便排尿正常，無鞍區麻木。依經絡辨證，下列取穴何者最適當？","options":[["A","腰夾脊、箕門、陰陵泉、三陰交、太谿"],["B","腰夾脊、髀關、伏兔、足三里、解谿"],["C","腰夾脊、環跳、風市、陽陵泉、懸鐘、足臨泣"],["D","腰夾脊、秩邊、殷門、委中、承山、崑崙"]],"answer":"D","difficulty":"中","explanation":"疼痛沿下肢後側到足跟、小趾，屬足太陽經型（相當於 S1 神經根），取秩邊、殷門、委中、承山、崑崙。如果疼痛沿大腿外側、小腿外側到足背，屬足少陽經型（相當於 L5），取環跳、風市、陽陵泉、懸鐘、足臨泣。兩型都可加腰部夾脊穴。\n紅旗：出現鞍區麻木、大小便失禁或尿滯留、進行性肌力下降，要考慮馬尾症候群，緊急轉介。","source":"notes（處方速記（二）：坐骨神經痛）；textbook_notes（新編彩圖 第八章 第一節；黃維三 下編第二章 第一節）","id":"D8-016","h":"841ec3c76a"},{"day":8,"date":"2026-10-15","number":17,"topic":"Day8｜實證：慢性坐骨神經痛針刺（Tu 2024）","group":"實證","qtype":"實證研究","stem":"Tu JF 等於2024年在《JAMA Internal Medicine》發表多中心隨機試驗（doi:10.1001/jamainternmed.2024.5463），比較針刺與假針刺治療腰椎間盤突出所致的慢性坐骨神經痛。下列敘述何者正確？","options":[["A","4週內共10次治療；第4週時針刺組腿痛 VAS 比假針刺組多降約16 mm，ODI 也較佳，差異從第2週出現並持續到第52週"],["B","針刺組與假針刺組在第4週時腿痛沒有差異，但第52週針刺組較佳"],["C","試驗為單盲、單中心，只追蹤4週，且針刺組發生多起嚴重不良事件"],["D","主要結果是手術率；針刺使手術率減半"]],"answer":"A","difficulty":"高","explanation":"這個試驗在中國6家醫院進行，隨機分配220人（分析216人），4週內各接受10次針刺或假針刺；受試者、結果評估者與統計人員皆盲。第4週：腿痛 VAS 針刺組降30.8 mm、假針刺組降14.9 mm（差 −16.0 mm）；ODI 降13.0 對4.9（差 −8.1）。差異從第2週開始出現，並持續到第52週；沒有嚴重不良事件。\n作者結論：針刺可作為腰椎間盤突出慢性坐骨神經痛的治療選項之一。","source":"Tu JF, et al. JAMA Intern Med. 2024;184(12):1417-1424. doi:10.1001/jamainternmed.2024.5463（PMID: 39401008，已於 PubMed 查證）","id":"D8-017","h":"566ba3075d"},{"day":8,"date":"2026-10-15","number":18,"topic":"Day8｜靈樞雜病：腰痛分經","group":"靈樞雜病","qtype":"經典填空","stem":"《靈樞‧雜病》：「腰痛，痛上寒，取足太陽陽明。痛上熱，取____。不可以俛仰，取____。」兩空格依序應填？","options":[["A","足太陰；足陽明"],["B","督脈；足少陰"],["C","足厥陰；足少陽"],["D","足少陰；足太陽"]],"answer":"C","difficulty":"高","explanation":"原文依腰痛的寒熱與活動受限分經：痛處發冷取足太陽、足陽明；痛處發熱取足厥陰；不能俯仰取足少陽。同篇還有「項痛不可俛仰，刺足太陽。不可以顧，刺手太陽也」，是頸項痛分經的依據。\n後世常用的腰痛取穴「腰背委中求」（足太陽合穴委中）也是同一套循經思路。","source":"《靈樞經》卷五‧雜病第二十六","id":"D8-018","h":"e3ac5279b0"},{"day":8,"date":"2026-10-15","number":19,"topic":"Day8｜痹證：行痹配穴","group":"痹證","qtype":"臨床情境","stem":"40歲女性，近一個月肩、肘、膝、踝等多處關節痠痛，痛處遊走不定，時輕時重，遇風加劇；舌淡紅苔薄白，脈浮。關節無紅腫熱，檢驗已排除類風濕性關節炎與痛風。依痹證分型，在局部取穴之外，下列何組配穴最適當？","options":[["A","陰陵泉、足三里"],["B","膈俞、血海"],["C","大椎、曲池"],["D","腎俞、關元（灸）"]],"answer":"B","difficulty":"易","explanation":"疼痛遊走不定、遇風加重，是風邪偏勝的行痹，依「治風先治血，血行風自滅」，加膈俞（血會）、血海。痛痹（寒勝，痛有定處、遇寒加重）加腎俞、關元並灸；著痹（濕勝，痠重腫脹）加陰陵泉、足三里；熱痹（關節紅腫熱痛）加大椎、曲池。","source":"notes（處方速記（二）：痺證）；textbook_notes（新編彩圖 第八章 第二節；楊甲三 第十章 骨傷與經筋病證）","id":"D8-019","h":"1a0c495fc6"},{"day":8,"date":"2026-10-15","number":20,"topic":"Day8｜哮喘：急性重度發作紅旗","group":"哮喘","qtype":"臨床情境","stem":"22歲男性氣喘病史，每年夏天都來做三伏貼。今日看診時突然喘促加劇，只能一個字一個字說話，坐著前傾、使用頸部輔助呼吸肌，血氧飽和度88%，聽診哮鳴音反而變弱。下列處置何者最適當？","options":[["A","立即針刺定喘、肺俞、膻中，留針30分鐘觀察"],["B","在背部大椎、肺俞拔罐放血以宣肺平喘"],["C","這是重度急性氣喘發作：立即讓患者坐姿休息、使用其急救型支氣管擴張劑，撥打119送急診"],["D","依「虛喘」補腎納氣，灸腎俞、太谿後返家"]],"answer":"C","difficulty":"易","explanation":"說話斷續、使用輔助呼吸肌、血氧低於90%、哮鳴音反而減弱（氣流極少，即「安靜胸」）是重度甚至致命性氣喘的徵象，必須先急救並立即送醫。針灸、三伏貼只用於緩解期的預防與輔助治療。\n平時處方：實喘取列缺、尺澤、膻中、肺俞、定喘；虛喘取肺俞、膏肓、腎俞、太淵、太谿、足三里、定喘。","source":"notes（處方速記（一）：哮喘）；textbook_notes（新編彩圖 第八章 第三節；特殊針法 第八章 安全與作業規範）","id":"D8-020","h":"b8924c2d37"},{"day":8,"date":"2026-10-15","number":21,"topic":"Day8｜實證：季節性過敏性鼻炎針刺（ACUSAR 2013）","group":"實證","qtype":"實證研究","stem":"Brinkhaus B 等於2013年在《Annals of Internal Medicine》發表多中心隨機試驗（ACUSAR，doi:10.7326/0003-4819-158-4-201302190-00002），評估針刺治療季節性過敏性鼻炎。下列何者最符合其結果與結論？","options":[["A","主要結果為血清 IgE 濃度，針刺使 IgE 下降一半"],["B","試驗只比較針刺與假針刺，沒有單純用藥組；兩組結果完全相同"],["C","422人分為針刺加急救藥物（cetirizine）、假針刺加急救藥物、只用急救藥物三組；第7–8週針刺組的鼻炎生活品質與用藥量優於另兩組，但作者認為改善幅度可能未達臨床意義"],["D","針刺組在第16週與第二年的所有指標都大幅優於假針刺，作者建議以針刺取代抗組織胺"]],"answer":"C","difficulty":"高","explanation":"ACUSAR 納入422位對樺樹與禾草花粉 IgE 致敏的季節性過敏性鼻炎患者：針刺加急救藥物212人、假針刺加急救藥物102人、只用急救藥物108人；第一年8週內治療12次。第7–8週時，針刺組的 RQLQ（鼻炎生活品質）與急救藥物使用分數優於假針刺組與單純用藥組（皆 P\u003c0.001）；第一年第16週時已無差異；第二年追蹤只有小幅差異。\n作者結論：統計上顯著，但改善可能未達臨床意義。","source":"Brinkhaus B, et al. Ann Intern Med. 2013;158(4):225-234. doi:10.7326/0003-4819-158-4-201302190-00002（PMID: 23420231，已於 PubMed 查證）","id":"D8-021","h":"3327f881f2"},{"day":8,"date":"2026-10-15","number":22,"topic":"Day8｜胸痹：處方方義","group":"胸痹","qtype":"非題","stem":"胸痹（冠心病心絞痛）的針灸處方常用內關、郄門、膻中、巨闕、心俞、厥陰俞。關於方義與相關古籍，下列何者錯誤？","options":[["A","內關為手厥陰絡穴，通陰維脈；《針灸大成‧奇經八脈》謂陰維脈「其為病也。苦心痛」"],["B","郄門為手厥陰經郄穴，陰經郄穴常用於血證，也用於急性心痛"],["C","《靈樞‧厥病》：「真心痛，手足清至節，心痛甚，旦發夕死，夕發旦死」，今多對應急性心肌梗塞等急症，應立即送醫"],["D","膻中是心的募穴，巨闕是八會穴中的氣會，兩穴合用屬俞募配穴"]],"answer":"D","difficulty":"高","explanation":"兩穴的屬性說反了：巨闕才是心的募穴，膻中是心包的募穴，也是八會穴的氣會。心俞配巨闕是心的俞募配穴；厥陰俞配膻中是心包的俞募配穴。\n內關通陰維、主心胸胃，郄門治急性心痛，都正確；〈厥病〉的真心痛描述，是古籍中最早的急症警示之一。","source":"《針灸大成》卷九‧奇經八脈 簡要；《靈樞經》卷五‧厥病第二十四；acupoints（膻中 CV17、巨闕 CV14、郄門 PC4）","id":"D8-022","h":"ec10837e52"},{"day":8,"date":"2026-10-15","number":23,"topic":"Day8｜心悸：甲狀腺功能亢進的鑑別","group":"心悸","qtype":"臨床情境","stem":"35歲女性，心悸、怕熱多汗、手抖、易怒兩個月，體重減輕5公斤；頸前瀰漫性腫大，心跳每分鐘112次、規則，雙眼略突。想以針灸治療「心悸失眠」。下列處置何者最適當？","options":[["A","辨為心脾兩虛，灸心俞、脾俞、足三里，不需抽血檢查"],["B","在頸前腫大處直刺透刺數針以「散結消癭」，深刺至甲狀腺內"],["C","心悸屬功能性問題，囑多休息，三個月後再評估"],["D","安排或轉介甲狀腺功能檢查（TSH、free T4）與新陳代謝科評估；確診後可在西醫治療的同時，以內關、神門等寧心安神作為輔助"]],"answer":"D","difficulty":"中","explanation":"心悸合併怕熱、多汗、手抖、體重減輕、甲狀腺腫大與突眼，強烈提示甲狀腺功能亢進（如 Graves 病），應先抽血確認並轉介新陳代謝科；未治療的甲亢可能引發心房顫動，甚至甲狀腺風暴。針灸可作輔助：心悸常用內關、神門、心俞、膻中；癭病局部針刺要淺、避開頸動脈，不可深刺入腺體。","source":"textbook_notes（新編彩圖 第八章 第四節；黃維三 下編第二章 第七節 新陳代謝病：甲狀腺腫）；notes（處方速記（一））","id":"D8-023","h":"d5662390a4"},{"day":8,"date":"2026-10-15","number":24,"topic":"Day8｜高血壓：高血壓急症轉診","group":"高血壓","qtype":"臨床情境","stem":"60歲男性，自行停用降壓藥兩週，今日劇烈頭痛、視力模糊、胸悶、噁心，量得血壓 224/132 mmHg，並出現說話稍不清楚。家屬要求耳尖放血、針太衝、曲池降壓。下列處置何者最適當？","options":[["A","針刺人迎深刺至頸動脈搏動處以「直接降壓」"],["B","耳尖、降壓溝點刺放血後，若血壓降到180以下即可返家"],["C","懷疑高血壓急症併標的器官損害（腦、眼、心），立即撥打119送急診，不以針灸代替"],["D","針太衝、曲池、風池，留針30分鐘後再量血壓決定"]],"answer":"C","difficulty":"易","explanation":"血壓顯著升高（常以 ≥180/120 mmHg 為界）並出現頭痛、視力模糊、胸痛、神經學症狀等標的器官損害，屬高血壓急症，必須到急診在監測下降壓。針灸降壓（曲池、太衝、風池、足三里，耳尖放血）只適用於穩定的原發性高血壓輔助治療。人迎位於頸動脈旁，要避開動脈淺刺，不可深刺頸動脈。","source":"notes（處方速記（一）：高血壓）；acupoints（人迎 ST9 注意事項）；textbook_notes（新編彩圖 第八章 第四節）","id":"D8-024","h":"545fc70f1b"},{"day":8,"date":"2026-10-15","number":25,"topic":"Day8｜實證：針刺治療高血壓（SHARP 2006）","group":"實證","qtype":"實證研究","stem":"Macklin EA 等於2006年在《Hypertension》發表 SHARP 隨機試驗（doi:10.1161/01.HYP.0000241090.28070.4c）。下列敘述何者正確？","options":[["A","192位未服藥、血壓140/90–179/109 mmHg 的患者，分為個別化中醫針刺、標準化針刺與侵入性假針刺；10週時真針刺組的血壓下降與假針刺組沒有顯著差異"],["B","試驗納入正在服用三種以上降壓藥的頑固性高血壓患者"],["C","標準化針刺有效，但個別化辨證針刺無效"],["D","個別化針刺組10週收縮壓平均下降約20 mmHg，明顯優於假針刺"]],"answer":"A","difficulty":"中","explanation":"SHARP 納入192位血壓在140/90到179/109 mmHg 之間、入組前已停用降壓藥的患者，隨機分配到個別化中醫針刺、預選穴位的標準化針刺、或侵入性假針刺，6–8週內最多治療12次。主要終點是第10週的平均血壓變化：真針刺組（兩組合併）與假針刺組沒有顯著差異（收縮壓 −3.56 對 −3.84 mmHg，P=0.90；舒張壓 −4.32 對 −2.81 mmHg，P=0.16），各次群組也沒有差異。\n啟示：高血壓仍以生活型態調整與藥物為主，針灸不能取代降壓藥。","source":"Macklin EA, et al. Hypertension. 2006;48(5):838-845. doi:10.1161/01.HYP.0000241090.28070.4c（PMID: 17015784，已於 PubMed 查證）","id":"D8-025","h":"b1eb85d4cb"},{"day":8,"date":"2026-10-15","number":26,"topic":"Day8｜胃痛：肝氣犯胃","group":"胃痛","qtype":"臨床情境","stem":"38歲男性，胃脘脹痛攻撐連及兩脅，噯氣頻繁，生氣或壓力大時加重；舌苔薄白，脈弦。三個月前胃鏡檢查只有輕度胃炎，近期無黑便、無體重減輕。下列處方何者最適當？","options":[["A","中脘、足三里，加脾俞、胃俞，並灸神闕"],["B","天樞、上巨虛、陰陵泉、水分"],["C","梁丘、內庭、厲兌點刺出血"],["D","中脘、內關、足三里，加期門、太衝"]],"answer":"D","difficulty":"中","explanation":"脹痛連脅、噯氣、隨情緒加重、脈弦，屬肝氣犯胃。主穴中脘（胃募、腑會）、足三里（胃下合穴，「肚腹三里留」）、內關（通陰維，「胸滿腹痛刺內關」），加肝募期門、肝原太衝疏肝理氣。\n脾胃虛寒（隱痛喜溫喜按）才加脾俞、胃俞、灸神闕；胃火可瀉內庭；天樞、上巨虛、陰陵泉、水分是急性泄瀉的處方。若有黑便、吞嚥困難、體重減輕、年紀大的新發胃痛，要先做胃鏡。","source":"notes（處方速記（一）：胃痛）；textbook_notes（新編彩圖 第八章 第五節；黃維三 下編第二章 第三節）","id":"D8-026","h":"c976b7b58b"},{"day":8,"date":"2026-10-15","number":27,"topic":"Day8｜靈樞四時氣：嘔膽","group":"靈樞四時氣","qtype":"經典填空","stem":"《靈樞‧四時氣》：「善嘔，嘔有苦，長太息，心中憺憺，恐人將捕之，邪在膽，逆在胃，膽液泄則口苦，胃氣逆則嘔苦，故曰嘔膽。取____以下，胃氣逆，則刺少陽血絡，以閉膽逆，卻調其虛實，以去其邪。」空格應填？","options":[["A","陽陵泉"],["B","中脘"],["C","內關"],["D","三里"]],"answer":"D","difficulty":"中","explanation":"「嘔膽」是膽熱犯胃、胃氣上逆：取足陽明合穴足三里，以和胃降逆（「取三里以下」，下指降胃氣）；再刺足少陽的血絡，以止膽氣上逆。這一段說明嘔吐、口苦常要膽胃同治。\n比較：《靈樞‧邪氣藏府病形》的膽病「嘔宿汁……取陽陵泉」，是用膽的下合穴。","source":"《靈樞經》卷四‧四時氣第十九；卷一‧邪氣藏府病形第四","id":"D8-027","h":"aba2f611b0"},{"day":8,"date":"2026-10-15","number":28,"topic":"Day8｜呃逆：《靈樞‧雜病》治噦三法","group":"呃逆","qtype":"經典","stem":"《靈樞‧雜病》記載治「噦」（呃逆）的簡便方法。下列何者「不是」該篇原文所列的方法？","options":[["A","閉氣不息，並迅速迎而引之"],["B","點按攢竹至呃止"],["C","突然使其大驚"],["D","以草刺鼻，使其打噴嚏"]],"answer":"B","difficulty":"中","explanation":"原文：「噦以草刺鼻，嚏，嚏而已。無息而疾迎引之，立已。大驚之，亦可已。」也就是取嚏、閉氣、驚嚇三法。點按攢竹、膈俞、內關、中脘是現代常用的止呃方法，並非〈雜病〉原文。\n安全提醒：持續超過48小時的頑固性呃逆，或合併吞嚥困難、體重減輕、神經學症狀，要檢查食道、胃、縱膈及中樞神經病變。","source":"《靈樞經》卷五‧雜病第二十六；notes（處方速記（一）：呃逆）","id":"D8-028","h":"cdb68bef6a"},{"day":8,"date":"2026-10-15","number":29,"topic":"Day8｜便秘：處方方義","group":"便秘","qtype":"非題","stem":"便秘常用處方為天樞、上巨虛、支溝、照海、大腸俞。關於方義，下列何者錯誤？","options":[["A","天樞是小腸的募穴，主要用來分清泌濁"],["B","照海屬足少陰，通陰蹻脈，可滋陰增液，常與支溝合用治便秘"],["C","上巨虛是大腸的下合穴，依「合治內府」通調腸腑"],["D","支溝是手少陽三焦經的經穴，為治便秘、脅痛的要穴"]],"answer":"A","difficulty":"中","explanation":"天樞是大腸的募穴（位於臍旁2寸，屬足陽明）；小腸的募穴是關元。大腸俞配天樞即大腸的俞募配穴。\n其餘正確：上巨虛為大腸下合穴；支溝為三焦經經穴，「脅肋支溝取」；《玉龍賦》有「照海支溝，通大便之秘」。紅旗：50歲以上新發便秘、血便、體重減輕、貧血，要先安排大腸鏡。","source":"notes（處方速記（一）：便秘）；acupoints（天樞 ST25、上巨虛 ST37、支溝 TE6、照海 KI6）","id":"D8-029","h":"7eb1cf1781"},{"day":8,"date":"2026-10-15","number":30,"topic":"Day8｜癃閉：膀胱充盈時的針刺安全","group":"癃閉","qtype":"臨床情境","stem":"30歲女性自然產後8小時仍無法自解小便，下腹脹痛，恥骨上可摸到膨隆至臍下的膀胱。產科同意先嘗試針灸。下列處置何者最適當？","options":[["A","先取遠端三陰交、陰陵泉，下腹中極、關元只可向下斜刺淺刺，不可深直刺；若仍無法排尿，應導尿"],["B","中極直刺3寸、強刺激，以刺激膀胱收縮"],["C","在膨隆的膀胱上方施隔鹽灸並重按揉腹部"],["D","屬氣虛，囑多喝水，明天再評估"]],"answer":"A","difficulty":"易","explanation":"膀胱充盈時，中極、曲骨、關元下方就是膀胱，深直刺可能刺破膀胱，所以只能斜刺、淺刺，或先取遠端穴（三陰交、陰陵泉）及秩邊透水道。產後尿滯留時間過長會造成膀胱過度擴張與損傷，針灸無效時應及時導尿。用力按壓膨脹的膀胱也不安全。","source":"notes（處方速記（一）：癃閉「中極針前須查膀胱充盈程度，宜斜刺淺刺」）；textbook_notes（新編彩圖 第八章 第七節；黃維三 下編第二章 第六節）","id":"D8-030","h":"82507dbf66"},{"day":8,"date":"2026-10-15","number":31,"topic":"Day8｜消渴：《針灸甲乙經》與胃脘下俞","group":"消渴","qtype":"經典填空","stem":"《針灸甲乙經‧五氣溢發消渴黃癉》：「消渴身熱，面赤（《千金》作目）黃，意舍主之。消渴嗜飲，____主之。」《針灸大成‧治症總要》亦列「第八十五消渴。金津 玉液 ____」。兩空格為同一穴，應填？","options":[["A","然谷"],["B","承漿"],["C","廉泉"],["D","胃脘下俞"]],"answer":"B","difficulty":"高","explanation":"兩書都以任脈的承漿治消渴嗜飲：甲乙經「消渴嗜飲，承漿主之」；《治症總要》「消渴。金津 玉液 承漿」，不效「復刺後穴。海泉 人中 廉泉 氣海 腎俞」。同篇另載「消渴黃癉，足一寒一熱，舌縱煩滿，然谷主之」。\n現代常用：胃脘下俞（第8胸椎棘突下旁開1.5寸，經外奇穴）、肺俞、脾俞、腎俞、太谿、三陰交、足三里。糖尿病患者皮膚易感染、傷口難癒，針刺要嚴格消毒，慎用化膿灸與埋線，足部感覺遲鈍時避免直接灸。","source":"《針灸甲乙經》卷十一‧五氣溢發消渴黃癉第六；《針灸大成》卷十一‧治症總要；acupoints（胃脘下俞）","id":"D8-031","h":"f61a291ad8"},{"day":8,"date":"2026-10-15","number":32,"topic":"Day8｜傳染病：瘧疾的輔助治療與通報","group":"傳染病","qtype":"臨床情境","stem":"28歲男性，從非洲出差返國10天，近3天出現寒顫、高燒、大汗後熱退，反覆發作，伴頭痛、肌肉痛。希望以針灸「截瘧」。下列敘述何者正確？","options":[["A","傳統截瘧常取大椎、後谿、間使，宜在發作前1–2小時施治，但只能作為輔助"],["B","有流行地區旅遊史又出現不明原因發燒，應懷疑瘧疾，轉介做血液抹片等檢驗，並接受抗瘧藥物治療"],["C","瘧疾在臺灣屬第二類法定傳染病，醫師懷疑符合通報定義時，應於24小時內通報衛生主管機關"],["D","以上皆是"]],"answer":"D","difficulty":"易","explanation":"三項都正確。截瘧要穴為大椎、後谿、間使（陶道亦常用），在發作前1–2小時針刺；《針灸大成‧治症總要》有「脾寒發瘧。後谿 間使 大椎 身柱 三里 絕骨 合谷 膏肓」。但瘧疾（尤其惡性瘧）可快速惡化成重症，必須以檢驗確診並用抗瘧藥物治療，針灸只是輔助。依傳染病防治法，瘧疾為第二類傳染病，應於24小時內通報。","source":"《針灸大成》卷十一‧治症總要；textbook_notes（黃維三 下編第二章 第八節 傳染病）；疾病管制署 瘧疾治療照護頁（https://www.cdc.gov.tw/Category/MPage/UD4SUiU4EDIvPUx3L9mlOQ）","id":"D8-032","h":"c3e4357b2a"},{"day":8,"date":"2026-10-15","number":33,"topic":"Day8｜傳染病：痄腮（流行性腮腺炎）","group":"傳染病","qtype":"非題","stem":"8歲男童發燒一天後，右側耳下以耳垂為中心腫脹疼痛，咀嚼酸物時疼痛加劇，同班有數名同學類似。關於痄腮的針灸處置與照護，下列何者錯誤？","options":[["A","應居家休息、避免上學，並注意睪丸腫痛、劇烈頭痛嘔吐、上腹痛等併發症"],["B","腫處屬陽明熱毒聚結，可在腮腺腫脹處施化膿灸，使其化膿潰破以加速消腫"],["C","常用翳風、頰車、合谷、外關，以疏散少陽、陽明風熱"],["D","民間常用角孫燈火灸（燈芯草蘸油點燃後快速點灸）"]],"answer":"B","difficulty":"中","explanation":"痄腮是腮腺的病毒感染，不會化膿，局部化膿灸既無根據又會造成疤痕與感染。正確作法是：取翳風、頰車（局部），合谷、外關（遠端疏散風熱），高熱加大椎、曲池；角孫燈火灸是傳統特色療法。\n照護：具傳染性，腮腺腫脹後約5天內避免上學；併發症有睪丸炎（青春期後男性多見）、病毒性腦膜炎、胰臟炎、聽力受損，出現時應轉介。","source":"textbook_notes（黃維三 下編第二章 第八節 傳染病：痄腮）；acupoints（翳風 TE17、角孫 TE20）","id":"D8-033","h":"830fb7c94c"},{"day":8,"date":"2026-10-15","number":34,"topic":"Day8｜靈樞經筋：維筋相交","group":"靈樞經筋","qtype":"經典填空","stem":"《靈樞‧經筋》足少陽之筋：「從左之右，右目不開，上過右角，並蹻脈而行，左絡於右，故傷左角，右足不用，命曰____。」空格應填？","options":[["A","經筋交巔"],["B","維筋相交"],["C","陰陽相移"],["D","筋急相引"]],"answer":"B","difficulty":"高","explanation":"足少陽之筋上額角、交巔，左右交叉：左側額角受傷，右足就不能動，所以叫「維筋相交」。這是古籍中對「病在一側、症在對側」的描述，可與中風對側肢體癱瘓、頭針取病灶對側、繆刺與巨刺「左取右、右取左」合看。經筋病的治則仍是「燔鍼劫刺，以知為數，以痛為輸」。","source":"《靈樞經》卷四‧經筋第十三","id":"D8-034","h":"f9356cbd8d"},{"day":8,"date":"2026-10-15","number":35,"topic":"Day8｜靈樞經筋：足厥陰之筋病與治法","group":"靈樞經筋","qtype":"經典填空","stem":"《靈樞‧經筋》足厥陰之筋：「其病足大指支內踝之前痛，內輔痛，陰股痛轉筋，陰器不用。傷於內則不起，傷於寒則陰縮入，傷於熱則縱挺不收。治在____。其病轉筋者，治在燔鍼劫刺，以知為數，以痛為輸，命曰季秋痹也。」空格應填？","options":[["A","熨引飲藥"],["B","取之分肉"],["C","行水清陰氣"],["D","以馬膏膏其急者"]],"answer":"C","difficulty":"中","explanation":"足厥陰之筋「結於陰器，絡諸筋」，所以病候以陰器不用、陽痿、陰縮、陰挺為特點，治法為「行水清陰氣」（調理水液以清陰分之氣）；轉筋疼痛才用燔鍼劫刺。「熨引飲藥」見足少陰之筋「在內者，熨引飲藥」；「治之以馬膏，膏其急者」見足陽明之筋（口僻）。\n記法：十二經筋多以燔鍼劫刺治轉筋疼痛；足厥陰「行水清陰氣」、足陽明「馬膏」、足少陰「熨引飲藥」是三個例外的治法。","source":"《靈樞經》卷四‧經筋第十三","id":"D8-035","h":"9405216bee"},{"day":8,"date":"2026-10-15","number":36,"topic":"其他｜兒科：《針灸大成》戒逆針灸","group":"兒科","qtype":"經典填空","stem":"《針灸大成》卷十二〈戒逆針灸（無病而先針灸曰逆）〉：「小兒新生，無病不可逆針灸之，如逆針灸，則忍痛，動其五臟，因善成____，河洛關中，地多寒，兒喜成。」空格應填？","options":[["A","驚"],["B","痿"],["C","疳"],["D","癇"]],"answer":"D","difficulty":"中","explanation":"原文為「因善成癇」：新生兒沒病不可預防性地針灸，疼痛會擾動五臟，反而容易誘發癇證。篇中說北方寒地常在出生三日「逆灸以防之」，南方溫暖則不用，「今人不分南北灸之，多害小兒也」。\n臨床啟示：小兒針灸要有明確適應症，取穴少、淺刺、不留針或短留針，艾炷要小（《針灸大成》〈小兒針〉題下注「用毫針艾炷如小麥或維雀大」）。","source":"《針灸大成》卷十二‧戒逆針灸；卷十二‧小兒針","id":"D8-036","h":"69a1d5f907"},{"day":8,"date":"2026-10-15","number":37,"topic":"其他｜兒科：小兒驚癇脊強取穴","group":"兒科","qtype":"經典填空","stem":"《針灸甲乙經‧小兒雜病》：「小兒驚癇，瘈瘲脊強互相引，____主之。」《針灸大成‧小兒針》也說：「小兒癲癇癥瘕，脊強互相引，灸____三七壯。」兩空格為同一穴，應填？","options":[["A","長強"],["B","筋縮"],["C","身柱"],["D","大椎"]],"answer":"A","difficulty":"高","explanation":"兩書都取督脈絡穴長強（尾骨端下，督脈別絡，「實則脊強」），治小兒驚癇、角弓反張。易混：甲乙經同篇另有「小兒驚癇加瘈瘲，脊急強，目轉上插，縮筋主之」，縮筋即筋縮（第9胸椎下），兩條文字很像，要分清楚。\n現代提醒：小兒抽搐先處理呼吸道、計時，超過5分鐘或首次發作要送醫。","source":"《針灸甲乙經》卷十二‧小兒雜病第十一；《針灸大成》卷十二‧小兒針；acupoints（長強 GV1、筋縮 GV8）","id":"D8-037","h":"86c8a41e6b"},{"day":8,"date":"2026-10-15","number":38,"topic":"其他｜兒科：遺尿的評估與處方","group":"兒科","qtype":"概念","stem":"7歲男童幾乎每晚尿床，家長求助針灸。關於小兒遺尿的評估與治療，下列敘述何者正確？","options":[["A","一般以5歲以上仍經常夜間尿床才稱為遺尿症"],["B","若伴多喝多尿、體重減輕，應先驗血糖與尿液，排除糖尿病"],["C","若白天也會漏尿、尿流細弱，或腰薦部皮膚有凹陷、毛髮叢生，應轉介檢查有無神經或泌尿道結構異常"],["D","常用關元、中極、膀胱俞、三陰交，腎氣不固可加灸腎俞、命門；小兒宜淺刺、少留針"],["E","以上皆是"]],"answer":"E","difficulty":"易","explanation":"四項都正確。遺尿症一般指5歲以上仍有睡眠中尿失禁。評估時要排除糖尿病（多飲多尿、體重減輕）、尿路感染、便秘，以及隱性脊柱裂等神經或結構問題（白天症狀、尿流異常、腰薦部皮膚異常）。針灸以培元固腎為主，取關元、中極、膀胱俞、三陰交、腎俞，多配合灸；也可配合行為治療與夜間鬧鈴。","source":"notes（處方速記（二）：小兒遺尿）；textbook_notes（黃維三 下編第二章 第十節 小兒科病）","id":"D8-038","h":"ce780a5a59"},{"day":8,"date":"2026-10-15","number":39,"topic":"其他｜兒科：小兒腹瀉的脫水評估","group":"兒科","qtype":"臨床情境","stem":"1歲半幼兒腹瀉、嘔吐兩天，今日精神萎靡、嗜睡，眼窩凹陷、哭時無淚、口唇乾燥，已8小時沒有尿濕尿布，皮膚捏起後回彈緩慢。家長想做推拿、四縫點刺止瀉。下列處置何者最適當？","options":[["A","判斷為重度脫水，應立即送急診接受靜脈輸液，不以推拿或針刺延誤"],["B","灸神闕、天樞各20分鐘，觀察一天"],["C","點刺四縫擠出黏液後，給予白開水即可"],["D","依《針灸大成》止吐瀉法推板門、橫門後返家"]],"answer":"A","difficulty":"易","explanation":"嗜睡、眼窩凹陷、無淚、口乾、長時間無尿、皮膚回彈緩慢，是幼兒重度脫水的表現，需要靜脈輸液，必須立即送醫。輕度脫水才在家使用口服電解質液並密切觀察。小兒推拿、針灸（天樞、足三里、四縫等）只能在生命徵象穩定、補足水分之後作為輔助。","source":"《針灸大成》卷十二‧止吐瀉法；textbook_notes（黃維三 下編第二章 第十節 小兒科病）","id":"D8-039","h":"d61f03e041"},{"day":8,"date":"2026-10-15","number":40,"topic":"其他｜經絡：《靈樞‧經別》論十二經脈的重要","group":"經絡","qtype":"經典填空","stem":"《靈樞‧經別》開篇論十二經脈：「夫十二經脈者，人之所以生，病之所以成，人之所以治，病之所以起，學之所始，工之所止也，粗之所易，上之所____也。」空格應填？","options":[["A","過"],["B","難"],["C","明"],["D","息"]],"answer":"B","difficulty":"中","explanation":"原文為「粗之所易，上之所難也」：粗工覺得經脈很容易，上工反而覺得很難。緊接著岐伯說「此粗之所過，上之所息也」，「過」「息」出自下一句，容易混淆。\n本篇接著說明十二經別「離、入、出、合」的六合：陰經經別合入相表裡的陽經，經別因此加強了表裡兩經的聯繫，也是陰經腧穴可以治療頭面病證的理論依據之一。","source":"《靈樞經》卷三‧經別第十一","id":"D8-040","h":"4cbaf58bb8"},{"day":8,"date":"2026-10-15","number":41,"topic":"其他｜醫籍：《針灸甲乙經》序例「主之、刺之、灸之」","group":"醫籍","qtype":"經典","stem":"《針灸甲乙經》序例說明條文用語的體例。依原文，條文中只說「刺之」者代表什麼意思？","options":[["A","可灸可刺"],["B","可刺，但不可灸"],["C","可灸，但不可刺"],["D","只能刺出血"]],"answer":"B","difficulty":"高","explanation":"序例原文：「諸言『主之』者可灸可刺，其言『刺之』者不可灸，言『灸之』者不可刺，亦其例也。」所以甲乙經卷七到卷十二各病篇中，「某穴主之」代表針灸皆可；「刺之」只宜針；「灸之」只宜灸。\n序例另一條體例：問答時「黃帝曰『答』，岐伯之徒皆曰『對』」。","source":"《針灸甲乙經》序例","id":"D8-041","h":"158c2f12e0"},{"day":8,"date":"2026-10-15","number":42,"topic":"其他｜醫籍：《針灸甲乙經》的成書","group":"醫籍","qtype":"經典","stem":"依皇甫謐〈針灸甲乙經序〉，他在甘露年間「病風加苦聾百日」，於是「撰集三部，使事類相從，刪其浮辭，除其重複，論其精要，至為十二卷」。所撰集的「三部」是指哪三部書？","options":[["A","《針經》、《難經》、《脈經》"],["B","《素問》、《難經》、《神農本草經》"],["C","《素問》、《針經》（九卷）、《明堂孔穴針灸治要》"],["D","《素問》、《傷寒雜病論》、《明堂孔穴針灸治要》"]],"answer":"C","difficulty":"中","explanation":"序文：「今有《針經》九卷，《素問》九卷，二九十八卷，即《內經》也……又有《明堂孔穴針灸治要》，皆黃帝岐伯遺事也。三部同歸，文多重複，錯互非一。」宋代林億等的校序也說他「取黃帝《素問》、《針經》、《明堂》三部之書，撰為《針灸經》十二卷」。《針經》即後世的《靈樞》。《針灸甲乙經》是現存最早的針灸專書，作者晉代皇甫謐。","source":"《針灸甲乙經》林序／皇甫謐序","id":"D8-042","h":"3de846e2cd"},{"day":8,"date":"2026-10-15","number":43,"topic":"其他｜外科：痔瘡與便血紅旗","group":"外科","qtype":"臨床情境","stem":"《針灸大成‧腸痔大便門》：「久痔  二白（左掌後四寸）承山 長強」。58歲男性，近兩個月排便時出鮮血，自認是「老痔瘡」，但最近排便習慣改變、糞便變細，體重減輕4公斤，從未做過大腸鏡。下列處置何者最適當？","options":[["A","先轉介做大腸鏡檢查，排除大腸直腸癌；確診為痔瘡後，可再以承山、二白、長強等作為輔助"],["B","在長強施化膿灸，以「燥濕止血」"],["C","便血屬「腸風」，灸尾閭骨盡處百壯即可"],["D","依古籍針二白、承山、長強，連續治療一個月，出血停止就不必檢查"]],"answer":"A","difficulty":"中","explanation":"50歲以上新出現便血，合併排便習慣改變、糞便變細、體重減輕，是大腸直腸癌的紅旗，必須先做大腸鏡，不能只當痔瘡處理。確認是痔瘡後，傳統取穴有二白（腕橫紋上4寸，橈側腕屈肌腱兩側）、承山、長強、百會（升提）、次髎。\n《針灸大成》同門另有「腸風  尾閭骨盡處灸百壯即愈」，屬古代經驗，不能取代診斷。","source":"《針灸大成》卷十‧腸痔大便門；acupoints（二白：腕掌側橫紋上4寸）；notes（處方速記（一）：便秘）","id":"D8-043","h":"2950d2cb47"},{"day":8,"date":"2026-10-15","number":44,"topic":"其他｜急症：針刺中的低血糖","group":"急症","qtype":"臨床情境","stem":"65歲第2型糖尿病患者，早上注射胰島素後未吃早餐就來針灸。留針10分鐘時出現冒冷汗、手抖、心悸、飢餓感，接著答話遲鈍。下列處置何者最適當？","options":[["A","這是典型暈針，加刺水溝、內關即可，不需測血糖"],["B","讓患者喝一大杯白開水後坐著休息"],["C","立即出針、平臥並測指尖血糖；確認低血糖且意識尚可吞嚥時給予含糖飲料或葡萄糖，意識不清則撥打119，不可灌食"],["D","繼續留針，加灸足三里以補中益氣"]],"answer":"C","difficulty":"中","explanation":"暈針與低血糖都會出現冒汗、頭暈、心悸，但這位患者有胰島素注射且空腹，又出現飢餓、手抖、意識變化，要優先懷疑低血糖。處理：停止治療、出針、平臥，測血糖；可吞嚥者給予約15公克的速效糖，15分鐘後再測；意識不清不可餵食，以免嗆入，應立即送醫。\n預防：糖尿病患者針灸前要確認已正常進食與用藥時間。","source":"notes（刺法灸法：針刺異常情況處理）；textbook_notes（特殊針法 第八章 安全與作業規範）","id":"D8-044","h":"aba14cf7d1"},{"day":8,"date":"2026-10-15","number":45,"topic":"其他｜急症：《刺灸心法要訣》灸暴絕穴","group":"急症","qtype":"經典","stem":"《刺灸心法要訣‧灸暴絕穴歌》：「鬼魘暴絕最傷人，急灸鬼眼可回春，穴在兩足大趾內，去甲韭葉鬼難存。」若今日診間遇到患者突然倒地、叫喚無反應、沒有正常呼吸，下列處置何者最適當？","options":[["A","先依歌訣灸兩足大趾內側去爪甲韭葉許的鬼眼穴，無效再撥119"],["B","針刺水溝、十宣放血，等待患者自行甦醒"],["C","扶患者坐起，灌服溫開水"],["D","立即呼救並撥打119、取得 AED，開始胸外按壓（CPR）；古法灸鬼眼不能取代急救"]],"answer":"D","difficulty":"中","explanation":"歌訣注文：鬼眼穴「在足兩大趾內，去爪甲如韭葉許」，用於「一切鬼魘暴絕」，部位與隱白相近。但突然倒地、無反應、沒有正常呼吸，要視為心跳停止：立即呼救、撥打119、開始高品質胸外按壓並盡快使用 AED，每延遲一分鐘存活率都會下降。古籍急救穴只能作為文獻知識，不可延誤 CPR。","source":"《刺灸心法要訣》卷八‧灸暴絕穴歌；acupoints（隱白 SP1）","id":"D8-045","h":"36b8231e2c"},{"day":8,"date":"2026-10-15","number":46,"topic":"其他｜皮膚：蕁麻疹合併血管性水腫","group":"皮膚","qtype":"臨床情境","stem":"30歲女性吃海鮮後20分鐘，全身起風團、搔癢，接著嘴唇與眼瞼腫脹，說話聲音沙啞，覺得喉嚨緊、呼吸有喘鳴聲，血壓 92/58 mmHg。下列處置何者最適當？","options":[["A","在委中、耳尖點刺放血後返家觀察"],["B","屬風熱癮疹，囑其冷敷並清淡飲食"],["C","針刺曲池、血海、膈俞，依「治風先治血」止癢"],["D","懷疑全身性過敏反應（過敏性休克前兆）：立即撥打119，有腎上腺素自動注射筆者立即使用，平躺並監測呼吸與血壓"]],"answer":"D","difficulty":"易","explanation":"風團合併嘴唇、眼瞼腫脹（血管性水腫）、聲音沙啞、喉嚨緊、喘鳴與血壓下降，代表過敏反應已影響呼吸道與循環，屬全身性過敏反應，第一線治療是肌肉注射腎上腺素並緊急送醫。曲池、合谷、血海、膈俞、三陰交等針灸處方，只適用於沒有呼吸道與循環症狀的慢性或輕度蕁麻疹。","source":"notes（處方速記（二）：癮疹）；textbook_notes（特殊針法 第八章 安全與作業規範）","id":"D8-046","h":"76258497d4"},{"day":8,"date":"2026-10-15","number":47,"topic":"其他｜皮膚：蛇串瘡（帶狀疱疹）","group":"皮膚","qtype":"臨床情境","stem":"66歲女性，右側胸背部兩天前出現沿肋間呈帶狀分布的成簇水疱，伴灼熱刺痛，不超過身體中線，頭面部與眼睛沒有病灶，免疫功能正常。下列處置何者最適當？","options":[["A","疼痛屬肝膽濕熱，只需針刺太衝，避免任何西藥"],["B","建議盡早（出疹72小時內）就醫使用抗病毒藥物；同時可用局部圍刺、相應節段夾脊穴、支溝、陽陵泉，或刺絡拔罐作為輔助止痛"],["C","將水疱逐一刺破擠出液體後，以膠布密封"],["D","在水疱上施化膿灸以「以毒攻毒」，不需使用抗病毒藥"]],"answer":"B","difficulty":"易","explanation":"帶狀疱疹在出疹72小時內使用抗病毒藥物，可縮短病程，並可能降低帶狀疱疹後神經痛的風險，高齡者尤其要盡早治療。針灸可作為輔助：阿是穴圍刺、相應節段夾脊穴、支溝、陽陵泉、行間，或局部刺絡拔罐。操作要嚴格消毒，避免弄破水疱造成感染。\n紅旗：侵犯眼周（三叉神經眼支，鼻尖出現水疱）、免疫低下、疹子散布全身或出現神經學症狀，要緊急轉介。","source":"notes（處方速記（二）：蛇串瘡）；textbook_notes（黃維三 下編第二章 第十一節 外科病）","id":"D8-047","h":"647707b32b"},{"day":8,"date":"2026-10-15","number":48,"topic":"其他｜外科：顏面疔瘡與危險三角","group":"外科","qtype":"臨床情境","stem":"《針灸大成‧治症總要》：「第一百八疔瘡。（以針挑有血可治無血不可治）合谷 曲池 三里 委中」。50歲糖尿病男性，上唇鼻翼旁長一顆紅腫硬結3天，自行擠壓後腫脹蔓延，今日發燒、頭痛，同側眼瞼腫脹、眼球轉動疼痛。下列處置何者最適當？","options":[["A","疔瘡屬火毒，在患處施隔蒜灸至膿出"],["B","懷疑面部危險三角感染擴散（如眼眶蜂窩性組織炎或海綿竇栓塞），應立即轉介急診，不可在局部挑刺或擠壓"],["C","局部熱敷並自行擠出膿頭即可"],["D","依古法在疔瘡上以三稜針挑刺出血，再針合谷、曲池、委中"]],"answer":"B","difficulty":"高","explanation":"上唇與鼻周屬「危險三角」，靜脈回流可經眼靜脈通往海綿竇；擠壓或挑刺可能讓感染向顱內擴散。發燒、頭痛、眼瞼腫脹、眼球轉動痛提示眼眶或海綿竇受累，屬急症，糖尿病更是高危險群。\n《治症總要》以合谷、曲池、三里、委中治疔瘡，並註明「以針挑有血可治無血不可治」，屬古代經驗；現代面部疔瘡禁止擠壓挑刺，要盡早使用抗生素。","source":"《針灸大成》卷十一‧治症總要（第一百八 疔瘡）；textbook_notes（黃維三 下編第二章 第十一節 外科病）","id":"D8-048","h":"c4a34e1028"},{"day":8,"date":"2026-10-15","number":49,"topic":"其他｜腧穴總論：常用骨度分寸","group":"腧穴總論","qtype":"非題","stem":"下列常用骨度分寸（依 WHO 2008 標準），何者錯誤？","options":[["A","臍中至恥骨聯合上緣為6寸"],["B","兩乳頭之間為8寸"],["C","肘橫紋至腕掌（背）側遠端橫紋為12寸"],["D","腋前、後紋頭至肘橫紋為9寸"]],"answer":"A","difficulty":"中","explanation":"臍中至恥骨聯合上緣是5寸（所以關元在臍下3寸、中極在臍下4寸、曲骨在恥骨聯合上緣）。胸劍聯合中點至臍中為8寸，兩乳頭之間8寸，腋前後紋頭至肘橫紋9寸，肘橫紋至腕橫紋12寸。\n下肢記法：股骨大轉子至膕橫紋19寸，膕橫紋至外踝尖16寸，脛骨內側髁下緣至內踝尖13寸，恥骨聯合上緣至髕底18寸。","source":"notes（腧穴學：腧穴定位法與骨度分寸）；acupoints（關元 CV4、中極 CV3、曲骨 CV2）","id":"D8-049","h":"110256c351"},{"day":8,"date":"2026-10-15","number":50,"topic":"其他｜急症：診間癲癇發作","group":"急症","qtype":"臨床情境","stem":"25歲癲癇病史患者在針刺留針中突然意識喪失、全身強直陣攣抽搐。下列處置何者最適當？","options":[["A","加刺水溝、十宣強刺激直到抽搐停止，不需計時"],["B","保護頭部、移開周圍危險物，抽搐稍緩時盡快出針並側躺，記錄發作時間；超過5分鐘或連續發作則撥打119"],["C","趁抽搐時灌服溫開水或藥物"],["D","立即用力按住四肢以停止抽搐，並將毛巾塞入口中防止咬舌"]],"answer":"B","difficulty":"易","explanation":"癲癇大發作時不要壓制肢體，也不可把任何東西塞進嘴裡（易造成牙齒斷裂或窒息），更不能餵食。應保護頭部、清除周圍危險物、記錄時間，抽搐稍緩時出針，以免彎針、斷針；發作後讓患者側躺，保持呼吸道通暢。發作超過5分鐘、連續發作中間沒有恢復意識、受傷或首次發作，應撥打119。","source":"notes（刺法灸法：針刺異常情況處理）；notes（處方速記（一）：癲癇）","id":"D8-050","h":"fd62c8a3bd"},{"day":9,"date":"2026-10-16","number":1,"topic":"Day9｜婦科：《針灸大成‧婦人門》難產補瀉","group":"婦科","qtype":"經典填空","stem":"《針灸大成‧婦人門》：「難產　合谷（____）三陰交（____）△太沖」。兩空格依序應填？","options":[["A","補；瀉"],["B","補；補"],["C","瀉；瀉"],["D","瀉；補"]],"answer":"A","difficulty":"中","explanation":"原文為「難產　合谷（補）三陰交（瀉）」，同篇「子上逼心氣悶欲絕」也用「合谷（補）三陰交（瀉）」。這組補瀉可與《通玄指要賦》楊繼洲注的徐文伯故事對照：「瀉足三陰交，補手陽明合谷」，結果胎兒應針而下。補合谷可以行氣，瀉三陰交可以活血下胎，兩穴合用就有催產、下胎的作用。\n同一組補瀉也說明了孕期為什麼禁針合谷、三陰交。只有在產程中、由產科團隊監測時，才可作為輔助催產。《針灸大成‧治症總要》「婦人難產」另取獨陰、合谷、三陰交。","source":"《針灸大成》卷十‧婦人門；卷三‧通玄指要賦（楊繼洲註解）；卷十一‧治症總要第九十五；notes（處方速記（二）：滯產）","id":"D9-001","h":"c17f299fa1"},{"day":9,"date":"2026-10-16","number":2,"topic":"Day9｜婦科：滯產的產科紅旗","group":"婦科","qtype":"臨床情境","stem":"28歲初產婦，懷孕40週，在醫院待產。子宮頸口開到6公分後，連續3小時沒有進展；胎心監測出現反覆晚期減速。家屬要求「先用針灸催生」。下列處置何者最適當？","options":[["A","電針次髎強刺激，催產後再通知醫師"],["B","立刻針刺合谷（補）、三陰交（瀉），留針1小時後再評估胎心"],["C","艾灸至陰20分鐘以加強宮縮，胎心異常可暫不處理"],["D","立即通知產科團隊評估胎兒窘迫，依產科處置（必要時剖腹產），不可用針刺催產延誤處理"]],"answer":"D","difficulty":"易","explanation":"活動期產程停滯，加上胎心監測出現反覆晚期減速，提示胎盤灌流不足、胎兒可能窘迫，屬產科急症，要由產科醫師決定是否給予宮縮劑、器械助產或剖腹產。\n教材的滯產處方（合谷補、三陰交瀉、至陰、獨陰）只適用於胎兒、母體狀況穩定，且在產科團隊同意、監測下的輔助處置。母胎任何一方出現警訊時，針灸不能取代標準產科處置。","source":"notes（處方速記（二）：滯產）；textbook_notes（新編彩圖 第八章 第八節 婦科疾病）","id":"D9-002","h":"f68cc910f4"},{"day":9,"date":"2026-10-16","number":3,"topic":"Day9｜婦科：《針灸大成》無乳取穴","group":"婦科","qtype":"經典","stem":"《針灸大成‧婦人門》記載產後「無乳」的取穴，並說「此二穴神效」。這兩個穴位與施術方式依序為何？","options":[["A","膻中（灸）、少澤（補）"],["B","足三里（灸）、膻中（禁灸）"],["C","肩井（針）、期門（瀉）"],["D","乳根（針）、少澤（瀉）"]],"answer":"A","difficulty":"易","explanation":"原文：「無乳　亶中（灸）少澤（補）此二穴神效」。底本的「亶中」就是膻中。膻中是氣會、心包募穴，位於兩乳之間，灸之可以調氣通乳；少澤是手太陽小腸經井穴，是通乳要穴。同書〈治症總要〉「婦人無乳」取少澤、合谷、亶中。\n現代教材的缺乳處方為膻中、乳根、少澤、足三里：氣血虛弱者加脾俞、足三里並灸；肝鬱氣滯者加太衝、期門。","source":"《針灸大成》卷十‧婦人門；卷十一‧治症總要第一百二；acupoints（膻中 CV17、少澤 SI1）","id":"D9-003","h":"6ed141221e"},{"day":9,"date":"2026-10-16","number":4,"topic":"Day9｜主病要穴歌：前谷治產後無乳","group":"主病要穴歌","qtype":"經典填空","stem":"《刺灸心法要訣‧手部主病針灸要穴歌》：「前谷主治癲癇疾，頸項肩臂痛難堪，更能兼治____。小海喉齦腫痛痊。」空格應填？","options":[["A","經漏崩"],["B","婦乳腫"],["C","水腫產難"],["D","產無乳"]],"answer":"D","difficulty":"中","explanation":"原文是「更能兼治產無乳」，注：「前谷穴，主治癲癇，頸項頰腫引耳疼痛，及婦人產後無乳等證。針一分，留三呼，灸三壯。」前谷是手太陽小腸經滎穴，和同經井穴少澤一樣能通乳。\n易混：「兼治婦人乳腫疼」是少澤；「水腫產難小兒驚」是合谷；「婦人經漏過多崩」是通里。","source":"《刺灸心法要訣》卷七‧手部主病針灸要穴歌","id":"D9-004","h":"e98d972327"},{"day":9,"date":"2026-10-16","number":5,"topic":"Day9｜缺乳：席漢氏症候群紅旗","group":"缺乳","qtype":"臨床情境","stem":"32歲女性，3週前生產時發生產後大出血，輸血6單位。產後一直沒有乳汁分泌，近日極度疲倦、頭暈、站起來就眼前發黑，血壓 88/54 mmHg，抽血鈉 128 mmol/L、空腹血糖 58 mg/dL。她希望用針灸「催乳」。下列處置何者最適當？","options":[["A","屬早期乳腺炎，乳房局部熱敷並針刺肩井"],["B","辨為肝鬱氣滯型缺乳，瀉太衝、期門，並囑多喝湯水"],["C","辨為氣血虛弱型缺乳，灸膻中、少澤、足三里，兩週後再評估"],["D","懷疑席漢氏症候群（產後腦下垂體缺血壞死），應轉介內分泌科評估皮質醇與甲狀腺功能等，優先處理腎上腺功能不足"]],"answer":"D","difficulty":"高","explanation":"產後大出血之後出現「完全無乳＋疲倦＋低血壓＋低血鈉＋低血糖」，應懷疑席漢氏症候群（Sheehan syndrome）：腦下垂體前葉缺血壞死，泌乳素、ACTH、TSH 等分泌不足。其中次發性腎上腺功能不足可能危及生命，需要內分泌科檢查並補充荷爾蒙。\n缺乳的辨證處方（膻中、乳根、少澤、足三里；虛加脾俞，實加太衝、期門）只適用於排除器質性病因之後。乳房並無紅腫熱痛，不符合乳腺炎。","source":"notes（處方速記（二）：乳少）；textbook_notes（新編彩圖 第八章 第八節）；臨床內分泌學常識","id":"D9-005","h":"dba78b931a"},{"day":9,"date":"2026-10-16","number":6,"topic":"Day9｜痛經：治療時機與繼發性痛經","group":"痛經","qtype":"概念","stem":"關於原發性痛經的針灸治療，下列敘述何者最正確？","options":[["A","一般在月經來潮前3–5天開始治療，連續治療數個週期；常用三陰交、中極、次髎、十七椎"],["B","只在經痛最劇烈時針刺即可，平時治療無益"],["C","月經期間一律禁針，只能在月經乾淨後治療"],["D","凡痛經皆屬原發性，不必詢問疼痛起始年齡與性交疼痛"]],"answer":"A","difficulty":"易","explanation":"教材原則：痛經在經前3–5天開始治療，至經行結束，持續約3個週期。常用穴為三陰交、中極、次髎、十七椎（第5腰椎棘突下，奇穴），地機（郄穴）可治急痛。\n鑑別：若25歲後才開始痛、痛感逐年加重，或合併性交疼痛、不孕、經血量異常，要考慮子宮內膜異位症、子宮腺肌症等繼發性痛經，應轉介婦產科做超音波檢查。","source":"textbook_notes（新編彩圖 第八章 第八節；第七章「施行時間」：痛經於經前3–5天開始治療）；acupoints（十七椎 EX-B8）","id":"D9-006","h":"fde717729a"},{"day":9,"date":"2026-10-16","number":7,"topic":"Day9｜崩漏：停經後出血紅旗","group":"崩漏","qtype":"臨床情境","stem":"56歲女性，停經已5年，近2週陰道斷續出血，量不多，無腹痛；舌淡、脈細。她說「中醫說這是崩漏，想灸隱白」。下列處置何者最適當？","options":[["A","停經後出血要先轉介婦產科，以經陰道超音波或子宮內膜切片排除子宮內膜癌等病變，確定病因後才考慮輔助治療"],["B","屬脾不統血，針三陰交、血海、氣海即可，不需檢查"],["C","依「陷下則灸之」，先灸隱白、百會，一個月後若仍出血再轉介"],["D","取《針灸大成》血崩方（氣海、大敦、陰谷、太沖、然谷、三陰交、中極），連續治療3個月"]],"answer":"A","difficulty":"中","explanation":"停經一年以上再出現陰道出血，就要優先排除子宮內膜癌、子宮內膜增生、子宮頸病灶等器質性病變，標準檢查是經陰道超音波測子宮內膜厚度，必要時做內膜切片。\n古籍的崩漏處方（《針灸大成‧婦人門》「血崩　氣海　大敦　陰谷　太沖　然谷　三陰交　中極」、灸隱白等）適用於排除惡性病變後的功能性子宮出血，不能先治療再說。","source":"《針灸大成》卷十‧婦人門；textbook_notes（新編彩圖 第八章 第八節）","id":"D9-007","h":"58df83e317"},{"day":9,"date":"2026-10-16","number":8,"topic":"Day9｜歌賦：《百症賦》婦科配穴","group":"歌賦","qtype":"非題","stem":"《針灸大成‧百症賦》後段論婦科配穴。下列配對何者「不符合」原文？","options":[["A","「婦人經事改常，自有地機血海」"],["B","「帶下產崩，衝門氣衝宜審」"],["C","「月潮違限，天樞水泉細詳」"],["D","「無子搜關元中極之鄉」"]],"answer":"D","difficulty":"高","explanation":"原文是「無子搜陰交石關之鄉」：陰交（任脈，臍下1寸）配石關（腎經，臍上3寸旁開0.5寸），不是關元、中極。\n同段還有：「女子少氣漏血，不無交信合陽」「肩井乳癰而極效」「脫肛趨百會尾翳之所」。考試常把病證和穴位對調，宜成對背誦。","source":"《針灸大成》卷二‧百症賦（聚英）","id":"D9-008","h":"48c6210a8f"},{"day":9,"date":"2026-10-16","number":9,"topic":"Day9｜實證：針刺用於分娩疼痛（Cochrane 2020）","group":"實證","qtype":"實證研究","stem":"Smith CA 等的 Cochrane 系統性回顧〈Acupuncture or acupressure for pain management during labour〉（2020；doi:10.1002/14651858.CD009232.pub2）。下列何者最符合其結論？","options":[["A","與假針比較，針刺對產痛強度可能差異不大（低確定性），但可能提高對止痛的滿意度，且可能減少藥物止痛的使用（中等確定性）"],["B","穴位按壓與假對照比較會使剖腹產率上升，因此不建議產程中使用"],["C","納入的28篇試驗全部為低偏差風險，證實針刺可顯著降低剖腹產率（高確定性）"],["D","針刺與假針比較，可使產痛 VAS 下降超過一半，可取代硬脊膜外麻醉"]],"answer":"A","difficulty":"高","explanation":"這篇回顧納入28篇試驗、3960位婦女（針刺13篇、穴位按壓15篇），沒有任何一篇在所有偏差面向都是低風險。\n針刺 vs 假針：疼痛強度可能差異不大（MD −4.42，95% CI −12.94～4.09，低確定性）；止痛滿意度可能提高（RR 2.38）；藥物止痛使用可能減少（RR 0.75，95% CI 0.63–0.89，中等確定性）；對器械助產與剖腹產大概沒有影響。穴位按壓 vs 假對照：剖腹產率可能下降（RR 0.44，中等確定性）。\n臨床意義：針刺與指壓可作為產程止痛的輔助方式，但證據確定性有限，不能取代標準產科麻醉。","source":"Smith CA, et al. Cochrane Database Syst Rev. 2020;2:CD009232. doi:10.1002/14651858.CD009232.pub2（PMID: 32032444，已查證）","id":"D9-009","h":"4ee8496e72"},{"day":9,"date":"2026-10-16","number":10,"topic":"Day9｜實證：試管嬰兒療程針刺（Smith 2018 JAMA）","group":"實證","qtype":"實證研究","stem":"Smith CA 等於2018年在《JAMA》發表多中心隨機試驗（doi:10.1001/jama.2018.5336），比較試管嬰兒（IVF）療程中真針刺與假針刺對活產率的影響。下列何者正確？","options":[["A","假針組使用真穴深刺，因此兩組無差異只是假針設計錯誤所致"],["B","848位婦女隨機分組，活產率真針組18.3%、假針組17.8%，差異無統計意義；作者結論不支持以針刺提高 IVF 活產率"],["C","試驗以臨床懷孕率為主要結果，未追蹤活產"],["D","真針組活產率約為假針組的兩倍，作者建議所有 IVF 婦女常規接受針刺"]],"answer":"B","difficulty":"高","explanation":"這是在澳洲、紐西蘭16家 IVF 中心進行的單盲隨機試驗：848人隨機分組，824人納入分析。針刺於卵巢刺激第6–8天施作一次，胚胎植入前後各一次；假針是放在非穴位、不刺入皮膚的鈍頭針。主要結果是活產：74/405（18.3%）vs 72/404（17.8%），RR 1.02（95% CI 0.76–1.38）。\n結論：在 IVF 療程中加做針刺，並不能提高活產率。臨床上可以和病人說明證據，避免誇大療效。","source":"Smith CA, et al. JAMA. 2018;319(19):1990-1998. doi:10.1001/jama.2018.5336（PMID: 29800212，已查證）","id":"D9-010","h":"e7e47eeb6e"},{"day":9,"date":"2026-10-16","number":11,"topic":"Day9｜兒科：疳積四縫點刺","group":"兒科","qtype":"臨床情境","stem":"4歲男童，食慾差半年，面黃肌瘦、頭髮稀疏、腹部脹大、睡眠不安、愛咬指甲，生長曲線由第50百分位掉到第10百分位。中醫診斷為疳積。下列何者是最具代表性的奇穴刺法？","options":[["A","耳尖點刺放血"],["B","點刺四縫穴，擠出少許黃白色透明黏液"],["C","四神聰平刺留針"],["D","十宣點刺放血"]],"answer":"B","difficulty":"易","explanation":"四縫（EX-UE10）位於第2–5指掌面近端指間關節橫紋中央，一手4穴，主治小兒疳積、百日咳；刺法是點刺後擠出少許黃白色透明黏液。疳積常配中脘、足三里、脾俞以健脾消積。\n十宣主要用於昏迷、高熱；耳尖用於目赤、麥粒腫；四神聰用於失眠、頭痛。生長曲線明顯下滑的孩子，也要評估寄生蟲、吸收不良、慢性病與餵養問題。","source":"acupoints（四縫 EX-UE10）；notes（處方速記（二）：小兒疳積）","id":"D9-011","h":"b5e845f9d2"},{"day":9,"date":"2026-10-16","number":12,"topic":"Day9｜兒科：楊繼洲疳疾醫案","group":"兒科","qtype":"經典填空","stem":"《針灸大成‧醫案》記載楊繼洲治一位患疳疾的孩子：「此子形羸，雖是疳症，而腹內有積塊，附於脾胃之旁，若徒治其疳，而不治其塊，是不求其本……治之之法，宜先取____灸針，消散積塊，後次第理治脾胃。」空格應填？","options":[["A","中脘"],["B","四縫"],["C","章門"],["D","天樞"]],"answer":"C","difficulty":"中","explanation":"原文是「宜先取章門灸針，消散積塊」，之後「灸章門，再以蟾蜍丸藥兼用之，形體漸盛，疳疾俱痊」。章門是脾募、臟會，位於第11肋游離端下方，善治痞塊、積聚。《刺灸心法要訣》也說「章門主治痞塊病」。\n此案的重點是治病求本：疳症只是表象，先消積塊，再調理脾胃。同書〈小兒針〉也有「小兒身羸瘦，賁助腹脹，四肢懈惰，肩背不舉，灸章門」（「賁助」當為「賁豚」）。","source":"《針灸大成》卷十一‧醫案（戊辰歲楊後山公迺郎疳疾案）；卷十二‧小兒針；《刺灸心法要訣》卷七‧胸腹部主病針灸要穴歌","id":"D9-012","h":"de37dea413"},{"day":9,"date":"2026-10-16","number":13,"topic":"Day9｜兒科：《針灸大成‧小兒針》驚風灸法","group":"兒科","qtype":"經典填空","stem":"《針灸大成‧小兒針》：「寶鑑曰：急慢驚風，灸____，若不愈，灸攢竹人中，各三壯。或謂急驚屬肝，慢驚屬脾。」空格應填？","options":[["A","前頂"],["B","囟會"],["C","神庭"],["D","百會"]],"answer":"A","difficulty":"中","explanation":"原文：「急慢驚風，灸前頂，若不愈，灸攢竹人中，各三壯。」原文接著說：「或謂急驚屬肝，慢驚屬脾，寶鑑不分，灸前頂攢竹二穴，俱太陽督脈，未詳其義。」也就是說他質疑《寶鑑》不分急驚、慢驚。同篇又有「小兒慢驚風，灸尺澤各七壯」。\n辨證要點：急驚屬肝、屬實熱（高熱、抽搐、角弓反張），治宜清熱熄風開竅；慢驚屬脾、屬虛寒（久吐瀉後神疲、時抽時止），治宜健脾溫陽。","source":"《針灸大成》卷十二‧小兒針（引《衛生寶鑑》）","id":"D9-013","h":"19ec222028"},{"day":9,"date":"2026-10-16","number":14,"topic":"Day9｜歌賦：《玉龍歌》慢驚取印堂","group":"歌賦","qtype":"經典","stem":"《針灸大成‧玉龍歌》：「頭風嘔吐眼昏花，穴取神庭始不差，孫子慢驚何可治？印堂刺入艾還加。」（底本作「孫子」）依歌文及楊繼洲注，下列何者正確？","options":[["A","注文主張急驚用補法、慢驚用瀉法"],["B","印堂宜直刺1.5寸，針感傳到後頭為佳"],["C","印堂屬禁灸穴，歌中只用針不用艾"],["D","小兒慢驚可刺印堂並加灸；注文說刺後若「不哭，急驚瀉，慢驚補」"]],"answer":"D","difficulty":"中","explanation":"歌文「印堂刺入艾還加」，說明印堂針、灸並用。注文：「即堂入一分。沿皮透左右，攢竹大哭效，不哭，急驚瀉，慢驚補。」（底本「即堂」當為印堂）意思是淺刺1分後向兩側攢竹沿皮透刺，孩子大哭就是有效；不哭時，再依急驚用瀉、慢驚用補。\n印堂（EX-HN3）位於兩眉頭連線中點，提捏皮膚平刺0.3–0.5寸，主治頭痛、鼻淵、小兒驚風等，不宜直刺深刺。","source":"《針灸大成》卷三‧玉龍歌（楊繼洲註解）；acupoints（印堂 EX-HN3）","id":"D9-014","h":"1717f0db68"},{"day":9,"date":"2026-10-16","number":15,"topic":"Day9｜主病要穴歌：小兒驚風用穴","group":"主病要穴歌","qtype":"非題","stem":"《刺灸心法要訣》卷七各部主病針灸要穴歌中，有多個穴位注明可治「小兒急慢驚風」。下列何穴的歌與注「沒有」提到小兒驚風？","options":[["A","行間"],["B","大敦"],["C","湧泉"],["D","尺澤"]],"answer":"C","difficulty":"高","explanation":"湧泉歌：「湧泉主刺足心熱，兼刺奔豚疝氣疼，血淋氣痛疼難忍」，沒有提到驚風。\n提到驚風的有：百會「兼治癲癇兒病驚」（注：小兒急慢驚風）；水溝「灸治兒風急慢災」；尺澤「兼刺小兒急慢風」；合谷「水腫產難小兒驚」（注：小兒急驚風）；大敦「小兒急慢驚風病，炷如小麥灸之靈」；行間「行間穴治兒驚風」。另有神門「兼治小兒驚癇證」，脾俞「更治嬰兒慢脾風」。","source":"《刺灸心法要訣》卷七‧頭部、手部、足部、背部主病針灸要穴歌","id":"D9-015","h":"025098ba45"},{"day":9,"date":"2026-10-16","number":16,"topic":"Day9｜兒科：腦性麻痺的針灸定位","group":"兒科","qtype":"非題","stem":"關於小兒腦性麻痺的針灸治療，下列敘述何者錯誤？","options":[["A","體針可取夾脊、百會、四神聰，以及髓會懸鐘、骨會大杼、足三里、三陰交"],["B","腦性麻痺是進行性腦部退化疾病，針灸的主要目的在阻止病程惡化，可取代物理與職能治療"],["C","頭皮針常取運動區、感覺區、足運感區、語言區、平衡區"],["D","中醫以「五遲」「五軟」描述發育遲緩的表現"]],"answer":"B","difficulty":"易","explanation":"腦性麻痺是出生前後腦部「非進行性」損傷所造成的動作與姿勢障礙，常合併智能、語言、癲癇等問題。針灸是綜合復健的一部分，要配合物理治療、職能治療、語言治療，不能取代。\n五遲：立、行、髮、齒、語遲；五軟：頭項、口、手、足、肌肉軟。取懸鐘（髓會）、大杼（骨會）是取「填髓壯骨」之意。","source":"textbook_notes（新編彩圖 第八章 第十一節 小兒科疾病（嬰兒腦性麻痺））","id":"D9-016","h":"26fdda87f3"},{"day":9,"date":"2026-10-16","number":17,"topic":"Day9｜五官：麥粒腫耳尖放血","group":"五官","qtype":"臨床情境","stem":"25歲女性，右上眼瞼邊緣紅腫、觸痛2天，局部可摸到小硬結，視力正常、眼球活動不痛、無發燒。診斷為麥粒腫（針眼）。下列何者最常用？","options":[["A","耳尖點刺放血，配合太陽、局部熱敷"],["B","灸睛明、承泣以溫散"],["C","至陰點刺放血"],["D","深刺眼眶內球後穴"]],"answer":"A","difficulty":"易","explanation":"耳尖（EX-HN6，折耳向前，耳郭上方尖端）點刺放血可清熱消腫，主治目赤腫痛、麥粒腫；也可在背部肩胛區找紅色反應點挑刺。睛明、承泣都是眼周禁灸穴，眼眶內深刺有出血風險，不宜用於麥粒腫。\n紅旗：若出現眼瞼瀰漫腫脹、眼球突出、眼球活動疼痛、視力下降或發燒，要懷疑眼眶蜂窩性組織炎，應立即轉介眼科。","source":"acupoints（耳尖 EX-HN6、太陽 EX-HN5）；textbook_notes（新編彩圖 第八章 第九節 五官科）","id":"D9-017","h":"6479a2c7d1"},{"day":9,"date":"2026-10-16","number":18,"topic":"Day9｜《玉龍歌》目赤刺血與青光眼紅旗","group":"《玉龍歌》目赤刺血與青光眼紅旗","qtype":"臨床情境","stem":"《玉龍歌》：「兩睛紅腫痛難熬，怕日羞明心自焦，只刺睛明魚尾穴，太陽出血自然消。」62歲女性，傍晚看電影後突然右眼劇痛、眼紅、視力模糊、看燈有虹暈，伴頭痛、噁心嘔吐；右瞳孔中度散大、對光反射遲鈍，眼球摸起來很硬。下列處置何者最適當？","options":[["A","屬肝火上炎，瀉行間、太衝即可，不需轉診"],["B","依《玉龍歌》太陽刺血、睛明針刺，觀察一晚"],["C","懷疑急性隅角閉鎖性青光眼，立即轉眼科急診降眼壓，不可只以太陽放血處理"],["D","耳尖放血後熱敷眼部，次日回診"]],"answer":"C","difficulty":"高","explanation":"急性眼痛、眼紅、視力模糊、虹暈、頭痛嘔吐、瞳孔中度散大且反應差、眼壓高，是典型的急性隅角閉鎖性青光眼，可在數小時內造成不可逆的視神經損傷，必須立即到眼科急診降眼壓。\n《玉龍歌》的「睛明魚尾＋太陽出血」適用於一般目赤腫痛（如急性結膜炎）。楊繼洲注還提醒：睛明、魚尾「俱禁灸，如虛腫，不宜去血」。單純結膜炎通常視力正常、瞳孔正常。","source":"《針灸大成》卷三‧玉龍歌（楊繼洲註解）；眼科急症常識"
