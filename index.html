}
function refreshGrid(sess){
  var g = document.getElementById('grid'); if (!g) return;
  Array.prototype.forEach.call(g.children, function(b, i){
    var q = sess.list[i]; b.className = gridClass(sess, q);
    if (U.view === 'single' && i === sess.getIdx()) b.classList.add('cur');
  });
}
function goTo(i){
  var sess = getSession(); if (!sess) return;
  i = Math.max(0, Math.min(sess.list.length - 1, i));
  sess.setIdx(i); sess.summary(false); save();
  if (U.view === 'single'){ render(); var c = document.getElementById('card-' + i); if (c) c.scrollIntoView({block:'start'}); }
  else { var c2 = document.getElementById('card-' + i); if (c2) c2.scrollIntoView({behavior:'smooth', block:'start'}); else { render(); } }
}
function refreshNav(sess){
  var fin = document.getElementById('finishHint'); if (!fin) return;
  var st = stats(sess);
  fin.classList.toggle('hide', !(sess.reveal && st.answered === st.total && st.total));
}

/* ---------- 成績 ---------- */
function breakdown(sess, keyFn, sortFn){
  var m = {}, keys = [];
  sess.list.forEach(function(q){
    var k = keyFn(q) || '未分類';
    if (!m[k]){ m[k] = {n:0, a:0, r:0}; keys.push(k); }
    var s = getAns(sess.map, q.id); m[k].n++; if (s){ m[k].a++; if (isRight(q, s)) m[k].r++; }
  });
  if (sortFn) keys.sort(sortFn);
  var t = el('table'), h = el('tr');
  ['', '題數', '作答', '答對', '正確率'].forEach(function(x){ h.appendChild(el('th', null, x)); });
  t.appendChild(h);
  keys.forEach(function(k){
    var r = m[k], tr = el('tr'), base = sess.kind === 'exam' ? r.n : r.a, p = pct(r.r, base);
    tr.appendChild(el('td', null, k)); tr.appendChild(el('td', null, r.n)); tr.appendChild(el('td', null, r.a)); tr.appendChild(el('td', null, r.r));
    var td = el('td', null, base ? p + '%' : '—'); var pb = el('span', 'pct-bar'), pi = el('i'); pi.style.width = p + '%'; pb.appendChild(pi); td.appendChild(pb);
    tr.appendChild(td); t.appendChild(tr);
  });
  return t;
}
function buildSummary(sess){
  var box = el('section', 'card sum'); box.id = 'summary';
  var st = stats(sess);
  var title = sess.kind === 'exam' ? '模擬考成績' : sess.kind === 'wrong' ? '錯題練習成績' : sess.kind === 'star' ? '難題收藏練習成績' : '練習成績';
  box.appendChild(el('h2', null, title));
  if (sess.kind === 'exam'){
    var e = S.exam, used = (e.end || Date.now()) - e.start;
    box.appendChild(el('div', 'note', '用時 ' + fmtTime(used) + '／限時 ' + e.dur + ' 分鐘' + (e.auto ? '（時間到自動交卷）' : '')));
  }
  var big = el('div', 'big');
  function cell(v, l){ var d = el('div'); d.appendChild(el('b', null, v)); d.appendChild(el('small', null, l)); big.appendChild(d); }
  cell(st.right + ' / ' + st.total, '答對題數');
  if (sess.kind === 'exam') cell(pct(st.right, st.total) + '%', '得分率（未答以錯計）');
  else { cell(pct(st.right, st.answered) + '%', '正確率（已作答）'); cell(pct(st.right, st.total) + '%', '佔全部題數'); }
  cell(st.total - st.answered, '未作答');
  var starredIdx = []; sess.list.forEach(function(q, i){ if (S.star[q.id]) starredIdx.push(i); });
  cell('★ ' + starredIdx.length, '本組已收藏難題');
  box.appendChild(big);
  if (st.answered < st.total && sess.kind !== 'exam') box.appendChild(el('div', 'warn', '尚有 ' + (st.total - st.answered) + ' 題未作答，以下統計僅含已作答題目。'));
  box.appendChild(el('h4', null, '依主題'));
  box.appendChild(breakdown(sess, function(q){ return q.group; }));
  box.appendChild(el('h4', null, '依難度'));
  box.appendChild(breakdown(sess, function(q){ return q.difficulty; }, diffSort));
  var days = uniq(sess.list.map(function(q){ return 'Day ' + q.day; }));
  if (days.length > 1){ box.appendChild(el('h4', null, '依日期')); box.appendChild(breakdown(sess, function(q){ return 'Day ' + q.day; }, function(a, b){ return parseInt(a.slice(4), 10) - parseInt(b.slice(4), 10); })); }
  var wrongs = [];
  sess.list.forEach(function(q, i){ var s = getAns(sess.map, q.id); if ((s && !isRight(q, s)) || (!s && sess.kind === 'exam')) wrongs.push(i); });
  if (wrongs.length){
    box.appendChild(el('h4', null, sess.kind === 'exam' ? '答錯／未答（點擊檢討）' : '答錯題目（點擊檢討）'));
    var wl = el('div', 'wlist');
    wrongs.forEach(function(i){ var b = el('button', 'btn sm', String(i + 1)); b.type = 'button'; b.title = qLabel(sess.list[i]); b.addEventListener('click', function(){ U.view = 'single'; goTo(i); }); wl.appendChild(b); });
    box.appendChild(wl);
  }
  if (starredIdx.length){
    box.appendChild(el('h4', null, '★ 已收藏難題（點擊檢討）'));
    var sl = el('div', 'wlist');
    starredIdx.forEach(function(i){ var b = el('button', 'btn sm', '★ ' + (i + 1)); b.type = 'button'; b.title = qLabel(sess.list[i]); b.addEventListener('click', function(){ U.view = 'single'; goTo(i); }); sl.appendChild(b); });
    box.appendChild(sl);
  }
  var r = el('div', 'row');
  var back = el('button', 'btn', sess.kind === 'exam' ? '逐題檢討' : '返回題目'); back.type = 'button';
  back.addEventListener('click', function(){ sess.summary(false); save(); render(); window.scrollTo(0, 0); });
  r.appendChild(back);
  if (wbCount() && sess.kind !== 'wrong'){
    var wb = el('button', 'btn pri', '練習錯題本（' + wbCount() + '）'); wb.type = 'button';
    wb.addEventListener('click', function(){ U.mode = 'wrong'; S.wbs = newWrongSession(); save(); render(); window.scrollTo(0, 0); });
    r.appendChild(wb);
  }
  if (starCount() && sess.kind !== 'star'){
    var sbn = el('button', 'btn', '★ 練習難題收藏（' + starCount() + '）'); sbn.type = 'button';
    sbn.addEventListener('click', function(){ U.mode = 'star'; S.sts = newStarSession(); save(); render(); window.scrollTo(0, 0); });
    r.appendChild(sbn);
  }
  box.appendChild(r);
  return box;
}

/* ---------- 主畫面 ---------- */
function render(){
  renderTabs(); renderCtrl();
  main.innerHTML = '';
  var sess = getSession();
  if (!sess){ renderSticky(null); main.appendChild(buildExamSetup()); return; }
  renderSticky(sess);
  if (!sess.list.length){
    var msg = sess.kind === 'wrong' ? (wbCount() ? '按「重新開始錯題練習」載入最新錯題。' : '錯題本是空的 🎉 先去「練習」作答吧。')
      : sess.kind === 'star' ? (starCount() ? '按「重新開始收藏練習」載入最新收藏，或調整篩選。' : '還沒有收藏的難題。作答時按「☆ 收藏難題」或「🤔 猜對的／沒把握」即可加入。')
      : '沒有符合條件的題目，請調整篩選。';
    main.appendChild(el('div', 'card empty', msg)); return;
  }
  if (sess.summary()){ main.appendChild(buildSummary(sess)); return; }
  var idx = Math.max(0, Math.min(sess.list.length - 1, sess.getIdx())); sess.setIdx(idx);
  if (U.view === 'single'){
    main.appendChild(buildCard(sess.list[idx], idx, sess));
    var nav = el('div', 'nav');
    var pv = el('button', 'btn', '← 上一題'); pv.type = 'button'; pv.id = 'prevBtn'; pv.disabled = idx === 0;
    pv.addEventListener('click', function(){ goTo(idx - 1); });
    var last = idx === sess.list.length - 1;
    var nx = el('button', 'btn pri', last ? (sess.kind === 'exam' && S.exam.state === 'running' ? '交卷' : '查看成績') : '下一題 →'); nx.type = 'button'; nx.id = 'nextBtn';
    nx.addEventListener('click', function(){
      if (!last) return goTo(idx + 1);
      if (sess.kind === 'exam' && S.exam.state === 'running') return submitExam(false);
      sess.summary(true); save(); render(); window.scrollTo(0, 0);
    });
    nav.appendChild(pv); nav.appendChild(nx); main.appendChild(nav);
  } else {
    sess.list.forEach(function(q, i){ main.appendChild(buildCard(q, i, sess)); });
  }
  var fin = el('div', 'row hide'); fin.id = 'finishHint'; fin.style.marginBottom = '12px';
  var fb = el('button', 'btn pri', '🎉 已全部作答，查看成績'); fb.type = 'button'; fb.style.width = '100%';
  fb.addEventListener('click', function(){ sess.summary(true); save(); render(); window.scrollTo(0, 0); });
  fin.appendChild(fb); main.appendChild(fin);
  var r = el('div', 'row'); r.style.marginBottom = '12px';
  if (sess.kind === 'exam' && S.exam.state === 'running'){
    var sb = el('button', 'btn pri', '交卷'); sb.type = 'button'; sb.style.flex = '1'; sb.addEventListener('click', function(){ submitExam(false); }); r.appendChild(sb);
  } else {
    var sm = el('button', 'btn', '查看成績摘要'); sm.type = 'button'; sm.style.flex = '1'; sm.id = 'sumBtn';
    sm.addEventListener('click', function(){ sess.summary(true); save(); render(); window.scrollTo(0, 0); }); r.appendChild(sm);
  }
  main.appendChild(r);
  main.appendChild(buildGrid(sess));
  refreshNav(sess);
}

document.getElementById('tabs').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-mode]'); if (!b) return;
  var m = b.getAttribute('data-mode'); if (m === U.mode) return;
  U.mode = m;
  if (m === 'wrong'){ var cur = S.wbs; var ids = Q.filter(function(q){ return S.wb[q.id]; }).map(function(q){ return q.id; });
    // 錯題本若有新增題目且目前進度已全部作答完，自動載入最新錯題
    if (!cur || (cur.order.every(function(id){ return getAns(cur.ans, id); }) && ids.join() !== cur.order.join())) S.wbs = newWrongSession(); }
  if (m === 'star'){ var z = S.sts, sids = starFilteredIds();
    // 尚未作答或已全部作答完時，自動載入最新收藏清單
    if (!z || (sids.join() !== z.order.join() && (!Object.keys(z.ans).length || z.order.every(function(id){ return getAns(z.ans, id); })))) S.sts = newStarSession(); }
  save(); render(); window.scrollTo(0, 0);
});
document.getElementById('wipeAll').addEventListener('click', function(){
  if (!confirm('確定清除所有作答紀錄、錯題本、難題收藏與模擬考？此動作無法復原。\n（建議先用「匯出／匯入紀錄」備份）')) return;
  S = {ans:{}, wb:{}, star:{}, ui:{mode:'practice', view:U.view, set:U.set, diff:'', topic:'', qtype:'', idx:0, seenDay:U.seenDay}, wbs:null, sts:null, exam:null}; U = S.ui;
  save(); render(); window.scrollTo(0, 0);
});
document.addEventListener('keydown', function(ev){
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var tg = ev.target && ev.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  if (document.getElementById('ioOverlay')) { if (ev.key === 'Escape') closeIO(); return; }
  var sess = getSession(); if (!sess || !sess.list.length || sess.summary() || U.view !== 'single') return;
  var idx = sess.getIdx(), q = sess.list[idx], key = ev.key;
  if (key === 's' || key === 'S'){ toggleStar(q); ev.preventDefault(); return; }
  if (key === 'ArrowRight'){ if (idx < sess.list.length - 1) goTo(idx + 1); ev.preventDefault(); return; }
  if (key === 'ArrowLeft'){ if (idx > 0) goTo(idx - 1); ev.preventDefault(); return; }
  var k = null;
  if (/^[1-8]$/.test(key)) k = q.options[+key - 1] && q.options[+key - 1][0];
  else if (/^[a-hA-H]$/.test(key)) k = key.toUpperCase();
  if (k && q.options.some(function(o){ return o[0] === k; })){ answer(q, k); ev.preventDefault(); }
});
/* ---------- 匯出／匯入 ---------- */
function safeKey(k){ return typeof k === 'string' && k.length > 0 && k.length <= 120 && k !== '__proto__' && k !== 'constructor' && k !== 'prototype'; }
function num(v){ return typeof v === 'number' && isFinite(v) ? v : 0; }
var CLEAN = {
  ans: function(v){ return (v && typeof v.s === 'string' && /^[A-H]$/.test(v.s) && typeof v.h === 'string') ? {s:v.s, h:v.h.slice(0, 40), t:num(v.t)} : null; },
  wb: function(v){ return (v && typeof v.h === 'string') ? {n:Math.max(1, Math.min(9999, Math.floor(num(v.n)) || 1)), h:v.h.slice(0, 40), t:num(v.t)} : null; },
  star: function(v){ return (v && typeof v === 'object') ? {t:num(v.t) || Date.now(), u:num(v.u) || num(v.t), streak:Math.max(0, Math.floor(num(v.streak))), tries:Math.max(0, Math.floor(num(v.tries)))} : null; }
};
function newer(kind, a, b){ // a 是否比 b 新
  if (kind === 'wb') return a.n > b.n || (a.n === b.n && a.t > (b.t || 0));
  if (kind === 'star') return a.u > (b.u || b.t || 0);
  return a.t > (b.t || 0);
}
function exportObj(){ return {app:'acuQuiz', v:1, exportedAt:new Date().toISOString(), data:{ans:S.ans, wb:S.wb, star:S.star}}; }
function doImport(text, mode){
  if (text.length > 5e6) throw new Error('內容過大');
  var o = JSON.parse(text);
  var d = o && o.data && typeof o.data === 'object' ? o.data : o;
  if (!d || typeof d !== 'object' || !(d.ans || d.wb || d.star)) throw new Error('不是本練習頁匯出的紀錄（找不到 ans／wb／star）');
  if (o.app && o.app !== 'acuQuiz') throw new Error('不是本練習頁匯出的紀錄');
  var next = mode === 'replace' ? {ans:{}, wb:{}, star:{}} : {ans:JSON.parse(JSON.stringify(S.ans)), wb:JSON.parse(JSON.stringify(S.wb)), star:JSON.parse(JSON.stringify(S.star))};
  var cnt = {ans:0, wb:0, star:0};
  ['ans', 'wb', 'star'].forEach(function(kind){
    var src = d[kind]; if (!src || typeof src !== 'object' || Array.isArray(src)) return;
    Object.keys(src).forEach(function(id){
      if (!safeKey(id)) return;
      var v = CLEAN[kind](src[id]); if (!v) return;
      var cur = Object.prototype.hasOwnProperty.call(next[kind], id) ? next[kind][id] : null;
      if (!cur || newer(kind, v, cur)) next[kind][id] = v;
      cnt[kind]++;
    });
  });
  S.ans = next.ans; S.wb = next.wb; S.star = next.star; S.wbs = null; S.sts = null;
  save(); return cnt;
}
function closeIO(){ var o = document.getElementById('ioOverlay'); if (o) o.parentNode.removeChild(o); render(); }
function openIO(){
  if (document.getElementById('ioOverlay')) return;

  var m = el('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.appendChild(el('h3', null, '匯出／匯入紀錄'));
  m.appendChild(el('div', 'note', '包含：練習作答、錯題本、難題收藏。把匯出的檔案或文字帶到另一台裝置的同一個練習頁匯入即可。'));
  var json = JSON.stringify(exportObj());
  m.appendChild(el('h4', null, '匯出（目前：作答 ' + Object.keys(S.ans).length + '、錯題 ' + wbCount() + '、收藏 ' + starCount() + '）'));
  var ta = el('textarea'); ta.readOnly = true; ta.value = json; ta.id = 'ioExport'; m.appendChild(ta);
  var r1 = el('div', 'row'); r1.style.marginTop = '8px';
  var dl = el('button', 'btn sm pri', '下載 .json 檔'); dl.type = 'button';
  dl.addEventListener('click', function(){
    try {
      var blob = new Blob([json], {type:'application/json'}), a = document.createElement('a'), d = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = '針灸題庫紀錄_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch(e){ msg.className = 'msg ng'; msg.textContent = '無法下載，請改用「複製文字」。'; }
  });
  var cp = el('button', 'btn sm', '複製文字'); cp.type = 'button';
  cp.addEventListener('click', function(){
    function fallback(){ ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} msg.className = 'msg ' + (ok ? 'ok' : 'ng'); msg.textContent = ok ? '已複製。' : '請手動全選上方文字後複製。'; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(json).then(function(){ msg.className = 'msg ok'; msg.textContent = '已複製。'; }, fallback); else fallback();
  });
  r1.appendChild(dl); r1.appendChild(cp); m.appendChild(r1);
  m.appendChild(el('h4', null, '匯入'));
  var fi = el('input'); fi.type = 'file'; fi.accept = '.json,.txt,application/json,text/plain'; fi.id = 'ioFile'; fi.style.fontSize = '14px'; fi.style.maxWidth = '100%';
  m.appendChild(fi);
  var ti = el('textarea'); ti.id = 'ioImport'; ti.placeholder = '或把匯出的文字貼在這裡'; ti.style.marginTop = '8px'; m.appendChild(ti);
  fi.addEventListener('change', function(){ var f = fi.files && fi.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ ti.value = String(rd.result || ''); }; rd.readAsText(f); });
  var rw = el('div'); rw.style.marginTop = '6px';
  [['merge', '合併（保留兩邊，較新的優先）', true], ['replace', '取代（以匯入內容覆蓋本機）', false]].forEach(function(x){
    var lb = el('label', 'rad'), rb = el('input'); rb.type = 'radio'; rb.name = 'ioMode'; rb.value = x[0]; rb.checked = x[2];
    lb.appendChild(rb); lb.appendChild(document.createTextNode(x[1])); rw.appendChild(lb);
  });
  m.appendChild(rw);
  var r2 = el('div', 'row'); r2.style.marginTop = '8px';
  var im = el('button', 'btn sm pri', '匯入'); im.type = 'button'; im.id = 'ioDoImport';
  im.addEventListener('click', function(){
    var text = ti.value.trim(); if (!text){ msg.className = 'msg ng'; msg.textContent = '請先選擇檔案或貼上文字。'; return; }
    var mode = (m.querySelector('input[name=ioMode]:checked') || {}).value || 'merge';
    if (mode === 'replace' && !confirm('取代會清除本機現有的作答、錯題本與難題收藏，確定？')) return;
    try { var c = doImport(text, mode); msg.className = 'msg ok'; msg.textContent = '匯入完成：作答 ' + c.ans + '、錯題 ' + c.wb + '、收藏 ' + c.star + ' 筆。\n目前：錯題本 ' + wbCount() + ' 題、難題收藏 ' + starCount() + ' 題。'; renderTabs(); }
    catch(e){ msg.className = 'msg ng'; msg.textContent = '匯入失敗：' + (e && e.message ? e.message : e) + '\n本機紀錄未變更。'; }
  });
  var cl = el('button', 'btn sm', '關閉'); cl.type = 'button'; cl.id = 'ioClose'; cl.addEventListener('click', closeIO);
  r2.appendChild(im); r2.appendChild(cl); m.appendChild(r2);
  var msg = el('div', 'msg'); msg.id = 'ioMsg'; m.appendChild(msg);
  if (!lsOK) m.appendChild(el('div', 'warn', '注意：此瀏覽器無法永久儲存，匯入的紀錄關閉頁面後會消失。'));
  ov.appendChild(m);
  ov.addEventListener('click', function(ev){ if (ev.target === ov) closeIO(); });
  document.body.appendChild(ov);
}
document.getElementById('ioBtn').addEventListener('click', openIO);
document.getElementById('ioBtn2').addEventListener('click', openIO);
window.addEventListener('pageshow', tickTimer);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tickTimer(); });
render();
})();
</script>
</body>
</html>
