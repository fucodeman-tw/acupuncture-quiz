pe":"經典填空","stem":"《針灸甲乙經》卷三：「然谷者，火也。一名龍淵，在足內踝前起大骨下陷者中，足少陰脈之所留也，為滎。刺入三分，留三呼，灸三壯。刺之多見血，使人____。」空格應填？","options":[["A","喑不能言"],["B","立飢欲食"],["C","少腹滿"],["D","目盲不見"]],"answer":"B","difficulty":"高","explanation":"原文為「刺之多見血，使人立飢欲食」；卷五刺禁亦言「然谷刺無多見血」，《針灸大成》則作「不宜見血，令人立飢欲食」。然谷為腎經滎穴（屬火），位於足舟骨粗隆下方赤白肉際。「刺少腹中膀胱，溺出，令人少腹滿」、「刺舌下中脈太過……為喑」是其他刺禁條文。","source":"《針灸甲乙經》卷三‧足少陰及股並陰蹺陰維凡二十穴第三十二；卷五‧針灸禁忌","id":"D3-030","h":"bf156db39a"},{"day":3,"date":"2026-10-10","number":31,"topic":"Day3｜原絡配穴：膀胱經病（刺灸心法要訣）","group":"原絡配穴","qtype":"經典","stem":"《刺灸心法要訣‧十二經表裡原絡總歌》主張「先主後客並刺之。主者原穴也，客者絡穴也」。若為足太陽膀胱經病，依此法應取？","options":[["A","太谿（主）＋飛揚（客）"],["B","京骨（主）＋飛揚（客）"],["C","京骨（主）＋大鐘（客）"],["D","委中（主）＋大鐘（客）"]],"answer":"C","difficulty":"中","explanation":"歌訣：「腎原太谿膀飛陽，膀腎京骨大鐘班。」注文：「足太陽膀胱經病，可刺本經表之原穴，即京骨穴也，復刺腎經里之絡穴，即大鐘穴也。」也就是取病經的原穴為主，配表裡經的絡穴為客。腎經病則反過來取太谿＋飛揚。同經的原穴與絡穴並用（如京骨＋飛揚）不是主客原絡配穴。","source":"《刺灸心法要訣》卷一‧十二經表裡原絡總歌","id":"D3-031","h":"a83686871b"},{"day":3,"date":"2026-10-10","number":32,"topic":"Day3｜原絡主治歌：腎經","group":"原絡主治歌","qtype":"經典填空","stem":"《刺灸心法要訣》：「____原絡應刺病，大小腹痛大便難，臍下氣逆脊背痛，唾血渴熱兩足寒。」此歌所指應刺的主客原絡穴為？","options":[["A","太谿＋大鐘"],["B","太谿＋飛揚"],["C","京骨＋大鐘"],["D","神門＋支正"]],"answer":"B","difficulty":"高","explanation":"這是〈腎經表裡原絡穴主治歌〉，注文：「腎經里之原穴太谿，膀胱表之絡穴飛揚，二穴應刺之證即：大腹、少腹、脊背疼痛，大便結燥，臍下氣逆上衝，口渴吐血，兩足寒冷。」京骨＋大鐘是膀胱經病；神門＋支正是心經病（「心原神門小支正」）；太谿與大鐘同屬腎經，不是表裡主客配穴。","source":"《刺灸心法要訣》卷一‧十二經表裡原絡總歌／腎經表裡原絡穴主治歌","id":"D3-032","h":"a85efbf0f7"},{"day":3,"date":"2026-10-10","number":33,"topic":"Day3｜郄穴：十二經郄穴總表","group":"郄穴","qtype":"非題","stem":"下列十二經郄穴的配對，何者錯誤？","options":[["A","手少陽三焦經：會宗"],["B","足少陰腎經：水泉"],["C","足太陽膀胱經：金門"],["D","足厥陰肝經：中都"],["E","足少陽膽經：陽交"]],"answer":"E","difficulty":"易","explanation":"膽經郄穴為外丘；陽交雖也在外踝上7寸、同屬膽經，但它是陽維脈郄穴（外丘在前、陽交在後）。十二經郄穴：肺孔最、大腸溫溜、胃梁丘、脾地機、心陰郄、小腸養老、膀胱金門、腎水泉、心包郄門、三焦會宗、膽外丘、肝中都；加奇經四郄（陽蹻跗陽、陰蹻交信、陽維陽交、陰維築賓）共十六郄。","source":"本資料庫腧穴表（郄穴標註）；notes：易混淆考點對照表","id":"D3-033","h":"450f85a2f7"},{"day":3,"date":"2026-10-10","number":34,"topic":"Day3｜郄穴：奇經四郄所屬經脈","group":"郄穴","qtype":"概念","stem":"奇經八脈中有四條脈有郄穴，但這四個郄穴都寄於十二正經上。下列哪一組是「位於足少陰腎經」上的奇經郄穴？","options":[["A","交信（陰蹻脈郄）＋跗陽（陽蹻脈郄）"],["B","交信（陰蹻脈郄）＋築賓（陰維脈郄）"],["C","跗陽（陽蹻脈郄）＋陽交（陽維脈郄）"],["D","築賓（陰維脈郄）＋陽交（陽維脈郄）"]],"answer":"B","difficulty":"高","explanation":"交信在太谿直上2寸、復溜前0.5寸，為陰蹻脈郄穴；築賓在太谿上5寸、腓腸肌肌腹內下方，為陰維脈郄穴，兩穴都在腎經。跗陽在崑崙直上3寸，屬膀胱經，為陽蹻脈郄穴；陽交在外踝上7寸，屬膽經，為陽維脈郄穴。另注意梁丘是胃經郄穴，與奇經無關。","source":"本資料庫腧穴表（KI8、KI9、BL59、GB35）；《針灸甲乙經》卷三‧第三十二、第三十五","id":"D3-034","h":"462c229a23"},{"day":3,"date":"2026-10-10","number":35,"topic":"Day3｜俞募配穴：膀胱病","group":"俞募配穴","qtype":"臨床情境","stem":"58歲女性反覆頻尿、小腹脹墜，尿液檢查無感染與血尿，泌尿科評估為膀胱過動症。若採俞募配穴法，下列何組最正確？","options":[["A","膀胱俞＋關元"],["B","三焦俞＋石門"],["C","小腸俞＋中極"],["D","膀胱俞＋中極"]],"answer":"D","difficulty":"易","explanation":"俞募配穴是取同一臟腑的背俞穴與募穴：膀胱之背俞為膀胱俞（平第2骶後孔、旁開1.5寸），膀胱之募穴為中極（臍下4寸）。關元是小腸募穴、石門是三焦募穴；小腸俞配關元、三焦俞配石門才是同一腑的俞募配穴。","source":"本資料庫腧穴表（BL28、CV3、CV4、CV5）；notes：特定穴總論","id":"D3-035","h":"17a98cd0f4"},{"day":3,"date":"2026-10-10","number":36,"topic":"其他｜治療學實證：慢性穩定型心絞痛針刺","group":"治療學實證","qtype":"實證研究","stem":"Zhao L 等人2019年發表於《JAMA Internal Medicine》的多中心隨機臨床試驗（doi:10.1001/jamainternmed.2019.2407），探討針刺作為慢性穩定型心絞痛的輔助治療。下列敘述何者正確？","options":[["A","主要結果指標為運動心電圖ST段下降的時間"],["B","在常規抗心絞痛藥物治療之外，「疾病相關經脈」穴位針刺組於第16週心絞痛發作次數的減少，顯著優於非相關經脈針刺、假針刺與候補名單組"],["C","「疾病相關經脈」與「非相關經脈」兩組的療效沒有差異，顯示穴位選擇不重要"],["D","針刺組停用所有抗心絞痛藥物，以針刺單獨治療"]],"answer":"B","difficulty":"中","explanation":"本試驗於中國5個中心納入404位35–80歲、每週至少發作2次的慢性穩定型心絞痛患者（ITT分析398人），四組皆接受指引建議的抗心絞痛藥物：疾病相關經脈（DAM）針刺、非相關經脈（NAM）針刺、假針刺、候補名單；針刺組每週3次、共4週12次。主要結果為基線至第16週每4週心絞痛發作次數的變化，DAM組比NAM組多減少4.07次、比假針刺多減少5.18次、比候補名單多減少5.63次（皆P\u003c.001）。結論是作為輔助治療有益，並非取代藥物。","source":"Zhao L, Li D, Zheng H, et al. JAMA Intern Med. 2019;179(10):1388-1397. doi:10.1001/jamainternmed.2019.2407（PMID: 31355870，PubMed 查證）","id":"D3-036","h":"94b2ce88a0"},{"day":3,"date":"2026-10-10","number":37,"topic":"其他｜治療學實證：慢性下背痛 GERAC 試驗","group":"治療學實證","qtype":"實證研究","stem":"關於 Haake M 等人2007年發表於《Archives of Internal Medicine》的德國針刺試驗 GERAC 慢性下背痛研究（doi:10.1001/archinte.167.17.1892），下列敘述何者錯誤？","options":[["A","第6個月時真針刺組的反應率顯著高於假針刺組（P\u003c.001），證實穴位特異性"],["B","共納入1162位慢性下背痛患者，分為依中醫理論的真針刺、非穴位淺刺的假針刺、及藥物＋物理治療＋運動的常規治療三組"],["C","6個月反應率分別約為真針刺47.6%、假針刺44.2%、常規治療27.4%"],["D","真針刺與假針刺的療效都約為常規治療的兩倍"]],"answer":"A","difficulty":"高","explanation":"真針刺與假針刺的差異僅3.4%（95% CI −3.7%至10.3%，P=.39），未達統計顯著；兩者相對於常規治療則都顯著較佳（差20.2%與16.8%，P\u003c.001）。各組接受十次、每次30分鐘的治療。這類結果常被用來討論「針刺的非特異性效應」與假針刺對照設計的限制，臨床上仍可作為慢性下背痛的選項。","source":"Haake M, Müller HH, Schade-Brittinger C, et al. Arch Intern Med. 2007;167(17):1892-1898. doi:10.1001/archinte.167.17.1892（PMID: 17893311，PubMed 查證）","id":"D3-037","h":"79db261d27"},{"day":3,"date":"2026-10-10","number":38,"topic":"其他｜針刺異常：暈針處理與預防","group":"針刺異常","qtype":"臨床情境","stem":"22歲女大學生第一次接受針灸，未吃早餐，坐位針刺合谷、足三里數分鐘後，突然頭暈目眩、面色蒼白、冒冷汗、噁心欲吐。關於處置與預防，下列何者正確？","options":[["A","立即停止針刺並起出全部針具，使患者平臥、頭低足高、鬆解衣帶並保暖"],["B","意識清楚者可飲溫糖水；較重者可指掐或針刺水溝、內關，並可灸百會"],["C","初診、體弱、飢餓或過度緊張者宜採臥位治療，手法宜輕"],["D","以上皆是"]],"answer":"D","difficulty":"易","explanation":"這是典型的暈針。處理：停針、起出所有針具，平臥頭低足高、保暖，輕者飲溫糖水即可恢復；重者可指掐或針刺水溝、素髎、內關、足三里，灸百會、關元、氣海；若仍昏迷不醒、呼吸心跳異常，應立即急救並送醫。預防：初診、空腹、疲勞或緊張者先說明、改採臥位、選穴少、手法輕。三項皆正確。","source":"notes：針刺異常情況處理（暈針）","id":"D3-038","h":"39b926c1b6"},{"day":3,"date":"2026-10-10","number":39,"topic":"其他｜針刺異常：斷針處理","group":"針刺異常","qtype":"臨床情境","stem":"醫師為患者針刺大腿穴位時，患者突然因咳嗽劇烈收縮肌肉，起針時發現針身折斷，殘端與皮膚表面約略相平、尚可看見。下列處置何者最適當？","options":[["A","請患者用力屈伸患肢，使殘端隨肌肉收縮自行退出"],["B","在斷針旁再刺一針以放鬆肌肉，等殘端自行浮出"],["C","囑患者保持原體位勿動，以手指在針孔兩旁下壓皮膚使殘端露出，再用鑷子夾出；若完全沒入則須外科處理"],["D","在斷針處熱敷並用力按揉，促使殘端隨組織排出"]],"answer":"C","difficulty":"中","explanation":"斷針時最重要的是讓患者保持原體位，避免肌肉收縮使殘端更深入。殘端露出皮外者直接用鑷子取出；與皮膚相平者，輕壓針孔周圍讓殘端露出後夾出；完全沒入皮下者，須以X光定位後外科手術取出。「旁刺一針」是處理滯針的方法。預防重點是檢查針具、針身勿全部刺入（留部分在體外）。","source":"notes：針刺異常情況處理（斷針、滯針）","id":"D3-039","h":"0631d922fd"},{"day":3,"date":"2026-10-10","number":40,"topic":"其他｜複式手法：燒山火與透天涼","group":"複式手法","qtype":"概念","stem":"關於燒山火與透天涼的操作，下列何者正確？","options":[["A","燒山火用六陰數，透天涼用九陽數"],["B","燒山火主治熱痺、骨蒸潮熱；透天涼主治冷痺頑麻、虛寒證"],["C","燒山火先深後淺、緊提慢按；透天涼先淺後深、緊按慢提"],["D","燒山火先淺後深、緊按慢提，用九陽數；透天涼先深後淺、緊提慢按，用六陰數"]],"answer":"D","difficulty":"中","explanation":"《金針賦》：「一曰燒山火，治頑麻冷痺，先淺後深，凡九陽而三進三退，慢提緊按，熱至緊閉插針」；「二曰透天涼，治肌熱骨蒸，先深後淺，用六陰而三出三入，緊提慢按，徐徐舉針」。現代教材多把燒山火描述為天、人、地三部逐層緊按慢提、「三進一退」，透天涼為逐層緊提慢按、「一進三退」，可配合呼吸補瀉。燒山火治冷痺頑麻、虛寒證；透天涼治熱痺、肌熱骨蒸。","source":"notes：複式補瀉手法；《針灸大成》卷四‧金針賦","id":"D3-040","h":"3d9798dd09"},{"day":3,"date":"2026-10-10","number":41,"topic":"其他｜刺法：靈樞官鍼五刺","group":"刺法","qtype":"經典填空","stem":"《靈樞‧官鍼》：「凡刺有五，以應五藏……____者，左右前後鍼之，中脈為故，以取經絡之血者，此心之應也。」空格所指刺法為？","options":[["A","關刺"],["B","半刺"],["C","豹文刺"],["D","合谷刺"]],"answer":"C","difficulty":"中","explanation":"五刺應五臟：半刺「淺內而疾發鍼，無鍼傷肉，如拔毛狀，以取皮氣，此肺之應也」；豹文刺「左右前後鍼之，中脈為故，以取經絡之血者，此心之應也」；關刺「直刺左右，盡筋上，以取筋痹，慎無出血，此肝之應也」；合谷刺「左右雞足，鍼於分肉之間，以取肌痹，此脾之應也」；輸刺「直入直出，深內之至骨，以取骨痹，此腎之應也」。","source":"《靈樞經》卷二‧官鍼第七","id":"D3-041","h":"f5d6b67800"},{"day":3,"date":"2026-10-10","number":42,"topic":"其他｜特殊針法：腕踝針","group":"特殊針法","qtype":"概念","stem":"關於張心曙創立的腕踝針，下列何者正確？","options":[["A","上1區位於拇指側橈骨緣前方，上6區位於拇指側橈骨緣後方"],["B","進針後應反覆提插，以求得明顯的酸麻脹痛感為有效"],["C","針刺方向一律朝向肢體遠端，不論病位在何處"],["D","腕部進針點約在腕橫紋上2寸（2橫指）環腕一周，踝部約在內外踝最高點上3寸（3橫指）環踝一周；病在橫膈以上取上區，以下取下區"]],"answer":"D","difficulty":"高","explanation":"腕踝針將體表縱分為6區，腕部取上1–上6、踝部取下1–下6；上1在小指側尺骨緣前方，上6在小指側尺骨緣後方；下1在跟腱內緣，下6在跟腱外緣。病在橫膈以上取上、以下取下；左病取左、右病取右，中線病兩側同取。操作是30°進針後沿皮下淺層平刺約1.4寸，針尖朝向病位方向，要求「無酸麻脹痛」，若出現針感代表過深，應調淺。","source":"notes：眼針、腹針、腕踝針、手足針","id":"D3-042","h":"8514e8d869"},{"day":3,"date":"2026-10-10","number":43,"topic":"其他｜特殊針法：國際標準頭針（中風偏癱）","group":"特殊針法","qtype":"臨床情境","stem":"68歲男性，腦梗塞後3個月，病情穩定，遺留右上肢無力為主的偏癱，下肢肌力尚可。若依國際標準頭針（WHO 1991）治療，下列主要刺激線何者最恰當？","options":[["A","左側頂顳前斜線（前神聰至懸釐）的中2/5"],["B","右側頂顳前斜線的中2/5"],["C","左側顳前線（頷厭至懸釐）"],["D","左側頂顳後斜線（百會至曲鬢）的上1/5"]],"answer":"A","difficulty":"高","explanation":"頂顳前斜線相當於焦氏頭針運動區，上1/5治對側下肢與軀幹、中2/5治對側上肢、下2/5治對側頭面（中樞性面癱、運動性失語）。右上肢癱瘓屬左側大腦病變，故取左側頂顳前斜線中2/5。頂顳後斜線相當於感覺區。頭針以15–30°快速刺入帽狀腱膜下層再平刺，可配合快速捻轉或電針，並邊留針邊活動患肢；急性腦中風發作初期應先送醫，不能以頭針替代急救。","source":"notes：頭針（頭皮針）；notes：易混淆考點對照表","id":"D3-043","h":"1bd717f8b9"},{"day":3,"date":"2026-10-10","number":44,"topic":"其他｜特殊針法：三稜針","group":"特殊針法","qtype":"非題","stem":"關於三稜針刺絡放血，下列何者錯誤？","options":[["A","三稜針源自九鍼中的「鑱鍼」"],["B","理論依據包括「菀陳則除之」「血實宜決之」"],["C","點刺法常用於井穴、十宣、耳尖等部位"],["D","散刺法（豹紋刺）可用於局部瘀腫、頑癬"]],"answer":"A","difficulty":"易","explanation":"三稜針源自九鍼中的「鋒鍼」，《靈樞‧九鍼十二原》：「鋒鍼者，刃三隅以發痼疾」；〈官鍼〉又說「病在經絡痼痹者，取以鋒鍼」。鑱鍼「頭大末銳，去寫陽氣」，用於皮膚淺表。三稜針刺法有點刺、散刺、刺絡、挑刺；體弱、貧血、低血壓、孕婦、凝血障礙者，以及大動脈附近應禁用或慎用。","source":"《靈樞經》卷一‧九鍼十二原第一；卷二‧官鍼第七；notes：三稜針、皮膚針、皮內針","id":"D3-044","h":"b504531935"},{"day":3,"date":"2026-10-10","number":45,"topic":"其他｜特殊針法：穴位埋線術後反應","group":"特殊針法","qtype":"臨床情境","stem":"40歲女性接受腹部穴位埋線（可吸收線）後第二天回診，主訴埋線處輕微紅腫、微熱、壓痛，體溫37.6°C，無流膿、無擴大的紅斑。下列處置何者最適當？","options":[["A","立即切開皮膚取出所有埋線，以防敗血症"],["B","多屬可吸收線引起的無菌性炎症反應，數日內可自行消退，宜衛教觀察；若紅腫持續加重、化膿或高燒，再按感染處理"],["C","表示埋線太淺，應在同一位置再補埋一次"],["D","判定為過敏性休克前兆，立即肌肉注射腎上腺素"]],"answer":"B","difficulty":"中","explanation":"穴位埋線後1–5天內局部輕度紅腫熱痛，或伴低熱數日，多屬正常的無菌性炎症反應。若紅腫範圍持續擴大、化膿、高燒，則屬感染，需清創或抗生素；個別患者對羊腸線過敏，則表現為搔癢、皮疹等。埋線深度以皮下脂肪與肌肉之間為宜，太淺容易排異。禁忌包括皮膚感染潰瘍、出血傾向、孕婦、糖尿病控制不良等。","source":"notes：火針、電針、穴位注射、穴位埋線","id":"D3-045","h":"1d5288bd98"},{"day":3,"date":"2026-10-10","number":46,"topic":"其他｜特殊針法：董氏奇穴倒馬針法","group":"特殊針法","qtype":"概念","stem":"董氏奇穴常將靈骨、大白兩穴併用，或在同一經或相鄰位置併排2–3針（如三重穴）以加強療效。這種針法稱為？","options":[["A","交叉取穴"],["B","倒馬針法"],["C","牽引針法"],["D","動氣針法"]],"answer":"B","difficulty":"易","explanation":"倒馬針法是在同一經或相鄰位置併排2–3針，以加強療效，靈骨與大白、三重穴都是典型例子。動氣針法是遠端進針後邊捻針邊讓患者活動患部或深呼吸；牽引針法是在患處兩端各取穴、互相呼應；交叉取穴指左病刺右、右病刺左。","source":"notes：董氏奇穴","id":"D3-046","h":"b8ef5cb07e"},{"day":3,"date":"2026-10-10","number":47,"topic":"其他｜特殊針法：火針","group":"特殊針法","qtype":"非題","stem":"關於火針，下列何者錯誤？","options":[["A","古稱燔針、焠刺，《靈樞‧官鍼》謂「焠刺者，刺燔鍼則取痹也」"],["B","術後24小時內宜保持針孔乾燥，避免搔抓"],["C","操作時將針燒至通紅白亮，迅速準確刺入並疾出"],["D","熱證及糖尿病患者最適合以火針「以熱引熱」，傷口癒合佳"]],"answer":"D","difficulty":"中","explanation":"火針適用於寒濕痺痛、癰疽瘰癧、痣疣、雞眼、頑癬等，但熱證一般不宜；糖尿病患者傷口不易癒合、容易感染，屬禁用或慎用。面部慎用，大血管、神經幹附近及孕婦亦不宜。《靈樞‧官鍼》九刺之一「焠刺者，刺燔鍼則取痹也」，〈經筋〉亦有「燔鍼劫刺」。","source":"《靈樞經》卷二‧官鍼第七；notes：火針、電針、穴位注射、穴位埋線","id":"D3-047","h":"e0cb67490b"},{"day":3,"date":"2026-10-10","number":48,"topic":"其他｜歌賦：標幽賦（魂門、魄戶）","group":"歌賦","qtype":"經典填空","stem":"《針灸大成‧標幽賦》：「筋攣骨痛而補____，體熱勞嗽而瀉____；頭風頭瘡，刺申脈與金門。」兩空格依序應填？","options":[["A","魄戶、魂門"],["B","魂門、魄戶"],["C","肝俞、肺俞"],["D","神堂、意舍"]],"answer":"B","difficulty":"高","explanation":"原文為「筋攣骨痛而補魂門，體熱勞嗽而瀉魄戶」。魂門在第9胸椎旁3寸，與肝俞同高，肝主筋，故補之治筋攣骨痛；魄戶在第3胸椎旁3寸，與肺俞同高，肺主氣、司咳嗽，故瀉之治體熱勞嗽。兩穴皆屬膀胱經第二側線，也呼應「肝藏魂、肺藏魄」。同段尚有「眼痒眼疼，瀉光明於地五」「瀉陰郄止盜汗」。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）；本資料庫腧穴表（BL42、BL47）","id":"D3-048","h":"47e78935a6"},{"day":3,"date":"2026-10-10","number":49,"topic":"其他｜歌賦：馬丹陽天星十二穴","group":"歌賦","qtype":"概念","stem":"下列何穴「不」屬於馬丹陽天星十二穴？","options":[["A","承山"],["B","腎俞"],["C","通里"],["D","崑崙"]],"answer":"B","difficulty":"易","explanation":"馬丹陽天星十二穴為三里、內庭、曲池、合谷、委中、承山、太衝、崑崙、環跳、陽陵泉、通里、列缺，其中膀胱經就有委中、承山、崑崙三穴，心經有通里，背俞穴都不在內。腎俞雖是腰痛常用穴（《通玄指要賦》「腎俞把腰疼而瀉盡」），但不屬於天星十二穴。","source":"notes：高頻歌賦考點；本資料庫腧穴表（馬丹陽天星十二穴標註）","id":"D3-049","h":"cf54ddd0aa"},{"day":3,"date":"2026-10-10","number":50,"topic":"其他｜特殊針法：電針波型","group":"特殊針法","qtype":"概念","stem":"35歲男性運動後小腿肌肉急性痙攣疼痛，欲以電針抑制感覺與運動神經、達到鎮痛及緩解肌肉痙攣的效果。下列波型何者最適合？","options":[["A","密波（高頻）"],["B","斷續波"],["C","鋸齒波"],["D","疏波（低頻）"]],"answer":"A","difficulty":"中","explanation":"密波（高頻，一般50–100 Hz）能降低神經應激功能，有鎮痛、鎮靜、緩解肌肉與血管痙攣的作用。疏波（低頻，2–5 Hz）會引起肌肉收縮，有興奮作用，用於痿證、肌肉韌帶損傷；斷續波節律性時斷時續，多用於痿證、癱瘓；鋸齒波可刺激膈神經作人工電呼吸；疏密波不易產生適應，多用於扭挫傷、關節炎、面癱。","source":"notes：火針、電針、穴位注射、穴位埋線（電針波型）","id":"D3-050","h":"1dd8074b69"},{"day":4,"date":"2026-10-11","number":1,"topic":"Day4｜心包經：天池定位與氣胸風險","group":"心包經","qtype":"概念","stem":"關於手厥陰心包經起始穴天池，下列敘述何者正確？","options":[["A","位於第4肋間隙、乳頭外1寸（前正中線旁開5寸），宜斜刺或平刺0.3–0.5寸，不可深刺以防氣胸；為手厥陰、足少陽之會"],["B","位於第4肋間隙、乳頭外2寸，為心包之募穴"],["C","位於第5肋間隙、乳頭外1寸，肌肉豐厚，可直刺1–1.5寸"],["D","位於上臂內側、腋前紋頭下2寸，肱二頭肌長短頭之間"]],"answer":"A","difficulty":"中","explanation":"天池（PC1）在第4肋間隙，乳頭外1寸、前正中線旁開5寸，深部為胸腔與肺，只宜斜刺或平刺0.3–0.5寸，深刺可致氣胸；女性須避開乳腺組織。《針灸甲乙經》載其「在乳後一寸，腋下三寸……手厥陰足少陽脈之會」。心包募穴是膻中；腋前紋頭下2寸、肱二頭肌長短頭之間的是天泉（PC2）。","source":"本資料庫腧穴表（PC1、PC2）；《針灸甲乙經》卷三","id":"D4-001","h":"315b90a39a"},{"day":4,"date":"2026-10-11","number":2,"topic":"Day4｜心包經：分寸歌（郄門、間使、內關）","group":"心包經","qtype":"經典填空","stem":"《刺灸心法要訣‧心包絡經分寸歌》：「曲澤屈肘陷中參，郄門去腕後____，間使腕後三寸然，內關去腕後二寸，大陵掌後橫紋間。」空格應填？","options":[["A","五寸"],["B","六寸"],["C","四寸"],["D","三寸半"]],"answer":"A","difficulty":"易","explanation":"原文為「郄門去腕後五寸」。心包經前臂諸穴都在掌長肌腱與橈側腕屈肌腱之間：郄門腕上5寸（郄穴）、間使腕上3寸（經穴）、內關腕上2寸（絡穴、八脈交會通陰維）、大陵在腕掌側橫紋中點（輸穴、原穴）。口訣「五三二零」。","source":"《刺灸心法要訣》卷四‧心包絡經分寸歌；本資料庫腧穴表（PC4–PC7）","id":"D4-002","h":"763786be29"},{"day":4,"date":"2026-10-11","number":3,"topic":"Day4｜心包經：五輸與特定穴","group":"心包經","qtype":"非題","stem":"關於手厥陰心包經的五輸穴與特定穴，下列何者錯誤？","options":[["A","中衝在中指末節尖端中央，為井穴（屬木），可點刺出血"],["B","勞宮在掌心第2、3掌骨間偏第3掌骨，握拳屈指時中指尖處，為滎穴（屬火）"],["C","大陵在腕掌側橫紋中點，為輸穴（屬土），也是心包經原穴"],["D","內關為心包經郄穴，善治急性心痛"]],"answer":"D","difficulty":"中","explanation":"心包經郄穴是郄門（腕上5寸）；內關是絡穴，別走手少陽，並為八脈交會穴通陰維脈。心包經五輸：井木中衝、滎火勞宮、輸土大陵、經金間使、合水曲澤，陰經以輸代原，故大陵兼原穴。急性心痛雖可取郄門、內關，但仍須先排除急性冠心症。","source":"本資料庫腧穴表（PC3–PC9）；《靈樞‧本輸》","id":"D4-003","h":"3c1a011d1b"},{"day":4,"date":"2026-10-11","number":4,"topic":"Day4｜心包經臨床：急性腦中風紅旗","group":"心包經臨床","qtype":"臨床情境","stem":"68歲男性，高血壓病史。家屬代訴約1小時前吃早餐時突然右側肢體無力、口角歪斜、說話含糊，目前意識尚清，血壓178/96 mmHg。家屬聽說「中風要先放血」，要求在中衝、十宣點刺。下列處置何者最適當？","options":[["A","屬中風脫證，重灸神闕、關元回陽固脫後返家觀察"],["B","取內關、勞宮行瀉法以醒神開竅，次日再安排頭部影像檢查"],["C","先在中衝、十宣點刺放血，並強刺激水溝，觀察半小時無改善再送醫"],["D","懷疑急性腦中風，立即撥打119送往能處理急性中風的醫院，記錄最後正常時間，以爭取血栓溶解或取栓的治療時機，不應先行針刺延誤"]],"answer":"D","difficulty":"中","explanation":"突發單側肢體無力、口角歪斜、言語不清（FAST徵象），且距發作僅約1小時，是急性腦中風紅旗，必須立即送醫；治療效果高度取決於時間，任何針灸處置都不能延誤送醫。傳統上中風閉證可取十二井穴、中衝點刺、水溝、勞宮開竅，脫證重灸關元、神闕，但這些只適用於已接受急診評估、病情穩定後的輔助或復健期。","source":"notes：針灸治療學（中風）；臨床轉介原則；本資料庫腧穴表（PC8、PC9）","id":"D4-004","h":"4ec683b27d"},{"day":4,"date":"2026-10-11","number":5,"topic":"Day4｜三焦經：前臂穴定位","group":"三焦經","qtype":"非題","stem":"下列手少陽三焦經前臂穴位的定位與屬性，何者錯誤？","options":[["A","會宗在腕背橫紋上3寸，支溝尺側、尺骨橈側緣，為郄穴"],["B","支溝在腕背橫紋上4寸，尺骨與橈骨之間，為三焦經郄穴"],["C","外關在腕背橫紋上2寸，尺骨與橈骨間隙中點，為絡穴"],["D","四瀆在肘尖（尺骨鷹嘴）下5寸，尺骨與橈骨之間"]],"answer":"B","difficulty":"中","explanation":"支溝在腕背橫紋上3寸，為三焦經經穴（屬火）；三焦經郄穴是同一水平、偏尺側的會宗。腕背橫紋上4寸的是三陽絡（古籍載禁針）。外關腕上2寸（絡穴，八脈交會通陽維），四瀆在肘尖下5寸。前臂內外對應：外關對內關、支溝對間使。","source":"本資料庫腧穴表（TE5–TE9）；《刺灸心法要訣》卷四‧三焦經分寸歌","id":"D4-005","h":"d60ab82bac"},{"day":4,"date":"2026-10-11","number":6,"topic":"Day4｜三焦經臨床：支溝治便秘脅痛","group":"三焦經臨床","qtype":"臨床情境","stem":"52歲女性，排便困難、3–4天一行，伴兩脅脹痛，情緒不佳時加重，噯氣頻作；舌苔薄白，脈弦。無血便、無體重減輕，去年大腸鏡檢查正常。下列遠端配穴何者最適當？","options":[["A","後谿配申脈"],["B","內關配公孫"],["C","外關配足臨泣"],["D","支溝配陽陵泉"]],"answer":"D","difficulty":"易","explanation":"支溝為三焦經經穴，能宣通三焦氣機，是治便秘（尤其氣秘）與脅肋痛的要穴；陽陵泉為膽經合穴、膽之下合穴，疏利肝膽，兩穴相配常用於脅痛與氣滯便秘，可再加天樞（大腸募）。外關配足臨泣主目外眥、耳後、頰頸肩病；內關配公孫主胃心胸；後谿配申脈主目內眥、頸項肩膊。若出現血便、體重減輕、排便習慣突然改變等警訊，應先安排大腸鏡。","source":"本資料庫腧穴表（TE6、GB34）；notes：針灸治療學（便秘、脅痛）","id":"D4-006","h":"e0b6b12a5c"},{"day":4,"date":"2026-10-11","number":7,"topic":"Day4｜三焦經：頭頸部穴","group":"三焦經","qtype":"非題","stem":"下列手少陽三焦經頭頸部穴位的敘述，何者錯誤？","options":[["A","翳風位於耳垂後方、乳突下端前方凹陷，為手、足少陽之會"],["B","絲竹空位於目外眥外側0.5寸、眶骨外緣凹陷"],["C","角孫在折耳郭向前、耳尖直上入髮際處，痄腮可用燈火灸"],["D","耳和髎在鬢髮後緣、平耳郭根前，針刺須避開顳淺動脈"]],"answer":"B","difficulty":"中","explanation":"絲竹空在眉梢凹陷處，宜平刺0.3–0.5寸；目外眥外側0.5寸、眶骨外緣凹陷是膽經的瞳子髎（手太陽、手足少陽之會）。三焦經止於眉梢絲竹空，膽經起於目外眥瞳子髎，兩經在此銜接。翳風、角孫、耳和髎的敘述皆正確。","source":"本資料庫腧穴表（TE17、TE20、TE22、TE23、GB1）","id":"D4-007","h":"349bd6b6a0"},{"day":4,"date":"2026-10-11","number":8,"topic":"Day4｜八脈交會：外關主治歌","group":"八脈交會","qtype":"經典填空","stem":"《刺灸心法要訣‧八脈交會八穴歌》中有一首主治歌：「肢節腫疼與膝冷，四肢不遂合頭風，背胯內外筋骨痛，頭項眉稜病不寧，手足熱麻夜盜汗，破傷跟腫目睛紅，傷寒自汗烘烘熱，惟有____針極靈。」空格應填？","options":[["A","足臨泣"],["B","外關"],["C","申脈"],["D","後谿"]],"answer":"B","difficulty":"易","explanation":"這是〈陽維外關穴主治歌〉。外關是手少陽三焦經絡穴，通陽維脈；陽維「維絡諸陽」，主表證、寒熱，所以歌中有頭風、肢節痛、自汗烘熱等。外關與足臨泣（通帶脈）相配，主目外眥、耳後、頰、頸、肩之病。後谿通督脈、申脈通陽蹻，主目內眥、頸項、肩膊。","source":"《刺灸心法要訣》卷一‧八脈交會八穴歌／陽維外關穴主治歌","id":"D4-008","h":"7ecd9ea6d5"},{"day":4,"date":"2026-10-11","number":9,"topic":"Day4｜膽經：外踝上三穴（分寸歌）","group":"膽經","qtype":"經典填空","stem":"《刺灸心法要訣‧膽經分寸歌》：「踝上五寸定____，踝上四寸____穴，踝上三寸是____。」三個空格依序應填？","options":[["A","光明、懸鐘、陽輔"],["B","懸鐘、陽輔、光明"],["C","光明、陽輔、懸鐘"],["D","陽輔、光明、懸鐘"]],"answer":"C","difficulty":"易","explanation":"原文：「踝上五寸定光明，踝上四寸陽輔穴，踝上三寸是懸鐘。」三穴都在腓骨前緣：光明（外踝尖上5寸，絡穴，別走厥陰，善治眼疾）、陽輔（上4寸，經穴屬火）、懸鐘（上3寸，又名絕骨，八會穴之髓會）。再往上至外踝上7寸，腓骨前緣為外丘（膽經郄穴）、後緣為陽交（陽維郄穴）。","source":"《刺灸心法要訣》卷四‧膽經分寸歌；本資料庫腧穴表（GB35–GB39）","id":"D4-009","h":"21c8027491"},{"day":4,"date":"2026-10-11","number":10,"topic":"Day4｜膽經：懸鐘（甲乙經）與髓會","group":"膽經","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「____，在足外踝上三寸動者脈中，足三陽絡，按之陽明脈絕乃取之，刺入六分，留七呼，灸五壯。」此穴名稱及其八會穴屬性為？","options":[["A","懸鐘；髓會"],["B","懸鐘；骨會"],["C","陽輔；骨會"],["D","光明；筋會"]],"answer":"A","difficulty":"中","explanation":"外踝上3寸、「足三陽絡」者為懸鐘（又名絕骨）。《針灸大成‧標幽賦》注引八會：「骨會大杼，髓會絕骨。」腎主骨生髓，懸鐘常用於髓海不足、下肢痿痹、頸項強痛。陽輔在外踝上4寸（經穴），光明在外踝上5寸（絡穴）；筋會是陽陵泉，骨會是大杼。","source":"《針灸甲乙經》卷三；《針灸大成》卷二‧標幽賦（楊繼洲注）；本資料庫腧穴表（GB39）","id":"D4-010","h":"a712e363c0"},{"day":4,"date":"2026-10-11","number":11,"topic":"Day4｜頸項部腧穴：延髓與肺尖安全","group":"頸項部腧穴","qtype":"非題","stem":"頸項部數個腧穴的深部有延髓或肺尖，針刺方向須特別注意。下列刺法何者錯誤？","options":[["A","風府：伏案正坐、頭微前傾，向下頜方向緩慢刺入0.5–1寸"],["B","啞門：令患者仰頭，針尖朝上、向枕骨大孔方向深刺1.5寸以加強開竅"],["C","風池：針尖微向下，朝鼻尖方向斜刺0.8–1.2寸"],["D","肩井：直刺0.5–0.8寸，不可深刺，孕婦禁針"]],"answer":"B","difficulty":"高","explanation":"啞門在第2頸椎棘突上際凹陷，後髮際正中直上0.5寸；應伏案正坐、頭微前傾，向下頜方向緩慢刺入0.5–1寸，絕不可向上斜刺或深刺，以免經枕骨大孔傷及延髓。風池深部亦為延髓，宜針尖微下、朝鼻尖方向；風府同樣不可向上深刺；肩井深部為肺尖，深刺可致氣胸。《甲乙經》並載喑門「不可灸，灸之令人喑」。","source":"本資料庫腧穴表（GV15、GV16、GB20、GB21）；《針灸甲乙經》卷三","id":"D4-011","h":"706995922e"},{"day":4,"date":"2026-10-11","number":12,"topic":"Day4｜膽經：頭部迂迴定位","group":"膽經","qtype":"非題","stem":"足少陽膽經在頭側部迂迴往返。下列膽經頭部穴位的定位，何者錯誤？","options":[["A","頭臨泣在瞳孔直上、入前髮際1.5寸"],["B","本神在前髮際上0.5寸、頭正中線旁開3寸"],["C","率谷在耳尖直上、入髮際1.5寸，為足太陽、足少陽之會"],["D","陽白在瞳孔直上、眉上1寸"]],"answer":"A","difficulty":"中","explanation":"頭臨泣在瞳孔直上、入前髮際0.5寸（足太陽、足少陽與陽維之會），其上依序為目窗（頭臨泣上1寸）、正營（上2.5寸）、承靈（上4寸）。率谷在耳尖直上入髮際1.5寸，是偏頭痛常用穴；陽白在眉上1寸，常用於面癱額紋消失；本神在神庭與頭維連線內2/3與外1/3交點。","source":"本資料庫腧穴表（GB8、GB13–GB18）；《刺灸心法要訣》卷四‧膽經分寸歌","id":"D4-012","h":"eb40774458"},{"day":4,"date":"2026-10-11","number":13,"topic":"Day4｜膽經臨床：急性膽管炎紅旗","group":"膽經臨床","qtype":"臨床情境","stem":"50歲女性，體型肥胖，晚餐吃油炸食物後右上腹劇痛6小時，痛連右肩背，伴寒顫、發燒38.9°C，家屬發現眼白發黃；口苦、嘔吐，舌紅苔黃膩，脈弦滑數。下列處置何者最適當？","options":[["A","取膽俞、日月行俞募配穴並加灸，觀察三天"],["B","先於委中刺絡放血清熱，再開清熱利濕方"],["C","針膽囊穴、陽陵泉、日月行瀉法，痛止即可返家"],["D","腹痛、發燒合併黃疸，疑急性膽管炎（或膽囊炎合併膽道阻塞），應立即轉急診，不宜僅以針刺止痛"]],"answer":"D","difficulty":"中","explanation":"右上腹痛、發燒寒顫、黃疸是急性膽管炎的Charcot三聯徵，可能迅速惡化為敗血症，屬急症，須立即轉診作影像檢查與膽道引流。膽囊穴（陽陵泉直下約2寸壓痛處）、陽陵泉（膽之下合穴）、日月（膽募）與膽俞是膽腑病常用穴，但只能在西醫處置下作為輔助止痛。","source":"本資料庫腧穴表（GB24、GB34、EX-LE6）；臨床轉介原則","id":"D4-013","h":"9b4e2f73c2"},{"day":4,"date":"2026-10-11","number":14,"topic":"Day4｜募穴：脅肋部四募定位","group":"募穴","qtype":"非題","stem":"脅肋部有四個募穴，依肋骨定位，容易混淆。下列敘述何者錯誤？","options":[["A","章門在側腹部第11肋游離端下際，為脾之募穴，亦為臟會"],["B","京門在側腰部第12肋骨游離端下際，為腎之募穴"],["C","期門在乳頭直下、第6肋間隙、前正中線旁開4寸，為肝之募穴"],["D","日月在乳頭直下、第6肋間隙，為膽之募穴"]],"answer":"D","difficulty":"高","explanation":"日月在乳頭直下、第7肋間隙（期門下一肋），為膽募；第6肋間隙是期門（肝募）。章門在第11肋游離端下際（脾募、臟會，足厥陰與足少陽之會），京門在第12肋游離端下際（腎募，屬膽經）。記法：「肝六膽七，脾十一腎十二」。古籍定位不同：《甲乙經》載日月「在期門下一寸五分」。","source":"本資料庫腧穴表（LR13、LR14、GB24、GB25）；《針灸甲乙經》卷三","id":"D4-014","h":"12cf1d7b39"},{"day":4,"date":"2026-10-11","number":15,"topic":"Day4｜肝經：下肢穴與特定穴","group":"肝經","qtype":"非題","stem":"下列足厥陰肝經穴位的定位與特定穴屬性，何者錯誤？","options":[["A","曲泉在屈膝時膝內側橫紋頭上方凹陷，為合穴（屬水）"],["B","大敦在拇趾外側、趾甲角旁0.1寸，為井穴（屬木）"],["C","蠡溝在內踝尖上7寸、脛骨內側面中央，為肝經郄穴"],["D","太衝在足背第1、2蹠骨結合部前方凹陷，為輸穴兼原穴"]],"answer":"C","difficulty":"中","explanation":"蠡溝在內踝尖上5寸，為肝經絡穴（《靈樞‧經脈》「足厥陰之別，名曰蠡溝，去內踝五寸」）；內踝尖上7寸的是中都，為肝經郄穴。肝經五輸：井木大敦、滎火行間、輸土太衝（兼原穴）、經金中封、合水曲泉。肝經在內踝上8寸交出足太陰之後。","source":"本資料庫腧穴表（LR1–LR8）；《靈樞‧經脈》","id":"D4-015","h":"da2eb5e5c5"},{"day":4,"date":"2026-10-11","number":16,"topic":"Day4｜俞募配穴：肝氣鬱結脅痛","group":"俞募配穴","qtype":"臨床情境","stem":"42歲女性，右脅脹痛走竄兩個月，隨情緒起伏，胸悶善太息、噯氣；舌淡紅苔薄，脈弦。肝功能與腹部超音波皆正常。若採俞募配穴法，應取哪一組？","options":[["A","脾俞配章門"],["B","膈俞配膻中"],["C","肝俞配期門"],["D","膽俞配日月"]],"answer":"C","difficulty":"中","explanation":"本案為肝氣鬱結脅痛。俞募配穴是取同一臟腑的背俞穴與募穴：肝俞（第9胸椎棘突下旁開1.5寸）配期門（肝募）。膽俞配日月是膽腑的俞募配穴；脾俞配章門屬脾；膈俞（血會）配膻中（氣會）是八會穴相配，不是俞募配穴。臨床可再加太衝、支溝、陽陵泉疏肝理氣。","source":"本資料庫腧穴表（BL18、LR14）；notes：特定穴應用（俞募配穴）","id":"D4-016","h":"89bea6f32d"},{"day":4,"date":"2026-10-11","number":17,"topic":"Day4｜肝經：期門（甲乙經）交會","group":"肝經","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「期門，肝募也，在第二肋端，不容傍各一寸五分，上直兩乳，足太陰厥陰、____之會，舉臂取之，刺入四分，灸五壯。」空格應填？","options":[["A","衝脈"],["B","陰維"],["C","帶脈"],["D","陽維"]],"answer":"B","difficulty":"高","explanation":"原文為「足太陰厥陰、陰維之會」。陰維脈在腹部與足太陰交會於府舍、大橫、腹哀，在脅部交會於期門，再上至天突、廉泉。《甲乙經》「第二肋端」是自胸下肋骨往上數的古法描述，現行定位為乳頭直下、第6肋間隙，前正中線旁開4寸，不可深刺以免傷及內臟。","source":"《針灸甲乙經》卷三；本資料庫腧穴表（LR14）","id":"D4-017","h":"671b7a118a"},{"day":4,"date":"2026-10-11","number":18,"topic":"Day4｜任脈：臍上下尺寸","group":"任脈","qtype":"非題","stem":"下列任脈腹部穴位與臍的距離，何者錯誤？","options":[["A","氣海：臍中下1.5寸"],["B","中脘：臍中上4寸"],["C","建里：臍中上2寸"],["D","中極：臍中下4寸"]],"answer":"C","difficulty":"易","explanation":"建里在臍上3寸；臍上2寸是下脘。任脈臍下：陰交1寸、氣海1.5寸、石門2寸、關元3寸、中極4寸、曲骨在恥骨聯合上緣（臍下5寸）；臍上：水分1寸、下脘2寸、建里3寸、中脘4寸、上脘5寸、巨闕6寸。《刺灸心法要訣‧任脈分寸歌》：「臍上二寸下脘列，臍上三寸名建里，臍上四寸中脘許。」","source":"《刺灸心法要訣》卷四‧任脈分寸歌；本資料庫腧穴表（CV3–CV14）","id":"D4-018","h":"dbe6b890f3"},{"day":4,"date":"2026-10-11","number":19,"topic":"Day4｜任脈：神闕禁刺（甲乙經）","group":"任脈","qtype":"經典填空","stem":"《針灸甲乙經》卷三論任脈腹部穴：「臍中，禁不可刺，刺之令人____，遺矢者死不治。」空格應填？","options":[["A","逆息"],["B","喑"],["C","惡瘍"],["D","絕子"]],"answer":"C","difficulty":"中","explanation":"臍中即神闕。原文為「刺之令人惡瘍，遺矢者死不治」，所以神闕禁針，臨床多用隔鹽灸、隔薑灸治虛脫、泄瀉、腹痛。「灸之令人喑」屬啞門；「絕子」是石門（女子禁刺）的警語；「逆息」見於雲門深刺。《刺灸心法要訣‧禁針穴歌》也列「水分神闕並會陰」。","source":"《針灸甲乙經》卷三；《刺灸心法要訣》禁針穴歌；本資料庫腧穴表（CV8）","id":"D4-019","h":"905da88fcd"},{"day":4,"date":"2026-10-11","number":20,"topic":"Day4｜任脈：石門（禁針穴歌）與三焦募","group":"任脈","qtype":"經典填空","stem":"《刺灸心法要訣‧禁針穴歌》：「孕婦不宜針合谷，三陰交內亦通論，____針灸應須忌，女子終身無妊娠。」此穴位於臍下幾寸、為何臟腑之募？","options":[["A","中極；臍下4寸，膀胱之募"],["B","石門；臍下2寸，三焦之募"],["C","氣海；臍下1.5寸，肓之原"],["D","關元；臍下3寸，小腸之募"]],"answer":"B","difficulty":"中","explanation":"歌中所指為石門。《針灸甲乙經》亦載石門「三焦募也……在臍下二寸……女子禁不可刺，灸中央，不幸使人絕子」。關元（臍下3寸）為小腸募、中極（臍下4寸）為膀胱募，兩者都是任脈與足三陰之會；氣海（臍下1.5寸）為《靈樞‧九鍼十二原》所稱「肓之原」。","source":"《刺灸心法要訣》禁針穴歌；《針灸甲乙經》卷三；本資料庫腧穴表（CV4–CV6）","id":"D4-020","h":"71d1e3bd0d"},{"day":4,"date":"2026-10-11","number":21,"topic":"Day4｜任脈：胸腹部刺法安全","group":"任脈","qtype":"非題","stem":"下列任脈穴位的刺法與注意事項，何者錯誤？","options":[["A","巨闕：直刺0.3–0.6寸，不可深刺，以免傷及肝臟"],["B","鳩尾：斜向下刺0.5–1寸，不可深刺"],["C","急性尿瀦留、膀胱明顯充盈的患者，中極應直刺深刺2–3寸，以強刺激促進排尿"],["D","天突：先直刺0.2–0.3寸，再將針尖轉向下方，緊貼胸骨柄後緣刺入，不可向左右深刺"]],"answer":"C","difficulty":"高","explanation":"中極深部為膀胱，一般要求針前排空膀胱；尿瀦留、膀胱充盈時應淺刺或向下斜刺，避免刺破膀胱，深刺強刺激是錯誤做法，且急性尿瀦留須評估是否需導尿或轉診。鳩尾、巨闕深部接近肝臟與心臟，不可深刺；天突向左右深刺可能傷及鎖骨下動脈與肺尖，也要嚴防刺傷氣管。","source":"本資料庫腧穴表（CV3、CV14、CV15、CV22）","id":"D4-021","h":"7c928a6fb2"},{"day":4,"date":"2026-10-11","number":22,"topic":"Day4｜督脈：胸椎段定位","group":"督脈","qtype":"非題","stem":"下列督脈背部穴位與所在胸椎棘突下凹陷的對應，何者錯誤？","options":[["A","身柱：第3胸椎棘突下"],["B","中樞：第10胸椎棘突下"],["C","靈台：第6胸椎棘突下"],["D","至陽：第9胸椎棘突下"]],"answer":"D","difficulty":"易","explanation":"至陽在第7胸椎棘突下（約平肩胛下角），第9胸椎棘突下是筋縮。督脈胸段：陶道T1、身柱T3、神道T5、靈台T6、至陽T7、筋縮T9、中樞T10、脊中T11；腰段：懸樞L1、命門L2、腰陽關L4。可對照同水平的背俞：至陽平膈俞、筋縮平肝俞、身柱平肺俞。","source":"本資料庫腧穴表（GV6–GV13）","id":"D4-022","h":"ca5fdb39e4"},{"day":4,"date":"2026-10-11","number":23,"topic":"Day4｜督脈：分寸歌古法計椎","group":"督脈","qtype":"經典填空","stem":"《刺灸心法要訣‧督脈分寸歌》：「尾閭骨端是長強，二十一椎腰俞當，十六陽關十四命，三一懸樞脊中央。」古法自第1胸椎起向下計椎，歌中「十六（椎下）」的陽關與「十四（椎下）」的命門，相當於現代哪個位置？","options":[["A","腰陽關在第2腰椎棘突下；命門在第4腰椎棘突下"],["B","腰陽關在第5腰椎棘突下；命門在第3腰椎棘突下"],["C","腰陽關在第4腰椎棘突下；命門在第2腰椎棘突下"],["D","腰陽關在第16胸椎棘突下；命門在第14胸椎棘突下"]],"answer":"C","difficulty":"高","explanation":"古法「椎」由第1胸椎往下數，胸椎12節後接腰椎，故十四椎下＝第2腰椎、十六椎下＝第4腰椎，二十一椎＝骶管裂孔（腰俞）。注文：「十六椎下，陽關穴也。十四椎下，命門穴也。十三椎下，懸樞穴也。十一椎下，脊中穴也。」現行定位：命門L2（約平腎俞）、腰陽關L4（約平髂嵴最高點）。人體只有12節胸椎，所以不會有「第16胸椎」。","source":"《刺灸心法要訣》卷四‧督脈分寸歌及注；本資料庫腧穴表（GV2–GV6）","id":"D4-023","h":"cbd6acd4d2"},{"day":4,"date":"2026-10-11","number":24,"topic":"Day4｜督脈：百會（甲乙經）","group":"督脈","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「百會，一名____，在前頂後一寸五分，頂中央旋毛中，陷可容指，督脈、足太陽之會，刺入三分，灸三壯。」空格應填？","options":[["A","三陽五會"],["B","三陰五會"],["C","五處"],["D","三陽絡"]],"answer":"A","difficulty":"易","explanation":"百會一名三陽五會，在前髮際正中直上5寸，約兩耳尖連線中點。《甲乙經》記為督脈與足太陽之會，後世另有手足三陽與督脈之會一說。三陽絡是三焦經穴（腕背橫紋上4寸）；五處是膀胱經頭部穴。百會常用於升陽舉陷（脫肛、子宮脫垂多用灸）與安神醒腦。","source":"《針灸甲乙經》卷三；本資料庫腧穴表（GV20）","id":"D4-024","h":"8c44959714"},{"day":4,"date":"2026-10-11","number":25,"topic":"Day4｜督脈臨床：大椎退熱與腦膜炎紅旗","group":"督脈臨床","qtype":"臨床情境","stem":"19歲男大學生住宿舍，高燒39.6°C一天，劇烈頭痛、噴射性嘔吐、畏光，頸部僵硬、屈頸困難，下肢出現壓之不褪色的紫紅色瘀點。室友希望你在大椎刺絡拔罐退熱。下列處置何者最適當？","options":[["A","大椎刺絡拔罐，配曲池、合谷瀉法退熱，觀察一晚"],["B","十宣點刺放血，熱退即可回宿舍休息"],["C","針風池、風府祛風止痛，並囑多喝水"],["D","疑細菌性腦膜炎（如腦膜炎雙球菌感染），應立即送急診，不可以針灸退熱延誤抗生素治療"]],"answer":"D","difficulty":"中","explanation":"大椎為手足三陽與督脈之會（《甲乙經》：「三陽督脈之會」），是退熱要穴，常配曲池、合谷，或刺絡拔罐。但高燒合併劇烈頭痛、頸部僵硬、畏光、噴射性嘔吐與出血性瘀點，是細菌性腦膜炎（甚至腦膜炎雙球菌敗血症）的紅旗，進展極快，必須立即送急診給予抗生素；密切接觸者也需評估預防性投藥。","source":"本資料庫腧穴表（GV14）；《針灸甲乙經》卷三；臨床轉介原則","id":"D4-025","h":"c65d0c61a2"},{"day":4,"date":"2026-10-11","number":26,"topic":"Day4｜奇穴：背部奇穴定位","group":"奇穴","qtype":"非題","stem":"下列背腰部經外奇穴的定位，何者錯誤？","options":[["A","胃脘下俞：第8胸椎棘突下，後正中線旁開1.5寸"],["B","夾脊：第1胸椎至第5腰椎棘突下兩側，後正中線旁開0.5寸，每側17穴"],["C","腰眼：第4腰椎棘突下，後正中線旁開1.5寸"],["D","定喘：第7頸椎棘突下，後正中線旁開0.5寸"]],"answer":"C","difficulty":"中","explanation":"腰眼在第4腰椎棘突下、旁開約3.5寸凹陷；第4腰椎棘突下旁開1.5寸是膀胱經的大腸俞。定喘在大椎旁0.5寸，主哮喘咳嗽；夾脊每側17穴（胸12＋腰5），常用於脊柱及相應臟腑病；胃脘下俞在第8胸椎下旁開1.5寸（第8胸椎無背俞），又稱胰俞，常用於消渴。","source":"本資料庫腧穴表（EX-B1–EX-B7、BL25）","id":"D4-026","h":"3da32c0f4e"},{"day":4,"date":"2026-10-11","number":27,"topic":"Day4｜奇穴：定位與主治配對","group":"奇穴","qtype":"非題","stem":"下列經外奇穴的定位與主治配對，何者錯誤？","options":[["A","闌尾穴：陽陵泉直下約2寸壓痛明顯處，主腸癰"],["B","腰痛點：手背第2、3及第4、5掌骨間，腕背橫紋與掌指關節中點，主急性腰扭傷"],["C","四縫：第2至5指掌面近端指間關節橫紋中央，點刺擠出黃白色黏液，主小兒疳積"],["D","十宣：十指尖端距指甲游離緣0.1寸，點刺出血，主高熱、昏迷"]],"answer":"A","difficulty":"易","explanation":"闌尾穴在足三里直下約2寸壓痛明顯處，主腸癰；陽陵泉直下約2寸的是膽囊穴，主膽腑病。兩穴都屬「壓痛點取穴」，急性腹痛時壓痛加劇可輔助判斷，但急性闌尾炎、膽囊炎仍須轉介外科。四縫、十宣、腰痛點的定位與主治都正確；腰痛點針刺時常邊捻轉邊囑患者活動腰部。","source":"本資料庫腧穴表（EX-LE6、EX-LE7、EX-UE7、EX-UE10、EX-UE11）","id":"D4-027","h":"99ba2a0c41"},{"day":4,"date":"2026-10-11","number":28,"topic":"Day4｜特定穴：十二募穴","group":"特定穴","qtype":"非題","stem":"下列臟腑與其募穴的配對，何者錯誤？","options":[["A","大腸之募：天樞"],["B","三焦之募：石門"],["C","小腸之募：關元"],["D","心包之募：巨闕"]],"answer":"D","difficulty":"中","explanation":"心包募穴是膻中，巨闕是心之募。十二募穴：肺中府、心巨闕、心包膻中、肝期門、膽日月、脾章門、胃中脘、腎京門、大腸天樞、小腸關元、三焦石門、膀胱中極。位於任脈上的有膻中、巨闕、中脘、石門、關元、中極（皆單穴），其餘六個為雙穴。","source":"本資料庫腧穴表；《針灸大成》卷二‧標幽賦注、卷九‧五臟募穴（聚英）","id":"D4-028","h":"5b7ea067d7"},{"day":4,"date":"2026-10-11","number":29,"topic":"Day4｜特定穴：八會穴（標幽賦注）","group":"特定穴","qtype":"經典填空","stem":"《針灸大成‧標幽賦》楊繼洲注：「八會者，血會膈俞，氣會膻中，脈會太淵，筋會陽陵泉，骨會____，髓會____，臟會章門，腑會中腕也。」兩空格依序應填？","options":[["A","大杼；懸樞"],["B","大杼；絕骨"],["C","絕骨；大杼"],["D","腎俞；絕骨"]],"answer":"B","difficulty":"中","explanation":"八會穴源自《難經》：骨會大杼（第1胸椎下旁開1.5寸）、髓會絕骨（懸鐘，外踝上3寸）。兩者常被對調，記法：「骨在上（大杼在背）、髓在下（絕骨在腿）」。其餘：血會膈俞、氣會膻中、脈會太淵、筋會陽陵泉、臟會章門、腑會中脘（原文作「中腕」）。","source":"《針灸大成》卷二‧標幽賦（楊繼洲注）；本資料庫腧穴表（BL11、GB39）","id":"D4-029","h":"bdbb80c038"},{"day":4,"date":"2026-10-11","number":30,"topic":"Day4｜特定穴：八脈交會穴配對","group":"特定穴","qtype":"非題","stem":"下列八脈交會穴與其所通奇經的配對，何者錯誤？","options":[["A","公孫：通衝脈"],["B","內關：通陰維脈"],["C","後谿：通督脈"],["D","足臨泣：通帶脈"],["E","列缺：通陰蹻脈"]],"answer":"E","difficulty":"易","explanation":"列缺通任脈，照海才通陰蹻脈。《刺灸心法要訣‧八脈交會八穴歌》：「公孫衝脈胃心胸，內關陰維下總同，臨泣膽經連帶脈，陽維目銳外關逢，後谿督脈內眥頸，申脈陽蹺絡亦通，列缺任脈行肺系，陰蹺照海膈喉嚨。」四組上下配對：公孫－內關、足臨泣－外關、後谿－申脈、列缺－照海。","source":"《刺灸心法要訣》卷一‧八脈交會八穴歌；本資料庫腧穴表","id":"D4-030","h":"1ea81895c5"},{"day":4,"date":"2026-10-11","number":31,"topic":"Day4｜八脈交會：照海主治歌（梅核氣）","group":"八脈交會","qtype":"臨床情境","stem":"38歲女性，近兩個月總覺得咽喉中有東西梗住，「咯之不出、咽之不下」，情緒緊張時加重，但進食吞嚥順暢、無體重減輕或聲音沙啞，耳鼻喉科內視鏡檢查正常。依《刺灸心法要訣》八脈交會穴主治歌「膈中不快梅核氣，格主____針有靈」，最適當的主客配穴為？","options":[["A","公孫配內關"],["B","足臨泣配外關"],["C","申脈配後谿"],["D","照海配列缺"]],"answer":"D","difficulty":"中","explanation":"〈陰蹺照海穴主治歌〉：「喉閉淋澀與胸腫……膈中不快梅核氣，格主照海針有靈。」照海通陰蹻，與通任脈的列缺相配，注文說兩經「會合系絡之處，在於肺系、咽喉、胸膈之間」。本案已排除器質性病變；若出現進行性吞嚥困難、體重減輕、聲音沙啞超過3週或頸部腫塊，應轉介耳鼻喉科或安排胃鏡。","source":"《刺灸心法要訣》卷一‧八脈交會八穴歌及陰蹺照海穴主治歌","id":"D4-031","h":"a2b9cbdec2"},{"day":4,"date":"2026-10-11","number":32,"topic":"Day4｜下合穴：邪氣藏府病形（膽病）","group":"下合穴","qtype":"經典填空","stem":"《靈樞‧邪氣藏府病形》論六腑病：「膽病者，善太息，口苦，嘔宿汁，心下澹澹，恐人將捕之，嗌中吤吤然，數唾，在足少陽之本末，亦視其脈之陷下者，灸之，其寒熱者，取____。」空格應填？","options":[["A","日月"],["B","丘墟"],["C","足臨泣"],["D","陽陵泉"]],"answer":"D","difficulty":"中","explanation":"原文為「其寒熱者，取陽陵泉」。同篇提出「滎俞治外經，合治內府」，六腑下合穴：「胃合於三里，大腸入合於巨虛上廉，小腸合入於巨虛下廉，三焦合入於委陽，膀胱合入於委中央，膽合入於陽陵泉。」陽陵泉同時是膽經合穴、筋會。丘墟是膽經原穴，日月是膽募，足臨泣是膽經輸穴。","source":"《靈樞‧邪氣藏府病形第四》","id":"D4-032","h":"494a282dbf"},{"day":4,"date":"2026-10-11","number":33,"topic":"Day4｜下合穴：邪氣藏府病形取穴法","group":"下合穴","qtype":"經典填空","stem":"《靈樞‧邪氣藏府病形》說明下合穴的取法：「取之三里者，低跗取之。巨虛者，舉足取之。委陽者，屈伸而索之。委中者，屈而取之。陽陵泉者，正豎膝予之齊，下至____之陽取之。」空格應填？","options":[["A","委陽"],["B","巨虛"],["C","三里"],["D","委中"]],"answer":"A","difficulty":"高","explanation":"原文：「陽陵泉者，正豎膝予之齊，下至委陽之陽取之。」意即端正豎膝、兩膝並齊，在委陽外側（陽側）的下方取之，即腓骨頭前下方。同段指出三里「低跗」（足背放低）、巨虛「舉足」、委陽「屈伸而索之」、委中「屈而取之」，都是配合下肢姿勢取下合穴的方法。","source":"《靈樞‧邪氣藏府病形第四》","id":"D4-033","h":"11655554f3"},{"day":4,"date":"2026-10-11","number":34,"topic":"Day4｜特定穴：六腑下合穴","group":"特定穴","qtype":"非題","stem":"下列六腑與其下合穴的配對，何者錯誤？","options":[["A","小腸：小海"],["B","大腸：上巨虛"],["C","三焦：委陽"],["D","膽：陽陵泉"]],"answer":"A","difficulty":"易","explanation":"小腸下合穴是下巨虛（犢鼻下9寸）；小海是手太陽小腸經本經合穴（在肘部尺神經溝），不是下合穴。六腑下合穴全部位於下肢足三陽經：胃足三里、大腸上巨虛、小腸下巨虛（足陽明），膀胱委中、三焦委陽（足太陽），膽陽陵泉（足少陽）。","source":"《靈樞‧邪氣藏府病形第四》；本資料庫腧穴表（ST36、ST37、ST39、BL39、BL40、GB34、SI8）","id":"D4-034","h":"e795a101e4"},{"day":4,"date":"2026-10-11","number":35,"topic":"Day4｜特定穴：重要交會穴","group":"特定穴","qtype":"概念","stem":"關於下列交會穴的敘述，何者正確？","options":[["A","三陰交為足太陰、足厥陰、足少陰之會"],["B","大椎為手足三陽與督脈之會"],["C","帶脈穴（GB26）為足少陽與帶脈之會"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"三陰交在內踝尖上3寸、脛骨內側緣後方，為足三陰之會，孕婦禁針；大椎在第7頸椎棘突下，《甲乙經》載「三陽督脈之會」，善退熱；帶脈穴在第11肋游離端垂線與臍水平線交點，《甲乙經》注引〈氣府論〉注為足少陽、帶脈之會，同屬此類的還有五樞、維道。三項皆正確。","source":"本資料庫腧穴表（SP6、GV14、GB26）；《針灸甲乙經》卷三","id":"D4-035","h":"02295af78a"},{"day":4,"date":"2026-10-11","number":36,"topic":"其他｜治療學實證：PC6刺激預防術後噁心嘔吐","group":"治療學實證","qtype":"實證研究","stem":"Lee A 等人2015年更新的 Cochrane 系統性回顧（doi:10.1002/14651858.CD003281.pub4，納入59篇隨機試驗、7667名受試者）評估刺激內關（PC6）預防術後噁心嘔吐（PONV）。下列結論何者正確？","options":[["A","與假刺激相比，PC6刺激對噁心與嘔吐均無效"],["B","PC6刺激常見嚴重不良反應，如正中神經損傷，故不建議使用"],["C","PC6刺激效果明顯優於 ondansetron 等止吐藥，證據品質高"],["D","與假刺激相比，PC6刺激可降低噁心、嘔吐及使用救援止吐藥的比率，但證據品質低；與止吐藥物相比則未見差異"]],"answer":"D","difficulty":"中","explanation":"該回顧顯示：與假刺激相比，PC6刺激降低噁心（RR 0.68）、嘔吐（RR 0.60）與救援止吐藥使用（RR 0.64），但因異質性大、研究限制，證據品質評為低；與六種止吐藥相比，噁心、嘔吐發生率無差異（中等品質）。副作用輕微、短暫（皮膚刺激、起水泡、發紅等）。內關為心包經絡穴、八脈交會穴通陰維，傳統主治嘔吐。","source":"Lee A, Chan SK, Fan LT. Cochrane Database Syst Rev. 2015;(11):CD003281. doi:10.1002/14651858.CD003281.pub4（PMID 26522652）","id":"D4-036","h":"f3fdc780cf"},{"day":4,"date":"2026-10-11","number":37,"topic":"其他｜靈樞衛氣：手心主之本","group":"靈樞衛氣","qtype":"經典填空","stem":"《靈樞‧衛氣》論十二經標本：「手心主之本，在掌後兩筋之間二寸中」，其標在腋下。此「本」的部位，相當於下列哪一個穴位？","options":[["A","內關"],["B","間使"],["C","大陵"],["D","郄門"]],"answer":"A","difficulty":"高","explanation":"「掌後兩筋之間二寸中」即腕掌側橫紋上2寸、掌長肌腱與橈側腕屈肌腱之間，正是內關；其「標」在腋下三寸處（《甲乙經》作「標在腋下三寸」，約當天池附近）。標本理論說明四肢的「本」與頭身的「標」上下呼應，可解釋內關能治胸脅心胸病。大陵在腕橫紋上，間使腕上3寸，郄門腕上5寸。（本題為 Day1 根結標本的間隔複習。）","source":"《靈樞‧衛氣第五十二》；《針灸甲乙經》卷二‧十二經標本；本資料庫腧穴表（PC4–PC7）","id":"D4-037","h":"45a5f77f51"},{"day":4,"date":"2026-10-11","number":38,"topic":"其他｜靈樞根結：足少陽根溜注入","group":"靈樞根結","qtype":"經典填空","stem":"《靈樞‧根結》論手足六陽經「根、溜、注、入」：「足少陽根於竅陰，溜於丘墟，注於____，入於天容光明也。」空格應填？","options":[["A","懸鐘"],["B","陽輔"],["C","陽陵泉"],["D","足臨泣"]],"answer":"B","difficulty":"高","explanation":"原文：「足少陽根於竅陰，溜於丘墟，注於陽輔，入於天容光明也。」根為井穴（足竅陰），溜多為原穴（丘墟），注多為經穴（陽輔），入則上在頸部、下在絡穴（光明）。同篇又有「少陽根於竅陰，結於窗籠，窗籠者，耳中也」。（本題為 Day1 根結標本的間隔複習。）","source":"《靈樞‧根結第五》","id":"D4-038","h":"5ddb8428f4"},{"day":4,"date":"2026-10-11","number":39,"topic":"其他｜靈樞衛氣：四氣街","group":"靈樞衛氣","qtype":"經典填空","stem":"《靈樞‧衛氣》：「胸氣有街，腹氣有街，頭氣有街，脛氣有街。故氣在頭者，止之於腦。氣在胸者，止之膺與背俞。氣在腹者，止之背俞，與衝脈於臍左右之動脈者。氣在脛者，止之於____，與承山踝上以下。」空格應填？","options":[["A","三陰交"],["B","委中"],["C","氣街"],["D","足三里"]],"answer":"C","difficulty":"高","explanation":"原文為「氣在脛者，止之於氣街，與承山踝上以下」。四氣街是經氣橫向匯聚通行的路徑，頭、胸、腹、脛各有其街，說明經氣除了縱向循行，還有局部橫向聯繫，可解釋前後配穴（如俞募）與上下配穴。篇中並要求取氣街時用毫鍼，先按壓穴處、待手下有應再刺。（本題為 Day1 氣街四海的間隔複習。）","source":"《靈樞‧衛氣第五十二》","id":"D4-039","h":"220552cd28"},{"day":4,"date":"2026-10-11","number":40,"topic":"其他｜原絡主客配穴：心包經病","group":"原絡主客配穴","qtype":"概念","stem":"《刺灸心法要訣‧十二經表裡原絡總歌》：「三焦陽池包內關，包原大陵焦外關。」若為手厥陰心包經病（心煩、掌中熱、胸脅支滿），依「先主後客」原絡配穴，應取？","options":[["A","大陵（主）＋內關（客）"],["B","大陵（主）＋外關（客）"],["C","內關（主）＋公孫（客）"],["D","陽池（主）＋內關（客）"]],"answer":"B","difficulty":"高","explanation":"原絡主客配穴取病經的原穴為主、表裡經的絡穴為客。心包經病取心包原穴大陵，配三焦經絡穴外關；反之三焦經病取陽池配內關。大陵配內關是同經原絡並用；內關配公孫是八脈交會穴的上下配穴，皆非主客原絡法。（本題為 Day3 原絡郄的間隔複習。）","source":"《刺灸心法要訣》卷一‧十二經表裡原絡總歌","id":"D4-040","h":"374890c2c2"},{"day":4,"date":"2026-10-11","number":41,"topic":"其他｜子母補瀉：肝膽經","group":"子母補瀉","qtype":"非題","stem":"依本經子母補瀉（虛則補其母，實則瀉其子），下列肝、膽經取穴何者錯誤？","options":[["A","膽經虛證：補陽陵泉"],["B","肝經實證：瀉行間"],["C","膽經實證：瀉陽輔"],["D","肝經虛證：補曲泉"]],"answer":"A","difficulty":"高","explanation":"肝、膽皆屬木，木之母為水、子為火。肝經（陰經）：滎火行間為子穴，合水曲泉為母穴；膽經（陽經）：經火陽輔為子穴，滎水俠谿為母穴，故膽經虛證應補俠谿。陽陵泉是膽經合土，非子母穴。（本題為 Day2 五輸與子母補瀉的間隔複習。）","source":"本資料庫腧穴表（LR2、LR8、GB34、GB38、GB43）；《針灸大成》卷七‧十二經病井榮俞經合補瀉虛實","id":"D4-041","h":"ac202d582c"},{"day":4,"date":"2026-10-11","number":42,"topic":"其他｜刺法：針刺角度","group":"刺法","qtype":"非題","stem":"關於毫針的針刺角度，下列何者錯誤？","options":[["A","頭皮部肌肉淺薄，宜直刺1寸以上，以求得氣"],["B","斜刺約45度，適用於肌肉較薄或深部有重要臟器處，如胸背部"],["C","直刺約90度，適用於肌肉豐厚處，如四肢、腹部"],["D","平刺（橫刺）約15度，適用於皮薄肉少處，如頭面部"]],"answer":"A","difficulty":"易","explanation":"頭皮部皮薄肉少、緊貼顱骨，應平刺0.5–0.8寸（如百會、率谷），不可直刺深刺。直刺用於肌肉豐厚處；斜刺用於胸背等深部有臟器處，以策安全；平刺用於頭面、胸骨等處，也用於透穴。","source":"本資料庫腧穴表（GV20、GB8）；notes：刺法灸法學（針刺角度與深度）","id":"D4-042","h":"d3e82d43eb"},{"day":4,"date":"2026-10-11","number":43,"topic":"其他｜灸法臨床：至陰灸矯正胎位","group":"灸法臨床","qtype":"臨床情境","stem":"31歲孕婦，懷孕33週，產檢超音波顯示臀位，胎盤位置正常、無妊娠高血壓或陰道出血，產科醫師同意嘗試傳統療法。下列處置何者最適當？","options":[["A","重灸神闕、關元各30分鐘溫補下元"],["B","以艾條溫和灸雙側至陰，每次約15–20分鐘、每日1–2次，並定期回產科以超音波追蹤胎位；若出現腹痛、陰道出血、破水或胎動減少，立即停止並就醫"],["C","至陰三稜針點刺放血，每日一次至轉位為止"],["D","深刺合谷、三陰交行強刺激瀉法，促使胎兒轉位"]],"answer":"B","difficulty":"中","explanation":"至陰為膀胱經井穴，艾灸矯正胎位是腧穴相對特異性的代表，多在妊娠中後期、排除前置胎盤、胎兒異常、多胞胎等禁忌後，由產科同意下進行，以溫和灸為主並定期追蹤。合谷、三陰交是孕婦禁針穴（《刺灸心法要訣‧禁針穴歌》：「孕婦不宜針合谷，三陰交內亦通論」），強刺激可能誘發子宮收縮；孕婦下腹部也不宜重灸或針刺。","source":"本資料庫腧穴表（BL67、SP6、LI4）；《刺灸心法要訣》禁針穴歌","id":"D4-043","h":"2b5051c993"},{"day":4,"date":"2026-10-11","number":44,"topic":"其他｜特殊針法：皮膚針（梅花針）","group":"特殊針法","qtype":"非題","stem":"關於皮膚針（梅花針、七星針）叩刺，下列何者錯誤？","options":[["A","局部皮膚潰瘍或創傷處，可重叩出血以祛瘀生新"],["B","重刺激以皮膚明顯發紅或微量出血為度，適用於肌肉豐厚處及實證"],["C","輕刺激以皮膚略見潮紅、不出血為度，適用於頭面部及老弱者"],["D","叩刺時針尖應垂直皮膚，運用腕力彈刺，立即彈起"]],"answer":"A","difficulty":"易","explanation":"皮膚針禁用於局部潰瘍、創傷、皮膚感染處，凝血功能障礙者亦不宜。操作要點：針具消毒、針尖平齊，垂直叩刺、借腕力彈刺，不可斜刺、拖刺；刺激強度依病情與部位分輕、中、重三級。叩刺部位可循經、取穴或局部叩刺。","source":"notes：特殊針法（皮膚針）（本資料庫筆記）","id":"D4-044","h":"cbb0554136"},{"day":4,"date":"2026-10-11","number":45,"topic":"其他｜特殊針法：穴位注射安全","group":"特殊針法","qtype":"非題","stem":"關於穴位注射（水針）療法，下列何者錯誤？","options":[["A","進針得氣後應先回抽，確認無回血再緩慢推注藥液"],["B","孕婦的下腹部、腰骶部及合谷、三陰交等穴不宜施行"],["C","為加強療效，藥液可直接注入關節腔或脊髓腔"],["D","須注意藥物的過敏反應與配伍禁忌，必要時先做皮膚試驗"]],"answer":"C","difficulty":"中","explanation":"一般穴位注射藥液不可注入關節腔、脊髓腔或血管內，否則可能引起關節紅腫疼痛、感染，甚至損傷脊髓。正確做法是得氣後回抽無血再推藥，並避開神經幹（若出現觸電感應退針改變方向）；藥物須注意有效期、過敏與配伍禁忌；孕婦下腹、腰骶及合谷、三陰交等穴不宜注射。","source":"notes：特殊針法（穴位注射）（本資料庫筆記）","id":"D4-045","h":"3f315dbe64"},{"day":4,"date":"2026-10-11","number":46,"topic":"其他｜特殊針法：皮內針（揿針）","group":"特殊針法","qtype":"概念","stem":"關於皮內針（含揿釘型皮內針）的應用，下列何者正確？","options":[["A","留置期間不可按壓，否則會失去療效"],["B","關節屈伸處活動多，最適合埋針以持續刺激"],["C","宜選不妨礙肢體活動的部位；天熱汗多時留置時間宜縮短，以免感染"],["D","埋針處若疼痛，應將針再壓深一些以加強得氣"]],"answer":"C","difficulty":"易","explanation":"皮內針是將特製小針固定於皮內或皮下長時間留置，以產生持續微弱刺激，常用於慢性疼痛、失眠等。應選擇不妨礙活動的部位，避開關節；留置期間可每日按壓數次以加強刺激；天熱出汗多時留置時間宜短。若埋針處疼痛或妨礙活動，應取出重埋或改換部位；局部紅腫發炎須立即取針。","source":"notes：特殊針法（皮內針）（本資料庫筆記）","id":"D4-046","h":"06adebe183"},{"day":4,"date":"2026-10-11","number":47,"topic":"其他｜治療學：落枕（外勞宮）","group":"治療學","qtype":"臨床情境","stem":"28歲上班族，今晨睡醒後頸部一側疼痛僵硬、轉頭受限，無外傷、無發燒，上肢無麻木無力，無劇烈頭痛。下列遠端取穴與操作何者最適當？","options":[["A","四縫點刺擠出黏液"],["B","針外勞宮（落枕穴），邊捻轉邊囑患者緩慢轉動頸部，再配合局部取穴"],["C","十宣點刺出血後囑頸部完全制動"],["D","二白直刺並留針30分鐘"]],"answer":"B","difficulty":"易","explanation":"外勞宮又名落枕穴，位於手背第2、3掌骨之間、掌指關節後0.5寸，是治落枕的經驗效穴；可配合「動氣」操作，邊行針邊讓患者活動頸部，再取風池、肩井、懸鐘、後谿等。四縫治疳積、二白治痔、十宣治高熱昏迷。若頸痛伴外傷、發燒、上肢神經症狀或劇烈頭痛，應先轉診排除頸椎骨折、感染或血管問題。","source":"本資料庫腧穴表（EX-UE8）；notes：針灸治療學（落枕）","id":"D4-047","h":"bc43fad162"},{"day":4,"date":"2026-10-11","number":48,"topic":"其他｜治療學：痛經與子宮外孕紅旗","group":"治療學","qtype":"臨床情境","stem":"26歲女性，平素有經期腹痛，常自行針灸。此次月經已延遲10天，今天突發右下腹劇痛，少量暗紅陰道出血，頭暈、冒冷汗，血壓92/58 mmHg、心跳112次/分。她要求「照舊針三陰交、地機、十七椎止痛」。下列處置何者最適當？","options":[["A","屬氣滯血瘀痛經，加針合谷、太衝行瀉法即可"],["B","懷疑子宮外孕破裂合併出血，應立即送急診驗孕及超音波檢查，暫停針灸"],["C","照舊針三陰交、地機、十七椎止痛，痛止後回家休息"],["D","重灸關元、神闕溫經止痛，觀察一晚"]],"answer":"B","difficulty":"中","explanation":"育齡女性月經延遲、突發單側下腹劇痛、陰道出血，加上低血壓、心搏過速，須高度懷疑子宮外孕破裂造成腹腔內出血，是危及生命的急症，應立即送醫。三陰交、地機（脾經郄穴）、十七椎是痛經常用穴，但三陰交、合谷屬孕婦禁針穴，在未排除懷孕前也不宜使用。","source":"本資料庫腧穴表（SP6、SP8、EX-B8）；臨床轉介原則","id":"D4-048","h":"3664eb7e27"},{"day":4,"date":"2026-10-11","number":49,"topic":"其他｜歌賦：回陽九針歌","group":"歌賦","qtype":"概念","stem":"《針灸大成‧回陽九針歌》所列九穴常用於急救回陽。下列何穴「不」在歌中？","options":[["A","水溝"],["B","環跳"],["C","啞門"],["D","勞宮"]],"answer":"A","difficulty":"高","explanation":"原文：「啞門勞宮三陰交，湧泉太谿中脘接，環跳三里合谷并，此是回陽九針穴。」九穴為啞門、勞宮、三陰交、湧泉、太谿、中脘、環跳、足三里、合谷。水溝雖是昏厥急救要穴（孫真人十三鬼穴之一），卻不在回陽九針中，這是常見的混淆點。其中啞門、勞宮、中脘、環跳都是本日 Day 4 經脈上的穴位。","source":"《針灸大成》卷三‧回陽九針歌；本資料庫腧穴表","id":"D4-049","h":"e48b23beb1"},{"day":4,"date":"2026-10-11","number":50,"topic":"其他｜針刺異常：彎針處理","group":"針刺異常","qtype":"概念","stem":"患者留針期間因改變姿勢，起針時發現針柄偏斜、針身彎曲，捻轉困難。下列處理何者正確？","options":[["A","用力捻轉使針身拉直後再迅速拔出"],["B","囑患者用力屈伸肢體，讓肌肉把針推出"],["C","先協助患者恢復原來的體位，再順著針身彎曲的方向緩慢退針，切忌強力拔出"],["D","在旁邊再刺一針，等針身自行恢復筆直"]],"answer":"C","difficulty":"易","explanation":"彎針多因進針過猛、體位改變或外力碰撞所致。處理：體位改變者先恢復原體位；輕度彎曲者順彎曲方向慢慢退出；彎曲角度大者配合針柄傾斜方向分段退針。強拔、捻轉可能造成斷針；「旁刺一針」是滯針的處理法。預防：體位舒適、留針期間勿任意變動姿勢、避免碰撞針柄。","source":"notes：刺法灸法學（針刺異常情況處理）（本資料庫筆記）","id":"D4-050","h":"28345ddde3"},{"day":5,"date":"2026-10-12","number":1,"topic":"Day5｜九鍼形制與用途","group":"九鍼形制與用途","qtype":"非題","stem":"依《靈樞‧九鍼十二原》對九鍼形制與用途的記載，下列何者錯誤？","options":[["A","「員利鍼者，大如氂，且員且銳，中身微大，以取暴氣」"],["B","「大鍼者，鋒如黍粟之銳，主按脈勿陷，以致其氣」"],["C","「鋒鍼者，刃三隅以發痼疾」"],["D","長鍼長七寸，「鋒利身薄，可以取遠痹」"]],"answer":"B","difficulty":"中","explanation":"「鋒如黍粟之銳，主按脈勿陷，以致其氣」說的是鍉鍼（長三寸半），不是大鍼。大鍼長四寸，「尖如挺，其鋒微員，以寫機關之水也」。另外：鋒鍼「刃三隅以發痼疾」，《刺灸心法要訣》說「鋒針即今三稜針」；員利鍼取暴氣（暴痹）；長鍼長七寸，取遠痹，《刺灸心法要訣》注說「長針即今環跳針也」；毫鍼長三寸六分，用來「取痛痹」。","source":"《靈樞‧九鍼十二原第一》；《刺灸心法要訣》卷一‧九針式圖並九針主治法歌","id":"D5-001","h":"bc17bec4a6"},{"day":5,"date":"2026-10-12","number":2,"topic":"Day5｜毫針結構與規格","group":"毫針結構與規格","qtype":"概念","stem":"關於現代毫針的結構與規格，下列何者正確？","options":[["A","針尾是指針身的前端，臨床上以針尾的長短決定刺入深度"],["B","毫針由針尖、針身、針根、針柄、針尾構成；針根是針身與針柄的交接處，最容易折斷，所以進針時不可把針身全部刺入"],["C","毫針粗細以「號」表示，號數越大針身越粗，所以28號比32號細"],["D","針柄是針身與針尖的交接處，為最尖銳、刺入皮膚的部分"]],"answer":"B","difficulty":"易","explanation":"毫針分五部分：針尖（尖端）、針身（尖與柄之間，刺入體內的部分）、針根（針身與針柄的交接處）、針柄（纏著金屬絲、供持針的部分）、針尾（針柄末端）。針根是最容易折斷的地方，所以要預防斷針，針身要留一部分在體外，不可刺到針根。粗細以「號」計，號數越大針越細（28號比32號粗）。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第四章第一節 製針法；針灸學 第五章 針灸器具）","id":"D5-002","h":"0fb5af09f6"},{"day":5,"date":"2026-10-12","number":3,"topic":"Day5｜練針次序","group":"練針次序","qtype":"概念","stem":"初學者練習毫針手法應循序漸進。下列練針順序何者最恰當？","options":[["A","相互試針→自身試針→棉團練習→紙墊練習"],["B","自身試針→紙墊練習→棉團練習→相互試針"],["C","棉團練習（練指力）→紙墊練習（練提插）→相互試針→自身試針"],["D","紙墊練習（練指力與捻轉）→棉團練習（練提插、捻轉的配合）→自身試針→相互試針"]],"answer":"D","difficulty":"易","explanation":"練針由易到難、由物到人：先用細繩紮緊的草紙墊練指力與捻轉；再用棉團練提插、捻轉的配合與各種手法；熟練之後才自身試針，親身體會針感、掌握深淺；最後才相互試針。持針的右手叫刺手，按壓穴位、協助進針的左手叫押手。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第四章第二節 練針的性情與方法；針灸科學 第二節 練針法）","id":"D5-003","h":"1bd7956716"},{"day":5,"date":"2026-10-12","number":4,"topic":"Day5｜押手：難經「信其左」","group":"押手","qtype":"經典填空","stem":"《針灸大成‧難經補瀉》引《難經》：「補瀉之法，非必呼吸出內針也。知為針者信其____，不知為針者信其____，當刺之時，先以左手壓按所針榮俞之處，彈而努之，爪而下之。」空格依序應填？","options":[["A","心；手"],["B","右；左"],["C","左；右"],["D","神；形"]],"answer":"C","difficulty":"易","explanation":"原文為「知為針者信其左，不知為針者信其右」，強調押手（左手）的重要：先用左手按壓、彈努、爪切穴位，等「其氣之來，如動脈之狀」再順針刺入。《標幽賦》也說「左手重而多按，欲令氣散，右手輕而徐入，不痛之因」，意思是押手按切可以減痛並幫助得氣。","source":"《針灸大成》卷五‧難經補瀉；卷二‧標幽賦（楊繼洲註解）","id":"D5-004","h":"753e1595b7"},{"day":5,"date":"2026-10-12","number":5,"topic":"Day5｜進針法操作細節","group":"進針法操作細節","qtype":"非題","stem":"下列進針法的操作要點，何者錯誤？","options":[["A","針管進針法：毫針放入針管，針管下端貼緊穴位，叩擊針尾使針尖刺入皮下後，連同針管一起繼續推入到所需深度"],["B","夾持進針法：押手拇、食二指捏消毒乾棉球夾住針身下段，針尖固定在穴位上，刺手捻動針柄，兩手配合刺入，適用於長針"],["C","指切進針法：押手拇指或食指指甲切按在穴位旁，刺手持針緊靠指甲面刺入，適用於短針"],["D","舒張進針法：押手拇、食二指把穴位皮膚向兩側撐開繃緊，刺手持針從兩指之間刺入，適用於皮膚鬆弛的部位，如腹部"]],"answer":"A","difficulty":"中","explanation":"針管進針是靠叩擊針尾讓針尖快速穿過皮膚以減痛；針尖入皮後要先退出針管，再用刺手捻轉或提插把針送到所需深度，不是連針管一起推入。其餘三種雙手進針法敘述都正確（指切→短針；夾持→長針；舒張→皮膚鬆弛處；提捏則用於皮肉淺薄處，如印堂）。","source":"本資料庫 textbook_notes（針灸學 第六章 進針法；新編彩圖針灸學 第四章第三節 基本手法）","id":"D5-005","h":"5622e247a3"},{"day":5,"date":"2026-10-12","number":6,"topic":"Day5｜終始：肥瘦刺齊","group":"終始","qtype":"經典填空","stem":"《靈樞‧終始》：「春氣在毛，夏氣在皮膚，秋氣在分肉，冬氣在筋骨，刺此病者，各以其時為齊。故刺肥人者，以____之齊，刺瘦人者，以____之齊。」空格依序應填？","options":[["A","春夏；秋冬"],["B","冬夏；春秋"],["C","秋冬；春夏"],["D","夏秋；冬春"]],"answer":"C","difficulty":"中","explanation":"春夏人氣在淺表，宜淺刺；秋冬人氣在分肉筋骨，宜深刺。所以肥人用秋冬的深度（較深），瘦人用春夏的深度（較淺），即「肥人深刺、瘦人淺刺」。現代觀念要分清「有效深度」（能得氣的深度）和「安全深度」（不傷及臟器、血管、神經的極限深度）；安全深度與體型（BMI）正相關，胸背、頸項、眼區尤其要注意。","source":"《靈樞‧終始第九》；本資料庫 textbook_notes（新編彩圖針灸學 第四章第八節 歷代典籍到現代教科書看針刺深度）","id":"D5-006","h":"31388ac191"},{"day":5,"date":"2026-10-12","number":7,"topic":"Day5｜眼區針刺：眶內出血紅旗","group":"眼區針刺","qtype":"臨床情境","stem":"55歲男性，有高血壓，服用抗血小板藥物，因乾眼症接受睛明、球後針刺。出針約10分鐘後，右眼瞼迅速腫脹青紫，眼球明顯前突、脹痛劇烈，視力模糊，眼球轉動受限。下列處置何者最適當？","options":[["A","囑患者回家觀察，青紫一般兩週內自然消退，不需處理"],["B","在血腫處以三稜針點刺放血，讓瘀血排出以減壓"],["C","這是常見的皮下血腫，立即熱敷並按摩眼球以促進吸收"],["D","懷疑眶內（球後）出血，立即轉眼科急診評估眼壓與視神經，必要時減壓處置；轉送時可輕柔冷敷，不可按揉眼球"]],"answer":"D","difficulty":"高","explanation":"睛明、球後屬眼區穴：要固定眼球、沿眶緣緩慢直刺、不提插捻轉，出針後按壓針孔，以防血腫。一般眼周皮下瘀青可先加壓冷敷，24–48小時後改熱敷。但若出現眼球突出、劇痛、視力下降、眼球運動受限，代表眶內出血，可能壓迫視神經，屬眼科急症，要立即轉診，絕不可按揉或放血。服用抗凝或抗血小板藥物者，眼區針刺要更謹慎。","source":"本資料庫腧穴表（BL1 睛明、EX-HN7 球後）；textbook_notes（第八節 針灸常見的併發症及其臨床處理原則）","id":"D5-007","h":"baae606c35"},{"day":5,"date":"2026-10-12","number":8,"topic":"Day5｜氣胸高風險部位","group":"氣胸高風險部位","qtype":"概念","stem":"下列穴位中，深刺時「最不」可能導致氣胸的是？","options":[["A","秩邊"],["B","大包"],["C","膏肓"],["D","缺盆"]],"answer":"A","difficulty":"易","explanation":"秩邊在臀部，第4骶後孔水平、骶正中嵴旁開3寸，深部是臀部肌肉與坐骨神經附近，可以直刺1.5–2寸，沒有胸膜和肺。缺盆（鎖骨上窩，深部是肺尖）、膏肓（第4胸椎棘突下旁開3寸）、大包（腋中線第6肋間隙）的深部都是胸腔，只宜淺刺、斜刺或平刺，深刺可能刺破胸膜而發生氣胸。","source":"本資料庫腧穴表（BL54、ST12、BL43、SP21）","id":"D5-008","h":"3fa8ce5773"},{"day":5,"date":"2026-10-12","number":9,"topic":"Day5｜張力性氣胸急救","group":"張力性氣胸急救","qtype":"臨床情境","stem":"45歲體型瘦長女性，俯臥接受肩背部針刺（含膏肓、肺俞），留針約15分鐘時突然咳嗽，隨即右胸刺痛、呼吸急促、冒冷汗。起針後症狀持續加重：血氧由92%降到86%，心跳每分鐘128次，血壓88/56 mmHg，右側呼吸音明顯減弱，頸靜脈怒張。下列處置何者最適當？","options":[["A","先觀察一晚，隔天再安排門診胸部X光"],["B","高度懷疑張力性氣胸，立即撥打119或啟動急救，給氧、採半坐臥並持續監測生命徵象，盡速送急診減壓（穿刺減壓或胸管引流）"],["C","屬針刺後遺感，在原針刺部位加拔火罐以活血止痛"],["D","判斷為暈針，令頭低足高平臥、飲溫糖水即可"]],"answer":"B","difficulty":"中","explanation":"胸背部穴位刺得太深可刺破胸膜。症狀包括胸痛、胸悶、咳嗽、呼吸困難、患側呼吸音減弱。若再出現血氧下降、心跳加快、血壓下降、頸靜脈怒張，代表張力性氣胸，會危及生命，必須立即啟動急救並送醫減壓。半坐臥較能呼吸，頭低足高反而加重呼吸困難。輕微氣胸可半臥休息觀察，但仍要X光確認；症狀也可能延遲數小時才出現。","source":"本資料庫 notes（刺法灸法‧針刺異常情況處理）；腧穴表（BL43、BL13）","id":"D5-009","h":"098345a63a"},{"day":5,"date":"2026-10-12","number":10,"topic":"Day5｜神經損傷：觸電樣放射","group":"神經損傷","qtype":"臨床情境","stem":"醫師為坐骨神經痛患者針刺環跳時，患者突然驚叫，說有像觸電一樣的感覺一路竄到腳底。下列處理何者最恰當？","options":[["A","繼續大幅度捻轉，直到放射感消失為止"],["B","立即停止提插，把針稍微退出、改變方向，不在原處反覆強刺激；出針後評估下肢感覺與肌力，若持續麻木無力要追蹤並轉介神經科"],["C","觸電感就是「氣至病所」，應加強提插以鞏固療效"],["D","馬上在同一位置接上電針，用強刺激加強止痛"]],"answer":"B","difficulty":"中","explanation":"針刺時出現觸電樣放射、銳痛，多代表針尖碰到神經幹（環跳深部接近坐骨神經）。正確做法是不要再提插捻轉，退針少許、改變方向，避免造成神經損傷。得氣是痠、麻、脹、重，或沿經傳導的感覺，與銳痛、電擊痛不同。大型前瞻性研究中，持續最久的不良反應就是下肢神經損傷（持續180天）。","source":"本資料庫 notes（針刺異常情況處理）、textbook_notes（行針與得氣：得氣≠痛）；Witt CM et al. Forsch Komplementmed 2009;16:91-97. doi:10.1159/000209315","id":"D5-010","h":"dffdb5c815"},{"day":5,"date":"2026-10-12","number":11,"topic":"Day5｜體位選擇","group":"體位選擇","qtype":"非題","stem":"下列針刺體位的選擇，何者最不恰當？","options":[["A","針刺耳門、聽宮等側頭部穴位，可採側臥位或側伏坐位"],["B","針刺中脘、天樞、足三里，宜採仰臥位"],["C","初診且非常緊張的患者要針刺後頭項部穴位，宜採俯伏坐位，方便醫師操作"],["D","針刺腎俞、委中、承山，宜採俯臥位"]],"answer":"C","difficulty":"易","explanation":"選體位的原則是：患者舒適、能維持較久、方便取穴與操作。初診、體弱、飢餓、精神緊張的人容易暈針，盡量採臥位；坐位（仰靠坐、俯伏坐）都比較容易暈針。後頭項部可以改用俯臥位。胸腹與四肢前側用仰臥位，背腰與下肢後側用俯臥位，側頭與側身用側臥位。","source":"本資料庫 textbook_notes（針灸學 第五章 刺灸前的準備：體位、消毒；文獻附錄二 針灸標準作業程序）","id":"D5-011","h":"c6d3b9ccba"},{"day":5,"date":"2026-10-12","number":12,"topic":"Day5｜SOP：針刺前準備","group":"SOP","qtype":"概念","stem":"依針灸標準作業程序，關於針刺前的準備，下列何者正確？","options":[["A","確認病人身分，說明療程與可能的風險（出血、瘀青、暈針、氣胸等），並取得知情同意"],["B","醫者施術前執行手部衛生，使用一次性無菌針具，一人一針，不重複使用"],["C","施術部位以75%酒精或優碘，從穴位中心向外環形擦拭消毒，待乾後再進針"],["D","以上皆是"]],"answer":"D","difficulty":"易","explanation":"SOP 的前置作業包括：病人辨識與知情同意、評估禁忌（出血傾向、懷孕、電針與心臟節律器等）、手部衛生、一次性無菌針具、皮膚消毒（由中心向外環形擦拭）、選擇適當體位。施術後要觀察反應、出針核對針數、銳器丟入專用收集盒，並做紀錄與不良事件通報。","source":"本資料庫 textbook_notes（新編彩圖針灸學 文獻附錄二 針灸標準作業程序；特殊針法 第八章 感染控制、知情同意）","id":"D5-012","h":"ee03952eb7"},{"day":5,"date":"2026-10-12","number":13,"topic":"Day5｜SOP：出針與針具處理","group":"SOP","qtype":"概念","stem":"依針灸標準作業程序，關於出針階段的處置，下列何者最正確？","options":[["A","為了加快流程，出針時不用押手，直接連續快速拔出所有針"],["B","出針後不必核對針數，只要詢問患者有沒有不適即可"],["C","頭髮覆蓋處的針不好找，可以請患者回家後自行拔除"],["D","出針後把針回套到原針管，以便同一患者下次療程重複使用"],["E","押手以消毒乾棉球輕壓針旁皮膚，刺手輕捻退到皮下後拔出；清點出針數與置針數相符，用過的針直接投入銳器收集盒"]],"answer":"E","difficulty":"中","explanation":"出針要點：押手按壓針旁皮膚，刺手輕捻、緩退到皮下再拔出；依補瀉決定是否按壓針孔；出針後清點針數，避免遺針（頭皮、髮際、衣物遮蓋處最容易漏針）；針具一次性使用，不回套，直接丟入銳器收集盒，以防針扎與交叉感染。","source":"本資料庫 textbook_notes（文獻附錄二 針灸標準作業程序；針灸學 第六章 留針與出針）","id":"D5-013","h":"bbc68b9eeb"},{"day":5,"date":"2026-10-12","number":14,"topic":"Day5｜行針輔助手法","group":"行針輔助手法","qtype":"非題","stem":"下列行針輔助手法的敘述，何者錯誤？","options":[["A","循法：手指沿著所刺穴位的經脈上下輕柔循按，促使氣至"],["B","震顫法：持針做小幅度、快速的提插捻轉，使針身輕微震顫"],["C","飛法：拇指抵住針尾，以食指或拇指指甲由下而上頻頻刮動針柄"],["D","彈法：手指輕彈針柄，使針體微微震動，以催氣、加強針感"]],"answer":"C","difficulty":"中","explanation":"題目描述的「指甲由下而上刮動針柄」是刮法，不是飛法。飛法是捻轉後鬆開手指，一捻一放，像飛鳥展翅。行針的基本手法是提插與捻轉；輔助手法有循、彈、刮、搖、飛、震顫，其中循、彈、刮多用於催氣，搖、飛多用於行氣。","source":"本資料庫 notes（刺法灸法‧毫針基本操作）；textbook_notes（第四章第三節 基本手法）","id":"D5-014","h":"e89c9b2484"},{"day":5,"date":"2026-10-12","number":15,"topic":"Day5｜標幽賦：察氣至","group":"標幽賦","qtype":"經典填空","stem":"《針灸大成‧標幽賦》：「先詳多少之宜，次察應至之氣。」緊接著賦文說：「輕滑慢而未來，____而已至。」空格應填？","options":[["A","疾數洪"],["B","浮虛空"],["C","痠麻脹"],["D","沉濇緊"]],"answer":"D","difficulty":"易","explanation":"原文為「輕滑慢而未來，沉濇緊而已至」。楊繼洲注：入針後針下輕浮、滑虛、慢遲，表示氣還沒到；沉重、濇滯、緊實，表示正氣已經到了。同篇又說「氣之至也，如魚吞鉤餌之沉浮；氣未至也，如閑處幽堂之深邃」。痠、麻、脹是患者的主觀感覺，賦文這句講的是醫者手下的感覺。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）","id":"D5-015","h":"d91ef1ab0f"},{"day":5,"date":"2026-10-12","number":16,"topic":"Day5｜不得氣：候氣與催氣","group":"不得氣","qtype":"臨床情境","stem":"60歲女性脾胃虛弱，針刺足三里約1寸，患者完全沒有痠脹感，醫者也覺得針下輕滑空虛，「如閑處幽堂之深邃」。下列處理何者最恰當？","options":[["A","不得氣代表一律太淺，應把針直刺到針根"],["B","先檢查取穴、深度與方向是否恰當並適度調整；仍不得氣時，可留針候氣，或用循、彈、刮、搖等手法催氣"],["C","不得氣表示這個穴位無效，應立即出針改刺其他穴，不必再處理"],["D","立即大幅度、高頻率強力提插捻轉，直到患者劇痛為止"]],"answer":"B","difficulty":"中","explanation":"《靈樞‧九鍼十二原》：「刺之而氣不至，無問其數；刺之而氣至，乃去之，勿復鍼……氣至而有效。」不得氣時先排除取穴與深淺、方向的問題，再候氣（留針等待）或催氣（循、彈、刮、搖等）。《靈樞‧行鍼》也指出，有些人體質「數刺乃知」。得氣不等於疼痛；把針刺到針根則容易斷針。","source":"《靈樞‧九鍼十二原第一》《靈樞‧行鍼第六十七》；本資料庫 textbook_notes（行針與得氣）","id":"D5-016","h":"ab1eb0ca8a"},{"day":5,"date":"2026-10-12","number":17,"topic":"Day5｜靈樞行鍼：個體針感差異","group":"靈樞行鍼","qtype":"經典填空","stem":"《靈樞‧行鍼》論各人對針刺的反應不同：「或神動而氣先鍼行，或氣與鍼相逢，或鍼已出，氣獨行，或數刺乃知……」。依岐伯的回答，「數刺乃知」是什麼原因？","options":[["A","此人多陰而少陽，其氣沉而氣往難"],["B","陰陽和調，血氣淖澤滑利，故鍼入而氣出疾而相逢"],["C","陰氣多而陽氣少，陰氣沉而陽氣浮者內藏，故鍼已出，氣乃隨其後"],["D","重陽之人，陽氣滑盛而揚，故神動而氣先行"]],"answer":"A","difficulty":"高","explanation":"原文為「此人之多陰而少陽，其氣沉而氣往難，故數刺乃知也」。其他對應：重陽之人「神動而氣先行」；陰陽和調、血氣淖澤滑利，則「氣與鍼相逢」；陰氣多而陽氣少，則「鍼已出，氣獨行」。至於「發鍼而氣逆」與「數刺病益劇」，岐伯說「此皆粗之所敗，工之所失」，是醫者手法的錯誤，不是體質造成。","source":"《靈樞‧行鍼第六十七》","id":"D5-017","h":"ecc463944a"},{"day":5,"date":"2026-10-12","number":18,"topic":"Day5｜金針賦：按壓行氣、氣至病所","group":"金針賦","qtype":"經典填空","stem":"《針灸大成‧金針賦》論調氣：「氣不至者，以手循攝，以爪切搯，以針搖動，進撚搓彈，直待氣至，以龍虎升騰之法，按之在前，使氣在____，按之在後，使氣在____，運氣走至疼痛之所。」空格依序應填？","options":[["A","前；後"],["B","後；前"],["C","上；下"],["D","下；上"]],"answer":"B","difficulty":"高","explanation":"押手按住針穴前方，經氣就無法往前走，只能向後傳；按住針穴後方，經氣就向前傳。藉此控制感傳方向，讓「氣至病所」。同段又說「欲氣上行，將針右撚，欲氣下行，將針左撚」，也是用捻轉方向來引導經氣。","source":"《針灸大成》卷二‧金針賦（楊繼洲註解）","id":"D5-018","h":"794ea1bfc4"},{"day":5,"date":"2026-10-12","number":19,"topic":"Day5｜捻轉補瀉","group":"捻轉補瀉","qtype":"概念","stem":"關於捻轉補瀉，下列何者屬於「補法」？","options":[["A","以拇指向前（左轉）為主，捻轉角度小、用力輕、頻率慢、時間短"],["B","以拇指向後（右轉）為主，捻轉角度大、用力重、頻率快、時間長"],["C","以拇指向前為主，但捻轉角度大、用力重、頻率快、時間長"],["D","左右來回等量捻轉，角度與力量中等，得氣後即出針"]],"answer":"A","difficulty":"易","explanation":"捻轉補法：拇指向前（左轉）為主，角度小、用力輕、頻率慢、時間短。瀉法：拇指向後（右轉）為主，角度大、用力重、頻率快、時間長。來回均勻捻轉、得氣即止，屬平補平瀉。記憶技巧：補法多「輕、慢、小」，瀉法多「重、快、大」。","source":"本資料庫 notes（刺法灸法‧單式補瀉手法）；textbook_notes（針刺補瀉）","id":"D5-019","h":"ad0289b4d8"},{"day":5,"date":"2026-10-12","number":20,"topic":"Day5｜提插補瀉（情境）","group":"提插補瀉（情境）","qtype":"臨床情境","stem":"70歲男性久病體虛，畏寒肢冷、腰膝痠軟、夜尿頻多，舌淡胖、脈沉細，辨為腎陽虛。醫師針刺關元、腎俞、太谿，打算用提插補瀉的補法。下列操作何者正確？","options":[["A","先淺後深，重插輕提，提插幅度小、頻率慢"],["B","先深後淺，輕插重提，提插幅度大、頻率快"],["C","快速大幅度提插，不分輕重，以患者劇烈痠脹為度"],["D","先淺後深，輕插重提，提插幅度大、頻率快"]],"answer":"A","difficulty":"中","explanation":"提插補法：先淺後深，重插輕提（往下插時用力重、往上提時用力輕），幅度小、頻率慢；瀉法：先深後淺，輕插重提，幅度大、頻率快。腎陽虛屬虛寒證，宜用補法，可配合灸法。針刺關元前要先請患者排尿。","source":"本資料庫 notes（單式補瀉手法）；腧穴表（CV4 關元：針前排尿）","id":"D5-020","h":"d21b0f17b9"},{"day":5,"date":"2026-10-12","number":21,"topic":"Day5｜九鍼十二原：徐疾補瀉原文","group":"九鍼十二原","qtype":"經典填空","stem":"《靈樞‧九鍼十二原》：「凡用鍼者，虛則實之，滿則泄之，宛陳則除之，邪勝則虛之，大要曰：徐而疾則____，疾而徐則____。」依《靈樞‧小鍼解》的解釋，下列何者正確？","options":[["A","虛；實——「徐內而疾出」為瀉，「疾內而徐出」為補"],["B","實；虛——「徐內而疾出」為補，「疾內而徐出」為瀉"],["C","虛；實——指呼吸的徐疾，緩慢呼氣時進針為瀉"],["D","實；虛——「徐」指留針時間長，「疾」指出針後急按針孔"]],"answer":"B","difficulty":"高","explanation":"原文為「徐而疾則實，疾而徐則虛」。《小鍼解》：「徐而疾則實者，言徐內而疾出也。疾而徐則虛者，言疾內而徐出也。」所以慢慢進針、快速出針是補，快速進針、慢慢出針是瀉，這就是疾徐補瀉。《小鍼解》也說「刺之微在數遲者，徐疾之意也」。後世對徐疾另有不同詮釋，但考題多採「徐入疾出＝補」。","source":"《靈樞‧九鍼十二原第一》《靈樞‧小鍼解第三》","id":"D5-021","h":"04e3f4e220"},{"day":5,"date":"2026-10-12","number":22,"topic":"Day5｜迎隨補瀉：原文辨析","group":"迎隨補瀉","qtype":"非題","stem":"下列有關「迎隨」的古籍原文，何者與原文不符？","options":[["A","《靈樞‧小鍼解》：「迎而奪之者，寫也。追而濟之者，補也」"],["B","《針灸大成‧難經補瀉》引《難經》：「迎而奪之者，瀉其子也。隨而濟之者，補其母也」"],["C","《靈樞‧終始》：「寫者迎之，補者隨之，知迎知隨，氣可令和」"],["D","《靈樞‧小鍼解》：「其來不可逢者，氣虛不可寫也」"]],"answer":"D","difficulty":"高","explanation":"《小鍼解》原文是「其來不可逢者，氣盛不可補也。其往不可追者，氣虛不可寫也」：邪氣正盛的時候不可以補，正氣已虛的時候不可以瀉。《九鍼十二原》本文則說「往者為逆，來者為順……迎之隨之，以意和之，鍼道畢矣」。迎隨的三種解釋：一是針尖順經或逆經；二是依經氣流注的時間（迎其來而奪之、隨其去而濟之）；三是泛指補瀉，《難經》就把它解為子母補瀉。","source":"《靈樞‧小鍼解第三》《靈樞‧九鍼十二原第一》《靈樞‧終始第九》；《針灸大成》卷五‧難經補瀉","id":"D5-022","h":"0872953bbe"},{"day":5,"date":"2026-10-12","number":23,"topic":"Day5｜針向迎隨：足三里","group":"針向迎隨","qtype":"臨床情境","stem":"依「針向迎隨補瀉」（針尖順著經脈循行方向為補、逆著經脈方向為瀉），醫師要在足三里施行補法，針尖應朝向哪裡？","options":[["A","朝向膝部（向上），因為足陽明胃經由足走頭"],["B","垂直刺入不傾斜，因為迎隨與針尖方向無關"],["C","朝向足部（向下），順著足陽明胃經由頭走足的方向"],["D","朝向膝部（向上），逆經而刺才能補"]],"answer":"C","difficulty":"中","explanation":"十二經走向：手三陰從胸走手，手三陽從手走頭，足三陽從頭走足，足三陰從足走腹（胸）。足陽明胃經從頭走足，所以針尖朝下（向足）是順經，屬「隨」，為補；針尖朝上是逆經，屬「迎」，為瀉。","source":"本資料庫 notes（單式補瀉手法‧迎隨補瀉；經絡學‧十二經脈走向）","id":"D5-023","h":"4727e09719"},{"day":5,"date":"2026-10-12","number":24,"topic":"Day5｜針法歌：呼吸、開闔、迎隨合用","group":"針法歌","qtype":"非題","stem":"《針灸大成‧針法歌》描述補法：「補必隨經刺，令他吹氣頻，隨吹隨左轉，逐歸天地人，待氣停針久，三彈更熨溫，出針口吸氣，急急閉其門。」下列對這段補法的理解，何者錯誤？","options":[["A","「出針口吸氣，急急閉其門」是吸氣時出針並急按針孔，兼含呼吸補瀉與開闔補瀉的補法"],["B","「隨經刺」是針尖順著經脈方向，屬迎隨補瀉的補法"],["C","「令他吹氣頻」時進針，相當於呼氣時進針，屬呼吸補瀉的補法"],["D","出針時令患者吹氣，並搖大針孔、不予按閉，使正氣充實"]],"answer":"D","difficulty":"高","explanation":"補法是吸氣出針、急閉針孔（「出針口吸氣，急急閉其門」）。出針時吹氣、搖大針孔是瀉法：「瀉欲迎經取，吸則內其針，吸時須右轉……出針吹口氣，搖動大其門。」這首歌把迎隨（隨經／迎經）、呼吸（呼氣進針／吸氣進針）、捻轉（左轉／右轉）、開闔（閉其門／大其門）合在一起。","source":"《針灸大成》卷四‧針法歌","id":"D5-024","h":"84862719d0"},{"day":5,"date":"2026-10-12","number":25,"topic":"Day5｜開闔補瀉：九鍼十二原","group":"開闔補瀉","qtype":"經典填空","stem":"《靈樞‧九鍼十二原》論補法：「……去如弦絕，令左屬右，其氣故止，____已閉，中氣乃實，必無留血，急取誅之。」空格應填？","options":[["A","外門"],["B","內關"],["C","氣海"],["D","玄府"]],"answer":"A","difficulty":"中","explanation":"原文為「外門已閉，中氣乃實」。「外門」就是針孔：補法出針後要閉合針孔，讓正氣不外洩，這是開闔補瀉的經典根據。瀉法則是「寫曰必持內之，放而出之，排陽得鍼，邪氣得泄」，要開大針孔讓邪氣外洩。","source":"《靈樞‧九鍼十二原第一》","id":"D5-025","h":"aec886e3bf"},{"day":5,"date":"2026-10-12","number":26,"topic":"Day5｜單式補瀉綜合辨析","group":"單式補瀉綜合辨析","qtype":"非題","stem":"下列單式補瀉手法的敘述，何者錯誤？","options":[["A","平補平瀉是進針得氣後不施任何手法，屬於不補不瀉"],["B","疾徐補瀉：慢慢刺入、快速出針為補"],["C","呼吸補瀉：吸氣時進針、呼氣時出針為瀉"],["D","開闔補瀉：出針時搖大針孔、不按閉為瀉"]],"answer":"A","difficulty":"中","explanation":"平補平瀉是進針得氣後，均勻地提插、捻轉，刺激量中等，適用於虛實不明顯或虛實夾雜的病證；它是一種手法，不是不補不瀉。其餘三項都正確：疾徐補法是徐入疾出；呼吸補法是呼氣進針、吸氣出針，瀉法相反；開闔補法是出針後急按針孔，瀉法是搖大針孔不按。","source":"本資料庫 notes（單式補瀉手法）；textbook_notes（針刺補瀉：易混）","id":"D5-026","h":"1acb8720cf"},{"day":5,"date":"2026-10-12","number":27,"topic":"Day5｜終始：邪氣與穀氣","group":"終始","qtype":"經典填空","stem":"《靈樞‧終始》辨別針下之氣：「邪氣來也緊而疾，穀氣來也____。」空格應填？","options":[["A","沉而緊"],["B","徐而和"],["C","浮而滑"],["D","疾而數"]],"answer":"B","difficulty":"中","explanation":"原文為「邪氣來也緊而疾，穀氣來也徐而和」：邪氣到來時針下緊急，穀氣（正氣）到來時針下和緩。同篇又說「一刺則陽邪出，再刺則陰邪出，三刺則穀氣至，穀氣至而止」，以及「凡刺之道，氣調而止」。《針灸大成‧問候氣之法何如》也引用這句來分辨邪正。","source":"《靈樞‧終始第九》；《針灸大成》卷六‧問候氣之法何如","id":"D5-027","h":"27f7ee9698"},{"day":5,"date":"2026-10-12","number":28,"topic":"Day5｜靈樞五禁：五奪不可瀉","group":"靈樞五禁","qtype":"非題","stem":"《靈樞‧五禁》說「刺有五奪」，並指出「此皆不可寫」。下列何者「不」屬於五奪？","options":[["A","大汗出之後"],["B","新產及大血"],["C","大飽之後"],["D","形肉已奪"]],"answer":"C","difficulty":"易","explanation":"五奪原文：「形肉已奪，是一奪也。大奪血之後，是二奪也。大汗出之後，是三奪也。大泄之後，是四奪也。新產及大血，是五奪也，此皆不可寫。」五奪都是氣血津液大虧，不可再用瀉法。大飽屬於《終始》十二禁「已飽勿刺」的範圍，不在五奪之列。","source":"《靈樞‧五禁第六十一》；《針灸大成》卷一‧五奪不可瀉","id":"D5-028","h":"23babfc22c"},{"day":5,"date":"2026-10-12","number":29,"topic":"Day5｜終始十二禁：休息後再刺","group":"終始十二禁","qtype":"經典填空","stem":"《靈樞‧終始》在列出針刺禁忌後說：「乘車來者，臥而休之，如食頃，乃刺之。出行來者，坐而休之，如行____頃，乃刺之。」空格應填？","options":[["A","三里"],["B","五里"],["C","十里"],["D","百步"]],"answer":"C","difficulty":"中","explanation":"原文為「出行來者，坐而休之，如行十里頃，乃刺之」。坐車來的人要躺著休息約一頓飯的時間，走路來的人要坐著休息約走十里路的時間，等氣血平定再針刺。原文接著說：「凡此十二禁者，其脈亂氣散逆，其榮衛經氣不次，因而刺之，則陽病入於陰，陰病出為陽，則邪氣復生。」","source":"《靈樞‧終始第九》","id":"D5-029","h":"ada202569b"},{"day":5,"date":"2026-10-12","number":30,"topic":"Day5｜終始十二禁：條文辨識","group":"終始十二禁","qtype":"非題","stem":"下列何者「不」見於《靈樞‧終始》所列的針刺禁忌？","options":[["A","新內勿刺，新刺勿內"],["B","新浴勿刺，已刺勿浴"],["C","已渴勿刺，已刺勿渴"],["D","大驚大恐，必定其氣，乃刺之"]],"answer":"B","difficulty":"易","explanation":"原文：「凡刺之禁，新內勿刺，新刺勿內，已醉勿刺，已刺勿醉，新怒勿刺，已刺勿怒，新勞勿刺，已刺勿勞，已飽勿刺，已刺勿飽，已饑勿刺，已刺勿饑，已渴勿刺，已刺勿渴，大驚大恐，必定其氣，乃刺之。」內指房事。原文沒有「新浴」一條。臨床上醉酒、大怒、過勞、過飽、飢餓、口渴、驚恐的患者，應先讓其休息、平定，再針刺。","source":"《靈樞‧終始第九》","id":"D5-030","h":"0f90d6555c"},{"day":5,"date":"2026-10-12","number":31,"topic":"Day5｜留針：終始久病刺法","group":"留針","qtype":"經典填空","stem":"《靈樞‧終始》：「久病者，邪氣入深。刺此病者，____而久留之，間日而復刺之，必先調其左右，去其血脈，刺道畢矣。」空格應填？","options":[["A","微浮"],["B","疾出"],["C","淺刺"],["D","深內"]],"answer":"D","difficulty":"中","explanation":"久病邪氣深入，所以要「深內而久留之」，隔日再刺。同篇又說「刺熱厥者，留鍼反為寒，刺寒厥者，留鍼反為熱」。現代留針一般15–30分鐘；慢性頑固疼痛或痙攣可以延長，小兒一般不留針；留針分靜留針與動留針（留針期間間歇行針）。","source":"《靈樞‧終始第九》；本資料庫 textbook_notes（針灸學 第六章 留針與出針）","id":"D5-031","h":"2e686d4e33"},{"day":5,"date":"2026-10-12","number":32,"topic":"Day5｜標幽賦：暈針成因","group":"標幽賦","qtype":"經典填空","stem":"《針灸大成‧標幽賦》：「____恐怯，直立側而多暈。」楊繼洲注說此句「言無刺飢人，其氣血未定，則令人恐懼，有怕怯之心，或直立，或側臥，必有眩暈之咎也」。空格應填？","options":[["A","久病"],["B","空心"],["C","醉酒"],["D","大怒"]],"answer":"B","difficulty":"易","explanation":"原文為「空心恐怯，直立側而多暈」，楊注：「空心者，未食之前」。空腹、恐懼加上站立或側身的體位，容易暈針。同篇又說「目無外視，手如握虎，心無內慕，如待貴人」，提醒醫者專心。現代預防暈針：勿空腹針刺，初診、體弱、緊張者採臥位，手法宜輕。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）","id":"D5-032","h":"4cd43741dd"},{"day":5,"date":"2026-10-12","number":33,"topic":"Day5｜滯針處理","group":"滯針處理","qtype":"臨床情境","stem":"25歲男性第一次針灸，針刺合谷後非常緊張，手部肌肉緊繃。醫師行針時向同一方向連續捻轉了數圈，之後發現針下澀滯，提插、捻轉與出針都很困難，患者覺得疼痛。下列處理何者最恰當？","options":[["A","用力強拔出針，以免留針時間太長"],["B","請患者用力握拳、屈伸手指，以帶動針身鬆動"],["C","安撫患者放鬆，向原來捻轉的相反方向捻回；也可在針旁循按、彈柄，或在鄰近加刺一針以緩解肌肉緊張，等針鬆動後再緩慢出針"],["D","繼續向同一方向用力捻轉，使纏住的肌纖維鬆脫"]],"answer":"C","difficulty":"中","explanation":"滯針常見原因有兩種：一是精神緊張使肌肉強烈收縮；二是單向捻轉過度，讓肌纖維纏住針身。處理方法：讓患者放鬆，延長留針或在附近循按、彈柄，或在旁邊加刺一針；如果是單向捻轉造成的，就向反方向捻回。強拔或讓患者用力收縮肌肉，可能造成彎針、斷針。","source":"本資料庫 notes（針刺異常情況處理‧滯針）；textbook_notes（第八節 五、針灸常見的併發症）","id":"D5-033","h":"dbf0ac494c"},{"day":5,"date":"2026-10-12","number":34,"topic":"Day5｜孕婦針刺禁慎","group":"孕婦針刺禁慎","qtype":"臨床情境","stem":"30歲女性懷孕14週，有妊娠噁心嘔吐，產科評估沒有脫水或電解質異常，希望用針灸輔助。下列處置何者最恰當？","options":[["A","取合谷、三陰交，用強刺激降逆止嘔"],["B","以內關為主穴，手法輕柔；避開腹部、腰骶部，以及合谷、三陰交、崑崙、至陰等傳統孕婦禁用穴"],["C","取中脘、關元、中極深刺，以和胃安胎"],["D","懷孕滿三個月後已無針刺禁忌，可以任意取穴"]],"answer":"B","difficulty":"易","explanation":"孕婦針刺注意：懷孕三個月內小腹部禁針；三個月以上，腹部與腰骶部都禁針；合谷、三陰交、崑崙、至陰等通經活血的穴位禁用。內關為心包經絡穴，通陰維脈，主治胸胃病證與嘔吐，手法宜輕。如果嘔吐嚴重、體重下降或脫水，要轉回產科處理。","source":"本資料庫 notes（針刺注意事項與禁忌；禁針禁灸與孕婦禁忌）；腧穴表（PC6 內關、LI4 合谷、SP6 三陰交）","id":"D5-034","h":"01e94be353"},{"day":5,"date":"2026-10-12","number":35,"topic":"Day5｜暈針與心跳停止的鑑別","group":"暈針與心跳停止的鑑別","qtype":"臨床情境","stem":"72歲男性有冠心病史，坐著接受針刺時突然面色蒼白、倒下。醫師立即起針，讓他平臥、頭低足高，但30秒後仍然叫喚沒有反應、沒有正常呼吸、摸不到頸動脈搏動。下列處置何者最適當？","options":[["A","不能只當暈針處理：立即呼救、撥打119並取得AED，開始高品質胸外按壓（CPR），依AED指示電擊"],["B","扶起患者，餵溫糖水促醒"],["C","繼續指掐水溝、內關，並灸百會，等待患者自行甦醒"],["D","加刺湧泉、十宣放血後，觀察30分鐘再決定是否送醫"]],"answer":"A","difficulty":"高","explanation":"典型暈針的人平臥後幾分鐘內會好轉，仍有呼吸和脈搏，所以可以用平臥、保暖、飲溫糖水，或掐水溝、內關、灸百會等方法處理。如果患者沒有反應、沒有正常呼吸、沒有脈搏，就是心跳停止，要立即CPR、用AED並啟動急救系統，針灸急救穴不能取代。意識不清的人不可以餵食，以免嗆入呼吸道。","source":"本資料庫 notes（針刺異常情況處理‧暈針）；textbook_notes（文獻附錄二 針灸標準作業程序：特殊狀況處理）","id":"D5-035","h":"06c60581bf"},{"day":5,"date":"2026-10-12","number":36,"topic":"Day5｜刺灸心法要訣：行針次第手法歌","group":"刺灸心法要訣","qtype":"非題","stem":"《刺灸心法要訣‧行針次第手法歌》說：「取穴持溫進指攝，退搓捻留搖拔合。」下列對其注文的敘述，何者錯誤？","options":[["A","這套十二字分次第手法，注文說「始自三衢楊繼洲」"],["B","拔針：要趁針下仍沉緊時迅速拔出，拔出後不必按壓針穴"],["C","搖針：出針瀉法時每部搖二三搖，最多不超過六搖，使孔穴開大，邪氣退除"],["D","指循：若氣不至，用手指在所屬經絡上下左右「推而行之，引而止之」，使針下氣至沉緊"]],"answer":"B","difficulty":"高","explanation":"拔針歌注：要等「針下氣緩，不沉不緊，覺輕動滑快」，才用右手捻住針尾，左手大指按住針穴與穴外的皮膚，「令針穴門戶不開，神氣內存，然後拔針，庶不致於出血」。如果針下還沉緊，表示邪氣未退，或是滯針，不可以急拔。其餘三項都符合注文。","source":"《刺灸心法要訣》卷一‧行針次第手法歌；《針灸大成》卷六‧三衢楊氏補瀉十二字分次第手法及歌","id":"D5-036","h":"a8ba66b8ae"},{"day":5,"date":"2026-10-12","number":37,"topic":"其他｜俞募配穴：肺氣虛咳嗽","group":"俞募配穴","qtype":"臨床情境","stem":"58歲男性慢性咳嗽兩年，咳聲低弱、痰稀白、氣短自汗、容易感冒，舌淡苔白，脈虛弱；胸部X光與肺功能已由胸腔科追蹤，無咳血或體重減輕。若用俞募配穴補益肺氣，下列取穴與刺法何者最恰當？","options":[["A","肺俞配膻中，因為膻中是肺之募穴"],["B","心俞配巨闕，因為肺朝百脈、心肺同治"],["C","肺俞（第3胸椎棘突下旁開1.5寸，斜刺0.5–0.8寸）配中府（向外斜刺或平刺0.5–0.8寸，不可向內深刺）"],["D","肺俞配中脘，因為中脘是肺之募穴"]],"answer":"C","difficulty":"中","explanation":"肺的背俞穴是肺俞（第3胸椎棘突下旁開1.5寸），募穴是中府（鎖骨下窩外側，平第1肋間隙，前正中線旁開6寸）。兩穴都有氣胸風險：肺俞宜斜刺、不宜深刺；中府向外斜刺或平刺，不可向內深刺。膻中是心包之募、氣會；中脘是胃之募、腑會；巨闕是心之募。","source":"本資料庫腧穴表（LU1 中府、BL13 肺俞、CV17 膻中、CV12 中脘）；notes（特定穴總論）","id":"D5-037","h":"bf8e66639b"},{"day":5,"date":"2026-10-12","number":38,"topic":"其他｜八會穴：熱病在內","group":"八會穴","qtype":"經典填空","stem":"《針灸大成‧八會》列「腑會中脘，臟會章門，筋會陽陵泉，髓會絕骨，血會膈俞，骨會大杼，脈會太淵，氣會亶中」，並引《難經》云：「____者，取會之氣穴也。」空格應填？","options":[["A","寒病在外"],["B","久病入絡"],["C","虛勞不足"],["D","熱病在內"]],"answer":"D","difficulty":"中","explanation":"原文為「難經云：熱病在內者，取會之氣穴也」，說明八會穴可治相應臟腑組織的內熱病證。亶中就是膻中。臨床例子：血證、皮膚血熱取膈俞；筋病取陽陵泉；脈病（如無脈症）取太淵；氣病取膻中。","source":"《針灸大成》卷七（八會）；本資料庫 notes（特定穴總論‧八會穴）","id":"D5-038","h":"642c628f6f"},{"day":5,"date":"2026-10-12","number":39,"topic":"其他｜郄穴應用：孔最與咯血","group":"郄穴應用","qtype":"臨床情境","stem":"40歲女性有支氣管擴張症，近兩天痰中帶少量鮮紅血絲，生命徵象穩定，胸腔科已評估並追蹤中。若依「陰經郄穴多治血證」取肺經郄穴輔助，下列何者正確？","options":[["A","孔最，在尺澤與太淵連線上、腕橫紋上7寸"],["B","經渠，在腕橫紋上1寸、橈動脈搏動處"],["C","尺澤，在肘橫紋上、肱二頭肌腱橈側凹陷"],["D","列缺，在橈骨莖突上方、腕橫紋上1.5寸"]],"answer":"A","difficulty":"中","explanation":"肺經郄穴是孔最（腕橫紋上7寸），陰經郄穴多治血證，可用於咯血輔助治療。列缺是絡穴、八脈交會穴通任脈；經渠是經穴；尺澤是合穴。紅旗：大量咯血、呼吸困難、血壓下降或血氧下降，屬急症，要立即送急診，不能靠針灸處理。","source":"本資料庫腧穴表（LU6 孔最、LU7 列缺、LU5 尺澤）；notes（特定穴總論‧郄穴）","id":"D5-039","h":"82de870bf1"},{"day":5,"date":"2026-10-12","number":40,"topic":"其他｜條口透承山：漏肩風","group":"條口透承山","qtype":"臨床情境","stem":"52歲女性右肩疼痛，抬舉與後伸受限三個月（漏肩風），無外傷、無發燒，影像已排除骨折。醫師選遠端穴，一邊針刺一邊請患者活動肩部（運動針法）。下列何穴最常用，且可以透刺承山？","options":[["A","下巨虛"],["B","豐隆"],["C","足三里"],["D","條口"]],"answer":"D","difficulty":"易","explanation":"條口在犢鼻下8寸、脛骨前緣外開一橫指，治肩痛可以透刺承山，配合運動針法。豐隆在條口外1寸（外踝尖上8寸），是胃經絡穴，偏於化痰；足三里在犢鼻下3寸；下巨虛在犢鼻下9寸，是小腸的下合穴。漏肩風的局部取穴常用肩髃、肩髎、肩貞、肩前。","source":"本資料庫腧穴表（ST38 條口、ST40 豐隆）；notes（治療學 常見病證處方速記：漏肩風）","id":"D5-040","h":"b454be2ebd"},{"day":5,"date":"2026-10-12","number":41,"topic":"其他｜脾經郄穴：痛經","group":"脾經郄穴","qtype":"臨床情境","stem":"20歲女性原發性痛經，經期第一天小腹絞痛拒按，經色紫暗、有血塊，舌暗，脈弦；婦科超音波正常。下列何穴是脾經郄穴，常用於實證痛經？","options":[["A","漏谷"],["B","血海"],["C","公孫"],["D","地機"]],"answer":"D","difficulty":"易","explanation":"地機在陰陵泉下3寸、脛骨內側緣後方，是脾經郄穴。陰經郄穴多治血證，常配中極、次髎、三陰交治實證痛經。公孫是脾經絡穴、八脈交會穴通衝脈；血海擅長治血分病（如癮疹、月經不調），但不是郄穴；漏谷在內踝上6寸。若痛經伴月經延遲、陰道出血與血壓下降，要排除子宮外孕。","source":"本資料庫腧穴表（SP8 地機、SP4 公孫）；notes（治療學 常見病證處方速記：痛經）","id":"D5-041","h":"8254704638"},{"day":5,"date":"2026-10-12","number":42,"topic":"其他｜子午流注：大腸經納子補瀉","group":"子午流注","qtype":"概念","stem":"依《針灸大成‧十二經病井榮俞經合補瀉虛實》，手陽明大腸經用納子法配合子母補瀉，下列何者正確？","options":[["A","虛則辰時補二間；實則卯時瀉曲池"],["B","虛則卯時補太淵；實則寅時瀉尺澤"],["C","虛則辰時補曲池（合土）；實則卯時瀉二間（滎水）"],["D","虛則卯時補曲池；實則辰時瀉二間"]],"answer":"C","difficulty":"高","explanation":"原文：「卯時氣血注此……補用辰時，曲池為合土，土生金，虛則補其母；瀉用卯時，二間為榮水，金生水，實則瀉其子。」瀉法在經氣正盛的時辰（迎而奪之），補法在經氣剛過的時辰（隨而濟之）。對照肺經：寅時氣血注肺，補用卯時太淵（俞土），瀉用寅時尺澤（合水）。","source":"《針灸大成》卷七‧十二經病井榮俞經合補瀉虛實","id":"D5-042","h":"15a004c512"},{"day":5,"date":"2026-10-12","number":43,"topic":"其他｜歌賦：標幽賦時間禁忌","group":"歌賦","qtype":"經典填空","stem":"《針灸大成‧標幽賦》：「望不補而晦不瀉，弦不奪而朔不濟。」依楊繼洲注，下列何者正確？","options":[["A","望是每月十五，晦是每月三十，朔是每月初一，上下弦約在初七八與廿二三；逢這些日子不施補瀉，但暴急之疾不在此限"],["B","此禁忌屬絕對禁忌，急症也不可違反"],["C","此句是說望診時不可用補法、面色晦暗時不可用瀉法"],["D","望是每月初一，晦是每月十五，朔是每月三十，逢這些日子一律禁針"]],"answer":"A","difficulty":"高","explanation":"楊注：「望每月十五也。晦，每月三十也。弦有上下弦，上弦或初七初八，下弦或廿二廿三也。朔，每月初一日也。凡值此日，不可用針施法也。如暴急之疾，則不拘矣。」同篇又有「寒熱風陰，飢飽醉勞而切忌」，與《靈樞‧終始》十二禁的精神相通。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）","id":"D5-043","h":"f7bff40e58"},{"day":5,"date":"2026-10-12","number":44,"topic":"其他｜歌賦：通玄指要賦","group":"歌賦","qtype":"非題","stem":"《針灸大成‧通玄指要賦》：「心胸病，求掌後之大陵，肩背患，責肘前之三里……頭項痛，擬後谿以安然，腰腳疼，在委中而已矣。」關於文中穴位，下列何者錯誤？","options":[["A","大陵在腕背橫紋中點，為三焦經原穴"],["B","「肘前之三里」通常解為手三里，在陽谿與曲池連線上、肘橫紋下2寸"],["C","委中在膕橫紋中點，是膀胱經合穴、膀胱之下合穴，也是四總穴之一"],["D","後谿在第5掌指關節後尺側赤白肉際，是小腸經輸穴，也是八脈交會穴通督脈"]],"answer":"A","difficulty":"中","explanation":"大陵在腕掌側橫紋中點（掌長肌腱與橈側腕屈肌腱之間），是心包經輸穴、原穴；三焦經原穴是陽池（腕背）。後谿通督脈，主治頭項強痛；委中「腰背委中求」；「肘前之三里」通常解為手陽明的手三里，主治肩背臂痛。","source":"《針灸大成》卷三‧通玄指要賦；本資料庫腧穴表（PC7、LI10、SI3、BL40）","id":"D5-044","h":"d5e90a7213"},{"day":5,"date":"2026-10-12","number":45,"topic":"其他｜實證：大型針刺安全觀察研究","group":"實證","qtype":"實證研究","stem":"Witt CM 等（2009, Forsch Komplementmed; doi:10.1159/000209315）對229,230名接受醫師針刺的患者進行前瞻性觀察研究。關於結果，下列何者正確？","options":[["A","研究沒有發現任何神經損傷，所有不良反應都在一天內消失"],["B","最常見的不良反應是氣胸，其次是斷針"],["C","約8.6%的患者報告至少一項不良反應，2.2%需要處理；最常見的是出血或血腫，氣胸僅2例"],["D","約半數患者發生需要住院的不良反應"]],"answer":"C","difficulty":"中","explanation":"該研究的患者平均接受10.2次治療。19,726人（8.6%）至少有一項不良反應，4,963人（2.2%）需要處理。最常見的是出血或血腫（6.1%的患者，占所有不良反應的58%），其次是疼痛（1.7%）與自律神經症狀（0.7%）。氣胸2例（1例住院、1例觀察）。持續最久的是下肢神經損傷（180天）。作者並據此設計了五個模組的針灸知情同意書，可對應 SOP 的知情同意。","source":"Witt CM, Pach D, Brinkhaus B, et al. Forsch Komplementmed. 2009;16(2):91-97. doi:10.1159/000209315（PMID 19420954）","id":"D5-045","h":"c53bf19835"},{"day":5,"date":"2026-10-12","number":46,"topic":"其他｜實證：針刺不良事件統合分析","group":"實證","qtype":"實證研究","stem":"Bäumler 等（2021, BMJ Open; doi:10.1136/bmjopen-2020-045961）彙整21項前瞻性研究，進行系統性回顧與統合分析。下列敘述何者正確？","options":[["A","最常見的不良事件是氣胸與感染，占半數以上"],["B","各研究間異質性極低，不良事件的定義與評估方式一致"],["C","接受一系列針刺療程的患者，約9.3%至少發生一次不良事件；嚴重不良事件約每萬名患者1例、每百萬次治療約8例，屬罕見"],["D","嚴重不良事件約每百名患者1例，屬常見"]],"answer":"C","difficulty":"高","explanation":"統合分析結果：至少一次不良事件的比例，以患者計約9.31%，以治療次數計約7.57%。嚴重不良事件每萬名患者約1.01例、每百萬次治療約7.98例；需要醫療處理的不良事件約每千名患者1.14例。約一半的不良事件是針刺部位出血、疼痛或潮紅。研究間異質性很大（I²\u003e80%），不良事件的定義差異也大。作者結論：針刺屬於較安全的醫療處置，但需要醫療處理的事件仍須具備醫療能力來確保安全。","source":"Bäumler P, Zhang W, Stübinger T, Irnich D. BMJ Open. 2021;11(9):e045961. doi:10.1136/bmjopen-2020-045961（PMID 34489268）","id":"D5-046","h":"8fd394d9ae"},{"day":5,"date":"2026-10-12","number":47,"topic":"其他｜溫針灸","group":"溫針灸","qtype":"非題","stem":"關於溫針灸，下列何者錯誤？","options":[["A","艾團應緊貼皮膚，裝在針身根部，熱力才能直達穴位深處"],["B","毫針刺入得氣後，在針柄上裝艾絨或艾條段點燃，讓熱力沿針身傳入"],["C","《針灸大成》引王節齋說溫針「乃楚人之法」，並說「古者針則不灸灸則不針」"],["D","施灸時可在穴位周圍皮膚墊隔熱紙片，防止艾灰掉落燙傷"]],"answer":"A","difficulty":"中","explanation":"溫針灸的艾團要裝在針柄上，與皮膚保持適當距離；緊貼皮膚或裝在針根處容易燙傷，也可能讓針身過熱。施灸時患者不可移動體位，周圍可墊紙片承接艾灰。《針灸大成》引王節齋：「近有為溫針者，乃楚人之法……然古者針則不灸灸則不針……近見衰弱之人，針灸並用亦無妨。」","source":"《針灸大成》卷五‧溫針；本資料庫 notes（刺法灸法‧灸法）","id":"D5-047","h":"0af81d6da5"},{"day":5,"date":"2026-10-12","number":48,"topic":"其他｜治療學：頭痛分經取穴","group":"治療學","qtype":"臨床情境","stem":"34歲男性反覆頭痛，以兩側太陽穴及耳上側頭部為主，伴口苦、目眩，脈弦；神經學檢查正常，無突發劇烈頭痛或發燒。依頭痛分經論治，下列取穴何者最適當？","options":[["A","印堂、上星、陽白、合谷、內庭"],["B","天柱、後谿、申脈、崑崙"],["C","百會、四神聰、太衝、內關"],["D","率谷、太陽、風池、外關、足臨泣"]],"answer":"D","difficulty":"易","explanation":"側頭痛屬少陽頭痛，取率谷、太陽、風池、外關、足臨泣。前額痛屬陽明，取印堂、上星、陽白、合谷、內庭；後頭項痛屬太陽，取天柱、後谿、申脈、崑崙；巔頂痛屬厥陰，取百會、四神聰、太衝、內關。紅旗：突發「一生最劇烈」的頭痛、發燒伴頸僵硬、神經學缺損、50歲以後新發頭痛等，要先轉診排除顱內病變。","source":"本資料庫 notes（治療學 常見病證處方速記：頭痛分經）","id":"D5-048","h":"2074894729"},{"day":5,"date":"2026-10-12","number":49,"topic":"其他｜治療學急症：中風脫證","group":"治療學急症","qtype":"臨床情境","stem":"78歲女性突然意識不清，目合口張、手撒遺尿、鼻鼾息微、四肢厥冷、汗出如油，脈微欲絕。家屬已撥打119，正在等待救護車。依中風中臟腑辨證，此屬何證？傳統處理何者最恰當？","options":[["A","閉證；十二井穴點刺放血並強刺水溝"],["B","閉證；以隔鹽灸神闕為主，不必送醫"],["C","脫證；十二井穴點刺放血，並強瀉太衝、豐隆"],["D","脫證；可灸神闕（隔鹽）、關元、氣海以回陽固脫，同時維持呼吸道暢通、監測生命徵象，不可延誤送醫"]],"answer":"D","difficulty":"中","explanation":"目合口張、手撒遺尿、鼻鼾息微、汗出肢冷、脈微欲絕是中風脫證，屬元氣衰脫，治法是回陽固脫：大艾炷隔鹽灸神闕，灸關元、氣海。閉證（牙關緊閉、兩手握固、面赤氣粗）才用水溝、十二井放血、太衝、豐隆以開竅瀉實。急性中風要以送醫、急診處置為優先，針灸只能輔助。","source":"本資料庫 notes（治療學 常見病證處方速記：中風）","id":"D5-049","h":"cc236fd0a0"},{"day":5,"date":"2026-10-12","number":50,"topic":"其他｜靈樞官鍼：三刺","group":"靈樞官鍼","qtype":"經典填空","stem":"《靈樞‧官鍼》：「故刺法曰：始刺淺之，以逐邪氣，而來血氣，後刺深之，以致陰氣之邪，最後刺極深之，以____，此之謂也。」空格應填？","options":[["A","下穀氣"],["B","致陽氣"],["C","取骨痹"],["D","出陽邪"]],"answer":"A","difficulty":"高","explanation":"原文為「最後刺極深之，以下穀氣」。同篇解釋三刺：「先淺刺絕皮，以出陽邪，再刺則陰邪出者，少益深，絕皮致肌肉，未入分肉間也，已入分肉之間，則穀氣出。」這與《靈樞‧終始》「一刺則陽邪出，再刺則陰邪出，三刺則穀氣至」相呼應，也是「天、人、地」三部分層進針的理論源頭。","source":"《靈樞‧官鍼第七》《靈樞‧終始第九》","id":"D5-050","h":"3e45186b02"},{"day":6,"date":"2026-10-13","number":1,"topic":"Day6｜燒山火、透天涼：三衢楊氏口訣","group":"燒山火、透天涼","qtype":"經典填空","stem":"《針灸大成‧三衢楊氏補瀉十二字分次第手法及歌》口訣：「燒山火，能除寒，____熱湧湧，鼻吸氣一口呵五口。」「透天涼，能除熱，____冷冰冰，口吸氣一口，鼻出五口。」兩空格依序應填？","options":[["A","九進六退；六進九退"],["B","三進一退；三退一進"],["C","三進三退；三出三入"],["D","三退一進；三進一退"]],"answer":"B","difficulty":"高","explanation":"原文：燒山火「三進一退熱湧湧」，透天涼「三退一進冷冰冰」。楊氏的說明：燒山火先在五分之中行九陽之數，再漸漸運入一寸之內，「三出三入，慢提緊按」，熱氣自生（先淺後深）；透天涼先進一寸內行六陰之數，再退至五分之中，「三入三出，緊提慢按」，涼氣自生（先深後淺）。分辨重點：燒山火＝先淺後深、慢提緊按（緊按慢提）、九陽數；透天涼＝先深後淺、緊提慢按、六陰數。","source":"《針灸大成》卷六‧三衢楊氏補瀉十二字分次第手法及歌（口訣 燒山火、透天涼）","id":"D6-001","h":"db67b28d37"},{"day":6,"date":"2026-10-13","number":2,"topic":"Day6｜陰中隱陽（情境）","group":"陰中隱陽（情境）","qtype":"臨床情境","stem":"45歲男性反覆發作寒熱兩週，每次都先覺身熱煩躁，隨後轉為惡寒（先熱後寒），辨為半虛半實；醫院已排除瘧疾與其他感染，持續追蹤中。若依《針灸大成‧三衢楊氏補瀉》選用複式手法，下列何者最恰當？","options":[["A","陰中隱陽：先運針至一寸行六陰之數，覺微涼後退至五分行九陽之數，即先瀉後補"],["B","子午搗臼：針行上下，九入六出，左右轉之不已"],["C","燒山火：先淺後深，三進一退，慢提緊按，使針下熱至"],["D","陽中隱陰：先運入五分行九陽之數，覺微熱後深入一寸行六陰之數，即先補後瀉"]],"answer":"A","difficulty":"高","explanation":"楊氏口訣：「陰中隱陽，能治先熱後寒，深而淺」——先運一寸行六陰之數，覺病微涼即退至五分行九陽之數，「先瀉後補」。相對的「陽中隱陰，能治先寒後熱，淺而深」——先五分行九陽、再一寸行六陰，「先補後瀉」。注意：本資料庫《金針賦》數位文本的「四曰陰中隱陽」一句與陽中隱陰重複（傳鈔訛誤），應以楊氏口訣及通行本為準（先熱後寒、深而淺、先瀉後補）。","source":"《針灸大成》卷六‧三衢楊氏補瀉（口訣 陽中隱陰、陰中隱陽）；本資料庫 notes（刺法灸法：複式補瀉手法）","id":"D6-002","h":"d9e9ee9dd1"},{"day":6,"date":"2026-10-13","number":3,"topic":"Day6｜子午搗臼","group":"子午搗臼","qtype":"概念","stem":"《金針賦》治病八法中，「落穴之後，調氣均勻，針行上下，九入六出，左右轉之，千遭自平」指的是哪一法？主治為何？","options":[["A","抽添法；癱瘓瘡癩"],["B","留氣法；痃癖癥瘕"],["C","龍虎交戰；疼痛"],["D","子午搗臼；水蠱膈氣"]],"answer":"D","difficulty":"易","explanation":"原文：「五曰子午搗臼，水蠱膈氣，落穴之後，調氣均勻，針行上下，九入六出，左右轉之，千遭自平。」子午搗臼是提插（上下、九入六出）結合捻轉（左右轉之）的複式手法，用於水腫（水蠱）、膈氣脹滿。龍虎交戰用來止痛；留氣法治痃癖癥瘕；抽添法治癱瘓瘡癩。","source":"《針灸大成》卷二‧金針賦；卷六‧三衢楊氏補瀉（口訣 子午搗臼法）","id":"D6-003","h":"8faf449e86"},{"day":6,"date":"2026-10-13","number":4,"topic":"Day6｜龍虎交戰與標幽賦「住痛移疼」","group":"龍虎交戰與標幽賦「住痛移疼」","qtype":"經典填空","stem":"《標幽賦》：「住痛移疼，取相交相貫之徑。」楊繼洲注：「先以針左行左轉，而得____數，復以針右行右轉，而得____數，此乃陰陽交貫之道也。」這種左右交替、用來止痛的複式手法稱為？","options":[["A","九；六；龍虎交戰"],["B","六；九；龍虎交戰"],["C","九；六；子午搗臼"],["D","三；一；燒山火"]],"answer":"A","difficulty":"中","explanation":"楊注：左轉得九數（陽、龍），右轉得六數（陰、虎），陰陽交貫，可以止痛。《金針賦》說：「龍虎交戰，左撚九而右撚六，是亦住痛之針」；楊氏口訣也說「青龍左轉九陽宮，白虎右旋六陰」「九六住疼時」。子午搗臼則是九入六出的提插加捻轉，治水蠱膈氣。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）、金針賦；卷六‧三衢楊氏補瀉（口訣 龍虎交戰手法）","id":"D6-004","h":"ed25e269b6"},{"day":6,"date":"2026-10-13","number":5,"topic":"Day6｜金針賦治病八法：進氣、留氣、抽添","group":"金針賦治病八法","qtype":"非題","stem":"關於《金針賦》治病八法中的進氣、留氣、抽添三訣，下列何者錯誤？","options":[["A","進氣之訣治腰背肘膝痛、渾身走注疼，刺九分，行九補，臥針五七吸，待氣上行"],["B","抽添之訣治癱瘓瘡癩，取其要穴使九陽得氣，提按搜尋，大要運氣週遍"],["C","留氣之訣治痃癖癥瘕，刺七分，用純陽，然後直插針，氣來深刺，提針再停"],["D","留氣之訣主治癱瘓瘡癩，取其要穴，使九陽得氣，提按搜尋，扶針直插，復向下納，回陽倒陰"]],"answer":"D","difficulty":"高","explanation":"「取其要穴，使九陽得氣，提按搜尋，大要運氣週遍，扶針直插，復向下納，回陽倒陰」說的是第八法抽添之訣，主治癱瘓瘡癩，不是留氣。留氣之訣（第七法）主治痃癖癥瘕：刺七分，用純陽，然後直插針，氣來深刺，提針再停；楊氏口訣也說留氣法「能破氣，伸九提六」，可治癥瘕氣塊。進氣之訣（第六法）治腰背肘膝痛、渾身走注疼：刺九分，行九補，臥針五七吸，待氣上行。（本資料庫數位文本「留氣之訣」作「留氣之交」、「純陽」作「純暢」，屬傳鈔錯字。）","source":"《針灸大成》卷二‧金針賦；卷六‧三衢楊氏補瀉（口訣 留氣法）","id":"D6-005","h":"1316191d21"},{"day":6,"date":"2026-10-13","number":6,"topic":"Day6｜金針賦：通經接氣定息寸數","group":"金針賦","qtype":"經典填空","stem":"《金針賦》：「至夫久患偏枯，通經接氣之法，有定息寸數，手足三陽，上九而下十四，過經____寸，手足三陰，上七而下十二，過經____寸，在乎搖動出納，呼吸同法，驅連氣血。」兩空格依序應填？","options":[["A","四；五"],["B","五；四"],["C","六；三"],["D","三；六"]],"answer":"A","difficulty":"高","explanation":"原文為「手足三陽，上九而下十四，過經四寸；手足三陰，上七而下十二，過經五寸」，用在久患偏枯、通經接氣，目的是使氣血「頃刻周流，上下通接」。《針灸大成‧南豐李氏補瀉》解釋「定息寸數」：人一呼氣行三寸，一吸氣行三寸，一呼一吸為一息，依經脈長短以息計算，「取其氣到病所為度」。","source":"《針灸大成》卷二‧金針賦；卷五‧南豐李氏補瀉","id":"D6-006","h":"015fe2bbdd"},{"day":6,"date":"2026-10-13","number":7,"topic":"Day6｜金針賦下針十四法","group":"金針賦下針十四法","qtype":"非題","stem":"《金針賦》說：「一十四法，針要所備。」下列何者「不」屬於這十四法？","options":[["A","彈"],["B","盤"],["C","捫"],["D","刮"]],"answer":"D","difficulty":"易","explanation":"《金針賦》十四法：爪、切（「爪而切之，下針之法」）、搖、退（「搖而退之，出針之法」）、動、進（「動而進之，催針之法」）、循、攝（「循而攝之，行氣之法」）、搓（「搓而去病」）、彈（「彈則補虛」）、盤（「肚腹盤旋」）、捫（「捫為穴閉」）、按（「重沉豆許曰按」）、提（「輕浮豆許曰提」）。刮法（以大指爪從針尾刮至針腰）見於〈南豐李氏補瀉〉，不在十四法內。另外，《標幽賦》楊注所列的十四法字目與此不完全相同，作答時要分清出處。","source":"《針灸大成》卷二‧金針賦、標幽賦（楊繼洲註解）；卷五‧南豐李氏補瀉","id":"D6-007","h":"7d6a083f5e"},{"day":6,"date":"2026-10-13","number":8,"topic":"Day6｜金針賦：一退三飛","group":"金針賦","qtype":"經典填空","stem":"《金針賦》：「補者一退三飛，真氣自歸；瀉者____，邪氣自避。補則補其不足，瀉則瀉其有餘。」空格應填？","options":[["A","一退三飛"],["B","三進一退"],["C","九陽三進"],["D","一飛三退"]],"answer":"D","difficulty":"中","explanation":"原文：「補者一退三飛，真氣自歸，瀉者一飛三退，邪氣自避。」接著說「有餘者，為腫為痛，曰實；不足者……曰虛；氣速效速，氣遲效遲」。南豐李氏解釋「飛」：以大指、次指撚針，連搓三下，如手顫之狀，叫做飛。","source":"《針灸大成》卷二‧金針賦；卷五‧南豐李氏補瀉","id":"D6-008","h":"a7564c93f2"},{"day":6,"date":"2026-10-13","number":9,"topic":"Day6｜金針賦：下針貴遲、出針貴緩","group":"金針賦","qtype":"經典填空","stem":"《金針賦》論出針：「補者吸之去疾，其穴急捫，瀉者呼之去徐，其穴不閉……故曰下針貴遲，太急傷____；出針貴緩，太急傷____。」兩空格依序應填？","options":[["A","肉；筋"],["B","氣；血"],["C","血；氣"],["D","神；精"]],"answer":"C","difficulty":"中","explanation":"原文：「下針貴遲，太急傷血；出針貴緩，太急傷氣。」同段引《醫經小學》：「出針不可猛出，必須作三四次，徐轉出之，則無血，若猛出，必見血也」；但經絡有凝血、要大瀉時則可猛出。出針前要等「針氣微鬆」，針下仍緊「推之不動，轉之不移」者不可強拔。","source":"《針灸大成》卷二‧金針賦","id":"D6-009","h":"8694665c29"},{"day":6,"date":"2026-10-13","number":10,"topic":"Day6｜金針賦：暈針的古法處理","group":"金針賦","qtype":"經典填空","stem":"《金針賦》論暈針：「其或暈針者，神氣虛也……如刺肝經之穴暈，即補肝之____，針入即甦，餘倣此，或有投針氣暈者，即補____，或補人中。」兩空格依序應填？","options":[["A","滎穴；湧泉"],["B","原穴；內關"],["C","合穴；足三里"],["D","井穴；百會"]],"answer":"C","difficulty":"中","explanation":"原文：「如刺肝經之穴暈，即補肝之合穴，針入即甦……或有投針氣暈者，即補足三里，或補人中，大抵暈從心生。」這是古法。現代臨床處置暈針，以立即停針、起出全部針具、平臥頭低足高、保暖、飲溫糖水為先，重者再指掐或針刺水溝、內關、足三里，必要時急救。","source":"《針灸大成》卷二‧金針賦；本資料庫 notes（針刺異常情況處理）","id":"D6-010","h":"40fafb9faf"},{"day":6,"date":"2026-10-13","number":11,"topic":"Day6｜官鍼十二刺：條文辨識","group":"官鍼十二刺","qtype":"非題","stem":"下列《靈樞‧官鍼》十二刺的條文，何者錯誤？","options":[["A","偶刺者，以手直心若背，直痛所，一刺前，一刺後，以治心痹"],["B","報刺者，直入一，傍入二，以治寒氣小深者"],["C","贊刺者，直入直出，數發鍼而淺之出血，是謂治癰腫也"],["D","短刺者，刺骨痹，稍搖而深之，致鍼骨所，以上下摩骨也"]],"answer":"B","difficulty":"中","explanation":"「直入一，傍入二，以治寒氣小深者」是齊刺（又名三刺）。報刺是「刺痛無常處也，上下行者，直內無拔鍼，以左手隨病所按之，乃出鍼復刺之也」，用於游走性疼痛。偶刺前後相對（胸、背）治心痹，刺時要傍針斜刺；短刺深至骨旁摩骨治骨痹；贊刺淺刺多針出血治癰腫。","source":"《靈樞‧官鍼第七》；本資料庫 notes（靈樞官針：九刺、十二刺、五刺）","id":"D6-011","h":"65d830d4a7"},{"day":6,"date":"2026-10-13","number":12,"topic":"Day6｜官鍼十二刺：留痹久居","group":"官鍼十二刺","qtype":"臨床情境","stem":"62歲女性右膝內側一處固定痠痛兩年，痛點不移、遇寒加重，影像為輕度退化性變化、無紅腫熱。依《靈樞‧官鍼》，針對「留痹久居者」的刺法及其操作為何？","options":[["A","報刺：直內無拔鍼，以左手隨病所按之，乃出鍼復刺"],["B","陰刺：左右率刺之"],["C","傍鍼刺：直刺傍刺各一"],["D","揚刺：正內一，傍內四而浮之"]],"answer":"C","difficulty":"中","explanation":"原文：「十一曰傍鍼刺，傍鍼刺者，直刺傍刺各一，以治留痹久居者也。」痛處固定、日久不癒屬留痹久居。報刺用於「痛無常處」的游走痛；陰刺「左右率刺之，以治寒厥」（取足踝後少陰）；揚刺治「寒氣之博大者」。","source":"《靈樞‧官鍼第七》","id":"D6-012","h":"2d29762554"},{"day":6,"date":"2026-10-13","number":13,"topic":"Day6｜官鍼九刺：遠道刺","group":"官鍼九刺","qtype":"概念","stem":"《靈樞‧官鍼》九刺中，「病在上，取之下，刺府俞也」稱為？","options":[["A","輸刺"],["B","遠道刺"],["C","經刺"],["D","巨刺"]],"answer":"B","difficulty":"易","explanation":"九刺「以應九變」：輸刺（刺諸經滎俞藏俞）、遠道刺（病在上取之下，刺府俞，一般指足三陽經的下合穴等腑俞）、經刺（刺大經之結絡經分）、絡刺（刺小絡之血脈）、分刺（刺分肉之間）、大寫刺（以鈹鍼刺大膿）、毛刺（刺浮痹皮膚）、巨刺（左取右，右取左）、焠刺（刺燔鍼則取痹）。","source":"《靈樞‧官鍼第七》；《針灸大成》卷一‧九刺應九變論","id":"D6-013","h":"0145b375be"},{"day":6,"date":"2026-10-13","number":14,"topic":"Day6｜三種「輸刺」辨析","group":"三種「輸刺」辨析","qtype":"非題","stem":"《靈樞‧官鍼》的九刺、十二刺、五刺中都有「輸刺」，但內容不同。下列敘述何者正確？","options":[["A","十二刺的輸刺「直入直出，稀發鍼而深之」，用來治氣盛而熱者"],["B","九刺的輸刺「直入直出，深內之至骨」，用來取骨痹，應腎"],["C","五刺的輸刺是「刺諸經滎俞藏俞」，應肺"],["D","三種輸刺都以淺刺疾發、如拔毛狀為特色"]],"answer":"A","difficulty":"高","explanation":"三種輸刺：①九刺之輸刺——「刺諸經滎俞藏俞也」；②十二刺之輸刺——「直入直出，稀發鍼而深之，以治氣盛而熱者」；③五刺之輸刺——「直入直出，深內之至骨，以取骨痹，此腎之應也」。「淺內而疾發鍼，無鍼傷肉，如拔毛狀，以取皮氣」是五刺的半刺，應肺。","source":"《靈樞‧官鍼第七》","id":"D6-014","h":"e0774656b6"},{"day":6,"date":"2026-10-13","number":15,"topic":"Day6｜官鍼：筋痹的兩種刺法","group":"官鍼","qtype":"概念","stem":"《靈樞‧官鍼》中，用來治療「筋痹」的兩種刺法是？","options":[["A","十二刺的恢刺（直刺傍之，舉之前後，恢筋急）與五刺的關刺（直刺左右，盡筋上，慎無出血）"],["B","十二刺的短刺與五刺的輸刺"],["C","五刺的合谷刺與十二刺的浮刺"],["D","五刺的半刺與九刺的毛刺"]],"answer":"A","difficulty":"中","explanation":"恢刺：「直刺傍之，舉之前後恢筋急，以治筋痹也。」關刺：「直刺左右，盡筋上，以取筋痹，慎無出血，此肝之應也，或曰淵刺，一曰豈刺。」短刺與五刺輸刺治骨痹；合谷刺取肌痹（應脾），浮刺治肌急而寒；半刺取皮氣（應肺），毛刺刺浮痹皮膚。","source":"《靈樞‧官鍼第七》","id":"D6-015","h":"68ccc5daa8"},{"day":6,"date":"2026-10-13","number":16,"topic":"Day6｜官鍼：鍼刺深淺失宜","group":"官鍼","qtype":"經典填空","stem":"《靈樞‧官鍼》開篇論用鍼失宜：「疾淺鍼深，內傷良肉，皮膚為____；病深鍼淺，病氣不寫，反為____。」兩空格依序應填？","options":[["A","痛；大痹"],["B","癰；大膿"],["C","腫；大瘡"],["D","膿；大癰"]],"answer":"B","difficulty":"易","explanation":"原文：「疾淺鍼深，內傷良肉，皮膚為癰；病深鍼淺，病氣不寫，反為大膿。病小鍼大，氣寫太甚，疾必為害；病大鍼小，氣不泄寫，亦復為敗。」強調鍼具大小、刺入深淺都要與病情相符，即「九鍼之宜，各有所為」。","source":"《靈樞‧官鍼第七》","id":"D6-016","h":"b3d46a71d4"},{"day":6,"date":"2026-10-13","number":17,"topic":"Day6｜官鍼：九鍼的選用","group":"官鍼","qtype":"非題","stem":"《靈樞‧官鍼》說明依病選用九鍼。下列條文何者錯誤？","options":[["A","「病水腫不能通關節者，取以大鍼」"],["B","「病在脈氣少，當補之者，取以鍉鍼於井滎分輸」"],["C","「病在皮膚無常處者，取以員鍼於病所」"],["D","「病痹氣暴發者，取以員利鍼」"]],"answer":"C","difficulty":"高","explanation":"原文是「病在皮膚無常處者，取以鑱鍼於病所，膚白勿取」；員鍼用於「病在分肉間」。其餘：經絡痼痹取鋒鍼，大膿取鈹鍼，「病痹氣痛而不去者，取以毫鍼」，「病在中者，取以長鍼」，「病水腫不能通關節者，取以大鍼」，「病在五藏固居者，取以鋒鍼」。","source":"《靈樞‧官鍼第七》","id":"D6-017","h":"b2003f64b7"},{"day":6,"date":"2026-10-13","number":18,"topic":"Day6｜繆刺：足厥陰之絡卒疝","group":"繆刺","qtype":"經典填空","stem":"《針灸甲乙經‧繆刺第三》：「邪客於足厥陰之絡，令人卒疝暴痛。刺足大指爪甲上與肉交者各一，男子立已，女子有頃已，左取右，右取左。」所刺的穴位，以及此刺法所刺的對象為何？","options":[["A","大敦；刺經脈（巨刺）"],["B","大敦；刺絡脈（繆刺）"],["C","行間；刺絡脈（繆刺）"],["D","隱白；刺經脈（巨刺）"]],"answer":"B","difficulty":"中","explanation":"足大指爪甲上與肉交者為足厥陰井穴大敦（《針灸大成‧繆刺論》注：「大敦穴兩腳俱刺故曰各一痏」）。繆刺用於「邪客大絡」「其痛與經脈繆處」，左病刺右、右病刺左，刺的是絡脈，多在手足爪甲上（井穴）淺刺出血；巨刺則刺經脈。臨床上，青少年突然陰囊劇痛須先排除睪丸扭轉等急症。","source":"《針灸甲乙經》卷五‧繆刺第三；《針灸大成》卷一‧繆刺論","id":"D6-018","h":"6ac3534873"},{"day":6,"date":"2026-10-13","number":19,"topic":"Day6｜巨刺與繆刺：原文辨析","group":"巨刺與繆刺","qtype":"非題","stem":"關於巨刺與繆刺，下列何者錯誤？","options":[["A","《標幽賦》楊注：巨刺用於「痛在於左，而右脈病者」；繆刺用於「身形有痛，九候無病」"],["B","繆刺用於邪客於經、「左盛則右病，右盛則左病」者，「必中其經」"],["C","《靈樞‧官鍼》九刺中，「巨刺者，左取右，右取左」"],["D","《甲乙經》：「凡刺之數，先視其經脈……不調者，經刺之；有痛而經不病者，繆刺之」"]],"answer":"B","difficulty":"易","explanation":"「邪客於經，左盛則右病，右盛則左病……如此者，必巨刺之，必中其經，非絡脈也」說的是巨刺。繆刺是邪客大絡、「其痛與經脈繆處」、經脈本身不病者，所以「有痛而經不病者，繆刺之」。兩者都左右交叉取穴：巨刺刺經，繆刺刺絡（《針灸大成‧巨刺論》：「巨刺刺經脈，繆刺刺絡脈，所以別也」）。","source":"《針灸甲乙經》卷五‧繆刺第三；《針灸大成》卷一‧巨刺論、卷二‧標幽賦；《靈樞‧官鍼第七》","id":"D6-019","h":"fd0a8d3f16"},{"day":6,"date":"2026-10-13","number":20,"topic":"Day6｜繆刺：以月死生為痏數","group":"繆刺","qtype":"經典填空","stem":"《針灸大成‧繆刺論》論凡痺往來、在分肉間痛者：「以月死生為數，用針者，隨氣盛衰以為痏數……月生一日一痏，二日二痏，漸多之，十五日十五痏，十六日____痏，漸少之。」空格應填？","options":[["A","十五"],["B","一"],["C","十六"],["D","十四"]],"answer":"D","difficulty":"高","explanation":"原文：「月生一日一痏，二日二痏，漸多之，十五日十五痏，十六日十四痏，漸少之。」月望（十五）以前為「生」，針數逐日增加；月望以後為「死」，逐日減少。《甲乙經》同段說：「針過其日數則脫氣，不及其日數則氣不瀉。」《標幽賦》楊注亦說「十七日十三痏，漸退至三十日二痏」。","source":"《針灸大成》卷一‧繆刺論、卷二‧標幽賦（楊繼洲註解）；《針灸甲乙經》卷五‧繆刺第三","id":"D6-020","h":"5369175da7"},{"day":6,"date":"2026-10-13","number":21,"topic":"Day6｜灸法點穴用火與早晚次序","group":"灸法點穴用火與早晚次序","qtype":"非題","stem":"依《刺灸心法要訣》〈灸法點穴用火歌〉〈灸法早晚次序歌〉的注文，下列何者錯誤？","options":[["A","施灸宜在子時陰盛之時，火氣才能內守經絡"],["B","古代灸病忌用松、柏、枳、橘、榆、棗、桑、竹八木之火"],["C","坐點穴則坐灸，臥點穴則臥灸，立點穴則立灸，須四體平直，毋令傾側"],["D","脈數有熱、新愈氣虛者都不宜灸；欲灸足三里，須年三十以上"]],"answer":"A","difficulty":"中","explanation":"〈灸法早晚次序歌〉：「灸法溫暖宜於午」，注說「宜在午時陽盛之時，火氣易行」；上下經都灸時先上後下，陰陽經都灸時先陽後陰；「脈數有熱，新愈氣虛，俱不宜灸」；欲灸足三里須年三十以上，「恐年少火盛傷目」。〈灸法點穴用火歌〉：點穴與施灸體位一致、四體平直；艾用蘄艾；上古用火珠映日取火，忌八木之火，今時用香火點艾。","source":"《刺灸心法要訣》卷八‧灸法點穴用火歌、灸法早晚次序歌；《針灸大成》卷十一‧點艾火、灸法","id":"D6-021","h":"7a646b4c78"},{"day":6,"date":"2026-10-13","number":22,"topic":"Day6｜灸法壯數：巨闕、鳩尾","group":"灸法壯數","qtype":"經典填空","stem":"《刺灸心法要訣‧灸法大小多少歌》注：「有病必當灸巨闕、鳩尾二穴者，必不可過____壯，艾炷如____，恐火氣傷心也。」兩空格依序應填？","options":[["A","七；雀糞"],["B","五；黍米"],["C","九；大豆"],["D","三；小麥"]],"answer":"D","difficulty":"中","explanation":"歌訣：「頭骨手足皮薄瘦，巨闕鳩尾小少宜，背腹臍下皮肉厚，大多方能起痼疾。」頭與四肢皮肉淺薄，炷宜小、壯數宜少，可分日或隔日灸；巨闕、鳩尾近心，不可過三壯、艾炷如小麥；背腹臍下皮肉深厚，艾炷宜大、壯數宜多，才能去痼冷之疾。","source":"《刺灸心法要訣》卷八‧灸法大小多少歌","id":"D6-022","h":"07b9638e5b"},{"day":6,"date":"2026-10-13","number":23,"topic":"Day6｜化膿灸與灸瘡","group":"化膿灸與灸瘡","qtype":"非題","stem":"關於瘢痕灸（化膿灸）與灸瘡的處理，下列何者錯誤？","options":[["A","《刺灸心法要訣》：過七天之後艾疤發時，「膿水稠多，其病易愈」"],["B","灸瘡黑痛、膿汁汙穢屬艾火毒盛，可用薄荷、黃連、蔥皮、芫荽煎湯洗之"],["C","現代施行化膿灸須事先取得患者知情同意；瘡面約5–6週結痂脫落並留下瘢痕"],["D","灸瘡應發而不發，表示火力已足、氣血充盛，病將自癒，不必處理"]],"answer":"D","difficulty":"中","explanation":"〈灸瘡調治歌〉：「灸瘡不發氣血竭」，注說灸瘡應發不發是「氣血大虧，不必復灸，即灸亦多不能愈」，並非好轉。《針灸大成‧灸瘡要法》也說「若不發，其病不愈」，可用熨法、服四物湯滋養氣血等方法促發。發後貼膏藥「防其六淫外襲」。化膿灸會留瘢痕，必須先取得同意；糖尿病、皮膚癒合差者不宜。","source":"《刺灸心法要訣》卷八‧灸瘡調治歌；《針灸大成》卷十一‧灸瘡要法；本資料庫 textbook_notes（新編彩圖針灸學 第五章第三節）","id":"D6-023","h":"4f5f310894"},{"day":6,"date":"2026-10-13","number":24,"topic":"Day6｜艾灸補瀉","group":"艾灸補瀉","qtype":"經典填空","stem":"《針灸大成‧艾灸補瀉》：「以火補者，毋吹其火，須待自滅，即按其穴；以火瀉者，____，開其穴也。」空格應填？","options":[["A","速吹其火"],["B","徐吹其火"],["C","毋吹其火，待其自滅"],["D","覆以濕布"]],"answer":"A","difficulty":"中","explanation":"艾灸補法讓艾火慢慢自滅、灸後按住穴位（火力溫和持久）；瀉法則快速吹旺艾火、不按穴位（火力猛而短）。此說源自《靈樞‧背輸》：「以火補者，毋吹其火，須自滅也。以火寫者，疾吹其火，傳其艾，須其火滅也。」同篇〈艾灸補瀉〉也說「陷下則灸之」「針所不為，灸之所宜」。","source":"《針灸大成》卷十一‧艾灸補瀉；《靈樞‧背輸第五十一》","id":"D6-024","h":"c843cbdcf4"},{"day":6,"date":"2026-10-13","number":25,"topic":"Day6｜灸材與灸法分類","group":"灸材與灸法分類","qtype":"非題","stem":"關於灸法的燃料與分類，下列何者錯誤？","options":[["A","艾絨以當年新採者為佳，越新火力越猛，越能起痼疾"],["B","天灸（發泡灸）如白芥子貼敷，不需要點火"],["C","太乙神針、雷火神針屬艾條灸中的實按灸"],["D","燈火灸以燈心草蘸油點燃後快速觸點穴位，常用於小兒痄腮"]],"answer":"A","difficulty":"中","explanation":"艾絨以陳久者為佳（《孟子》「七年之病，求三年之艾」），越細、越純、越陳，火力越溫和；新艾火烈易傷肌膚。《刺灸心法要訣》說「炷用蘄艾」，艾要乾燥、搗去塵屑。艾條灸分懸起灸（溫和、雀啄、迴旋）與實按灸（太乙神針、雷火神針）；非艾灸有燈火灸、天灸。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第五章第一、二節；針灸科學 上編第二章）；《刺灸心法要訣》卷八‧灸法點穴用火歌","id":"D6-025","h":"08c95e70c9"},{"day":6,"date":"2026-10-13","number":26,"topic":"Day6｜灸法：氣虛下陷（陰挺）","group":"灸法","qtype":"臨床情境","stem":"66歲女性，多產，子宮下墜感一年，久站加重，神疲氣短，舌淡脈弱；婦科診斷為輕度子宮脫垂，建議骨盆底肌訓練並定期追蹤，無異常出血或排尿困難。若以灸法輔助升陽舉陷，下列何者最適當？","options":[["A","大椎、曲池刺絡放血"],["B","隔鹽灸湧泉"],["C","溫和灸百會，配氣海、關元、足三里"],["D","合谷、三陰交重瀉"]],"answer":"C","difficulty":"易","explanation":"氣虛下陷（脫肛、陰挺、久瀉）是灸法的適應症，常灸百會升陽舉陷，配氣海、關元、足三里補氣。刺絡放血、重瀉適用實熱證，不合本例；隔鹽灸只用於臍部神闕。若出現陰道異常出血、尿滯留或脫垂加重，應回婦科處理。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第五章第四節 灸法的適應症和禁忌）；notes（灸法）","id":"D6-026","h":"76f568918b"},{"day":6,"date":"2026-10-13","number":27,"topic":"Day6｜禁針穴歌與禁灸穴歌對照","group":"禁針穴歌與禁灸穴歌對照","qtype":"非題","stem":"《刺灸心法要訣》的禁針穴歌前段明列「二十三穴不可針」，禁灸穴歌列「禁灸之穴四十七」。下列何穴同時出現在這兩份名單中？","options":[["A","承泣"],["B","腦戶"],["C","素髎"],["D","神闕"],["E","睛明"]],"answer":"B","difficulty":"高","explanation":"禁針二十三穴：腦戶、囟會、神庭、絡卻、玉枕、角孫、顱息、承泣、承靈、神道、靈臺、膻中、水分、神闕、會陰、橫骨、氣衝、手五里、箕門、承筋、青靈、乳中、三陽絡。禁灸四十七穴中有腦戶、睛明、素髎、乳中等。兩份名單都有的是腦戶（乳中也是）。承泣、神闕只在禁針名單（神闕反而常用隔鹽灸）；睛明、素髎只在禁灸名單。","source":"《刺灸心法要訣》卷八‧禁針穴歌、禁灸穴歌","id":"D6-027","h":"0dc37a7458"},{"day":6,"date":"2026-10-13","number":28,"topic":"Day6｜禁針穴歌：肩井深刺","group":"禁針穴歌","qtype":"經典填空","stem":"《刺灸心法要訣‧禁針穴歌》：「外有云門並鳩尾，缺盆客主人莫深，肩井深時人悶倒，____急補人還平。」空格應填？","options":[["A","合谷"],["B","百會"],["C","人中"],["D","三里"]],"answer":"D","difficulty":"易","explanation":"原文為「肩井深時人悶倒，三里急補人還平」：肩井刺得太深會令人悶倒，急補足三里可以恢復。從現代解剖看，肩井下方接近肺尖，深刺有氣胸風險，應淺刺或平刺，不可向下深刺；出現胸痛、呼吸困難要考慮氣胸並轉診。","source":"《刺灸心法要訣》卷八‧禁針穴歌；《針灸大成》卷六‧禁針穴歌","id":"D6-028","h":"85533cd24a"},{"day":6,"date":"2026-10-13","number":29,"topic":"Day6｜標幽賦：禁灸四十九、禁刺二十二","group":"標幽賦","qtype":"經典填空","stem":"《標幽賦》：「避灸處而加四肢，四十有____；禁刺處而除六腧，二十有____。」兩空格依序應填？","options":[["A","七；二"],["B","九；二"],["C","五；三"],["D","九；三"]],"answer":"B","difficulty":"高","explanation":"原文為「避灸處而加四肢，四十有九，禁刺處而除六腧，二十有二」。楊繼洲注：「禁灸之穴四十五，更加四肢之井，共四十九也。禁針之穴二十二，外除六腑之腧也。」注意這和《刺灸心法要訣》禁灸「四十七」、禁針「二十三穴」的數目不同，要分清出處。","source":"《針灸大成》卷二‧標幽賦（楊繼洲註解）；《刺灸心法要訣》卷八‧禁針穴歌、禁灸穴歌","id":"D6-029","h":"bbfe2c8b61"},{"day":6,"date":"2026-10-13","number":30,"topic":"Day6｜拔罐：吸拔方法","group":"拔罐","qtype":"非題","stem":"關於拔罐的吸拔方法，下列何者錯誤？","options":[["A","閃火法以止血鉗夾酒精棉球點燃，在罐內繞一圈後迅速抽出再扣罐，火源不留在罐內"],["B","水罐法多將竹罐放入清水或藥液中煮沸，取出甩去水液後趁熱扣上"],["C","抽氣罐以抽氣器抽出空氣形成負壓，不用火，可調整吸力"],["D","投火法適合罐口朝下垂直扣在背部，燃燒物留在罐內，是最安全的方法"]],"answer":"D","difficulty":"易","explanation":"投火法是將點燃的紙片或棉球投入罐內再扣上，燃燒物留在罐內，所以只宜側面橫拔，以免燃燒物落下燙傷。最常用、相對安全的是閃火法（火源不留在罐內）。其他火罐法還有貼棉法、架火法；另有水罐法（煮竹罐）與抽氣法。","source":"本資料庫 textbook_notes（新編彩圖針灸學 第六章第二節 拔罐療法的種類及吸引方法）；notes（拔罐、刮痧）","id":"D6-030","h":"53c43ee1df"},{"day":6,"date":"2026-10-13","number":31,"topic":"Day6｜刺絡拔罐前的骨折篩檢","group":"刺絡拔罐前的骨折篩檢","qtype":"臨床情境","stem":"25歲男性打籃球扭傷右外踝2天，局部瘀腫青紫，希望接受刺絡拔罐。檢查發現外踝後緣骨頭有明顯壓痛，受傷後到現在都無法自己承重走四步。下列處置何者最適當？","options":[["A","依渥太華踝關節準則（Ottawa ankle rules），有外踝後緣骨壓痛且無法承重，應先轉介X光排除骨折，再決定是否在局部刺絡拔罐"],["B","先在踝部走罐，以加速消腫"],["C","瘀腫越嚴重越適合刺絡拔罐，可立即在外踝重度放血並留罐20分鐘"],["D","扭傷48小時內最適合在患處熱敷並重灸，以溫通經脈"]],"answer":"A","difficulty":"中","explanation":"依渥太華踝關節準則
