<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>

<title>針灸題庫練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1f2328; --muted:#5f6b7a; --line:#dde2e8;
  --pri:#2563c9; --pri-bg:#e8f0fe; --ok:#1f8a46; --ok-bg:#e6f6ec; --ng:#c9302c; --ng-bg:#fdecec;
  --warn:#b45309; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體","Source Han Sans TC",sans-serif;
  font-size:17px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
header.top h1{font-size:22px;margin:6px 0 2px;letter-spacing:.04em}
header.top .sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin:12px 0 10px;background:#e9edf2;border-radius:12px;padding:4px}
.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:16px;min-height:46px;color:var(--muted);font-weight:600}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-block;min-width:1.6em;padding:0 .4em;border-radius:99px;background:var(--ng);color:#fff;font-size:12px;line-height:1.6em;margin-left:4px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ctrls label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:2px}
select,input[type=number]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:46px;font-size:16px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--ng);border-color:#f0c4c3}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:6px 10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;min-height:44px;font-size:15px}
.seg button.on{background:var(--pri-bg);color:var(--pri);font-weight:600}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;margin:0 -2px}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.bar{height:8px;background:#e3e7ec;border-radius:99px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)} .bar .b-ans{background:var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:18px}
.timer.low{color:var(--ng)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:12px;scroll-margin-top:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:13px;padding:2px 9px;border-radius:99px;background:#eef1f5;color:var(--muted);line-height:1.7}
.chip.num{background:var(--pri-bg);color:var(--pri);font-weight:700}
.chip.d-易{background:#e6f6ec;color:#1f7a3f}.chip.d-中{background:#fff4dc;color:#94600a}.chip.d-高,.chip.d-難{background:#fdecec;color:#b42b27}
.stem{font-size:18px;white-space:pre-wrap;word-break:break-word;margin:4px 0 12px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:56px;font-size:17px;line-height:1.6;transition:background .12s,border-color .12s}
.opt:not(:disabled):hover{border-color:#b9c4d2}
.opt:not(:disabled):active{background:#f1f4f8}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-top:1px}
.opt .t{flex:1;white-space:pre-wrap;word-break:break-word}
.opt .mk{flex:none;font-weight:700;font-size:15px;margin-top:2px}
.opt.sel{border-color:var(--pri);background:var(--pri-bg)} .opt.sel .k{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok);color:#fff} .opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)} .opt.wrong .k{background:var(--ng);color:#fff} .opt.wrong .mk{color:var(--ng)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:#fafbfc}
.fb .res{font-weight:700;font-size:18px;margin-bottom:4px}
.fb.ok{border-color:#b7e1c5;background:#f3fbf6} .fb.ok .res{color:var(--ok)}
.fb.ng{border-color:#f1c2c0;background:#fff6f6} .fb.ng .res{color:var(--ng)}
.fb.na .res{color:var(--warn)}
.fb h4{margin:10px 0 2px;font-size:15px;color:var(--muted)}
.fb .ex{white-space:pre-wrap;word-break:break-word;font-size:16px}
.fb .src{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--muted)}
.fb .note{font-size:14px;color:var(--muted);margin-top:6px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.nav .btn{min-height:52px;font-size:17px}
details.grid-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px;margin-bottom:12px}
details.grid-wrap summary{padding:10px 0;cursor:pointer;font-weight:600;color:var(--muted);list-style-position:inside}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:4px 0 12px}
.grid button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:14px;font-weight:600;padding:0;font-variant-numeric:tabular-nums}
.grid button.g-ok{background:var(--ok-bg);border-color:#9fd6b3;color:var(--ok)}
.grid button.g-ng{background:var(--ng-bg);border-color:#efb1af;color:var(--ng)}
.grid button.g-ans{background:var(--pri-bg);border-color:#a9c3f2;color:var(--pri)}
.grid button.cur{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:#fff;border:1px solid var(--line)}
.legend .l-ok::before{background:var(--ok-bg);border-color:#9fd6b3}.legend .l-ng::before{background:var(--ng-bg);border-color:#efb1af}.legend .l-ans::before{background:var(--pri-bg);border-color:#a9c3f2}
.sum h2{margin:4px 0 8px;font-size:20px}
.big{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.big div{flex:1;min-width:96px;background:#f4f6f9;border-radius:12px;padding:10px;text-align:center}
.big b{display:block;font-size:26px;line-height:1.3}
.big small{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0 14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:13px;color:var(--muted);font-weight:600}
.pct-bar{display:inline-block;width:46px;height:6px;background:#e3e7ec;border-radius:9px;vertical-align:middle;margin-left:6px;overflow:hidden}
.pct-bar i{display:block;height:100%;background:var(--ok)}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.warn{background:#fff7e6;border:1px solid #f3d39b;color:#7a4b00;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
footer .btn{font-size:13px;min-height:36px;padding:4px 10px}
.hide{display:none!important}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-head .chips{margin-bottom:0}
.star-btn{flex:none;border:1.5px solid #dcc58a;background:#fff;color:#7a5c00;border-radius:99px;padding:5px 12px;min-height:40px;font-size:15px;font-weight:600;white-space:nowrap}
.star-btn.on{background:#fff4cc;border-color:#e0a800;color:#7a4f00}
.quick-star{display:block;width:100%;margin:8px 0 2px;border:1.5px dashed #dcc58a;background:#fffbea;color:#7a5c00;border-radius:10px;padding:8px 12px;min-height:44px;font-size:15px;font-weight:600;text-align:left}
.star-note{margin-top:8px;font-size:14px;color:#7a5c00;background:#fffbea;border-radius:8px;padding:6px 10px}
.badge.gold{background:#e0a800}
.grid button{position:relative}
.grid button.starred::after{content:"★";position:absolute;top:-3px;right:1px;font-size:12px;line-height:1;color:#e0a800;text-shadow:0 0 2px #fff}
.legend .l-star::before{content:"★";background:none;border:0;color:#e0a800;width:auto;height:auto;font-size:12px;vertical-align:0}
.slist{margin:4px 0 0;padding:0;list-style:none}
.slist li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.slist .sl-main{flex:1;min-width:0;cursor:pointer}
.slist .sl-main b{font-size:14px;color:var(--pri)}
.slist .sl-main div{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .sl-main small{font-size:12px;color:var(--muted)}
details.sl-wrap summary{cursor:pointer;font-weight:600;color:var(--muted);padding:8px 0 4px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 10px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal h4{margin:14px 0 6px;font-size:15px}
.modal textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal .msg{font-size:14px;margin-top:8px;white-space:pre-wrap}
.modal .msg.ok{color:var(--ok)} .modal .msg.ng{color:var(--ng)}
.modal label.rad{display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:15px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:15px;z-index:60;pointer-events:none;transition:opacity .25s;opacity:0}
.toast.show{opacity:1}
@media (max-width:420px){ .tabs button{font-size:14px;padding:10px 1px} .tabs .badge{font-size:11px;min-width:1.4em;margin-left:2px} .star-btn{font-size:14px;padding:4px 10px} body{font-size:16px} .stem{font-size:17px} .opt{font-size:16px;padding:11px 10px} .wrap{padding:8px 10px 36px} }
@media print{.tabs,.panel.ctrl,.nav,details.grid-wrap,footer,.sticky{display:none!important}}
</style>
</head>

<script type="application/json" id="quiz-data">{"meta":{"total":450,"days":[{"day":1,"date":"2026-10-08","count":50},{"day":2,"date":"2026-10-09","count":50},{"day":3,"date":"2026-10-10","count":50},{"day":4,"date":"2026-10-11","count":50},{"day":5,"date":"2026-10-12","count":50},{"day":6,"date":"2026-10-13","count":50},{"day":7,"date":"2026-10-14","count":50},{"day":8,"date":"2026-10-15","count":50},{"day":9,"date":"2026-10-16","count":50}],"updated":"2026-10-16"},"questions":[{"day":1,"date":"2026-10-08","number":1,"topic":"Day1｜經絡總論：十二經脈交接","group":"經絡總論","qtype":"非題","stem":"十二經脈依「相表裡的陰陽經交於四肢末端、同名陽經交於頭面、手足陰經交於胸中」的規律銜接。下列交接部位，何者錯誤？","options":[["A","手少陰心經→手太陽小腸經：交於小指端"],["B","足少陽膽經→足厥陰肝經：交於足小趾外側端"],["C","手太陽小腸經→足太陽膀胱經：交於目內眥"],["D","足少陰腎經→手厥陰心包經：交於胸中"]],"answer":"B","difficulty":"易","explanation":"《靈樞‧經脈》膽經「其支者，別跗上，入大指之間，循大指歧骨內出其端，還貫爪甲，出三毛」，於足大趾（叢毛處）交足厥陰；肝經亦「起於大指叢毛之際」。足小趾是足太陽交足少陰之處（膀胱經「至小指外側」，腎經「起於小指之下」）。其餘三項正確：心經「循小指之內出其端」交小腸；小腸經「至目內眥」交膀胱；腎經「從肺出絡心，注胸中」交心包。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷一‧手足陰陽流注論","id":"D1-001","h":"50cf136a78"},{"day":1,"date":"2026-10-08","number":2,"topic":"Day1｜經絡總論：營氣流注（十四經）","group":"經絡總論","qtype":"經典填空","stem":"《靈樞‧營氣》述營氣「從肝上注肺，上循喉嚨，入頏顙之竅，究於畜門。其支別者，上額，循巔，下項中，循脊，入骶，是____脈也，絡陰器，上過毛中，入臍中，上循腹裏，入缺盆，下注肺中，復出太陰」。空格應填何脈？","options":[["A","督"],["B","帶"],["C","陽蹻"],["D","衝"]],"answer":"A","difficulty":"中","explanation":"原文明言「是督脈也」。營氣循十二經一周後，其支別沿督脈上額循巔、下項循脊，再「入臍中，上循腹裏」（即任脈所行）而入缺盆注肺，復出手太陰，故後世稱營氣為「十四經流注」。衝脈「起於氣街，並少陰之經，俠臍上行」；陽蹻「起於跟中，循外踝上行」；帶脈「起於季脅，迴身一周」，均與本段不符。（本資料庫靈樞底本此處作「入焔」，屬傳鈔訛字，《甲乙經》卷二引作「循脊入骶，是督脈也」。）","source":"《靈樞經》卷四‧營氣第十六；《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-002","h":"5531aa246e"},{"day":1,"date":"2026-10-08","number":3,"topic":"Day1｜經絡總論：十二經脈分布規律","group":"經絡總論","qtype":"非題","stem":"關於十二經脈在四肢與軀幹的分布，下列何者錯誤？","options":[["A","腹部足少陰腎經距前正中線2寸，足陽明胃經距前正中線4寸"],["B","內踝上8寸以下，小腿內側前緣為足厥陰、中線為足太陰"],["C","上肢內側前緣為手太陰、中線為手厥陰、後緣為手少陰"],["D","胸部足少陰距前正中線2寸、足陽明4寸、足太陰6寸"]],"answer":"A","difficulty":"中","explanation":"腹部足少陰距前正中線0.5寸、足陽明2寸、足太陰4寸；《甲乙經》卷三篇名即作「腹自幽門挾巨闕兩傍各半寸」（足少陰）、「腹自不容俠幽門兩傍各一寸五分」（足陽明，即距中線2寸）。小腿內側：肝經「上踝八寸，交出太陰之後」、脾經「交出厥陰之前」，故內踝上8寸以下厥陰在前、太陰居中。胸部2、4、6寸之說正確。","source":"《靈樞經》卷三‧經脈第十；《針灸甲乙經》卷三‧第二十、第二十一","id":"D1-003","h":"764011b601"},{"day":1,"date":"2026-10-08","number":4,"topic":"Day1｜經絡總論：經脈走向與衝脈","group":"經絡總論","qtype":"經典","stem":"《靈樞‧逆順肥瘦》說明「手之三陰，從藏走手……足之三陰，從足走腹」後，黃帝問：「少陰之脈獨下行，何也？」岐伯答「不然」，並以何脈之下行支「注少陰之大絡，出於氣街，循陰股內廉，入膕中……下至內踝之後屬而別」加以解釋？","options":[["A","陰維脈"],["B","足少陰經別"],["C","陰蹻脈"],["D","衝脈"]],"answer":"D","difficulty":"高","explanation":"岐伯指出下行者乃「衝脈者，五藏六府之海也……其下者，注少陰之大絡，出於氣街……下至內踝之後屬而別。其下者，並於少陰之經，滲三陰；其前者……入大指間，滲諸絡而溫肌肉」，故「別絡結則跗上不動，不動則厥，厥則寒矣」。足少陰經本身仍是從足走腹。陰蹻「起於然骨之後，上內踝之上」上行；陰維起於諸陰交（築賓）上行；足少陰經別「至膕中，別走太陽而合」，均非下行支。","source":"《靈樞經》卷六‧逆順肥瘦第三十八；《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-004","h":"7aa4f297f9"},{"day":1,"date":"2026-10-08","number":5,"topic":"Day1｜靈樞經脈：足陽明是動病","group":"靈樞經脈","qtype":"臨床情境","stem":"28歲男性，家屬代訴近一週惡寒振慄、頻頻呻吟呵欠，討厭見人與火光，聽到木頭聲響即驚惕不安，常獨自關門閉窗而居；昨夜突然爬上高處唱歌、脫衣奔走，並腹脹腸鳴。若依《靈樞‧經脈》病候歸經，此表現最符合下列何者？","options":[["A","手太陰肺經是動病，稱為「臂厥」"],["B","足陽明胃經是動病，稱為「骭厥」"],["C","足少陽膽經是動病，稱為「陽厥」"],["D","足少陰腎經是動病，稱為「骨厥」"]],"answer":"B","difficulty":"中","explanation":"胃經：「是動則病洒洒振寒，善呻數欠，顏黑，病至則惡人與火，聞木聲則惕然而驚，心欲動，獨閉戶塞牖而處，甚則欲上高而歌，棄衣而走，賁響腹脹，是為骭厥。」腎經骨厥為「飢不欲食，面如漆柴……心惕惕如人將捕之」；肺經臂厥為「肺脹滿，膨膨而喘欬……甚則交兩手而瞀」；膽經陽厥為「口苦，善太息，心脇痛，不能轉側」。臨床提醒：急性躁狂或精神病樣發作有自傷、傷人風險，應會同精神科急診評估，並排除物質使用、甲狀腺亢進、腦炎等器質性原因，針灸僅能作為輔助。","source":"《靈樞經》卷三‧經脈第十","id":"D1-005","h":"afd4063260"},{"day":1,"date":"2026-10-08","number":6,"topic":"Day1｜靈樞經脈：手太陰病候＋急症轉診","group":"靈樞經脈","qtype":"臨床情境","stem":"66歲男性，吸菸40包年，慢性咳喘多年，平素「肺脹滿，膨膨而喘欬，缺盆中痛」。今日搬重物後突發右側胸痛、呼吸急促、坐立不安，唇色發紺，血氧飽和度86%，右側呼吸音減弱。下列處置何者最適當？","options":[["A","先於少商、商陽點刺放血，觀察半小時再決定是否轉診"],["B","於膻中、定喘施隔薑灸後，囑回家休息"],["C","判定為急重症（疑自發性氣胸或慢性阻塞性肺病急性惡化），暫停針灸，給氧並維持呼吸道，立即轉送急診"],["D","依《靈樞‧經脈》屬手太陰是動病，深刺中府、肺俞以宣肺平喘"]],"answer":"C","difficulty":"易","explanation":"平素症狀雖符合《靈樞‧經脈》肺經「是動則病肺脹滿，膨膨而喘欬，缺盆中痛，甚則交兩手而瞀，此為臂厥」，但本次出現突發單側胸痛、發紺、血氧\u003c90%、患側呼吸音減弱，屬紅旗徵象，須優先排除氣胸與急性呼吸衰竭並立即轉診。中府不可向內深刺、背部俞穴不宜深刺（皆有氣胸風險）；放血觀察或灸後回家都會延誤處置。","source":"《靈樞經》卷三‧經脈第十；本資料庫 acupoints（中府、肺俞注意事項）；notes「針刺異常情況處理」","id":"D1-006","h":"ad37c3a113"},{"day":1,"date":"2026-10-08","number":7,"topic":"Day1｜靈樞經脈：足太陰是動病","group":"靈樞經脈","qtype":"經典填空","stem":"《靈樞‧經脈》：「是動則病舌本強，食則嘔，胃脘痛，腹脹善噫，得____與氣，則快然如衰，身體皆重。」空格與所屬經脈應為？","options":[["A","食；足陽明胃經"],["B","後；足太陰脾經"],["C","汗；足太陰脾經"],["D","後；足陽明胃經"]],"answer":"B","difficulty":"中","explanation":"此為脾經是動病。「得後與氣」指排便或矢氣之後，腹脹即覺輕快（快然如衰）。脾經「入腹，屬脾，絡胃，上膈，挾咽，連舌本，散舌下」，故有舌本強、食則嘔、胃脘痛。胃經是動病為「骭厥」（洒洒振寒、惡人與火等），不是這段。","source":"《靈樞經》卷三‧經脈第十","id":"D1-007","h":"74b1c2d0ec"},{"day":1,"date":"2026-10-08","number":8,"topic":"Day1｜靈樞經脈：手陽明循行（交人中）＋面癱紅旗","group":"靈樞經脈","qtype":"臨床情境","stem":"35歲女性，兩天前右耳後疼痛，今晨發現右側額紋消失、閉眼不全、口角歪向左側、鼓腮漏氣。依《靈樞‧經脈》手陽明大腸經「還出挾口，交人中，左之右，右之左，上挾鼻孔」之循行特點，並考量安全評估，下列何者正確？","options":[["A","遠端可取左側（健側）合谷，配合患側陽白、四白、地倉、頰車等；急性期面部取穴宜少、刺激宜輕"],["B","應檢查外耳道與耳廓有無皰疹；若有，須考慮 Ramsay Hunt 症候群，宜會同西醫評估抗病毒治療"],["C","若病程中出現肢體無力、言語不清、複視等神經學症狀，應懷疑中樞性病變並立即轉診急診"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"手陽明經左右交叉於人中，故面口病可取對側合谷（亦合「面口合谷收」）；周圍性面癱急性期面部宜少針、輕刺激。耳後痛加上耳部皰疹時，須考慮帶狀皰疹病毒引起的 Ramsay Hunt 症候群，宜及早會同西醫給予抗病毒治療。額紋消失屬周圍性面癱，但若合併肢體無力、構音障礙等，應懷疑中風等中樞病變而立即轉診。三項皆正確。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷四‧四總穴歌","id":"D1-008","h":"38b43e056e"},{"day":1,"date":"2026-10-08","number":9,"topic":"Day1｜十五絡脈：絡穴位置（原文）","group":"十五絡脈","qtype":"非題","stem":"《靈樞‧經脈》記載十五絡穴「去腕」「去踝」的距離，下列何者與原文不符？","options":[["A","足陽明之別，名曰豐隆，去踝五寸，別走太陰"],["B","手心主之別，名曰內關，去腕二寸，出於兩筋之間"],["C","足太陽之別，名曰飛揚，去踝七寸，別走少陰"],["D","手少陰之別，名曰通里，去腕一寸半，別而上行"]],"answer":"A","difficulty":"中","explanation":"原文為「足陽明之別，名曰豐隆，去踝八寸」。「去踝五寸」的是足少陽光明（去踝五寸，別走厥陰）與足厥陰蠡溝（去內踝五寸）。另應注意古今差異：原文列缺「取之去腕半寸」、通里「去腕一寸半……取之掌後一寸」，與現代定位（列缺腕上1.5寸、通里腕上1寸）不同，作答時要分清「原文」與「現行定位」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-009","h":"7d6d8fe983"},{"day":1,"date":"2026-10-08","number":10,"topic":"Day1｜十五絡脈：絡脈病候","group":"十五絡脈","qtype":"非題","stem":"下列《靈樞‧經脈》十五絡脈之病候與絡穴配對，何者錯誤？","options":[["A","實則脊強，虛則頭重，高搖之──任脈之別尾翳（鳩尾）"],["B","實則腸中切痛，虛則鼓脹──足太陰之別公孫"],["C","實則支膈，虛則不能言──手少陰之別通里"],["D","實則狂癲，虛則足不收、脛枯──足陽明之別豐隆"]],"answer":"A","difficulty":"中","explanation":"「實則脊強，虛則頭重，高搖之」屬督脈之別長強。任脈之別尾翳（即鳩尾；《針灸大成‧十五絡脈歌》作「屏翳」）的病候為「實則腹皮痛，虛則癢搔」。其餘三項皆與原文相符：通里「其實則支膈，虛則不能言」；公孫「實則腸中切痛，虛則鼓脹」；豐隆「實則狂癲，虛則足不收，脛枯」。","source":"《靈樞經》卷三‧經脈第十；《針灸大成》卷九‧十五絡脈歌","id":"D1-010","h":"7459755773"},{"day":1,"date":"2026-10-08","number":11,"topic":"Day1｜十二經別：離入出合","group":"十二經別","qtype":"經典","stem":"關於《靈樞‧經別》十二經別的「離、入、出、合」，下列何者正確？","options":[["A","經別多從四肢末端井穴分出，淺行於體表"],["B","手太陰經別最後復合於手太陰本經"],["C","足少陰之正至膕中，別走太陽而合，上至腎，當十四椎，出屬帶脈"],["D","足厥陰經別上行至巔頂，合於督脈"]],"answer":"C","difficulty":"中","explanation":"原文：「足少陰之正，至膕中，別走太陽而合，上至腎，當十四椎，出屬帶脈。」陰經經別合於相表裡的陽經：手太陰之正「上出缺盆，循喉嚨，復合陽明」；足厥陰之正「上至毛際，合於少陽」。經別多從肘膝上下的正經分出（離），深入胸腹（入），淺出頭項（出），再合於陽經（合），並非從井穴淺行。","source":"《靈樞經》卷三‧經別第十一","id":"D1-011","h":"fd1c232727"},{"day":1,"date":"2026-10-08","number":12,"topic":"Day1｜十二經筋：寒熱病機與治法","group":"十二經筋","qtype":"非題","stem":"依《靈樞‧經筋》，下列敘述何者錯誤？","options":[["A","足陽明筋病頰筋有寒則急引頰移口，「治之以馬膏，膏其急者，以白酒和桂，以塗其緩者」"],["B","經筋病屬熱而筋弛縱不收者，仍以燔鍼劫刺為首選"],["C","足陽明之筋病可見「卒口僻，急者，目不合」"],["D","經筋之病，寒則反折筋急"]],"answer":"B","difficulty":"高","explanation":"原文：「經筋之病，寒則反折筋急，熱則筋弛縱不收……焠刺者，刺寒急也，熱則筋縱不收，無用燔鍼。」所以「以知為數，以痛為輸」的燔鍼劫刺是治寒急，熱證筋縱不用燔鍼。足陽明之筋「卒口僻，急者，目不合，熱則筋縱，目不開」，並以馬膏、白酒和桂外治，皆為原文。","source":"《靈樞經》卷四‧經筋第十三","id":"D1-012","h":"881f96e931"},{"day":1,"date":"2026-10-08","number":13,"topic":"Day1｜十二經筋：與經脈比較","group":"十二經筋","qtype":"非題","stem":"關於十二經筋與十二經脈的比較，下列何者為非？","options":[["A","經筋多結聚於關節與骨骼周圍"],["B","經筋病候以拘攣、轉筋、強直或弛縱為主"],["C","十二經筋皆起於四肢末端，向心性循行"],["D","經筋與經脈一樣內屬臟腑，且各有專屬的腧穴"]],"answer":"D","difficulty":"易","explanation":"經筋是十二經脈之氣「結、聚、散、絡」於筋肉關節的體系，不入臟腑，也沒有專屬腧穴，治療「以痛為輸」（取壓痛點）。其起於四末、向心而行、結聚關節、病候以筋肉拘攣弛縱為主，皆為正確敘述。","source":"《靈樞經》卷四‧經筋第十三；notes「十二經別、十五絡脈、十二經筋比較」","id":"D1-013","h":"d3dd14d64a"},{"day":1,"date":"2026-10-08","number":14,"topic":"Day1｜奇經八脈：病候","group":"奇經八脈","qtype":"非題","stem":"《針灸甲乙經‧奇經八脈第二》綜合《素問》《難經》論奇經病候，下列何者錯誤？","options":[["A","任脈為病，男子內結七疝，女子帶下瘕聚"],["B","陽蹻為病，陽緩而陰急"],["C","衝脈為病，逆氣裏急"],["D","督脈為病，脊強反折"]],"answer":"B","difficulty":"中","explanation":"原文：「陰蹺為病，陽緩而陰急；陽蹺為病，陰緩而陽急。」題目把陰、陽蹻互換。任脈「男子內結七疝，女子帶下瘕聚」、衝脈「逆氣裏急」、督脈「脊強反折」皆為原文。記憶法：哪條蹻脈病，哪一側就「急」（陽蹻病→外側陽急，陰蹻病→內側陰急）。","source":"《針灸甲乙經》卷二‧奇經八脈第二","id":"D1-014","h":"cfc01a7ed7"},{"day":1,"date":"2026-10-08","number":15,"topic":"Day1｜奇經八脈：陰維、陽維起穴（歌訣）","group":"奇經八脈","qtype":"經典填空","stem":"《針灸大成‧奇經八脈歌（醫經小學）》：「諸陰交起陰維脈，發足少陰____郄。諸陽會起陽維脈，太陽之郄____穴。」空格依序為？","options":[["A","照海；申脈"],["B","交信；跗陽"],["C","築賓；陽交"],["D","築賓；金門"]],"answer":"D","difficulty":"高","explanation":"陰維脈起於諸陰之交，其郄為足少陰築賓；陽維脈起於諸陽之會，「別於金門」（金門為足太陽膀胱經郄穴），「郄於陽交」。所以歌訣第二空是金門而非陽交──陽交是陽維脈郄穴，但歌中「太陽之郄」指的是膀胱經郄穴金門。交信、跗陽分別是陰蹻、陽蹻郄穴；照海、申脈是二蹻的八脈交會穴。","source":"《針灸大成》卷九‧奇經八脈歌（醫經小學）、奇經八脈簡要","id":"D1-015","h":"3e3f21056c"},{"day":1,"date":"2026-10-08","number":16,"topic":"Day1｜奇經八脈：帶脈病證取穴","group":"奇經八脈","qtype":"臨床情境","stem":"42歲女性，白帶量多、清稀無臭三個月，自覺腰部冷重「如坐水中」，腹部脹滿；舌淡胖、苔白滑，脈沉緩。婦科內診、子宮頸抹片與超音波檢查皆正常。依奇經八脈辨證，最適當的歸經與選穴為？","options":[["A","衝脈；取公孫，配內關"],["B","帶脈；取帶脈穴，配足臨泣、外關"],["C","陽蹻脈；取申脈，配跗陽"],["D","陰維脈；取內關，配築賓"]],"answer":"B","difficulty":"易","explanation":"《針灸大成‧奇經八脈簡要》：「帶脈者，起於季脅，迴身一周，其為病也，腹滿，腰溶溶如坐水中。」帶脈穴（GB26）為足少陽與帶脈之會；足臨泣通帶脈，「與外關主客相應」。本案已先完成婦科檢查；若有血性或惡臭分泌物、停經後出血、腹部腫塊，仍應優先轉介婦科。","source":"《針灸大成》卷九‧奇經八脈簡要；卷七‧帶脈（考穴治病）","id":"D1-016","h":"6db7f720f7"},{"day":1,"date":"2026-10-08","number":17,"topic":"Day1｜奇經八脈：蹻脈與睡眠","group":"奇經八脈","qtype":"臨床情境","stem":"50歲女性，失眠半年，入睡困難、易醒，兩目乾澀，手足心熱；舌紅少苔，脈細數。依《靈樞‧大惑論》「衛氣不得入於陰，常留於陽，留於陽則陽氣滿，陽氣滿則陽蹻盛，不得入於陰則陰氣虛，故目不瞑矣」，下列配穴與補瀉何者最適當？","options":[["A","補照海、瀉申脈"],["B","單灸申脈，不取照海"],["C","補申脈、瀉照海"],["D","照海、申脈皆用瀉法"]],"answer":"A","difficulty":"中","explanation":"照海通陰蹻，申脈通陽蹻。陽蹻盛、陰氣虛而目不瞑，治宜瀉陽蹻（申脈）、補陰蹻（照海），可配神門、三陰交、安眠等。補申脈、瀉照海會使陽更盛。臨床提醒：失眠合併大聲打鼾、白天嗜睡，應評估睡眠呼吸中止症；合併情緒低落或自殺意念，應轉介精神科。","source":"《靈樞經》卷十二‧大惑論第八十；《靈樞經》卷四‧脈度第十七","id":"D1-017","h":"4d5681c004"},{"day":1,"date":"2026-10-08","number":18,"topic":"Day1｜四海：衝脈之輸","group":"四海","qtype":"經典填空","stem":"《靈樞‧海論》：「衝脈者，為十二經之海，其輸上在於____，下出於巨虛之上下廉。」空格為？","options":[["A","風府"],["B","氣街"],["C","大杼"],["D","人迎"]],"answer":"C","difficulty":"中","explanation":"四海之輸：胃為水穀之海，「其輸上在氣街，下至三里」；衝脈為十二經之海（血海），「其輸上在於大杼，下出於巨虛之上下廉」；膻中為氣之海，「其輸上在柱骨之上下，前在於人迎」；腦為髓之海，「其輸上在於其蓋，下在風府」。大杼同時也是八會穴中的骨會。","source":"《靈樞經》卷六‧海論第三十三；《針灸甲乙經》卷一‧四海第八","id":"D1-018","h":"ea3f633462"},{"day":1,"date":"2026-10-08","number":19,"topic":"Day1｜四海：髓海不足（情境）","group":"四海","qtype":"臨床情境","stem":"76歲男性，近一年漸覺頭暈、耳鳴，小腿痠軟無力，視物昏花，終日倦怠欲臥；舌淡、脈沉細尺弱，神經學檢查無局部缺損。依《靈樞‧海論》，此屬何者不足？其所輸之穴為何？","options":[["A","氣海不足；上在柱骨之上下，前在人迎"],["B","水穀之海不足；上在氣街，下至三里"],["C","血海不足；上在大杼，下出巨虛上下廉"],["D","髓海不足；上在其蓋（百會），下在風府"]],"answer":"D","difficulty":"中","explanation":"原文：「髓海不足，則腦轉耳鳴，脛痠眩冒，目無所見，懈怠安臥。」腦為髓之海，「其輸上在於其蓋，下在風府」（其蓋即百會）。風府須伏案正坐、向下頜方向緩刺0.5–1寸，不可向上深刺以免傷及延髓。紅旗：若突發眩暈並出現複視、構音障礙、吞嚥困難、肢體無力或步態不穩（疑後循環中風），應立即轉送急診。","source":"《靈樞經》卷六‧海論第三十三；本資料庫 acupoints（風府）","id":"D1-019","h":"8687435b52"},{"day":1,"date":"2026-10-08","number":20,"topic":"Day1｜根結：開闔樞","group":"根結","qtype":"經典填空","stem":"《靈樞‧根結》：「太陽為開，陽明為闔，少陽為樞……闔折則氣無所止息，而____起矣。」空格及其取經為？","options":[["A","骨繇；取之少陽"],["B","暴病；取之太陽"],["C","痿疾；取之陽明"],["D","膈洞；取之太陰"]],"answer":"C","difficulty":"高","explanation":"三陽：開折則「肉節瀆而暴病起」，取太陽；闔折則「氣無所止息，而痿疾起」，取陽明；樞折則「骨繇而不安於地」，取少陽。「膈洞」是三陰中太陰開折（倉廩無所輸）。此與《甲乙經》「治痿者獨取陽明」之說相互呼應。","source":"《靈樞經》卷二‧根結第五；《針灸甲乙經》卷十‧熱在五臟發痿第四","id":"D1-020","h":"4e64fdb097"},{"day":1,"date":"2026-10-08","number":21,"topic":"Day1｜根結與標本：出處與意義","group":"根結與標本","qtype":"非題","stem":"關於根結、標本理論，下列何者錯誤？","options":[["A","根結與標本皆強調四肢末端（根、本）與頭面軀幹（結、標）的上下聯繫"],["B","《靈樞‧衛氣》論標本之候：「下虛則厥，下盛則熱，上虛則眩，上盛則熱痛」"],["C","《靈樞‧根結》謂足太陰「根於隱白，結於太倉」"],["D","根結理論主要見於《靈樞‧衛氣》，標本理論主要見於《靈樞‧根結》"]],"answer":"D","difficulty":"易","explanation":"出處相反：根結出自《靈樞‧根結第五》，十二經標本與氣街出自《靈樞‧衛氣第五十二》（《甲乙經》卷二〈十二經標本第四〉同）。兩者都說明四肢末端穴位能治頭面軀幹病。足太陰「根於隱白，結於太倉」、標本之候「下虛則厥……上盛則熱痛」皆為原文。","source":"《靈樞經》卷二‧根結第五、卷八‧衛氣第五十二","id":"D1-021","h":"ab85ee48c7"},{"day":1,"date":"2026-10-08","number":22,"topic":"Day1｜九鍼十二原：十二原","group":"九鍼十二原","qtype":"經典填空","stem":"《靈樞‧九鍼十二原》：「五藏有疾，當取之十二原。」十二原除五臟原穴左右各一外，另有「膏之原，出於____」及「肓之原，出於脖胦」。空格與「脖胦」的今名依序為？","options":[["A","鳩尾；氣海"],["B","中脘；氣海"],["C","膻中；關元"],["D","巨闕；神闕"]],"answer":"A","difficulty":"中","explanation":"原文：「膏之原，出於鳩尾，鳩尾一。肓之原，出於脖胦，脖胦一。」五臟原穴（太淵、大陵、太衝、太白、太谿）左右各一共10穴，再加鳩尾、脖胦（即氣海，臍下1.5寸）共12，稱十二原；這和後世「十二經原穴」不同。鳩尾同時是任脈絡穴。","source":"《靈樞經》卷一‧九鍼十二原第一；《針灸甲乙經》卷一‧十二原第六","id":"D1-022","h":"29e96c7bf9"},{"day":1,"date":"2026-10-08","number":23,"topic":"Day1｜九鍼十二原：心之原","group":"九鍼十二原","qtype":"經典","stem":"依《靈樞‧九鍼十二原》所列，「陽中之太陽，心也，其原出於____」。空格為何？","options":[["A","太淵"],["B","少府"],["C","大陵"],["D","神門"]],"answer":"C","difficulty":"高","explanation":"《靈樞》十二原中，心之原取手厥陰心包經的大陵。《靈樞‧邪客》解釋：「諸邪之在於心者，皆在於心之包絡……故獨無腧焉」，少陰「獨取其經於掌後銳骨之端」；《靈樞‧本輸》也作「心出於中衝……注於大陵」。現代以神門為心經原穴（陰經以輸代原），是後世之說。太淵為肺之原；少府為心經滎穴。","source":"《靈樞經》卷一‧九鍼十二原第一、本輸第二；卷十‧邪客第七十一","id":"D1-023","h":"e91bc3d836"},{"day":1,"date":"2026-10-08","number":24,"topic":"Day1｜九鍼十二原：刺法要旨","group":"九鍼十二原","qtype":"非題","stem":"依《靈樞‧九鍼十二原》，下列敘述何者錯誤？","options":[["A","「刺寒清者，如人不欲行」，指寒證宜深刺留針以候氣"],["B","「刺諸熱者，如以手探湯」，指熱證宜淺刺疾出"],["C","「疾高而內者，取之陰之陵泉」"],["D","「陰有陽疾者，取之陽之陵泉」"]],"answer":"D","difficulty":"高","explanation":"原文：「陰有陽疾者，取之下陵三里，正往無殆，氣下乃止，不下復始也。疾高而內者，取之陰之陵泉。疾高而外者，取之陽之陵泉也。」所以「陰有陽疾」取的是足三里（下陵），不是陽陵泉。以手探湯指輕觸即起（淺而疾），人不欲行指遲留不去（深而留），與《經脈》「熱則疾之，寒則留之」意思相通。","source":"《靈樞經》卷一‧九鍼十二原第一","id":"D1-024","h":"196205670d"},{"day":1,"date":"2026-10-08","number":25,"topic":"Day1｜九鍼十二原：九鍼形制","group":"九鍼十二原","qtype":"經典","stem":"《靈樞‧九鍼十二原》九鍼中，「末如劍鋒，以取大膿」者為何？其長度為何？","options":[["A","大鍼；長四寸"],["B","鋒鍼；長一寸六分"],["C","員利鍼；長一寸六分"],["D","鈹鍼；長四寸，廣二分半"]],"answer":"D","difficulty":"易","explanation":"「鈹鍼者，末如劍鋒，以取大膿」，「長四寸，廣二分半」，是後世外科切開排膿刀的前身（九刺中的「大寫刺」即用鈹鍼）。鋒鍼「刃三隅以發痼疾」（三稜針前身）；員利鍼「大如氂，且員且銳，中身微大，以取暴氣」；大鍼「尖如挺，其鋒微員，以寫機關之水也」。","source":"《靈樞經》卷一‧九鍼十二原第一","id":"D1-025","h":"55f026485b"},{"day":1,"date":"2026-10-08","number":26,"topic":"Day1｜靈樞經脈：人迎寸口脈法","group":"靈樞經脈","qtype":"經典","stem":"《靈樞‧經脈》以人迎與寸口比較判斷經脈盛衰。「盛者人迎大再倍於寸口」所指為何經之盛？","options":[["A","手太陽小腸經"],["B","足陽明胃經"],["C","足太陰脾經"],["D","手少陽三焦經"]],"answer":"A","difficulty":"高","explanation":"陽經以人迎大於寸口為盛：陽明（大腸、胃）「人迎大三倍於寸口」，太陽（小腸、膀胱）「人迎大再倍於寸口」，少陽（三焦、膽）「人迎大一倍於寸口」。陰經以寸口大於人迎為盛：太陰（肺、脾）三倍，少陰（心、腎）再倍，厥陰（心包、肝）一倍。足太陰為「寸口大三倍於人迎」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-026","h":"31479e9e0b"},{"day":1,"date":"2026-10-08","number":27,"topic":"Day1｜靈樞經脈：經脈與絡脈之別、絡脈色診","group":"靈樞經脈","qtype":"非題","stem":"依《靈樞‧經脈》對經脈與絡脈的論述，下列何者錯誤？","options":[["A","諸脈之浮而常見者，皆絡脈也"],["B","經脈十二者，伏行分肉之間，深而不見"],["C","胃中寒，則手魚際之絡多赤"],["D","凡診絡脈，脈色青則寒且痛，赤則有熱"]],"answer":"C","difficulty":"中","explanation":"原文：「胃中寒，手魚之絡多青矣；胃中有熱，魚際絡赤。」所以寒為青、熱為赤，題目將寒熱顛倒。原文又說：「經脈十二者，伏行分肉之間，深而不見……諸脈之浮而常見者，皆絡脈也」；「凡診絡脈，脈色青則寒且痛，赤則有熱」；並指出刺絡應「刺其結上，甚血者雖無結，急取之」。","source":"《靈樞經》卷三‧經脈第十","id":"D1-027","h":"463b8b29c6"},{"day":1,"date":"2026-10-08","number":28,"topic":"Day1｜十二經氣血多少","group":"十二經氣血多少","qtype":"經典","stem":"《刺灸心法要訣‧十二經氣血多少歌》：「多氣多血惟陽明，少氣太陽厥陰同，二少太陰常少血。」依其注文，下列何組四經全屬「多血少氣」？","options":[["A","三焦、膽、腎、心"],["B","心包絡、膀胱、小腸、肝"],["C","脾、肺、三焦、膽"],["D","大腸、胃、膀胱、肝"]],"answer":"B","difficulty":"中","explanation":"注：「手陽明大腸、足陽明胃，此二經多氣多血之經也；三焦、膽、腎、心、脾、肺，此六經多氣少血也；心包絡、膀胱、小腸、肝，此四經乃多血少氣也。」也就是太陽（小腸、膀胱）與厥陰（心包、肝）多血少氣，少陽、少陰、太陰多氣少血。","source":"《刺灸心法要訣》卷一‧十二經氣血多少歌","id":"D1-028","h":"920dc56baa"},{"day":1,"date":"2026-10-08","number":29,"topic":"Day1｜腧穴總論：骨度分寸古今差異","group":"腧穴總論","qtype":"經典","stem":"《靈樞‧骨度》記載「眾人之度」。下列哪一項與現行教材（WHO 2008 標準）的骨度分寸「不一致」？","options":[["A","內輔下廉下至內踝，長一尺三寸"],["B","膝以下至外踝，長一尺六寸"],["C","髀樞以下至膝中，長一尺九寸"],["D","兩乳之間，廣九寸半"]],"answer":"D","difficulty":"高","explanation":"現行骨度以兩乳頭間為8寸；《刺灸心法要訣‧骨度尺寸》在「兩乳之間，廣九寸半」下也注明「當折八寸為當」。其餘三項與現行一致：股骨大轉子至膕橫紋19寸、膕橫紋至外踝尖16寸、脛骨內側髁下緣至內踝尖13寸。另一個古今不一致的例子：原文「肘至腕長一尺二寸半」，現行為12寸。（《刺灸心法要訣》傳本作「內輔下廉下至內踝，長一尺二寸」，與《靈樞》不同，作答以《靈樞》為準。）","source":"《靈樞經》卷四‧骨度第十四；《刺灸心法要訣》卷二‧骨度尺寸","id":"D1-029","h":"25690038ab"},{"day":1,"date":"2026-10-08","number":30,"topic":"Day1｜腧穴總論：頭部直寸","group":"腧穴總論","qtype":"經典填空","stem":"《刺灸心法要訣‧骨度尺寸》按語：頭部以前髮際至後髮際折為一尺二寸；「如髮際不明，則取眉心直上，後至大杼骨，折作____」。空格為？","options":[["A","二尺"],["B","一尺二寸"],["C","一尺八寸"],["D","一尺五寸"]],"answer":"C","difficulty":"中","explanation":"髮際不明時，由眉心經頭頂至大杼骨（第7頸椎）折作一尺八寸。換算現行骨度：眉間至前髮際3寸＋前後髮際12寸＋後髮際至第7頸椎棘突3寸＝18寸。同書又說頭部橫寸「以眼內角至外角，此為一寸」。","source":"《刺灸心法要訣》卷二‧周身名位骨度／骨度尺寸","id":"D1-030","h":"2e523c17ce"},{"day":1,"date":"2026-10-08","number":31,"topic":"Day1｜腧穴總論：手指同身寸","group":"腧穴總論","qtype":"非題","stem":"關於腧穴定位的指寸法與骨度法，下列何者錯誤？","options":[["A","中指同身寸以中指屈曲時，中節橈側兩端紋頭之間為1寸"],["B","拇指同身寸以拇指指間關節的寬度為1寸"],["C","為5歲兒童取四肢穴時，以醫師本人的中指同身寸量取最準確"],["D","骨度分寸不論患者高矮胖瘦，皆按同一分寸等分折量"]],"answer":"C","difficulty":"易","explanation":"指寸法須以「患者本人」的手指為準（《針灸大成》中指同身寸圖：「手中指第二節內廷，兩橫紋頭相去為一寸」，並取男左女右；底本作「男左如右」）；醫師與兒童手指大小差很多，用醫師的手指量會嚴重偏差。兒童及體型特殊者應以骨度折量為主、指寸為輔。骨度法依比例等分，因此不受高矮胖瘦影響。","source":"《針灸大成》卷五‧中指同身寸圖；notes「腧穴定位法與骨度分寸」","id":"D1-031","h":"9683c16fbc"},{"day":1,"date":"2026-10-08","number":32,"topic":"Day1｜腧穴總論：腧穴作用","group":"腧穴總論","qtype":"概念","stem":"下列何者屬於腧穴「相對特異性」作用的典型例子？","options":[["A","艾灸至陰矯正胎位"],["B","合谷治頭面口齒疾病"],["C","膝眼治膝關節疼痛"],["D","天樞既能止瀉又能通便"]],"answer":"A","difficulty":"易","explanation":"腧穴作用分近治、遠治與特殊作用。特殊作用包括「相對特異性」（如至陰矯正胎位、大椎退熱）與「雙向調節」（如天樞止瀉又通便、內關可升可降心率）。合谷治頭面是「經脈所過，主治所及」的遠治作用；膝眼治膝痛是近治作用。","source":"notes「腧穴分類、作用與命名」","id":"D1-032","h":"fa4d030d95"},{"day":1,"date":"2026-10-08","number":33,"topic":"Day1｜特定穴總論：分布部位","group":"特定穴總論","qtype":"非題","stem":"關於特定穴的分布部位，下列何者錯誤？","options":[["A","六腑下合穴均位於下肢足三陽經上"],["B","募穴均位於胸腹及脅腹部，但並非全在任脈上"],["C","十六郄穴全部位於肘、膝關節以下"],["D","背俞穴均位於足太陽膀胱經背腰部第一側線（後正中線旁開1.5寸）"]],"answer":"C","difficulty":"高","explanation":"郄穴「多數」在肘膝以下，但胃經郄穴梁丘在髕底上2寸，是例外。募穴中的期門、章門、京門、日月、中府、天樞都不在任脈上。下合穴：足三里、上巨虛、下巨虛（足陽明），委中、委陽（足太陽），陽陵泉（足少陽），都位於下肢足三陽經上。","source":"本資料庫 acupoints（梁丘：髕底上2寸，胃經郄穴）；《靈樞經》卷一‧邪氣藏府病形第四","id":"D1-033","h":"b4355d845b"},{"day":1,"date":"2026-10-08","number":34,"topic":"Day1｜經絡現代研究：結締組織假說","group":"經絡現代研究","qtype":"實證研究","stem":"關於經絡與腧穴的現代形態學研究，Langevin 與 Yandow（2002, Anat Rec）在人體上臂的連續大體解剖切面中比對穴位位置，主要發現為何？","options":[["A","約80%的穴位位置與肌間或肌內結締組織平面相對應，並提出經絡網絡可能反映間質結締組織網絡的假說"],["B","穴位分布與結締組織平面完全沒有關聯，經絡僅為古人想像"],["C","所有穴位處皆有密集的肥大細胞聚集，可作為經絡實質的唯一證據"],["D","在穴位下方發現獨立於血管、神經的管狀實體結構，直接證實經絡是特殊管道"]],"answer":"A","difficulty":"中","explanation":"該研究以超音波觀察到穴位處有結締組織裂隙平面，並在人體上臂連續大體切面中比對穴位，發現約80%的穴位與肌間或肌內結締組織平面相對應，因而提出「穴位與經絡網絡可視為間質結締組織網絡的表現」的假說，認為這與針刺作用機轉有關。研究沒有找到獨立管道結構，也沒有否定兩者的關聯；肥大細胞說並非本研究內容。\n文獻：Langevin HM, Yandow JA. Relationship of acupuncture points and meridians to connective tissue planes. Anat Rec. 2002;269(6):257-265. doi:10.1002/ar.10185（PMID 12467083）","source":"Langevin HM, Yandow JA. Anat Rec. 2002;269(6):257-265. doi:10.1002/ar.10185","id":"D1-034","h":"3ae1fed4af"},{"day":1,"date":"2026-10-08","number":35,"topic":"Day1｜腧穴現代研究：腧穴特異性（足三里 vs 天樞）","group":"腧穴現代研究","qtype":"實證研究","stem":"在腧穴特異性研究中，Liu 等（2021, Nature）以小鼠內毒素（LPS）全身性發炎模型，比較電針「足三里（ST36）」與「天樞（ST25）」。下列何者最符合其結果？","options":[["A","高強度電針只能在ST36誘發脊髓交感反射，在ST25則完全無效"],["B","剔除 PROKR2-Cre 神經元後，低強度電針ST36的抗炎作用反而增強"],["C","低強度電針ST36經由支配後肢深筋膜（如骨膜）、以 PROKR2-Cre 標記的感覺神經元，驅動迷走神經—腎上腺軸釋放兒茶酚胺而抑制全身發炎；低強度電針ST25則無此效應"],["D","低強度電針ST25與ST36同樣能驅動迷走—腎上腺抗炎軸，顯示穴位沒有特異性"],["E","研究證實穴位特異性取決於經絡歸屬，與神經支配分布無關"]],"answer":"C","difficulty":"高","explanation":"研究發現：支配後肢深層筋膜（如骨膜）但不支配腹膜的 PROKR2-Cre 感覺神經元，是低強度電針ST36驅動迷走—腎上腺軸（兒茶酚胺釋放）並抑制內毒素引起的全身發炎所必需；剔除這群神經元後，抗炎效果消失。高強度電針在ST25與ST36兩處都能誘發脊髓交感反射，且不受影響。作者也發現 PROKR2-Cre 神經纖維的分布可以預測哪些部位的低強度電針有抗炎效果，為腧穴的選擇性與特異性提供神經解剖基礎（以神經支配解釋，而非經絡歸屬）。注意這是小鼠研究，不能直接推論到人體療效。\n文獻：Liu S, Wang Z, Su Y, Qi L, Yang W, Fu M, Jing X, Wang Y, Ma Q. A neuroanatomical basis for electroacupuncture to drive the vagal–adrenal axis. Nature. 2021;598(7882):641-645. doi:10.1038/s41586-021-04001-4（PMID 34646018）","source":"Liu S, et al. Nature. 2021;598(7882):641-645. doi:10.1038/s41586-021-04001-4","id":"D1-035","h":"b6e170c40f"},{"day":1,"date":"2026-10-08","number":36,"topic":"其他｜腧穴安全：肩井與氣胸","group":"腧穴安全","qtype":"臨床情境","stem":"30歲瘦高男性上班族，因肩頸痠痛在某處接受毫針治療，右側肩井直刺約1.5寸並留針20分鐘。返家約3小時後出現右胸刺痛、呼吸短促、乾咳，平躺時加劇。下列處置何者最適當？","options":[["A","高度懷疑針刺所致氣胸，囑立即至急診安排胸部X光確認，必要時抽氣或胸管引流"],["B","可能是暈針延遲反應，飲溫糖水平臥即可"],["C","屬針後遺留痠痛，局部按揉熱敷即可"],["D","再針內關、膻中以寬胸理氣，觀察一晚"]],"answer":"A","difficulty":"易","explanation":"肩井位於第7頸椎棘突與肩峰端連線中點，宜直刺0.5–0.8寸，深部為肺尖，不可深刺；孕婦禁針。《刺灸心法要訣‧禁針穴歌》有「肩井深時人悶倒」的警語。針刺性氣胸的症狀可能延遲數小時才出現，瘦高體型更危險，須立即轉急診照X光。","source":"本資料庫 acupoints（肩井）；《刺灸心法要訣》卷八‧禁針穴歌；notes「針刺異常情況處理」","id":"D1-036","h":"e573b3fb18"},{"day":1,"date":"2026-10-08","number":37,"topic":"其他｜腧穴刺法與禁忌","group":"腧穴刺法與禁忌","qtype":"非題","stem":"下列腧穴刺法與注意事項，何者錯誤？","options":[["A","中府：向外斜刺或平刺0.5–0.8寸，不可向內深刺"],["B","風府：伏案正坐，向下頜方向緩慢刺入0.5–1寸，不可向上深刺"],["C","章門：肝脾腫大者宜深刺，以疏肝健脾"],["D","承泣：推眼球向上固定，沿眶下緣緩慢直刺，不提插捻轉，出針後按壓"]],"answer":"C","difficulty":"易","explanation":"章門在第11肋游離端下際，其下為肝、脾，肝脾腫大者不可深刺，以免刺傷臟器出血。風府向上深刺可能傷及延髓；承泣容易出血，禁灸、不提插；中府向內深刺可能造成氣胸。","source":"本資料庫 acupoints（章門、風府、承泣、中府）","id":"D1-037","h":"553d59f3e7"},{"day":1,"date":"2026-10-08","number":38,"topic":"其他｜特定穴：交會穴","group":"特定穴","qtype":"概念","stem":"關於下列交會穴的敘述，何者正確？","options":[["A","會陰為任、督、衝三脈之會"],["B","承泣為陽蹻、任脈與足陽明之會"],["C","大杼為手、足太陽之會，亦為八會穴中的骨會"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"會陰是任、督、衝「一源三歧」的交會處；《針灸大成‧奇經八脈簡要》記載陽蹻「又與任脈足陽明會於承泣」；大杼為手、足太陽之會，也是《難經》八會中的骨會。三項皆正確。","source":"本資料庫 acupoints（會陰、承泣、大杼）；《針灸大成》卷九‧奇經八脈簡要","id":"D1-038","h":"5ced10f75e"},{"day":1,"date":"2026-10-08","number":39,"topic":"其他｜腧穴急症：下合穴與轉診","group":"腧穴急症","qtype":"臨床情境","stem":"22歲男性，12小時前臍周疼痛，之後轉移到右下腹，伴噁心、發燒38.3°C，右下腹壓痛及反跳痛。下列處置何者最適當？","options":[["A","委中刺絡放血以瀉熱，次日回診"],["B","依「合治內府」針上巨虛、闌尾穴止痛後，囑回家觀察"],["C","於天樞、神闕重灸以溫通腑氣"],["D","高度懷疑急性闌尾炎，應立即轉介急診外科評估，不宜以針刺止痛延誤診斷"]],"answer":"D","difficulty":"易","explanation":"轉移性右下腹痛加上發燒、腹膜刺激徵（反跳痛），是急性闌尾炎的典型表現，屬外科急症，延誤可能導致穿孔或腹膜炎。雖然《靈樞‧邪氣藏府病形》有「合治內府……大腸入合於巨虛上廉」，上巨虛（大腸下合穴）與闌尾穴也是傳統腸癰用穴，但只能在西醫評估後作為輔助，不能拿來止痛後讓病人回家，以免掩蓋病情。","source":"《靈樞經》卷一‧邪氣藏府病形第四；本資料庫 acupoints（上巨虛）","id":"D1-039","h":"6dfd9d6bcd"},{"day":1,"date":"2026-10-08","number":40,"topic":"其他｜刺灸法：靈樞官鍼十二刺","group":"刺灸法","qtype":"經典","stem":"《靈樞‧官鍼》十二刺中，「傍入而浮之，以治肌急而寒者」稱為？","options":[["A","陰刺"],["B","浮刺"],["C","短刺"],["D","直鍼刺"]],"answer":"B","difficulty":"中","explanation":"原文：「九曰浮刺，浮刺者，傍入而浮之，以治肌急而寒者也。」直鍼刺「引皮乃刺之，以治寒氣之淺者」；短刺「刺骨痹，稍搖而深之，致鍼骨所，以上下摩骨也」；陰刺「左右率刺之，以治寒厥，中寒厥，足踝後少陰也」。","source":"《靈樞經》卷二‧官鍼第七；《針灸甲乙經》卷五‧九針九變十二節五刺五邪第二","id":"D1-040","h":"8706d229e0"},{"day":1,"date":"2026-10-08","number":41,"topic":"其他｜刺灸法：皮下血腫處理","group":"刺灸法","qtype":"臨床情境","stem":"68歲女性長期服用阿斯匹靈，太陽穴出針後局部迅速腫起、皮下青紫，患者十分緊張。下列處置何者最適當？","options":[["A","囑患者自行停用阿斯匹靈一週後再來治療"],["B","先以乾棉球加壓止血並冷敷，24–48小時後改熱敷促進吸收；記錄抗血小板藥物史，日後頭面部取穴宜精簡、出針確實按壓"],["C","立即熱敷並用力揉按，以促進瘀血消散"],["D","於血腫中央再以三稜針點刺，放出瘀血"]],"answer":"B","difficulty":"易","explanation":"急性出血期應先加壓、冷敷止血；24–48小時後再熱敷促進吸收。立即熱敷揉按會加重出血；再刺放血會擴大出血並增加感染風險。抗血小板藥物通常因心血管疾病而開立，不可由針灸醫師囑咐自行停藥，必要時應與處方醫師討論。","source":"notes「針刺異常情況處理」（血腫）","id":"D1-041","h":"96d240569e"},{"day":1,"date":"2026-10-08","number":42,"topic":"其他｜刺灸法：金針賦（男女氣之上下）","group":"刺灸法","qtype":"經典填空","stem":"《針灸大成‧金針賦》：「男子之氣，早在____而晚在____；女子之氣，早在下而晚在上……午前為早屬陽，午後為晚屬陰。男女上下，憑____分之。」空格依序為？","options":[["A","上、下；腰"],["B","內、外；膈"],["C","上、下；臍"],["D","下、上；腰"]],"answer":"A","difficulty":"高","explanation":"原文：「頭有病而足取之，左有病而右取之，男子之氣，早在上而晚在下，取之必明其理；女子之氣，早在下而晚在上，用之必識此時，午前為早屬陽，午後為晚屬陰。男女上下，憑腰分之。」《針灸大成‧南豐李氏補瀉》也說「男女上下，平腰分之」。金針賦作者為明代泉石心（一說出自徐鳳《針灸大全》），收於《針灸大成》卷二。","source":"《針灸大成》卷二‧金針賦；卷五‧南豐李氏補瀉","id":"D1-042","h":"d2afd75316"},{"day":1,"date":"2026-10-08","number":43,"topic":"其他｜特殊針法：焦氏頭針分區","group":"特殊針法","qtype":"臨床情境","stem":"70歲男性，右手靜止性顫抖、動作遲緩一年，神經科診斷為帕金森氏病，目前規律服藥，希望加上頭皮針輔助治療。依焦順發頭針分區，下列何者最適當？","options":[["A","取雙側暈聽區"],["B","取左側舞蹈震顫控制區（運動區向前平移1.5 cm的平行線）"],["C","取右側舞蹈震顫控制區"],["D","取左側視區"]],"answer":"B","difficulty":"中","explanation":"焦氏頭針依大腦皮質功能定位，肢體症狀取「對側」區。舞蹈震顫控制區位於運動區前方1.5 cm的平行線，主治舞蹈病、帕金森氏症候群；右手症狀取左側。暈聽區主眩暈、耳鳴；視區主皮質性視力障礙。頭皮針僅為輔助，應提醒患者不可自行停用抗帕金森藥物。","source":"notes「頭針（頭皮針）」；特殊針法（李育臣）範圍——標準教學大綱","id":"D1-043","h":"7722287259"},{"day":1,"date":"2026-10-08","number":44,"topic":"其他｜特殊針法：耳針安全","group":"特殊針法","qtype":"非題","stem":"關於耳針的操作與禁忌，下列何者錯誤？","options":[["A","有習慣性流產史的孕婦，可常規刺激內生殖器、內分泌等耳穴以安胎"],["B","耳穴須嚴格消毒，以防耳軟骨膜炎"],["C","毫針刺耳穴時，深度以不穿透耳軟骨為度"],["D","耳郭凍傷或有炎症的部位不宜針刺"]],"answer":"A","difficulty":"易","explanation":"孕婦使用耳針應謹慎，有習慣性流產史者禁用，更不可刺激內生殖器、內分泌等穴。耳郭血液循環較差，感染後容易造成耳軟骨膜炎甚至耳郭變形，所以要嚴格消毒、深度不穿透軟骨；凍傷、發炎部位禁針。","source":"notes「耳針」；特殊針法範圍——標準教學大綱","id":"D1-044","h":"7b42b1939c"},{"day":1,"date":"2026-10-08","number":45,"topic":"其他｜特殊針法：針刀四步規程","group":"特殊針法","qtype":"概念","stem":"朱漢章創立的針刀療法，進針「四步規程」中的「定向」，要求刀口線應如何？","options":[["A","一律與皮膚呈45°並斜向頭側"],["B","與施術部位重要血管、神經及肌纖維走向平行"],["C","與重要血管、神經走向垂直，以便切斷粘連"],["D","依經絡循行方向，順經為補、逆經為瀉"]],"answer":"B","difficulty":"中","explanation":"四步規程為：定點→定向→加壓分離→刺入。定向時刀口線要與重要血管、神經及肌纖維走向平行，以免橫斷造成損傷；加壓分離則是讓血管神經被推開後再刺入。迎隨補瀉是毫針刺法的概念，與針刀定向無關。","source":"notes「小針刀、浮針、其他微針系統」；特殊針法範圍——標準教學大綱","id":"D1-045","h":"4c81c4672c"},{"day":1,"date":"2026-10-08","number":46,"topic":"其他｜特殊針法：電針安全","group":"特殊針法","qtype":"非題","stem":"關於電針的操作安全，下列何者錯誤？","options":[["A","延髓、脊髓附近使用電針時，電流量宜小，避免強刺激"],["B","開機前輸出旋鈕應歸零，電流量由小到大逐步調整"],["C","同一對輸出電極可分別接在左右上肢，讓電流橫貫胸部以加強療效"],["D","曾行溫針灸、針柄已氧化者，不宜再接電針夾"]],"answer":"C","difficulty":"易","explanation":"同一對電極不宜跨越心臟（避免左右上肢對接），以免電流通過心臟引起心律不整。其他三項都是正確的電針安全原則；心臟節律器使用者禁用電針，孕婦慎用。","source":"notes「火針、電針、穴位注射、穴位埋線」；特殊針法範圍——標準教學大綱","id":"D1-046","h":"564d2f0419"},{"day":1,"date":"2026-10-08","number":47,"topic":"其他｜治療學：壓力性尿失禁電針（實證）","group":"治療學","qtype":"實證研究","stem":"56歲女性，咳嗽、打噴嚏或提重物時漏尿兩年，尿液檢查無感染，婦科評估無需手術處理的骨盆腔器官脫垂，診斷為壓力性尿失禁。若參考 Liu 等（2017, JAMA）多中心隨機對照試驗設計電針處方，下列何者最符合該研究？","options":[["A","電針雙側中髎（BL33，第3骶後孔）與會陽（BL35，尾骨端旁開0.5寸），每週3次、共6週18次；第6週1小時尿墊試驗漏尿量比假電針組多減少約7.4 g"],["B","電針中髎、會陽雖可減少漏尿，但不良事件發生率顯著高於假電針，因此不建議使用"],["C","電針雙側次髎與白環俞，每週1次共4週，結果與假電針無差異"],["D","電針關元、中極、三陰交，每日1次共4週，主要結局為尿動力學最大尿道閉合壓"],["E","該研究以皮膚穿刺的真針刺於非穴位作為假電針對照"]],"answer":"A","difficulty":"高","explanation":"該試驗在中國12家醫院收納504位壓力性尿失禁女性，電針組取雙側中髎（BL33）與會陽（BL35），進針約50–60 mm，連續波50 Hz、1–5 mA，每次30分鐘，每週3次共6週（18次）。主要結局（第6週1小時尿墊試驗漏尿量變化）：電針組−9.9 g，假電針組−2.6 g，平均差7.4 g（95% CI 4.8–10.0）。治療相關不良事件為1.6%比2.0%，皆屬輕微。假電針是在假穴位上不穿透皮膚。\n文獻：Liu Z, Liu Y, Xu H, et al. Effect of electroacupuncture on urinary leakage among women with stress urinary incontinence: a randomized clinical trial. JAMA. 2017;317(24):2493-2501. doi:10.1001/jama.2017.7220（PMID 28655016；全文 PMC5815072）","source":"Liu Z, et al. JAMA. 2017;317(24):2493-2501. doi:10.1001/jama.2017.7220","id":"D1-047","h":"8e2ca6c5c2"},{"day":1,"date":"2026-10-08","number":48,"topic":"其他｜治療學：慢性功能性便秘電針（實證）＋紅旗","group":"治療學","qtype":"實證研究","stem":"48歲女性，慢性嚴重功能性便秘多年，每週完全自發排便約1次。參考 Liu 等（2016, Ann Intern Med）的電針試驗與特定穴理論，下列何者正確？","options":[["A","該試驗電針雙側天樞、腹結（疏密波10/50 Hz），並針刺雙側上巨虛，8週共28次"],["B","天樞為大腸募穴，上巨虛為大腸下合穴，選穴符合俞募與「合治內府」理論"],["C","8週治療期間，電針組每週完全自發排便次數的增加顯著大於假電針組，且效果持續至第20週追蹤"],["D","若為50歲以上新發便秘，或合併血便、體重減輕、貧血，應先轉介大腸鏡等檢查以排除器質性病變"],["E","以上皆是"]],"answer":"E","difficulty":"高","explanation":"該試驗在15家醫院收納1075位慢性嚴重功能性便秘患者，電針組取雙側天樞（ST25）、腹結（SP14）接電（疏密波10/50 Hz、0.1–1.0 mA，刺至腹肌層），雙側上巨虛（ST37）常規針刺，前2週每週5次、後6週每週3次，共28次。第1–8週每週完全自發排便（CSBM）增加1.76次，假電針組0.87次（組間差0.90，P\u003c0.001）；第9–20週追蹤仍有差異（1.09）。天樞為大腸募穴，上巨虛為大腸下合穴（《靈樞‧邪氣藏府病形》「大腸入合於巨虛上廉」）。紅旗徵象須先排除大腸癌等器質性疾病。四項皆正確。\n文獻：Liu Z, Yan S, Wu J, et al. Acupuncture for chronic severe functional constipation: a randomized trial. Ann Intern Med. 2016;165(11):761-769. doi:10.7326/M15-3118（PMID 27618593；試驗登錄 NCT01726504，選穴與參數依 ClinicalTrials.gov 登錄資料核對）","source":"Liu Z, et al. Ann Intern Med. 2016;165(11):761-769. doi:10.7326/M15-3118；《靈樞經》卷一‧邪氣藏府病形第四","id":"D1-048","h":"5bb67a9049"},{"day":1,"date":"2026-10-08","number":49,"topic":"其他｜治療學：慢性膝痛針刺（實證判讀）","group":"治療學","qtype":"實證研究","stem":"關於 Hinman 等（2014, JAMA）針刺治療慢性膝痛的隨機臨床試驗，下列敘述何者錯誤？","options":[["A","與不治療對照相比，毫針與雷射針在12週時疼痛有小幅改善，但1年時未能維持"],["B","研究結論支持雷射針灸與毫針針刺對50歲以上慢性膝痛的療效顯著優於假雷射，建議作為首選治療"],["C","採 Zelen 設計，收納282位50歲以上慢性膝痛患者，分為不治療對照、毫針、雷射與假雷射四組，治療12週"],["D","12週時，毫針與雷射針在疼痛與功能上均未優於假雷射"]],"answer":"B","difficulty":"中","explanation":"結果：12週時毫針與雷射針在疼痛（平均差−0.4與−0.1）與功能上都沒有優於假雷射；與不治療對照相比，毫針（−1.1）與雷射（−0.8）疼痛有小幅改善，但1年時沒有維持。作者結論是「不支持」對這類患者使用針刺。判讀重點：「優於不治療」不等於「優於假治療」，要分清特異性療效與非特異性（安慰、期待）效應。\n文獻：Hinman RS, McCrory P, Pirotta M, et al. Acupuncture for chronic knee pain: a randomized clinical trial. JAMA. 2014;312(13):1313-1322. doi:10.1001/jama.2014.12660（PMID 25268438）","source":"Hinman RS, et al. JAMA. 2014;312(13):1313-1322. doi:10.1001/jama.2014.12660","id":"D1-049","h":"992dd82c10"},{"day":1,"date":"2026-10-08","number":50,"topic":"其他｜治療學：盜汗（百症賦）＋結核紅旗","group":"治療學","qtype":"臨床情境","stem":"45歲男性，近兩個月夜間盜汗、睡醒衣被濕透，伴午後低熱、乾咳，體重減輕5公斤；舌紅少苔，脈細數。下列敘述何者正確？","options":[["A","依《針灸大成‧百症賦》「陰郄後谿，治盜汗之多出」，可取陰郄、後谿"],["B","陰郄為手少陰心經郄穴，位於腕掌側橫紋上0.5寸、尺側腕屈肌腱橈側"],["C","因合併低熱、慢性咳嗽與體重減輕，應先轉介胸部X光與痰液抗酸菌檢查，排除肺結核等疾病"],["D","以上皆是"]],"answer":"D","difficulty":"中","explanation":"《百症賦》原文：「陰郄後谿，治盜汗之多出。」陰郄是心經郄穴（腕橫紋上0.5寸），後谿是小腸經輸穴、通督脈。但盜汗合併午後低熱、慢性咳嗽、體重減輕是肺結核（或淋巴瘤等）的紅旗組合，應先轉介檢查，確診結核須依法通報並接受標準治療，針灸僅能輔助。三項皆正確。","source":"《針灸大成》卷二‧百症賦；本資料庫 acupoints（陰郄、後谿）","id":"D1-050","h":"f6e0d4af50"},{"day":2,"date":"2026-10-09","number":1,"topic":"Day2｜肺經：腕部穴距離","group":"肺經","qtype":"概念","stem":"以腕掌側橫紋為基準，下列手太陰肺經穴位與腕橫紋距離的敘述，何者正確？","options":[["A","列缺：腕橫紋上1.5寸"],["B","太淵：腕橫紋上1寸"],["C","孔最：腕橫紋上5寸"],["D","經渠：腕橫紋上1.5寸"]],"answer":"A","difficulty":"易","explanation":"太淵位於腕掌側橫紋橈側、橈動脈搏動處（即在橫紋上）；經渠在腕橫紋上1寸；列缺在橈骨莖突上方、腕橫紋上1.5寸（《甲乙經》「去腕上一寸五分」）；孔最在尺澤與太淵連線上、腕橫紋上7寸（《甲乙經》「去腕七寸」）。","source":"本資料庫腧穴表（WHO 2008 標準定位）；《針灸甲乙經》卷三‧手太陰及臂凡一十八穴第二十四","id":"D2-001","h":"1d4a5b9e4c"},{"day":2,"date":"2026-10-09","number":2,"topic":"Day2｜肺經：中府、雲門定位","group":"肺經","qtype":"概念","stem":"關於中府與雲門兩穴的定位，下列何者正確？","options":[["A","雲門位於第1肋間隙，中府位於鎖骨下窩凹陷中"],["B","雲門位於鎖骨下窩凹陷中；中府在其下約1寸、平第1肋間隙；兩穴均距前正中線6寸"],["C","兩穴雖同屬肺經，但肺之募穴為雲門"],["D","中府平第2肋間隙、距前正中線4寸"]],"answer":"B","difficulty":"中","explanation":"現代定位：雲門在鎖骨下窩凹陷、喙突內緣，前正中線旁開6寸；中府平第1肋間隙、旁開6寸，為肺之募穴（手、足太陰之會）。《甲乙經》：「中府，肺之募也，一名膺中俞，在雲門下一寸，乳上三肋間陷者中」。距前正中線4寸者為足陽明胸部諸穴。兩穴深部為肺，皆不可向內深刺。","source":"《針灸甲乙經》卷三‧胸自雲門俠氣戶兩傍各二寸下行至食竇凡十二穴第十七；本資料庫腧穴表","id":"D2-002","h":"3bfbab10c6"},{"day":2,"date":"2026-10-09","number":3,"topic":"Day2｜肺經：經渠禁灸（甲乙）","group":"肺經","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「經渠者，金也。在寸口陷者中，手太陰之所行也，為經……不可灸，灸之傷人____。」空格應填？","options":[["A","神明"],["B","目明"],["C","心氣"],["D","逆氣"]],"answer":"A","difficulty":"中","explanation":"原文為「不可灸，灸之傷人神明」。經渠為肺經經穴（陰經經穴屬金），位於腕橫紋上1寸、橈骨莖突與橈動脈之間，現代刺法亦須避開橈動脈。「灸之令人逆氣」是《甲乙經》對天府的禁灸警語。","source":"《針灸甲乙經》卷三‧手太陰及臂凡一十八穴第二十四","id":"D2-003","h":"9a1fb5f711"},{"day":2,"date":"2026-10-09","number":4,"topic":"Day2｜腧穴禁忌：甲乙經禁灸禁刺","group":"腧穴禁忌","qtype":"非題","stem":"下列《針灸甲乙經》卷三所載穴位禁忌與其後果的配對，何者錯誤？","options":[["A","雲門：禁不可灸，灸之令人逆息"],["B","氣沖：灸之不幸，使人不得息"],["C","天府：禁不可灸，灸之令人逆氣"],["D","人迎：禁不可灸，刺入四分，過深不幸殺人"]],"answer":"A","difficulty":"高","explanation":"《甲乙經》載雲門「刺入七分，灸五壯，刺太深令人逆息」，是深刺的警示，並非禁灸。天府「禁不可灸，灸之令人逆氣」；氣沖「灸之不幸，使人不得息」；人迎「禁不可灸，刺入四分，過深不幸殺人」，皆與原文相符。","source":"《針灸甲乙經》卷三‧第十二、第十七、第二十一、第二十四","id":"D2-004","h":"85bebe9176"},{"day":2,"date":"2026-10-09","number":5,"topic":"Day2｜肺經：少商放血＋扁桃腺周圍膿瘍紅旗","group":"肺經","qtype":"臨床情境","stem":"32歲男性，咽喉腫痛、發燒三天，原診為風熱乳蛾（急性扁桃腺炎）。今日張口困難，說話含糊像口含熱物，右側軟顎明顯腫脹、懸雍垂偏向左側，口水流出無法吞嚥。下列處置何者最適當？","options":[["A","加刺天突，沿胸骨柄後緣向下深刺1.5寸以利咽"],["B","少商、商陽點刺出血後即可返家觀察"],["C","溫灸大椎、肺俞各20分鐘助退熱，三日後回診"],["D","疑為扁桃腺周圍膿瘍，應立即轉介耳鼻喉科或急診評估引流與抗生素，不宜僅以針刺處理"]],"answer":"D","difficulty":"中","explanation":"咽喉腫痛實證可取少商（肺經井穴，淺刺0.1寸或點刺出血）、合谷、尺澤、內庭。但張口困難（牙關緊閉）、含熱物樣語音、單側軟顎膨隆、懸雍垂偏移，是扁桃腺周圍膿瘍的典型紅旗；流涎、無法吞嚥也須警覺會厭炎等呼吸道危急狀況，應立即轉介，針刺最多只能作為輔助。天突深刺有傷及氣管與大血管的風險；咽喉實熱證也不宜溫灸。","source":"本資料庫腧穴表（少商）；notes：針灸治療學（咽喉腫痛）；臨床轉介原則","id":"D2-005","h":"d3399c16a1"},{"day":2,"date":"2026-10-09","number":6,"topic":"Day2｜靈樞經脈：手太陰所生病","group":"靈樞經脈","qtype":"經典填空","stem":"《靈樞‧經脈》：「是主肺所生病者，欬，上氣喘喝，煩心胸滿，臑臂內前廉痛厥，____。」空格應填？","options":[["A","肩前臑痛"],["B","缺盆中痛"],["C","大指次指痛不用"],["D","掌中熱"]],"answer":"D","difficulty":"易","explanation":"原文為「臑臂內前廉痛厥，掌中熱」。「缺盆中痛」屬手太陰的是動病（「肺脹滿，膨膨而喘欬，缺盆中痛，甚則交兩手而瞀，此為臂厥」）；「肩前臑痛，大指次指痛不用」則是手陽明大腸經的所生病。","source":"《靈樞經》卷三‧經脈第十","id":"D2-006","h":"e1d0162fab"},{"day":2,"date":"2026-10-09","number":7,"topic":"Day2｜大腸經：前臂穴距離","group":"大腸經","qtype":"非題","stem":"以陽谿與曲池連線為準，下列手陽明大腸經前臂穴位的定位，何者錯誤？","options":[["A","上廉：肘橫紋下3寸"],["B","溫溜：腕橫紋上7寸"],["C","手三里：肘橫紋下2寸"],["D","偏歷：腕橫紋上3寸"]],"answer":"B","difficulty":"中","explanation":"溫溜（大腸經郄穴）在腕橫紋上5寸（《甲乙經》「在腕後少士五寸，大士六寸」，少士、大士指小兒與大人）。偏歷（絡穴）在腕上3寸；下廉、上廉、手三里分別在肘橫紋下4、3、2寸。","source":"本資料庫腧穴表；《針灸甲乙經》卷三‧手陽明及臂凡二十八穴第二十七","id":"D2-007","h":"58977ec76b"},{"day":2,"date":"2026-10-09","number":8,"topic":"Day2｜大腸經：合谷孕婦禁針","group":"大腸經","qtype":"臨床情境","stem":"29歲女性，懷孕10週，因工作壓力出現緊張型頭痛，血壓正常、無視力模糊與上腹痛，希望接受針灸。下列穴位中，依傳統禁忌最應避免針刺的是？","options":[["A","風池"],["B","印堂"],["C","太陽"],["D","合谷"]],"answer":"D","difficulty":"易","explanation":"合谷為大腸經原穴，「面口合谷收」，常用於頭面疾患；但歷來列為孕婦禁針，與三陰交配伍有墮胎之說，孕期應避免。孕婦的頭痛須留意紅旗：若出現高血壓、視覺異常、上腹痛或水腫（妊娠後期尤需警覺子癲前症），應轉介產科。","source":"本資料庫腧穴表（合谷：孕婦禁針）；notes：針灸治療學","id":"D2-008","h":"973e23bfd8"},{"day":2,"date":"2026-10-09","number":9,"topic":"Day2｜大腸經：曲池取穴（甲乙）","group":"大腸經","qtype":"經典填空","stem":"《針灸甲乙經》載曲池：「在肘外輔骨肘骨之中，手陽明脈之所入也，為合。以手____取之。」空格應填？","options":[["A","舉臂"],["B","叉腰"],["C","伸臂"],["D","按胸"]],"answer":"D","difficulty":"高","explanation":"原文為「以手按胸取之」：屈肘、以手按胸（拱手）時，肘橫紋外側端明顯，便於取穴。《靈樞‧本輸》亦謂曲池「在肘外輔骨陷者中，屈臂而得之」。現代定位：屈肘時，肘橫紋外側端與肱骨外上髁連線的中點。「舉臂取之」是《甲乙經》對雲門的取法。","source":"《針灸甲乙經》卷三‧第二十七、第十七；《靈樞經》卷一‧本輸第二","id":"D2-009","h":"39d11bf2c0"},{"day":2,"date":"2026-10-09","number":10,"topic":"Day2｜大腸經：頸面部穴定位","group":"大腸經","qtype":"非題","stem":"下列手陽明大腸經頸面部穴位的定位，何者錯誤？","options":[["A","扶突：喉結旁1.5寸，胸鎖乳突肌前緣，頸總動脈搏動處"],["B","迎香：鼻翼外緣中點旁，鼻唇溝中"],["C","口禾髎：鼻孔外緣直下，平水溝"],["D","天鼎：扶突直下1寸，胸鎖乳突肌後緣"]],"answer":"A","difficulty":"中","explanation":"喉結旁1.5寸、胸鎖乳突肌前緣、頸總動脈搏動處是足陽明的人迎。扶突在喉結旁約3寸，位於胸鎖乳突肌胸骨頭與鎖骨頭之間；《甲乙經》謂扶突「在人迎後一寸五分」。迎香為手、足陽明之會。","source":"本資料庫腧穴表；《針灸甲乙經》卷三‧頸凡十七穴第十二","id":"D2-010","h":"7d3bcaaebd"},{"day":2,"date":"2026-10-09","number":11,"topic":"Day2｜靈樞經脈：是主○所生病","group":"靈樞經脈","qtype":"非題","stem":"《靈樞‧經脈》中各經「是主○所生病」的配對，下列何者錯誤？","options":[["A","足陽明胃經：是主血所生病"],["B","手陽明大腸經：是主液所生病"],["C","手太陰肺經：是主肺所生病"],["D","足太陰脾經：是主脾所生病"]],"answer":"B","difficulty":"中","explanation":"手陽明是「主津液所生病者，目黃，口乾，鼽衄，喉痹……」。「是主液所生病」屬手太陽小腸經（「耳聾，目黃，頰腫……」）。肺主肺、胃主血、脾主脾，皆合原文。","source":"《靈樞經》卷三‧經脈第十","id":"D2-011","h":"7bb25f8222"},{"day":2,"date":"2026-10-09","number":12,"topic":"Day2｜胃經：承泣定位（甲乙）","group":"胃經","qtype":"經典填空","stem":"《針灸甲乙經》載：「承泣，一名鼷穴，一名面，在目下____，直目瞳子，陽蹺、任脈、足陽明之會，刺入三分，不可灸。」空格應填？","options":[["A","一寸"],["B","三分"],["C","五分"],["D","七分"]],"answer":"D","difficulty":"中","explanation":"原文為「在目下七分，直目瞳子」。同書載四白「在目下一寸」，故承泣在上、四白在下。現代定位：承泣在瞳孔直下、眼球與眶下緣之間。該處易出血，出針後須按壓。","source":"《針灸甲乙經》卷三（面部諸穴）；本資料庫腧穴表","id":"D2-012","h":"163164b297"},{"day":2,"date":"2026-10-09","number":13,"topic":"Day2｜胃經：下關取穴（本輸）","group":"胃經","qtype":"經典","stem":"《靈樞‧本輸》：「刺上關者，呿不能欠，刺下關者，欠不能呿。」《甲乙經》亦載下關「合口有孔，張口即閉」。據此，針刺下關時的體位要求為何？","options":[["A","張口取穴，留針期間保持張口"],["B","咬緊牙關，使咬肌隆起時取穴"],["C","閉口取穴，留針期間不可張口"],["D","張口取穴，進針後再閉口"]],"answer":"C","difficulty":"高","explanation":"下關在顴弓下緣與下頜切跡形成的凹陷中，閉口時才有孔隙（「合口有孔，張口即閉」），所以要閉口取穴，留針期間不可張口，以免彎針、滯針。注家多將「呿」解為張口、「欠」解為合口，即刺上關（客主人）宜張口，刺下關宜合口。咬牙使咬肌隆起是頰車的取法（《甲乙經》頰車「開口有孔」）。","source":"《靈樞經》卷一‧本輸第二；《針灸甲乙經》卷三‧耳前後凡二十穴第十一","id":"D2-013","h":"1e3c9b2837"},{"day":2,"date":"2026-10-09","number":14,"topic":"Day2｜胃經：人迎","group":"胃經","qtype":"非題","stem":"關於人迎穴，下列何者錯誤？","options":[["A","古籍載人迎宜多灸，現代可施化膿灸治療高血壓"],["B","針刺時須避開頸總動脈，直刺0.3–0.8寸"],["C","《甲乙經》謂其「以候五臟氣」，並警示「過深不幸殺人」"],["D","位於喉結旁1.5寸，胸鎖乳突肌前緣，頸總動脈搏動處"]],"answer":"A","difficulty":"易","explanation":"《甲乙經》：人迎「在頸大脈動應手，俠結喉，以候五臟氣，足陽明脈氣所發，禁不可灸，刺入四分，過深不幸殺人」，現代亦列為禁灸，因此不可施化膿灸。人迎為足陽明、足少陽之會，針刺須避開頸總動脈。","source":"《針灸甲乙經》卷三‧頸凡十七穴第十二；本資料庫腧穴表","id":"D2-014","h":"d538d8eaf4"},{"day":2,"date":"2026-10-09","number":15,"topic":"Day2｜胃經：胸部旁開4寸","group":"胃經","qtype":"概念","stem":"位於第3肋間隙、前正中線旁開4寸的穴位是？","options":[["A","膺窗"],["B","胸鄉"],["C","屋翳"],["D","靈墟"]],"answer":"A","difficulty":"中","explanation":"足陽明胸部諸穴距前正中線4寸：氣戶在鎖骨下緣，庫房在第1肋間、屋翳第2、膺窗第3、乳中第4、乳根第5肋間。同在第3肋間者：足少陰靈墟旁開2寸，足太陰胸鄉旁開6寸。","source":"本資料庫腧穴表；《針灸甲乙經》卷三‧第十五至第十七","id":"D2-015","h":"7d20bfb42d"},{"day":2,"date":"2026-10-09","number":16,"topic":"Day2｜胃經：乳中禁刺灸（甲乙）","group":"胃經","qtype":"經典填空","stem":"《針灸甲乙經》：「乳中，禁不可刺灸，灸刺之，不幸生____，瘡中有膿血清汁者可治，瘡中有息肉若蝕瘡者死。」空格應填？","options":[["A","瘰癧"],["B","癰疽"],["C","乳癖"],["D","蝕瘡"]],"answer":"D","difficulty":"易","explanation":"原文為「不幸生蝕瘡」。乳中位於乳頭中央（第4肋間隙），現代亦不針不灸，只作胸腹部取穴的定位標誌，例如乳根在乳頭直下第5肋間。","source":"《針灸甲乙經》卷三‧胸自氣戶俠輸府兩傍各二寸下行至乳根凡十二穴第十六；本資料庫腧穴表","id":"D2-016","h":"d4c5416f3f"},{"day":2,"date":"2026-10-09","number":17,"topic":"Day2｜胃經：腹部旁開2寸","group":"胃經","qtype":"非題","stem":"下列足陽明胃經腹部穴位（皆距前正中線2寸）的定位，何者錯誤？","options":[["A","梁門：臍中上4寸"],["B","外陵：臍中下2寸"],["C","水道：臍中下3寸"],["D","歸來：臍中下4寸"]],"answer":"B","difficulty":"中","explanation":"臍上：不容6寸、承滿5、梁門4、關門3、太乙2、滑肉門1；平臍為天樞（大腸募）；臍下：外陵1寸、大巨2、水道3、歸來4、氣衝5。外陵應在臍下1寸。《甲乙經》篇名作「腹自不容俠幽門兩傍各一寸五分」，因幽門距中線0.5寸，故胃經距中線2寸。","source":"本資料庫腧穴表；《針灸甲乙經》卷三‧第二十一","id":"D2-017","h":"f23524a0cf"},{"day":2,"date":"2026-10-09","number":18,"topic":"Day2｜五輸穴：本輸足陽明（下合）","group":"五輸穴","qtype":"經典填空","stem":"《靈樞‧本輸》：「入於下陵，下陵，膝下三寸……為合。復下三里三寸，為巨虛上廉，復下上廉三寸，為巨虛下廉也，大腸屬____，小腸屬____，足陽明胃脈也。」空格依序應填？","options":[["A","下；上"],["B","三里；上"],["C","下；三里"],["D","上；下"]],"answer":"D","difficulty":"中","explanation":"原文為「大腸屬上，小腸屬下」：巨虛上廉（上巨虛，犢鼻下6寸）為大腸下合穴，巨虛下廉（下巨虛，犢鼻下9寸）為小腸下合穴；下陵即足三里（犢鼻下3寸），為胃經合穴兼胃之下合穴。同篇並謂「大腸小腸，皆屬於胃」。","source":"《靈樞經》卷一‧本輸第二；本資料庫腧穴表","id":"D2-018","h":"f64ed8f180"},{"day":2,"date":"2026-10-09","number":19,"topic":"Day2｜胃經：足三里＋消化道警訊轉診","group":"胃經","qtype":"臨床情境","stem":"62歲男性，上腹悶痛三個月，自認「胃寒」，希望接受足三里艾灸。近兩個月體重減輕6公斤，曾解黑便，結膜蒼白。下列處置何者最適當？","options":[["A","先轉介腸胃科安排胃鏡及血液檢查，排除消化道出血與惡性腫瘤，再評估輔助針灸"],["B","改刺胃經郄穴止痛，無需進一步檢查"],["C","足三里直刺2寸，行溫補手法以溫胃散寒即可"],["D","足三里配中脘溫和灸，每日一次，連續四週後再評估"]],"answer":"A","difficulty":"易","explanation":"足三里為胃經合穴、胃之下合穴，「肚腹三里留」，常用於胃痛腹脹。但中老年人新發上腹痛合併體重減輕、黑便、貧血，屬消化道警訊（出血、腫瘤），必須先轉介腸胃科做內視鏡檢查，不可單憑辨證施灸而延誤診斷。","source":"本資料庫腧穴表（足三里）；臨床轉介原則","id":"D2-019","h":"2aa350db7c"},{"day":2,"date":"2026-10-09","number":20,"topic":"Day2｜靈樞經脈：所生病「指不用」","group":"靈樞經脈","qtype":"非題","stem":"《靈樞‧經脈》所生病中「○指不用」的描述與經脈配對，下列何者錯誤？","options":[["A","足少陽膽經：小指次指不用"],["B","足太陰脾經：中指不用"],["C","手陽明大腸經：大指次指痛不用"],["D","足陽明胃經：中指不用"]],"answer":"B","difficulty":"高","explanation":"足太陰所生病為「股膝內腫厥，足大指不用」，與脾經「起於大指之端」相應。足陽明為「中指不用」（胃經「下足跗，入中指內間」）；手陽明為「肩前臑痛，大指次指痛不用」；足少陽（以及手少陽）皆有「小指次指不用」。","source":"《靈樞經》卷三‧經脈第十","id":"D2-020","h":"11e46ad7e1"},{"day":2,"date":"2026-10-09","number":21,"topic":"Day2｜脾經：隱白崩漏＋生命徵象不穩","group":"脾經","qtype":"臨床情境","stem":"48歲女性，月經量多、淋漓兩週，面色萎黃、神疲乏力。今日起身時眼前發黑、心悸，血壓 86/52 mmHg、心跳每分鐘118次，衛生棉每小時需更換兩片以上。下列處置何者最適當？","options":[["A","關元、氣海隔附子餅灸以益氣固脫，無須轉診"],["B","隱白麥粒灸配三陰交，觀察一小時後返家"],["C","生命徵象不穩，應立即轉急診輸液、檢驗血紅素並止血；穩定後再考慮隱白艾灸等輔助"],["D","隱白點刺放血，依「血實宜決之」止血"]],"answer":"C","difficulty":"中","explanation":"隱白為脾經井穴（陰經井穴屬木），主月經過多、崩漏，臨床多用灸。但低血壓、心搏過速加上大量出血，代表急性失血、血行動力學不穩，須立即送急診。此外，48歲的異常子宮出血也應轉婦產科評估子宮內膜病變。點刺放血用於實熱、瘀血證，不適用於此。","source":"本資料庫腧穴表（隱白）；臨床轉介原則","id":"D2-021","h":"b8a9bd61d0"},{"day":2,"date":"2026-10-09","number":22,"topic":"Day2｜脾經：陰陵泉＋深部靜脈栓塞紅旗","group":"脾經","qtype":"臨床情境","stem":"70歲女性，右膝人工關節置換術後3週，右小腿突然腫脹、壓痛、皮膚溫熱，小腿圍比左側粗3公分，並感輕微氣喘。家屬希望針刺陰陵泉以利水消腫。下列處置何者最適當？","options":[["A","懷疑深部靜脈栓塞（並須排除肺栓塞），應暫停針刺推拿，立即轉介急診"],["B","陰陵泉、三陰交直刺並加電針，以促進靜脈回流"],["C","患側小腿局部刺絡拔罐以消瘀"],["D","陰陵泉配足三里溫針灸，三次無效再轉介"]],"answer":"A","difficulty":"中","explanation":"陰陵泉為脾經合穴（陰經合穴屬水），主腹脹、水腫、小便不利。但術後單側小腿腫痛、皮溫升高，是深部靜脈栓塞的紅旗，合併氣喘更須排除肺栓塞，應立即轉診；患肢局部的針刺、電針、拔罐與按摩都可能有風險，應避免。","source":"本資料庫腧穴表（陰陵泉）；臨床轉介原則","id":"D2-022","h":"2e79cf5ce4"},{"day":2,"date":"2026-10-09","number":23,"topic":"Day2｜脾經：小腿內側穴距離","group":"脾經","qtype":"非題","stem":"下列足太陰脾經小腿與膝部穴位的定位，何者錯誤？","options":[["A","血海：屈膝，髕底內側端上2寸，股內側肌隆起處"],["B","三陰交：內踝尖上3寸，脛骨內側緣後方"],["C","地機：陰陵泉下3寸，脛骨內側緣後方"],["D","漏谷：內踝尖上8寸，脛骨內側緣後方"]],"answer":"D","difficulty":"中","explanation":"漏谷在內踝尖上6寸（《甲乙經》「在內踝上六寸骨下陷者中」）。內踝上8寸是足厥陰與足太陰在小腿內側交叉、肝經「交出太陰之後」的部位，不是漏谷的位置。三陰交為足太陰、厥陰、少陰之會；地機為脾經郄穴，《甲乙經》作「在膝下五寸」。","source":"本資料庫腧穴表；《針灸甲乙經》卷三‧足太陰及股凡二十二穴第三十；《靈樞經》經脈第十","id":"D2-023","h":"21102a0f92"},{"day":2,"date":"2026-10-09","number":24,"topic":"Day2｜脾經：血海與癮疹","group":"脾經","qtype":"臨床情境","stem":"35歲女性，反覆蕁麻疹（癮疹）半年，遇風加劇、搔癢難耐，無呼吸困難或嘴唇腫脹。依「治風先治血，血行風自滅」的原則，下列何穴最常與曲池、合谷配伍？","options":[["A","箕門"],["B","血海"],["C","梁丘"],["D","陰市"]],"answer":"B","difficulty":"易","explanation":"血海位於屈膝時髕底內側端上2寸、股內側肌隆起處（《甲乙經》「在膝臏上內廉白肉際二寸中」），主月經不調、崩漏及癮疹、濕疹，與曲池、合谷、膈俞配伍治風疹。梁丘、陰市在髕底外側端上方（胃經），箕門在血海上6寸。若出現呼吸困難、喉頭或口唇腫脹等過敏性休克徵象，應立即急救轉診。","source":"本資料庫腧穴表；notes：針灸治療學（癮疹）；《針灸甲乙經》卷三‧第三十","id":"D2-024","h":"4a7c6177e6"},{"day":2,"date":"2026-10-09","number":25,"topic":"Day2｜五輸穴：甲乙經「所出為井」","group":"五輸穴","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「所出為井，所溜為滎，所注為俞，所過為____，所行為經，所入為合。」空格應填？","options":[["A","原"],["B","絡"],["C","募"],["D","郄"]],"answer":"A","difficulty":"易","explanation":"原文為「所過為原」。《靈樞‧九鍼十二原》只言五腧（「所出為井，所溜為滎，所注為腧，所行為經，所入為合」）；〈本輸〉則於六腑各經另記「過於……為原」，因此陽經有六輸、陰經以輸代原，即「五五二十五腧，六六三十六腧」。","source":"《針灸甲乙經》卷三‧第二十四；《靈樞經》卷一‧九鍼十二原第一、本輸第二","id":"D2-025","h":"27770a5298"},{"day":2,"date":"2026-10-09","number":26,"topic":"Day2｜五輸穴：本輸之五行記載","group":"五輸穴","qtype":"經典","stem":"《靈樞‧本輸》敘述五臟六腑五輸穴時，對五行屬性的記載有何特點？","options":[["A","陰經井穴標「井木」，陽經井穴標「井火」"],["B","只在合穴標明五行：陰經合穴屬水，陽經合穴屬土"],["C","只在井穴標明五行：陰經井穴「為井木」，陽經井穴「為井金」，其餘各輸未標五行"],["D","五輸穴逐一標明五行：陰經依木火土金水，陽經依金水木火土"]],"answer":"C","difficulty":"高","explanation":"〈本輸〉如「肺出於少商……為井木」「膀胱出於至陰……為井金」，只在井穴標五行，滎、輸、經、合都未標。五輸穴逐一配五行的完整記載見於《甲乙經》卷三（如「少商者，木也」「魚際者，火也」「太淵者，土也」）。","source":"《靈樞經》卷一‧本輸第二；《針灸甲乙經》卷三‧第二十四","id":"D2-026","h":"faadd622d0"},{"day":2,"date":"2026-10-09","number":27,"topic":"Day2｜五輸穴：本輸「心出於中衝」","group":"五輸穴","qtype":"經典","stem":"《靈樞‧本輸》載「心出於中衝……溜於勞宮……注於大陵……行於間使……入於曲澤」。關於這段記載，下列何者正確？","options":[["A","本篇以中衝為心經滎穴、勞宮為井穴"],["B","此為手少陰心經本經的五輸穴，與後世相同"],["C","所列五穴實屬手厥陰心包經，本篇以心包代心列其輸，未列手少陰本經五輸"],["D","本篇另列少衝、少府、神門、靈道、少海為心包經五輸"]],"answer":"C","difficulty":"高","explanation":"中衝、勞宮、大陵、間使、曲澤是後世所稱手厥陰心包經的五輸穴。《靈樞‧邪客》解釋：「諸邪之在於心者，皆在於心之包絡……故獨無腧焉」，黃帝並問「少陰獨無腧者，不病乎」。後世補入手少陰本經五輸：少衝、少府、神門、靈道、少海（見《針灸大成》井榮俞原經合歌）。","source":"《靈樞經》卷一‧本輸第二、卷十‧邪客第七十一；《針灸大成》卷七","id":"D2-027","h":"08e3c8f462"},{"day":2,"date":"2026-10-09","number":28,"topic":"Day2｜五輸穴：本輸四時取穴","group":"五輸穴","qtype":"經典填空","stem":"《靈樞‧本輸》：「春取絡脈諸滎大經分肉之間……夏取諸俞孫絡肌肉皮膚之上。秋取諸____，餘如春法。冬取諸井諸俞之分，欲深而留之。」空格應填？","options":[["A","合"],["B","經"],["C","井"],["D","滎"]],"answer":"A","difficulty":"高","explanation":"原文為「秋取諸合，餘如春法」。〈本輸〉的四時取穴是：春取絡脈與諸滎，夏取諸俞，秋取諸合，冬取諸井與諸俞之分，並深刺久留。《針灸大成》引項氏「春刺井……冬刺合」，是另一套以五輸穴配四時的說法，不可混淆。","source":"《靈樞經》卷一‧本輸第二；《針灸大成》卷七‧井榮俞原經合橫圖","id":"D2-028","h":"1d6bc93d89"},{"day":2,"date":"2026-10-09","number":29,"topic":"Day2｜子母補瀉：本經子母","group":"子母補瀉","qtype":"非題","stem":"依本經子母補瀉法（虛則補其母，實則瀉其子），下列取穴何者錯誤？","options":[["A","足太陰脾經實證：瀉商丘"],["B","手陽明大腸經實證：瀉三間"],["C","足陽明胃經實證：瀉厲兌"],["D","手陽明大腸經虛證：補曲池"]],"answer":"B","difficulty":"中","explanation":"大腸屬金，金生水，子穴為滎水二間，實證應瀉二間；三間為輸木。虛證補母穴合土曲池。胃屬土，實證瀉子穴井金厲兌，虛證補母穴經火解谿。脾屬土，實證瀉子穴經金商丘，虛證補母穴滎火大都。","source":"《針灸大成》卷七‧十二經病井榮俞經合補瀉虛實","id":"D2-029","h":"ec7074e013"},{"day":2,"date":"2026-10-09","number":30,"topic":"Day2｜子母補瀉：異經子母","group":"子母補瀉","qtype":"臨床情境","stem":"48歲女性，食少便溏、神疲肢倦、舌淡苔白、脈緩弱，辨為脾氣虛。若採「異經子母補瀉」，補其母經的本穴，應取何穴？","options":[["A","大都"],["B","少府"],["C","神門"],["D","經渠"]],"answer":"B","difficulty":"高","explanation":"脾屬土，火生土，母經為屬火的手少陰心經；心經的本穴（火經中的火穴）是滎火少府。若用本經補母，則取脾經滎火大都。脾實證採異經瀉子時，取子經（肺，屬金）的金穴經渠。神門是心經輸土。","source":"《針灸大成》卷七；本資料庫腧穴表（五輸五行）","id":"D2-030","h":"c79ca65350"},{"day":2,"date":"2026-10-09","number":31,"topic":"Day2｜子母補瀉：納子法補瀉時辰","group":"子母補瀉","qtype":"經典","stem":"依《針灸大成》〈十二經病井榮俞經合補瀉虛實〉，足太陰脾經以納子法配合子母補瀉的時穴，下列何者正確？","options":[["A","虛則巳時補大都；實則午時瀉商丘"],["B","虛則辰時補商丘；實則巳時瀉大都"],["C","虛則午時補大都；實則巳時瀉商丘"],["D","虛則午時補太白；實則巳時瀉陰陵泉"]],"answer":"C","difficulty":"高","explanation":"原文：脾經「已時注此」（已即巳）；「補用午時，大都為榮火，火生土，虛則補其母；瀉用巳時，商邱為經金，土生金，實則瀉其子」。瀉法在本經氣血方盛的時辰（巳）迎而奪之；補法在氣血方過的下一時辰（午）隨而濟之。","source":"《針灸大成》卷七‧十二經病井榮俞經合補瀉虛實","id":"D2-031","h":"c49c6fb4f8"},{"day":2,"date":"2026-10-09","number":32,"topic":"Day2｜古代部位名稱：頭面","group":"古代部位名稱","qtype":"非題","stem":"依《刺灸心法要訣‧周身名位骨度》，下列古代頭面部位名稱的解釋，何者錯誤？","options":[["A","蔽：耳門"],["B","頞：鼻梁，即山根"],["C","顑：俗稱腮，口旁頰前肉的空軟處"],["D","頷：目下的眶骨，向內下連接上牙床"]],"answer":"D","difficulty":"中","explanation":"「目下之眶骨，顴骨內下連上牙床者」是䪼（音拙）。頷是「頦下結喉上，兩側肉之空軟處」。頞即鼻梁山根；顑俗呼為腮；蔽者耳門。","source":"《刺灸心法要訣》卷二‧周身名位骨度","id":"D2-032","h":"6975a49638"},{"day":2,"date":"2026-10-09","number":33,"topic":"Day2｜古代部位名稱：核骨與脾經","group":"古代部位名稱","qtype":"概念","stem":"《靈樞‧經脈》謂足太陰脾經「起於大指之端，循指內側白肉際，過核骨後，上內踝前廉」。「核骨」所指為何？","options":[["A","足跟骨"],["B","足大趾本節（第1蹠趾關節）後內側的圓形突起"],["C","足外側大骨（第5蹠骨粗隆）"],["D","內踝"]],"answer":"B","difficulty":"中","explanation":"《刺灸心法要訣》：「其大趾之本節後內側，圓骨形突者，名核骨。」《甲乙經》載太白「在足內側核骨下陷者中」，現代定位為第1蹠趾關節後下方赤白肉際凹陷，與此相符。足外側大骨是《靈樞‧本輸》中京骨所在。","source":"《刺灸心法要訣》卷二‧周身名位骨度；《靈樞經》經脈第十、本輸第二；《針灸甲乙經》卷三‧第三十","id":"D2-033","h":"588506798c"},{"day":2,"date":"2026-10-09","number":34,"topic":"Day2｜古代部位名稱：下肢","group":"古代部位名稱","qtype":"非題","stem":"依《刺灸心法要訣‧周身名位骨度》，下列下肢古代名稱的解釋，何者錯誤？","options":[["A","膕：膝後彎曲處，俗名腿凹"],["B","伏兔：髀骨前、膝之上，起肉似俯伏之兔"],["C","連骸：膝上的蓋骨，即髕骨"],["D","踝骨：胻骨之下、足跗之上兩旁突出的高骨"]],"answer":"C","difficulty":"易","explanation":"「膝上蓋骨」是臏骨；連骸是「膝外側二高骨」。膕為「膝後屈外，俗名腿凹」；伏兔「髀骨前膝之上，起肉似俯兔」（胃經伏兔穴即在髕底上6寸）；踝骨在外為外踝、在內為內踝。","source":"《刺灸心法要訣》卷二‧周身名位骨度","id":"D2-034","h":"53fd22ae32"},{"day":2,"date":"2026-10-09","number":35,"topic":"Day2｜腧穴主治實證：足三里、公孫與餐後不適症候群","group":"腧穴主治實證","qtype":"實證研究","stem":"Yang JW 等人2020年發表於《Annals of Internal Medicine》的多中心隨機試驗（doi:10.7326/M19-2880），比較真針刺與假針刺治療功能性消化不良中的餐後不適症候群（PDS）。下列敘述何者正確？","options":[["A","固定取穴包含足三里與公孫（另有中脘、內關、天樞等），共治療12次（4週），第4週反應率約83%，高於假針刺組約52%"],["B","第4週兩組反應率無顯著差異，追蹤至第16週真針刺組才較佳"],["C","因發生數例嚴重不良事件而提前終止"],["D","固定取穴只有足三里一穴，並以 2/100 Hz 電針刺激"]],"answer":"A","difficulty":"中","explanation":"Yang JW, Wang LQ, Zou X, et al. Ann Intern Med 2020;172(12):777-785（PMID 32422066）。278名符合 Rome IV 的 PDS 患者，接受12次（4週）真針刺或假針刺。第4週反應率83.0%對51.6%（差異31.4個百分點，P\u003c0.001），療效維持到12週追蹤，無嚴重不良事件。依試驗計畫書（Hou YQ et al. Trials 2018, doi:10.1186/s13063-018-3051-3）與 ISRCTN12511434 登錄，固定穴為百會、膻中、中脘、氣海及雙側天樞、內關、足三里、公孫，並依證型加太白、太衝或內庭。","source":"Yang JW et al. Ann Intern Med 2020;172(12):777-785. doi:10.7326/M19-2880","id":"D2-035","h":"512614fc23"},{"day":2,"date":"2026-10-09","number":36,"topic":"其他｜灸法：隔物灸適應症","group":"灸法","qtype":"非題","stem":"下列隔物灸與其常用適應症的配對，何者錯誤？","options":[["A","隔薑灸：因寒所致的嘔吐、腹痛及風寒痺痛"],["B","隔附子餅灸：瘰癧及毒蟲咬傷的初起"],["C","隔蒜灸：瘰癧、腫瘍初起"],["D","隔鹽灸：傷寒陰證、吐瀉、中風脫證"]],"answer":"B","difficulty":"易","explanation":"隔附子餅灸用於命門火衰之陽痿、早洩，以及瘡瘍久潰不斂。瘰癧與蛇蠍蜈蚣等咬傷用隔蒜灸，《刺灸心法要訣》載「瘰癧隔蒜灸法宜，先從後發核灸起，灸到初發母核止」，咬傷「急以傷處隔蒜灸」。","source":"notes：刺法灸法（灸法）；《刺灸心法要訣》卷八‧灸瘰癧穴歌、灸蛇蠍蜈蚣蜘蛛咬傷歌","id":"D2-036","h":"e262ac0cc9"},{"day":2,"date":"2026-10-09","number":37,"topic":"其他｜灸法：感覺障礙患者的安全","group":"灸法","qtype":"臨床情境","stem":"68歲第2型糖尿病患者，雙足麻木、足背觸覺遲鈍（周邊神經病變），主訴下肢冷痛，要求在足三里與湧泉施直接灸。下列處置何者最適當？","options":[["A","可施瘢痕灸，化膿後療效較佳"],["B","以溫灸器置於足底30分鐘，患者不覺燙即屬安全"],["C","感覺遲鈍者易燙傷且傷口難癒，應避免直接灸；如需溫灸，以溫和灸並由醫者手指感受溫度、縮短時間、灸後檢查皮膚"],["D","改在足背施刺絡拔罐以溫通經脈"]],"answer":"C","difficulty":"易","explanation":"糖尿病神經病變患者對熱感覺遲鈍，「不覺燙」不代表安全，且末梢循環差、傷口難癒，燙傷可能演變成潰瘍或感染。瘢痕灸（化膿灸）會造成化膿傷口，須患者知情同意，在此不宜。溫和灸時醫者可將手指置於施灸部位兩側感測溫度。","source":"notes：刺法灸法（灸法）；臨床安全原則","id":"D2-037","h":"b694649b29"},{"day":2,"date":"2026-10-09","number":38,"topic":"其他｜拔罐：操作要點","group":"拔罐","qtype":"非題","stem":"關於拔罐法，下列何者錯誤？","options":[["A","走罐前須先塗潤滑劑，宜用於背、腰、臀、大腿等肌肉豐厚處"],["B","閃火法為最常用且較安全的吸拔方法"],["C","起罐時應握住罐體直接向上用力拔起，避免空氣進入"],["D","閃罐（反覆吸拔即起）可用於局部麻木與面癱"]],"answer":"C","difficulty":"易","explanation":"起罐時應一手扶罐，另一手按壓罐口邊緣皮膚，讓空氣進入後罐自然脫落，不可硬拉，以免皮膚損傷。其餘三項皆正確。拔罐的禁忌包括高熱抽搐、凝血障礙、皮膚過敏或潰瘍、水腫、大血管處、孕婦腹部腰骶及心臟搏動處。","source":"notes：特殊針法（拔罐、刮痧）","id":"D2-038","h":"dc69960839"},{"day":2,"date":"2026-10-09","number":39,"topic":"其他｜刮痧：抗凝治療禁忌","group":"刮痧","qtype":"臨床情境","stem":"55歲男性，心房顫動長期服用 warfarin（INR 2.8），戶外工作後頭痛、肩背痠沉，意識清楚、體溫37.8°C。家屬要求在背部大面積刮痧至出痧。下列處置何者最適當？","options":[["A","抗凝劑不影響刮痧，可重手刮至紫黑痧點"],["B","凝血障礙與抗凝治療屬刮痧、拔罐禁忌，應避免出痧類操作，改以輕柔手法並補充水分；若出現意識改變或高體溫應送急診"],["C","刮痧應來回雙向反覆刮拭，以加速出痧"],["D","改在大椎刺絡拔罐，出血量較易控制"]],"answer":"B","difficulty":"中","explanation":"刮痧的禁忌同拔罐，包括凝血障礙；服用 warfarin 者重手刮痧或刺絡易造成大片皮下出血。刮痧方向應由上而下、由內而外，單方向刮拭，出痧後待3–5日痧退再刮。中暑若出現意識改變或核心體溫明顯升高（熱中暑），屬急症，須立即降溫並送醫。","source":"notes：特殊針法（拔罐、刮痧）、三稜針禁忌（凝血障礙）","id":"D2-039","h":"88aec134a7"},{"day":2,"date":"2026-10-09","number":40,"topic":"其他｜子午流注：納甲法返本還原","group":"子午流注","qtype":"經典填空","stem":"《針灸大成‧徐氏子午流注逐日按時定穴歌》：「甲日戌時膽竅陰，丙子時中前谷榮，戊寅陷谷陽明俞，返本____木在寅。」（榮即滎）空格應填？","options":[["A","合谷"],["B","太衝"],["C","邱墟（丘墟）"],["D","衝陽"]],"answer":"C","difficulty":"高","explanation":"納甲法中，甲日甲戌時開膽經井穴竅陰，之後依「經生經、穴生穴」，丙子時開小腸滎前谷、戊寅時開胃輸陷谷；開輸穴時同時「返本還原」，開當日值日經（膽，甲木）的原穴丘墟，所以說「返本邱墟木在寅」。","source":"《針灸大成》卷七‧徐氏子午流注逐日按時定穴歌","id":"D2-040","h":"bedbad66ac"},{"day":2,"date":"2026-10-09","number":41,"topic":"其他｜靈龜八法：除數","group":"靈龜八法","qtype":"經典填空","stem":"《針灸大成‧八法臨時干支歌》：「甲己子午九宜用，乙庚丑未八無疑……巳亥單加四共齊。陽日除____陰除____，不及零餘穴下推。」空格依序應填？","options":[["A","九；六"],["B","八；六"],["C","九；五"],["D","六；九"]],"answer":"A","difficulty":"高","explanation":"原文為「陽日除九陰除六」：將日、時干支的代數相加，陽日（甲丙戊庚壬）除以九，陰日（乙丁己辛癸）除以六，以餘數配八卦數，便知當時應開的八脈交會穴。原文例：「甲子日戊辰時，以日上甲得十數，子得七數，以時上戊得五數，辰得五數」。","source":"《針灸大成》卷七‧八法臨時干支歌","id":"D2-041","h":"11532c2404"},{"day":2,"date":"2026-10-09","number":42,"topic":"其他｜複式手法：飛經走氣四法","group":"複式手法","qtype":"經典","stem":"《金針賦》云：「若夫過關過節，催連氣以飛經走氣，其法有四。」下列配對何者正確？","options":[["A","青龍擺尾：一退三進，鑽剔四方"],["B","白虎搖頭：如扶船舵，不進不退，一左一右，慢慢撥動"],["C","蒼龜探穴：如入土之象，一退三進，鑽剔四方"],["D","赤鳳迎源：似手搖鈴，方進圓，兼之左右，搖而振之"]],"answer":"C","difficulty":"中","explanation":"原文：「一曰青龍擺尾，如扶船舵，不進不退，一左一右，慢慢撥動。二曰白虎搖頭，似手搖，鈴方進圓，兼之左右，搖而振之。三曰蒼龜探穴，如入土之象，一退三進，鑽剔四方。四曰赤鳳迎源，展翅之儀，入針致地，提針至天，候針自搖，復進其元，上下左右，四圍飛旋。」（「催連氣」「入針致地」及句讀依底本）","source":"《針灸大成》卷二‧金針賦（楊繼洲註解）","id":"D2-042","h":"bc26529c96"},{"day":2,"date":"2026-10-09","number":43,"topic":"其他｜複式手法：治病八法","group":"複式手法","qtype":"經典","stem":"《金針賦》治病八法中「陽中隱陰」的操作要點為何？","options":[["A","九入六出，左右轉之，治水蠱膈氣"],["B","先深後淺，以六九之方，先瀉後補"],["C","左撚九而右撚六，用於止痛"],["D","先淺後深，以九六之法，先補後瀉"]],"answer":"D","difficulty":"高","explanation":"《金針賦》：「陽中隱陰，先寒後熱，淺而深以九六之法，則先補後瀉也。」先深後淺、先瀉後補是陰中隱陽（本資料庫底本此句誤與上句重複，宜以通行本為準）。「左撚九而右撚六，是亦住痛之針」是龍虎交戰；「九入六出，左右轉之」是子午搗臼。","source":"《針灸大成》卷二‧金針賦（楊繼洲註解）","id":"D2-043","h":"5061fa430c"},{"day":2,"date":"2026-10-09","number":44,"topic":"其他｜治療學（婦）：乳癰成膿轉介","group":"治療學（婦）","qtype":"臨床情境","stem":"30歲哺乳期婦女，產後第3週，左乳外上象限紅腫熱痛三天，發燒38.6°C。今日觸診腫塊中央變軟、有波動感。下列處置何者最適當？","options":[["A","立即停止哺乳，並以熱敷用力按揉腫塊排膿"],["B","已有膿瘍徵象，應轉介乳房外科做超音波並抽吸或切開引流，配合抗生素；針灸只作輔助"],["C","在腫塊處施隔蒜灸或直接灸，促其內消"],["D","針刺肩井、膻中、乳根並少澤放血，持續治療至腫塊消退即可"]],"answer":"B","difficulty":"中","explanation":"乳癰的常用針灸處方為肩井、膻中、乳根、期門、內關、少澤（放血），適用於鬱乳期。一旦出現波動感，表示已成膿，須轉介外科引流，否則易形成瘻管或擴散。哺乳期可在醫師指導下持續排空乳汁，不必一律停止；若非哺乳期或抗生素治療後持續不退，須排除發炎性乳癌。","source":"notes：針灸治療學（婦兒——乳癰）；臨床轉介原則","id":"D2-044","h":"c63a06094f"},{"day":2,"date":"2026-10-09","number":45,"topic":"其他｜治療學（五官）：突發性耳聾轉介","group":"治療學（五官）","qtype":"臨床情境","stem":"45歲男性，昨晨醒來發現右耳突然聽不清楚，伴耳鳴及耳脹滿感，無外傷、無耳漏。下列處置何者最適當？","options":[["A","先針刺翳風、聽會、俠谿兩週，無效再轉介"],["B","耳尖放血後觀察，聽力多會自行恢復，無須檢查"],["C","疑為突發性感音神經性聽力損失，應盡速轉介耳鼻喉科做聽力檢查並評估類固醇治療，針刺可作輔助"],["D","辨為腎虛耳聾，灸腎俞、太谿一個月"]],"answer":"C","difficulty":"易","explanation":"突發性單側聽力喪失屬耳科急症，愈早接受聽力評估與類固醇等治療，預後愈好；也須排除聽神經瘤或中風等少見原因。針刺（實證取翳風、聽會、俠谿、中渚；虛證取聽宮、翳風、太谿、腎俞）可作輔助，但不應延誤轉介。","source":"notes：針灸治療學（五官——耳鳴耳聾）；臨床轉介原則","id":"D2-045","h":"d77c142f4c"},{"day":2,"date":"2026-10-09","number":46,"topic":"其他｜治療學（皮膚）：眼部帶狀疱疹轉介","group":"治療學（皮膚）","qtype":"臨床情境","stem":"72歲女性，左額及上眼瞼出現成簇水疱並劇痛三天，今日鼻尖側也出現水疱，左眼紅、畏光、視力模糊。下列處置何者最適當？","options":[["A","病灶周圍圍刺並刺絡拔罐，三日後再評估"],["B","眼周水疱處施直接灸，以熱引熱"],["C","針刺支溝、陽陵泉、行間即可，無需轉介"],["D","鼻尖受侵（Hutchinson 徵象）合併眼部症狀，提示眼部帶狀疱疹，應立即轉介眼科並盡早抗病毒治療；針灸只作止痛輔助"]],"answer":"D","difficulty":"中","explanation":"蛇串瘡（帶狀疱疹）的針灸處方為阿是穴圍刺、夾脊、支溝、陽陵泉、行間，並可刺絡拔罐。但三叉神經眼支受侵、鼻尖出疹（鼻睫神經）並有紅眼、畏光、視力下降時，可能併發角膜炎或葡萄膜炎而危及視力，須緊急轉介眼科並盡早給予抗病毒藥物；眼周也不宜施灸或拔罐。","source":"notes：針灸治療學（皮膚——蛇串瘡）；臨床轉介原則","id":"D2-046","h":"e9801e20f2"},{"day":2,"date":"2026-10-09","number":47,"topic":"其他｜治療學實證：偏頭痛預防針刺","group":"治療學實證","qtype":"實證研究","stem":"Xu S 等人2020年發表於《BMJ》的多中心隨機試驗（doi:10.1136/bmj.m697），比較手針、假針刺與常規治療預防無先兆陣發性偏頭痛。下列敘述何者正確？","options":[["A","共治療8次，療程4週"],["B","第13–20週的偏頭痛日數，手針組與假針刺組無顯著差異"],["C","假針刺組在真穴旁淺刺入皮"],["D","固定取穴含雙側合谷、太衝、太陽、風池、率谷，並依頭痛部位分經加穴（陽明加頭維、太陽加天柱、厥陰加百會）"]],"answer":"D","difficulty":"中","explanation":"Xu S, Yu L, Luo X, et al. BMJ 2020;368:m697（PMID 32213509）。150名未曾接受針刺的患者，8週內治療20次。手針取10個固定穴（雙側 LI4、LR3、EX-HN5、GB20、GB8），並依經絡辨證加 ST8、BL10 或 DU20。假針刺組用不刺入皮膚的鈍針，施於異節段非穴位。第13–16週與第17–20週，手針組偏頭痛日數下降均顯著多於假針刺組，無嚴重不良事件。","source":"Xu S et al. BMJ 2020;368:m697. doi:10.1136/bmj.m697","id":"D2-047","h":"60b9dff03d"},{"day":2,"date":"2026-10-09","number":48,"topic":"其他｜治療學實證：術後腸麻痺電針","group":"治療學實證","qtype":"實證研究","stem":"Wang Y 等人2023年發表於《JAMA Surgery》的多中心隨機試驗（doi:10.1001/jamasurg.2022.5674），在加速術後康復（ERAS）流程下，比較電針與假電針治療腹腔鏡大腸直腸癌術後腸麻痺（POI）。下列敘述何者正確？","options":[["A","取穴以內關、公孫為主，術前一週開始治療"],["B","電針組延長性 POI 發生率與假電針組相同"],["C","電針以 50 Hz 連續波接於中脘與天樞"],["D","主要結果為住院天數，電針組顯著縮短"],["E","取中脘及雙側天樞、足三里、上巨虛，於雙側足三里接 2/100 Hz 電刺激，術後每日一次共4天，縮短首次排便時間"]],"answer":"E","difficulty":"中","explanation":"Wang Y, Yang JW, Yan SY, et al. JAMA Surg 2023;158(1):20-27（PMID 36322060）。共248人納入分析。主要結果為首次排便時間：中位數76.4對90.0小時（P=.003）。延長性 POI 發生率10%對20%（RR 0.51）。住院天數等其他次要結果無差異，無嚴重不良事件。依全文（PMC9631228），取穴為中脘及雙側天樞、足三里、上巨虛，電極接雙側足三里、2/100 Hz，術後每日30分鐘、連續4天。","source":"Wang Y et al. JAMA Surg 2023;158(1):20-27. doi:10.1001/jamasurg.2022.5674","id":"D2-048","h":"80a81c11ee"},{"day":2,"date":"2026-10-09","number":49,"topic":"其他｜刺法：進針法","group":"刺法","qtype":"概念","stem":"下列進針法與適用情況的配對，何者最恰當？","options":[["A","舒張進針法：皮肉淺薄處，如頭面部"],["B","指切進針法：長針深刺，如環跳"],["C","提捏進針法：皮肉淺薄處，如印堂"],["D","夾持進針法：短針、指端穴位"]],"answer":"C","difficulty":"易","explanation":"指切進針適用短針；夾持進針適用長針；舒張進針用於皮膚鬆弛處，如腹部；提捏進針用於皮肉淺薄處，如印堂與頭面部。","source":"notes：刺法灸法（毫針基本操作）","id":"D2-049","h":"fc971f08e6"},{"day":2,"date":"2026-10-09","number":50,"topic":"其他｜歌賦：雜病穴法歌汗吐下","group":"歌賦","qtype":"經典","stem":"《針灸大成‧雜病穴法歌》云：「汗吐下法非有他，合谷內關陰交杵。」依其注文，汗、吐、下三法所針之穴依序為何？","options":[["A","合谷、內關、三陰交"],["B","合谷、三陰交、內關"],["C","內關、合谷、三陰交"],["D","三陰交、內關、合谷"]],"answer":"A","difficulty":"高","explanation":"注文：「汗針合谷入二分，行九九數……吐針內關，入三分，先補六次，瀉三次，行子午搗臼法三次……下針三陰交，入三分，男左女右……」。同歌另有「冷嗽只宜補合谷，三陰交瀉即時住」。合谷、三陰交皆為孕婦禁針穴。","source":"《針灸大成》卷四‧雜病穴法歌（醫學入門）","id":"D2-050","h":"27e20679ff"},{"day":3,"date":"2026-10-10","number":1,"topic":"Day3｜心經：腕部四穴順序與間距","group":"心經","qtype":"概念","stem":"手少陰心經在前臂掌側、尺側腕屈肌腱橈側緣，由近心端往腕橫紋依序排列四穴。下列順序與距腕橫紋距離，何者正確？","options":[["A","通里（1.5寸）→靈道（1寸）→陰郄（0.5寸）→神門（腕橫紋上）"],["B","陰郄（3寸）→通里（2寸）→靈道（1寸）→神門（腕橫紋上）"],["C","靈道（1.5寸）→通里（1寸）→陰郄（0.5寸）→神門（腕橫紋上）"],["D","靈道（1.5寸）→陰郄（1寸）→通里（0.5寸）→神門（腕橫紋上）"]],"answer":"C","difficulty":"易","explanation":"四穴皆位於尺側腕屈肌腱橈側緣，彼此相距0.5寸：靈道在腕掌側橫紋上1.5寸（心經經穴），通里在腕橫紋上1寸（心經絡穴），陰郄在腕橫紋上0.5寸（心經郄穴），神門在腕掌側橫紋尺側端凹陷（心經輸穴、原穴）。記憶口訣可取「靈通陰神，各差半寸」。","source":"本資料庫腧穴表（HT4–HT7）；《刺灸心法要訣》卷四‧心經分寸歌","id":"D3-001","h":"e7a4a5140d"},{"day":3,"date":"2026-10-10","number":2,"topic":"Day3｜心經：五輸穴五行屬性","group":"心經","qtype":"非題","stem":"關於手少陰心經五輸穴及其五行屬性，下列何者錯誤？","options":[["A","少海為心經合穴，五行屬水"],["B","神門為心經輸穴，五行屬土，亦為心經原穴"],["C","靈道為心經經穴，五行屬金"],["D","少衝為心經滎穴，五行屬火"]],"answer":"D","difficulty":"中","explanation":"心經五輸穴：井木少衝、滎火少府、輸土神門、經金靈道、合水少海（陰經井穴起於木）。少衝是井穴（屬木），滎火是少府。陰經「以輸代原」，故神門同時為原穴。《針灸甲乙經》：「心出少沖，少沖者，木也……為井」「少府者，火也……為滎」。","source":"《針灸甲乙經》卷三‧手少陰及臂凡一十六穴第二十六；本資料庫腧穴表","id":"D3-002","h":"712636fd67"},{"day":3,"date":"2026-10-10","number":3,"topic":"Day3｜心經：分寸歌（刺灸心法要訣）","group":"心經","qtype":"經典填空","stem":"《刺灸心法要訣‧心經分寸歌》：「靈道掌後一寸半，通里腕後一寸同，陰郄腕後內____，神門掌後銳骨隆。」空格應填？","options":[["A","二寸"],["B","半寸"],["C","一寸"],["D","寸半"]],"answer":"B","difficulty":"易","explanation":"原文為「陰郄腕後內半寸」，其注文亦言陰郄在「掌後脈中腕後五分」。歌訣一句帶出腕部四穴：靈道1.5寸、通里1寸、陰郄0.5寸、神門在掌後銳骨（豌豆骨）端陷中。","source":"《刺灸心法要訣》卷四‧心臟經文／心經分寸歌","id":"D3-003","h":"d15288c393"},{"day":3,"date":"2026-10-10","number":4,"topic":"Day3｜心經：通里穴歌（暴瘖）","group":"心經","qtype":"經典填空","stem":"《刺灸心法要訣》卷八有一首單穴歌：「____腕側後，去腕一寸中。欲言聲不出，懊憹及怔忡……虛則不能食，暴喑面無容，毫針微微刺，方信有神功。」此穴為？","options":[["A","通里"],["B","陰郄"],["C","神門"],["D","靈道"]],"answer":"A","difficulty":"易","explanation":"此為〈通里穴歌〉。通里位於腕掌側橫紋上1寸，為心經絡穴（別走手太陽），注文說它主治聲啞、心煩、怔忡、喉咽疼痛、暴喑；本穴也名列馬丹陽天星十二穴。靈道在腕上1.5寸，《針灸大成》也載其主「暴瘖不言」，但歌中「去腕一寸」指的就是通里。","source":"《刺灸心法要訣》卷八‧通里穴歌；本資料庫腧穴表","id":"D3-004","h":"21ae7439f7"},{"day":3,"date":"2026-10-10","number":5,"topic":"Day3｜心經：陰郄（陰經郄穴治血證）","group":"心經","qtype":"概念","stem":"陰經郄穴多用於血證。《針灸大成》記載某心經穴「掌後脈中，去腕五分。銅人針三分，灸七壯。主鼻衄吐血，洒淅畏寒，厥逆氣驚，心痛」。此穴為？","options":[["A","通里"],["B","少府"],["C","神門"],["D","陰郄"]],"answer":"D","difficulty":"易","explanation":"「去腕五分」即腕橫紋上0.5寸，是心經郄穴陰郄。郄穴是經氣深聚之處；陰經郄穴多治血證（如孔最治咯血、陰郄治吐衄），陽經郄穴多治急性痛證。通里在腕上1寸（絡穴），神門在腕橫紋上（原穴），少府在掌中第4、5掌骨間（滎穴）。","source":"《針灸大成》卷八‧手少陰心經穴歌（考正穴法）；notes：易混淆考點對照表（郄穴 vs 絡穴）","id":"D3-005","h":"51e46f19ed"},{"day":3,"date":"2026-10-10","number":6,"topic":"Day3｜心經臨床：急性冠心症紅旗","group":"心經臨床","qtype":"臨床情境","stem":"62歲男性，有高血壓、糖尿病與吸菸史，自述「心悸胸悶」想針神門、內關。問診得知40分鐘前開始胸骨後壓迫感，向左臂及下頜放射，伴冒冷汗、噁心，休息後未緩解；脈細數，面色蒼白。下列處置何者最適當？","options":[["A","懷疑急性冠心症，應立即撥打119或送急診作12導程心電圖與心肌酵素檢查，不可以針刺延誤"],["B","灸心俞、厥陰俞各20分鐘溫通心陽，症狀緩解即可返家"],["C","先針神門、內關、膻中寬胸理氣，留針30分鐘後再評估"],["D","囑其回家休息，若明日仍不適再回診加開活血化瘀方"]],"answer":"A","difficulty":"中","explanation":"神門（心經原穴）、內關（心包經絡穴、八脈交會穴通陰維）、心俞、膻中都是心悸胸痹的常用穴，但持續20分鐘以上不緩解的胸骨後壓迫痛，放射至左臂或下頜，伴冷汗、噁心，又有多重心血管危險因子，是急性冠心症（心肌梗塞）的紅旗，應立即啟動緊急醫療，以免錯失再灌流治療的黃金時間。針灸只能在穩定期作為輔助。","source":"notes：針灸治療學（心悸、胸痹）；臨床轉介原則","id":"D3-006","h":"f04bc7f54d"},{"day":3,"date":"2026-10-10","number":7,"topic":"Day3｜心腎經臨床：心腎不交失眠選穴","group":"心腎經臨床","qtype":"臨床情境","stem":"46歲女性，失眠半年，入睡困難、多夢易醒，心煩心悸、健忘，伴腰膝痠軟、潮熱盜汗、口乾；舌紅少苔，脈細數。辨證為心腎不交，下列取穴組合何者最恰當？","options":[["A","太衝、行間、風池、俠谿"],["B","心俞、脾俞、足三里、三陰交（補法加灸）"],["C","豐隆、中脘、內庭、厲兌"],["D","神門、心俞、太谿、腎俞"]],"answer":"D","difficulty":"易","explanation":"心腎不交為腎陰虧虛、心火偏亢，治以交通心腎、滋陰降火：取心經原穴神門與心俞以寧心安神，腎經原穴太谿與腎俞以滋補腎陰，也常加照海、三陰交。太衝、行間、風池、俠谿用於肝火擾心；豐隆、中脘、內庭用於痰熱內擾；心俞、脾俞、足三里加灸用於心脾兩虛（多見面色萎黃、食少便溏、舌淡），不適合陰虛火旺。","source":"notes：針灸治療學（不寐）；本資料庫腧穴表（神門、太谿原穴）","id":"D3-007","h":"e1215f95ab"},{"day":3,"date":"2026-10-10","number":8,"topic":"Day3｜心俞：刺中心（甲乙經刺禁）","group":"心俞","qtype":"經典填空","stem":"《針灸大成》心俞條引《資生經》告誡不可妄針：「刺中心，一日死，其動為____」，此語亦見於《針灸甲乙經‧針灸禁忌》。空格應填？","options":[["A","咳"],["B","嚏"],["C","欠"],["D","噫"]],"answer":"D","difficulty":"中","explanation":"原文：「刺中心，一日死，其動為噫。刺中肺，三日死，其動為咳。刺中肝，五日死，其動為欠……刺中腎……其動為嚏。刺中膽，一日半死，其動為嘔。」《針灸大成》載心俞在「五椎下兩旁，相去脊各一寸五分」，「銅人針三分……不可灸」。現代定位為第5胸椎棘突下旁開1.5寸，宜斜刺0.5–0.8寸，不可深刺，以免傷及胸膜、肺臟。","source":"《針灸甲乙經》卷五‧針灸禁忌第一（上）；《針灸大成》卷八‧足太陽膀胱經穴歌（心俞）","id":"D3-008","h":"977dd5a67c"},{"day":3,"date":"2026-10-10","number":9,"topic":"Day3｜小腸經：耳前三穴辨識","group":"小腸經","qtype":"概念","stem":"耳屏前方由上而下有三個張口取穴的凹陷，分屬三條不同經脈。下列敘述何者正確？","options":[["A","由上而下為耳門（膽經）、聽會（三焦經）、聽宮（小腸經）"],["B","由上而下為耳門（三焦經）、聽宮（小腸經）、聽會（膽經）"],["C","由上而下為聽會（膽經）、聽宮（小腸經）、耳門（三焦經）"],["D","由上而下為聽宮（小腸經）、耳門（三焦經）、聽會（膽經）"]],"answer":"B","difficulty":"易","explanation":"耳門在耳屏上切跡與下頜骨髁突之間（手少陽三焦經）；聽宮在耳屏正中與髁突之間（手太陽小腸經最後一穴）；聽會在耳屏間切跡與髁突之間（足少陽膽經）。三穴都要張口取穴，口訣「門宮會，三焦小腸膽」。","source":"本資料庫腧穴表（TE21、SI19、GB2）；notes：易混淆考點對照表","id":"D3-009","h":"ed8181029b"},{"day":3,"date":"2026-10-10","number":10,"topic":"Day3｜小腸經：聽宮","group":"小腸經","qtype":"非題","stem":"關於聽宮穴，下列何者錯誤？","options":[["A","宜閉口取穴，因閉口時下頜骨髁突前移，凹陷最明顯"],["B","《針灸甲乙經》謂其為「手足少陽、手太陽之會」"],["C","位於耳屏正中與下頜骨髁突之間的凹陷"],["D","《針灸甲乙經》描述其「在耳中，珠子大，明如赤小豆」"]],"answer":"A","difficulty":"中","explanation":"聽宮應張口取穴：張口時下頜骨髁突向前滑動，耳屏前方才出現凹陷；現代刺法為張口直刺1–1.5寸。《甲乙經》：「聽宮，在耳中，珠子大，明如赤小豆，手足少陽、手太陽之會，刺入三分，灸三壯。」《針灸大成》別名「多所聞」，主耳聾、耳鳴「如物填塞無聞」。","source":"《針灸甲乙經》卷三‧耳前後凡二十穴第十一；《針灸大成》卷八‧手太陽小腸經穴歌；本資料庫腧穴表","id":"D3-010","h":"71067e2f29"},{"day":3,"date":"2026-10-10","number":11,"topic":"Day3｜小腸經：肩胛區穴位定位","group":"小腸經","qtype":"非題","stem":"下列手太陽小腸經肩胛區穴位的定位，何者錯誤？","options":[["A","天宗：肩胛岡中點與肩胛骨下角連線上1/3與下2/3交點凹陷"],["B","肩貞：臂內收時，腋後紋頭直上1寸"],["C","肩中俞：第1胸椎棘突下，後正中線旁開3寸"],["D","臑俞：腋後紋頭直上，肩胛岡下緣凹陷"]],"answer":"C","difficulty":"中","explanation":"第1胸椎棘突下旁開3寸是肩外俞；肩中俞在第7頸椎棘突下旁開2寸。《甲乙經》：肩外俞「在肩胛上廉，去脊三寸陷者中」，肩中俞「在肩胛內廉，去脊二寸陷者中」。肩胛區穴大致順序為肩貞→臑俞→天宗→秉風（岡上窩中央）→曲垣（岡上窩內側端）→肩外俞→肩中俞，皆不宜向胸腔方向深刺。","source":"本資料庫腧穴表（SI9–SI15）；《針灸甲乙經》卷三‧肩凡二十八穴第十三","id":"D3-011","h":"a27d89c1d8"},{"day":3,"date":"2026-10-10","number":12,"topic":"Day3｜小腸經：郄穴養老（急性痛證）","group":"小腸經","qtype":"臨床情境","stem":"35歲男性搬貨時扭傷，腰部劇痛、俯仰困難一小時，神經學檢查正常。醫師依「陽經郄穴多治急性痛證」取手太陽小腸經郄穴，邊捻針邊囑患者緩慢活動腰部。關於此穴名稱與取穴，下列何者正確？","options":[["A","養老：掌心向胸時，於尺骨小頭近端橈側凹陷取之"],["B","腕骨：第5掌骨基底與鉤骨（三角骨）之間凹陷"],["C","支正：腕背橫紋上5寸，陽谷與小海連線上"],["D","陽谷：腕背橫紋尺側端，尺骨莖突與三角骨之間"]],"answer":"A","difficulty":"中","explanation":"小腸經郄穴是養老，屈肘、掌心向胸時，在尺骨小頭近端橈側的骨縫凹陷中取穴；《甲乙經》載其「在手踝骨上一空，腕後一寸陷者中」。養老常與後谿、水溝、腰痛點一起用於急性腰扭傷，配合運動針法。支正是小腸經絡穴，陽谷是經穴，腕骨是原穴。","source":"本資料庫腧穴表（SI4–SI7）；《針灸甲乙經》卷三‧手太陽凡一十六穴第二十九；notes：針灸治療學（急性腰扭傷）","id":"D3-012","h":"2903eafe3d"},{"day":3,"date":"2026-10-10","number":13,"topic":"Day3｜膀胱經：胸段背俞椎體對應","group":"膀胱經","qtype":"概念","stem":"背俞穴位於足太陽膀胱經第一側線（後正中線旁開1.5寸）。下列背俞穴與所平胸椎棘突下的對應，何者完全正確？","options":[["A","膈俞—第7胸椎；肝俞—第9胸椎；脾俞—第11胸椎"],["B","心俞—第4胸椎；膈俞—第6胸椎；肝俞—第8胸椎"],["C","肺俞—第2胸椎；心俞—第5胸椎；脾俞—第12胸椎"],["D","肝俞—第9胸椎；膽俞—第11胸椎；胃俞—第12胸椎"]],"answer":"A","difficulty":"易","explanation":"胸段第一側線：大杼T1、風門T2、肺俞T3、厥陰俞T4、心俞T5、督俞T6、膈俞T7、（T8無經穴，有奇穴胃脘下俞）、肝俞T9、膽俞T10、脾俞T11、胃俞T12。《靈樞‧背輸》亦云「肺俞在三焦之間，心俞在五焦之間，膈俞在七焦之間，肝俞在九焦之間，脾俞在十一焦之間」。","source":"本資料庫腧穴表（BL11–BL21）；《靈樞經》卷八‧背輸第五十一","id":"D3-013","h":"4283dd1219"},{"day":3,"date":"2026-10-10","number":14,"topic":"Day3｜膀胱經：腰骶段背俞","group":"膀胱經","qtype":"非題","stem":"下列腰骶部背俞穴的定位，何者錯誤？","options":[["A","膀胱俞：平第2骶後孔，骶正中嵴旁開1.5寸"],["B","大腸俞：第3腰椎棘突下，旁開1.5寸"],["C","三焦俞：第1腰椎棘突下，旁開1.5寸"],["D","腎俞：第2腰椎棘突下，旁開1.5寸"]],"answer":"B","difficulty":"中","explanation":"腰段：三焦俞L1、腎俞L2、氣海俞L3、大腸俞L4、關元俞L5；骶段：小腸俞平第1骶後孔、膀胱俞平第2骶後孔、中膂俞平第3骶後孔、白環俞平第4骶後孔。大腸俞約與兩側髂嵴最高點連線（約平L4）同高，是臨床定位的好參考。","source":"本資料庫腧穴表（BL22–BL30）","id":"D3-014","h":"d9b9596461"},{"day":3,"date":"2026-10-10","number":15,"topic":"Day3｜膀胱經：第二側線神志穴","group":"膀胱經","qtype":"非題","stem":"膀胱經第二側線（旁開3寸）有五個穴位與同水平的五臟背俞相對，名稱反映五臟所藏之神（魄、神、魂、意、志）。下列配對何者錯誤？","options":[["A","神堂—平心俞（第5胸椎棘突下）"],["B","志室—平腎俞（第2腰椎棘突下）"],["C","意舍—平肝俞（第9胸椎棘突下）"],["D","魄戶—平肺俞（第3胸椎棘突下）"]],"answer":"C","difficulty":"中","explanation":"肺藏魄、心藏神、肝藏魂、脾藏意、腎藏志。第二側線：魄戶T3（肺俞旁）、神堂T5（心俞旁）、魂門T9（肝俞旁）、意舍T11（脾俞旁）、志室L2（腎俞旁）。平肝俞的是魂門；意舍平脾俞。另膏肓在T4（厥陰俞旁）。","source":"本資料庫腧穴表（BL42–BL52）","id":"D3-015","h":"5756bfe9c0"},{"day":3,"date":"2026-10-10","number":16,"topic":"Day3｜背俞穴：古籍記載與古今差異","group":"背俞穴","qtype":"非題","stem":"關於古籍對背俞穴的記載，下列何者錯誤？","options":[["A","《刺灸心法要訣‧膀胱經分寸歌》記第一側線為「自此脊中開二寸」，與現行1.5寸的標準不同"],["B","《靈樞‧背輸》說五臟之俞「皆挾脊相去三寸所」，並以按壓「應在中而痛解」來驗證取穴"],["C","《靈樞‧背輸》主張背俞「刺之則可，灸之則不可」"],["D","《針灸大成》載心俞在「五椎下兩旁，相去脊各一寸五分」"]],"answer":"C","difficulty":"高","explanation":"《靈樞‧背輸》原文剛好相反：「灸之則可，刺之則不可。氣盛則寫之，虛則補之。」古人重視背俞以灸為主，與現代「背部腧穴不宜深刺，防氣胸」的觀點相通。「挾脊相去三寸所」一般解為左右兩穴相距約3寸，即各旁開1.5寸，與《針灸大成》「相去脊各一寸五分」相符；《刺灸心法要訣》則以「脊中開二寸」、第二側線「三寸半」計量，考試要分清古籍與現行標準。","source":"《靈樞經》卷八‧背輸第五十一；《針灸大成》卷八‧足太陽膀胱經穴歌；《刺灸心法要訣》卷四‧膀胱經分寸歌","id":"D3-016","h":"2d6a2acf8c"},{"day":3,"date":"2026-10-10","number":17,"topic":"Day3｜膀胱經：膏肓定位與安全","group":"膀胱經","qtype":"概念","stem":"關於膏肓（膏肓俞）的定位、取穴與刺灸，下列何者正確？","options":[["A","因屬第二側線、離脊柱較遠且肌肉豐厚，可直刺1.5–2寸而無氣胸之虞"],["B","位於第4胸椎棘突下旁開1.5寸，為心包之背俞穴"],["C","取穴時應令患者雙臂下垂、肩胛骨向脊柱內收，使穴位充分暴露"],["D","位於第4胸椎棘突下旁開3寸，深部為胸膜與肺，宜斜刺0.5–0.8寸；古籍多主灸，《刺灸心法要訣》稱「此穴禁針惟宜艾」"]],"answer":"D","difficulty":"中","explanation":"膏肓在T4下旁開3寸（與厥陰俞同高）。古法取穴要令患者正坐曲脊、伸兩手以臂著膝前，使肩胛骨向外分開，才能在肩胛骨內緣摸到穴位（《針灸大成》「以臂著膝前令端直……以物支肘，毋令搖動取之」）。T4旁1.5寸的是厥陰俞（心包背俞）。第二側線胸段離肩胛骨內緣近，下方肌層薄，深刺有氣胸風險，現代要求斜刺0.5–0.8寸。","source":"本資料庫腧穴表（BL43）；《針灸大成》卷八（膏肓俞）；《刺灸心法要訣》卷七‧背部主病針灸要穴歌","id":"D3-017","h":"12b60f6a60"},{"day":3,"date":"2026-10-10","number":18,"topic":"Day3｜膀胱經：膏肓灸法（針灸大成）","group":"膀胱經","qtype":"經典填空","stem":"《針灸大成》論灸膏肓俞：「人年二旬後，方可灸此二穴，仍灸____二穴，引火氣下行，以固其本。若未出幼而灸之，恐火氣盛，上焦作熱。」空格應填？","options":[["A","大椎"],["B","百會"],["C","湧泉"],["D","三里"]],"answer":"D","difficulty":"高","explanation":"原文為「仍灸三里二穴，引火氣下行」，並批評醫家「多不針瀉三里，以致虛火上炎」。同條亦說灸膏肓後可「又灸臍下氣海、丹田、關元、中極，四穴中取一穴，又灸足三里，以引火氣實下」。膏肓主「羸瘦虛損，傳尸骨蒸，夢中失精，上氣欬逆」，並引《左傳》「病入膏肓」的晉景公典故。","source":"《針灸大成》卷八‧足太陽膀胱經穴歌（膏肓俞）","id":"D3-018","h":"8359a08ffa"},{"day":3,"date":"2026-10-10","number":19,"topic":"Day3｜膀胱經：禁灸穴歌","group":"膀胱經","qtype":"概念","stem":"《刺灸心法要訣‧禁灸穴歌》列有「禁灸之穴四十七」。下列足太陽膀胱經穴中，何者「未」列入該歌？","options":[["A","心俞"],["B","委中"],["C","膏肓"],["D","白環俞"]],"answer":"C","difficulty":"中","explanation":"歌中與膀胱經有關者包括睛明、攢竹、天柱、承光、心俞、白環俞、殷門、承扶、申脈、委中（「肩貞天牖心俞同，乳中脊中白環俞……殷門申脈承扶忌，伏兔髀關連委中」）。膏肓不僅不禁灸，反而是著名的灸穴（「膏肓一穴灸勞傷」）。《甲乙經》卷五亦載「白環俞禁不可灸」。","source":"《刺灸心法要訣》卷八‧禁灸穴歌；卷七‧背部主病針灸要穴歌；《針灸甲乙經》卷五‧針灸禁忌第一（下）","id":"D3-019","h":"df7894903d"},{"day":3,"date":"2026-10-10","number":20,"topic":"Day3｜背部要穴歌：刺灸規定","group":"背部要穴歌","qtype":"非題","stem":"依《刺灸心法要訣‧背部主病針灸要穴歌》的注文，下列穴位的刺灸規定何者與原文不符？","options":[["A","神道：灸七壯，禁針"],["B","膈俞：灸三壯，禁針"],["C","大杼：灸七壯，禁針"],["D","腎俞：灸三壯，禁針"]],"answer":"C","difficulty":"高","explanation":"注文載大杼「主治遍身發熱，瘧疾，咳嗽多痰。針五分，禁灸」，是可針而禁灸。膈俞「灸三壯，禁針」、腎俞「灸三壯，禁針」、神道「灸七壯，禁針」，另肝俞、膽俞、脾俞注文也都寫「禁針」。可見該書對胸背部俞穴多主灸而慎針，與《靈樞‧背輸》「灸之則可，刺之則不可」一脈相承。","source":"《刺灸心法要訣》卷七‧背部主病針灸要穴歌","id":"D3-020","h":"a65e382dd3"},{"day":3,"date":"2026-10-10","number":21,"topic":"Day3｜甲乙經背部穴：脊中禁灸","group":"甲乙經背部穴","qtype":"經典填空","stem":"《針灸甲乙經》卷三背部督脈諸穴：「脊中，在第十一椎節下間，督脈氣所發，俯而取之，刺入五分，不可灸，灸則令人____。」空格應填？","options":[["A","喑"],["B","痿"],["C","逆息"],["D","盲"]],"answer":"B","difficulty":"高","explanation":"原文為「不可灸，灸則令人痿」；卷五〈針灸禁忌〉則作「脊中禁不可灸（灸之使人僂）」。同章其他背部穴多為「刺入五分，灸三壯」，如身柱、神道、至陽、筋縮、命門；懸樞「刺入三分」。「灸之令人喑」是啞門（喑門）的禁灸警語；「目小及盲」是絲竹空；「逆息」與雲門、天府、缺盆等胸肩部穴有關。","source":"《針灸甲乙經》卷三‧背自第一椎循督脈下行至脊凡十一穴第七；卷五‧針灸禁忌第一（下）","id":"D3-021","h":"7bdd4d3c86"},{"day":3,"date":"2026-10-10","number":22,"topic":"Day3｜膀胱經：委中與委陽","group":"膀胱經","qtype":"概念","stem":"關於委中與委陽，下列何者正確？","options":[["A","委中在膕橫紋中點，為膀胱經合穴及膀胱下合穴；委陽在膕橫紋外側端、股二頭肌腱內側，為三焦下合穴"],["B","委中為三焦下合穴，委陽為膀胱經合穴"],["C","委陽在膕橫紋內側端、半腱肌腱外側，為膽之下合穴"],["D","委陽在膕橫紋中點，為膀胱下合穴；委中在膕橫紋外側端，為三焦下合穴"]],"answer":"A","difficulty":"易","explanation":"《靈樞‧邪氣藏府病形》：「三焦合入於委陽，膀胱合入於委中央」，並說「委陽者，屈伸而索之。委中者，屈而取之」。委中為膀胱經合穴（土），同時是膀胱下合穴、四總穴（腰背委中求）、馬丹陽天星十二穴；委陽在膕橫紋外側端，股二頭肌腱內側。膕橫紋內側端、半腱肌腱與半膜肌腱之間的是腎經合穴陰谷。","source":"《靈樞經》卷一‧邪氣藏府病形第四；本資料庫腧穴表（BL39、BL40、KI10）","id":"D3-022","h":"a5c3b5ee77"},{"day":3,"date":"2026-10-10","number":23,"topic":"Day3｜委陽：本輸三焦下俞","group":"委陽","qtype":"經典填空","stem":"《靈樞‧本輸》：「三焦下俞，在於足大指之前，少陽之後，出於膕中外廉，名曰委陽，是太陽絡也……並太陽之正，入絡膀胱，約下焦，實則閉癃，虛則____。」空格應填？","options":[["A","遺溺"],["B","腹脹"],["C","閉癃"],["D","洞泄"]],"answer":"A","difficulty":"高","explanation":"原文：「實則閉癃，虛則遺溺，遺溺則補之，閉癃則寫之。」委陽為三焦下合穴，三焦「約下焦」，主水道通調，因此委陽常用於癃閉、遺尿等小便病。《甲乙經》亦載委陽主「胸滿膨膨然，實則癃閉……虛則遺溺」。","source":"《靈樞經》卷一‧本輸第二；《針灸甲乙經》卷九‧第十一","id":"D3-023","h":"e53abe3406"},{"day":3,"date":"2026-10-10","number":24,"topic":"Day3｜委中：刺腰痛論","group":"委中","qtype":"經典填空","stem":"《針灸大成‧刺腰痛論》：「足太陽脈令人腰痛，引項脊尻背如重狀，刺其郄中，太陽正經出血，春無____。」空格應填？","options":[["A","深刺"],["B","灸之"],["C","見血"],["D","留針"]],"answer":"C","difficulty":"中","explanation":"原文為「刺其郄中，太陽正經出血，春無見血」。「郄中」即委中，《針灸大成》謂「委中者，血郄也」（委中一名血郄）。這是「腰背委中求」、委中刺絡治腰背痛的經典根據；「春無見血」反映依四時調整刺法的觀念。","source":"《針灸大成》卷一‧刺腰痛論；卷八‧足太陽膀胱經穴歌（委中）","id":"D3-024","h":"1621ba924a"},{"day":3,"date":"2026-10-10","number":25,"topic":"Day3｜委中：刺絡安全","group":"委中","qtype":"非題","stem":"關於委中的刺絡放血與刺灸注意事項，下列何者錯誤？","options":[["A","《針灸大成》引《素問》「刺委中大脈，令人仆脫色」，提醒勿傷深部大血管"],["B","刺絡宜選膕窩部淺表、怒張的靜脈（浮絡）點刺出血"],["C","應選膕窩中央搏動最明顯處，以三稜針刺入動脈出血，療效最佳"],["D","古籍多載委中禁灸，如《刺灸心法要訣‧委中穴歌》注文「禁灸」"]],"answer":"C","difficulty":"中","explanation":"委中深部有膕動脈、膕靜脈與脛神經，刺絡放血是點刺膕窩淺表瘀滯的靜脈，絕不可刺動脈；毫針直刺1–1.5寸時也要避開膕動脈。《針灸大成》：「素問，刺委中大脈，令人仆脫色」「可出血，痼疹皆愈」。委中在〈禁灸穴歌〉中名列禁灸。","source":"本資料庫腧穴表（BL40）；《針灸大成》卷八（委中）；《刺灸心法要訣》卷八‧委中穴歌、禁灸穴歌","id":"D3-025","h":"e1bdfa955d"},{"day":3,"date":"2026-10-10","number":26,"topic":"Day3｜腰痛臨床：馬尾症候群紅旗","group":"腰痛臨床","qtype":"臨床情境","stem":"52歲男性搬重物後腰痛兩天，今晨起雙下肢無力、會陰及肛門周圍麻木（鞍區感覺異常），且小便解不出來、下腹脹。家屬希望先針委中、腎俞、大腸俞止痛。下列處置何者最適當？","options":[["A","懷疑馬尾症候群，應立即轉急診安排腰椎MRI及神經外科／骨科評估，不宜以針灸延誤"],["B","委中刺絡放血加腎俞、大腸俞電針，三天後回診"],["C","屬急性腰扭傷，取養老、後谿配合運動針法即可"],["D","先針秩邊、次髎通利小便，待排尿後再處理腰痛"]],"answer":"A","difficulty":"中","explanation":"委中、腎俞、大腸俞、夾脊是腰痛常用穴，但鞍區麻木、尿滯留或失禁、雙側下肢無力或進行性神經缺損，是馬尾症候群的紅旗，需緊急影像與減壓手術，延誤可能造成永久性大小便與性功能障礙。其他腰痛紅旗還包括發燒（感染）、癌症病史或不明原因體重減輕、夜間休息痛、重大外傷等。","source":"notes：針灸治療學（腰痛）；臨床轉介原則","id":"D3-026","h":"62d42cf458"},{"day":3,"date":"2026-10-10","number":27,"topic":"Day3｜膀胱經：承筋禁刺（甲乙）","group":"膀胱經","qtype":"經典填空","stem":"《針灸甲乙經》卷三：「____，一名腨腸，一名直腸，在腨腸中央陷者中，足太陽脈氣所發，禁不可刺，灸三壯。」此穴為？","options":[["A","合陽"],["B","飛揚"],["C","承筋"],["D","承山"]],"answer":"C","difficulty":"中","explanation":"此為承筋，位於委中與承山連線上、委中下5寸，腓腸肌兩肌腹之間。《甲乙經》卷五刺禁也列「承筋禁不可刺」，《針灸大成》載「銅人灸三壯，禁針」。承山（一名魚腹、肉柱）「刺入七分，灸三壯」；合陽在膝約紋中央下2寸；飛揚為膀胱經絡穴，在外踝上7寸。","source":"《針灸甲乙經》卷三‧足太陽及股並陽蹺六穴凡三十四穴第三十五；卷五‧針灸禁忌第一（下）；《針灸大成》卷八","id":"D3-027","h":"9da2617a50"},{"day":3,"date":"2026-10-10","number":28,"topic":"Day3｜腎經：腹胸部分布規律","group":"腎經","qtype":"概念","stem":"關於足少陰腎經在胸腹部的分布規律，下列何者正確？","options":[["A","腹部各穴距前正中線0.5寸；胸部各穴距前正中線4寸"],["B","腹部各穴距前正中線1.5寸；胸部各穴距前正中線4寸"],["C","腹部各穴距前正中線2寸；胸部各穴距前正中線2寸"],["D","腹部橫骨至幽門各穴距前正中線0.5寸；胸部步廊至俞府各穴距前正中線2寸"]],"answer":"D","difficulty":"易","explanation":"腎經腹部11穴（橫骨、大赫、氣穴、四滿、中注、肓俞、商曲、石關、陰都、腹通谷、幽門）距前正中線0.5寸，肓俞在臍旁0.5寸；胸部6穴（步廊第5肋間隙至彧中第1肋間隙、俞府在鎖骨下緣）距前正中線2寸。常與他經比較：胃經腹部旁開2寸、胸部旁開4寸；脾經腹部旁開4寸、胸部旁開6寸；腎經則是0.5寸與2寸。","source":"本資料庫腧穴表（KI11–KI27）；《刺灸心法要訣》卷五‧腎經分寸歌","id":"D3-028","h":"ae556f7e97"},{"day":3,"date":"2026-10-10","number":29,"topic":"Day3｜腎經：胸部穴間距（甲乙）","group":"腎經","qtype":"經典填空","stem":"《針灸甲乙經》卷三〈胸自輸府俠任脈兩傍各二寸下行至步廊凡十二穴〉：「神封，在靈墟下____陷者中，足少陰脈氣所發，仰而取之，刺入四分，灸五壯。」空格應填？","options":[["A","一寸六分"],["B","一寸"],["C","二寸"],["D","一寸五分"]],"answer":"A","difficulty":"高","explanation":"原文各穴依次「下一寸六分」：輸府「在巨骨下，去璇璣傍各二寸陷者中」，以下彧中、神藏、靈墟、神封、步廊各相距一寸六分，相當於一個肋間隙，現代即第1至第5肋間隙。本組穴皆「刺入四分」，現代亦要求斜刺或平刺0.5–0.8寸，不可深刺。","source":"《針灸甲乙經》卷三‧第十五；本資料庫腧穴表（KI22–KI27）","id":"D3-029","h":"3722df406f"},{"day":3,"date":"2026-10-10","number":30,"topic":"Day3｜腎經：然谷刺血（甲乙）","group":"腎經","qty
