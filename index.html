,"id":"D9-018","h":"e2598e0825"},{"day":9,"date":"2026-10-16","number":19,"topic":"Day9｜皮膚：痤瘡刺絡拔罐","group":"皮膚","qtype":"概念","stem":"20歲男性，額頭、兩頰及背部丘疹與膿皰反覆發作，口乾、便秘、舌紅苔黃、脈數，辨為肺胃熱盛型痤瘡。下列處方最適當？","options":[["A","膏肓重灸七七壯"],["B","只取足三里、太谿施補法"],["C","大椎刺絡拔罐，配肺俞、曲池、合谷、內庭"],["D","重灸關元、神闕、命門以溫補下元"]],"answer":"C","difficulty":"易","explanation":"通行教材的痤瘡處方是大椎、曲池、合谷、內庭、肺俞，常在大椎（或肺俞）刺絡拔罐以瀉熱。肺胃熱盛要清瀉陽明、肺經之熱，重灸溫補會助熱。\n補充：反覆結節囊腫型痤瘡、或疑似多囊性卵巢症候群（女性合併月經不規則、多毛）時，宜會同皮膚科或婦產科處理。","source":"notes（處方速記（二）：痤瘡）；textbook_notes（新編彩圖 第八章 第十節 皮膚系統疾病）","id":"D9-019","h":"23a846ecf6"},{"day":9,"date":"2026-10-16","number":20,"topic":"Day9｜外科：急性腰扭傷運動針法","group":"外科","qtype":"臨床情境","stem":"30歲男性，1小時前彎腰搬重物後腰部劇痛、不能轉身，腰肌僵硬、壓痛明顯；下肢無麻木無力、大小便正常，無外傷撞擊、無骨質疏鬆病史。下列處置何者最適當？","options":[["A","先取遠端穴（後谿、腰痛點或水溝），行針時囑患者緩慢活動腰部，再視情況處理局部"],["B","腰部痛點立即深刺強刺激，留針後囑絕對臥床兩週"],["C","首選重灸神闕、關元，以溫補腎陽"],["D","委中禁刺血，急性扭傷只能熱敷"]],"answer":"A","difficulty":"中","explanation":"急性腰扭傷的常用處方是水溝、後谿、腰痛點、養老、攢竹，或委中放血，並採「運動針法」：遠端行針的同時，讓患者緩慢前屈、後伸、旋轉腰部，常能立刻減輕疼痛與肌肉痙攣。急性期局部不宜強刺激，也不建議長期臥床，應鼓勵在可忍受範圍內活動。\n要排除的紅旗：下肢神經學缺損、大小便異常（馬尾症候群）、高齡或骨質疏鬆者的壓迫性骨折、發燒、腫瘤病史。","source":"notes（處方速記（二）：腰痛／急性腰扭傷）","id":"D9-020","h":"6dcbd1468b"},{"day":9,"date":"2026-10-16","number":21,"topic":"Day9｜急救：《刺灸心法要訣》十井刺血","group":"急救","qtype":"經典","stem":"《刺灸心法要訣‧手部主病針灸要穴歌》：「商陽主刺卒中風，暴僕昏沉痰塞壅，少商中衝關衝少，少澤三稜立回生。」注文引《乾坤生意》，以三稜針刺「十井穴」急救。下列何穴「不在」注文所列之中？","options":[["A","少衝"],["B","隱白"],["C","中衝"],["D","關衝"]],"answer":"B","difficulty":"易","explanation":"注文：「凡初中風跌倒，卒暴昏沉，痰盛不省人事，牙關緊閉，藥水不下，急以三稜針刺中衝、少商、商陽、關衝、少衝、少澤，使血氣流通，實起死回生急救之妙訣也。」所列都是手部井穴；隱白是足太陰脾經井穴，不在其中。\n現代處置：疑似中風要先撥打119、記錄發病時間，送到可做血栓溶解或取栓的醫院。刺血只能作為等待時的輔助，不能延誤送醫。","source":"《刺灸心法要訣》卷七‧手部主病針灸要穴歌（注引《乾坤生意》）","id":"D9-021","h":"544935ef07"},{"day":9,"date":"2026-10-16","number":22,"topic":"Day9｜歌賦：四總穴歌","group":"歌賦","qtype":"經典填空","stem":"《針灸大成‧四總穴歌》：「肚腹三里留，腰背委中求，頭項尋____，面口合谷收。」空格應填？","options":[["A","風池"],["B","後谿"],["C","列缺"],["D","外關"]],"answer":"C","difficulty":"易","explanation":"頭項尋列缺。列缺是手太陰絡穴，別走手陽明，也是八脈交會穴（通任脈）。手陽明上行頭面，所以列缺能治頭項病，如《刺灸心法要訣》「列缺主治嗽寒痰，偏正頭疼治自痊」。\n後人加上「酸痛取阿是，胸脅內關謀」成為「六總穴」，那不是《針灸大成》的原文。","source":"《針灸大成》卷三‧四總穴歌；notes（高頻歌賦考點）","id":"D9-022","h":"f78ff7ae32"},{"day":9,"date":"2026-10-16","number":23,"topic":"Day9｜歌賦：孫真人十三鬼穴配對","group":"歌賦","qtype":"非題","stem":"《針灸大成‧孫真人針十三鬼穴歌》及其注，下列「鬼穴名—今穴名」配對何者錯誤？","options":[["A","鬼床—頰車"],["B","鬼信—少商"],["C","鬼堂—百會"],["D","鬼心—大陵"]],"answer":"C","difficulty":"中","explanation":"注文：「十針鬼堂，即上星」，不是百會。完整十三穴：鬼宮人中、鬼信少商、鬼壘隱白、鬼心大陵、鬼路申脈、鬼枕風府、鬼床頰車、鬼市承漿、鬼窟勞宮、鬼堂上星、鬼藏（男會陰、女玉門頭）、鬼腿曲池、鬼封（舌下中縫）。注文又說「更加間使後谿二穴，尤妙」。\n本歌治「百邪顛狂」。今日遇到急性精神症狀，要先排除譫妄、低血糖、中毒、顱內病變，並評估自傷、傷人風險。","source":"《針灸大成》卷十一‧孫真人針十三鬼穴歌","id":"D9-023","h":"1273df133b"},{"day":9,"date":"2026-10-16","number":24,"topic":"Day9｜歌賦：十三鬼穴的火針與刺法","group":"歌賦","qtype":"經典","stem":"依《針灸大成‧孫真人針十三鬼穴歌》注文，下列何組穴位注明以「火針」施術？","options":[["A","鬼窟勞宮、鬼堂上星"],["B","鬼路申脈、鬼腿曲池"],["C","鬼枕風府、鬼市承漿"],["D","鬼宮人中、鬼信少商"]],"answer":"B","difficulty":"高","explanation":"注文：「五針鬼路，即申脈，火針三分」「十二針鬼腿，即曲池，火針入五分」。歌文也說「五針申脈為鬼路，火針三分七锃锃」「十二曲池名鬼腿，火針仍要七锃锃」（保留底本用字）。\n其他刺法要點：先針鬼宮（人中）；「男從左起女從右」；鬼封在舌下中縫，刺出血後「仍橫安針一枚，就兩口吻，令舌不動」；鬼藏男取會陰、女取玉門頭。","source":"《針灸大成》卷十一‧孫真人針十三鬼穴歌","id":"D9-024","h":"f9b5c6c7c8"},{"day":9,"date":"2026-10-16","number":25,"topic":"Day9｜歌賦：回陽九針的經脈歸屬","group":"歌賦","qtype":"概念","stem":"《針灸大成‧回陽九針歌》：「啞門勞宮三陰交，湧泉太谿中脘接，環跳三里合谷并，此是回陽九針穴。」九穴中屬於足少陰腎經的是哪兩穴？","options":[["A","勞宮、中脘"],["B","啞門、合谷"],["C","環跳、三陰交"],["D","湧泉、太谿"]],"answer":"D","difficulty":"中","explanation":"九穴的歸經：啞門（督脈）、勞宮（手厥陰心包經滎穴）、三陰交（足太陰脾經）、湧泉（足少陰腎經井穴）、太谿（足少陰腎經輸穴、原穴）、中脘（任脈，胃募、腑會）、環跳（足少陽膽經）、足三里（足陽明胃經合穴）、合谷（手陽明大腸經原穴）。\n只有腎經佔兩穴，反映回陽救逆要從腎陽（元陽）著手。現代遇到休克、心跳停止，仍以 CPR、AED、119 為優先。","source":"《針灸大成》卷三‧回陽九針歌；acupoints","id":"D9-025","h":"9557339f1b"},{"day":9,"date":"2026-10-16","number":26,"topic":"Day9｜歌賦：馬丹陽天星十二穴（太衝）","group":"歌賦","qtype":"經典填空","stem":"《針灸大成‧馬丹陽天星十二穴治雜病》其七：「____足大指，節後二寸中，動脈知生死，能醫驚癇風，咽喉并心脹，兩足不能行……」空格應填？","options":[["A","衝陽"],["B","行間"],["C","太白"],["D","太衝"]],"answer":"D","difficulty":"中","explanation":"這是太衝。「動脈知生死」是指太衝處可以摸到動脈搏動（第1、2蹠骨間），古人以太衝脈判斷預後。歌中主治驚癇風、咽喉、心脹、兩足不能行、七疝偏墜、眼目雲朦、腰痛；注明「針三分灸三壯」。\n易混：衝陽（胃經原穴）也在足背、可摸到足背動脈，但不屬天星十二穴。天星十二穴：三里、內庭、曲池、合谷、委中、承山、太衝、崑崙、環跳、陽陵、通里、列缺。","source":"《針灸大成》卷三‧馬丹陽天星十二穴治雜病","id":"D9-026","h":"80866ca2c0"},{"day":9,"date":"2026-10-16","number":27,"topic":"Day9｜歌賦：《通玄指要賦》重點句","group":"歌賦","qtype":"非題","stem":"下列《針灸大成‧通玄指要賦》的病證與取穴配對，何者「不符合」原文？","options":[["A","四肢之懈惰，憑足三里以消除"],["B","瘧生寒熱兮，仗間使以扶持"],["C","人中除脊膂之強痛"],["D","行步難移，太衝最奇"]],"answer":"A","difficulty":"中","explanation":"原文是「四肢之懈惰，憑照海以消除」。照海通陰蹻脈，可治嗜臥、肢體倦怠。\n其他原文：「且如行步難移，太衝最奇，人中除脊膂之強痛，神門去心性之呆痴」「牙齒痛，太谿堪治，頭項強，承漿可保」「癇發顛狂兮，憑後谿而療理，瘧生寒熱兮，仗間使以扶持」「大敦去七疝之偏墜」「三里卻五勞之羸瘦」。","source":"《針灸大成》卷三‧通玄指要賦（楊繼洲註解）","id":"D9-027","h":"5a3ab02a15"},{"day":9,"date":"2026-10-16","number":28,"topic":"Day9｜歌賦：《百症賦》五官配穴","group":"歌賦","qtype":"非題","stem":"下列《針灸大成‧百症賦》頭面五官的配穴，何者「不符合」原文？","options":[["A","「通天去鼻內無聞之苦」"],["B","「面上蟲行有驗，睛明可取」"],["C","「耳聾氣閉，全憑聽會翳風」"],["D","「耳門絲竹空，住牙疼於頃刻」"]],"answer":"B","difficulty":"中","explanation":"原文是「面上蟲行有驗，迎香可取」。迎香在鼻翼旁，主治鼻塞不聞香臭、面癢如蟲行，與《刺灸心法要訣》「迎香主刺鼻失臭，兼刺面癢若蟲行」相同。\n其他原文：「耳聾氣閉，全憑聽會翳風」「耳中蟬鳴有聲，聽會堪攻」「耳門絲竹空，住牙疼於頃刻，頰車地倉穴，正口喎於片時」「喉痛兮液門魚際去療」「通天去鼻內無聞之苦」「鼻痔必取齗交」。","source":"《針灸大成》卷二‧百症賦（聚英）；《刺灸心法要訣》卷七‧頭部主病針灸要穴歌","id":"D9-028","h":"ad5592c253"},{"day":9,"date":"2026-10-16","number":29,"topic":"Day9｜歌賦：《玉龍歌》二白治痔","group":"歌賦","qtype":"經典","stem":"《玉龍歌》：「痔漏之疾亦可憎，表裏急重最難禁，或痛或痒或下血，二白穴在掌中尋。」依楊繼洲注及今日定位，關於二白，下列何者正確？","options":[["A","位於掌心第2、3掌骨之間，一手一穴"],["B","位於腕掌側橫紋上4寸，一臂二穴、兩穴相對，分處橈側腕屈肌腱兩側"],["C","屬手厥陰心包經正經穴，即間使穴"],["D","位於前臂背側腕橫紋上4寸，與三陽絡同位"]],"answer":"B","difficulty":"中","explanation":"注文：「二白四穴，在掌後，去橫紋四寸，兩穴相對，一穴在筋內，一穴在大筋外，針五分。」四穴是指左右共四穴，一臂二穴。今定位（EX-UE2）：腕掌側橫紋上4寸，橈側腕屈肌腱兩側，主治痔瘡、脫肛。歌中的「掌中尋」是泛指掌側，並非掌心。\n同首歌另有「九般痔漏最傷人，必刺承山效若神，更有長強一穴是」。","source":"《針灸大成》卷三‧玉龍歌（楊繼洲註解）；acupoints（二白 EX-UE2）","id":"D9-029","h":"7e95c87fa5"},{"day":9,"date":"2026-10-16","number":30,"topic":"Day9｜醫籍：作者、朝代與特色","group":"醫籍","qtype":"非題","stem":"下列針灸醫籍與作者、朝代的配對，何者錯誤？","options":[["A","《針灸聚英》為明代楊繼洲所著，《百症賦》即出自此書"],["B","元代滑壽著《十四經發揮》，將任、督二脈與十二經並稱「十四經」"],["C","北宋王惟一撰《銅人腧穴針灸圖經》，並主持鑄造針灸銅人"],["D","清代李學川《針灸逢源》載經穴361個，沿用至今"]],"answer":"A","difficulty":"易","explanation":"《針灸聚英》作者是明代高武。《針灸大成》收錄《百症賦》時標明「聚英」，即指此書。楊繼洲的代表作是《針灸大成》（1601年，靳賢補輯）。\n其餘正確：王惟一，北宋天聖年間（1026–1027）編《銅人腧穴針灸圖經》並鑄銅人；滑壽，元代，《十四經發揮》；李學川，清代，《針灸逢源》（1817）定361穴。","source":"textbook_notes（新編彩圖 緒論 第四節 針灸醫學源流；針灸學 第十一章 主要針灸醫籍簡介）；notes（針灸大成提要）","id":"D9-030","h":"cc3b9323f5"},{"day":9,"date":"2026-10-16","number":31,"topic":"Day9｜醫籍：《甲乙經》卷三的腧穴排列法","group":"醫籍","qtype":"概念","stem":"《針灸甲乙經》卷三收錄腧穴，篇名如「頭直鼻中髮際傍行至頭維凡七穴」「胸自天突循任脈下行至中庭凡七穴」「手太陰及臂凡一十八穴」。其排列方式為何？","options":[["A","依五輸穴、原穴、絡穴等特定穴分類排列"],["B","依主治病證分類排列，不分部位"],["C","全身穴位依十四經循行順序排列"],["D","頭面軀幹依部位分區劃線排列，四肢依經脈排列"]],"answer":"D","difficulty":"中","explanation":"《甲乙經》卷三把頭、背、面、耳、頸、肩、胸、腹按部位分區，再依直線排穴（如「頭直鼻中入髮際一寸循督脈卻行至風府凡八穴」），四肢則按經排列（如「手太陰及臂」「足陽明及股」）。這種「分部劃線布穴」是《甲乙經》的創舉，也是現存最早的系統腧穴整理，通行教材稱載穴349個。\n全身依十四經排列，是元代滑壽《十四經發揮》的體例。","source":"《針灸甲乙經》卷三各篇名；notes（針灸甲乙經提要）","id":"D9-031","h":"a08d2f5323"},{"day":9,"date":"2026-10-16","number":32,"topic":"Day9｜WHO 2002 報告：婦產科適應症分類","group":"WHO 2002 報告","qtype":"概念","stem":"WHO 2002年出版的《Acupuncture: Review and Analysis of Reports on Controlled Clinical Trials》將病症分為四類。下列婦產科病症，何者「不屬於」第一類（經對照試驗證實有效）？","options":[["A","引產"],["B","產後缺乳"],["C","原發性痛經"],["D","胎位不正的矯正"]],"answer":"B","difficulty":"中","explanation":"第一類共28項，婦產科相關的有原發性痛經、引產、胎位不正的矯正、晨吐（孕吐）。缺乳（lactation deficiency）屬第二類：已顯示療效，但需要更多證據。同在第二類的婦產科病症還有女性不孕、產痛、多囊性卵巢症候群、經前症候群等。\n提醒：WHO 文件聲明只供各國參考，不等於 WHO 背書所有療效；考題常問「分為幾類」與代表病症。","source":"WHO. Acupuncture: Review and Analysis of Reports on Controlled Clinical Trials. Geneva; 2002（第3章，已查閱原文清單）；textbook_notes（新編彩圖 第九章 第四節）","id":"D9-032","h":"fa4ed87f89"},{"day":9,"date":"2026-10-16","number":33,"topic":"Day9｜WHO 2002 報告：第四類（需現代醫學監測）","group":"WHO 2002 報告","qtype":"概念","stem":"WHO 2002 報告的第四類是：「施術者具備特殊現代醫學知識及足夠監測設備時，才可嘗試針刺」的病症。下列何者屬於此類？","options":[["A","嬰兒驚厥"],["B","牙科疼痛"],["C","色盲"],["D","百日咳"]],"answer":"A","difficulty":"高","explanation":"第四類共7項：慢性阻塞性肺病的呼吸困難、昏迷、嬰兒驚厥、冠心病（心絞痛）、嬰幼兒腹瀉、小兒病毒性腦炎後期、進行性延髓麻痺與假性延髓麻痺。這些都是可能危及生命的情況，必須在現代醫療監測下進行。\n色盲屬第三類（只有個別對照試驗，因常規治療困難而值得嘗試）；百日咳屬第二類；牙科疼痛屬第一類。這也呼應兒科驚風的處置：嬰兒抽搐要先確保呼吸道與生命徵象，針灸只能在監測下輔助。","source":"WHO. Acupuncture: Review and Analysis of Reports on Controlled Clinical Trials. Geneva; 2002（第3章四類清單）","id":"D9-033","h":"9bdbca0064"},{"day":9,"date":"2026-10-16","number":34,"topic":"Day9｜針刺鎮痛：作用機轉","group":"針刺鎮痛","qtype":"非題","stem":"關於針刺鎮痛的作用機轉，下列敘述何者錯誤？","options":[["A","動物研究顯示，局部腺苷（adenosine）經 A1 受體參與針刺的局部鎮痛"],["B","可啟動中腦導水管周圍灰質、延腦中縫核等下行抑制路徑，涉及血清素與正腎上腺素"],["C","可經由脊髓節段性抑制產生鎮痛，常以 Melzack 與 Wall（1965）的閘門控制理論解釋"],["D","針刺鎮痛完全不受納洛酮（naloxone）影響，證明與內源性鴉片肽無關"]],"answer":"D","difficulty":"中","explanation":"納洛酮是鴉片受體拮抗劑，可以「部分」拮抗針刺鎮痛，這是支持內源性鴉片肽（腦啡肽、β-內啡肽、強啡肽）參與的重要證據，所以「完全不受影響、與鴉片肽無關」是錯的。\n其他機轉：脊髓閘門控制、腦幹下行抑制（5-HT、NE）、局部腺苷 A1 受體（Goldman 等 2010 動物研究）。補充：低頻（約2 Hz）電針主要促進腦啡肽、β-內啡肽釋放；高頻（約100 Hz）主要促進強啡肽釋放。","source":"textbook_notes（新編彩圖 第八章 第十二節 針刺鎮痛之臨床研究成果；第九章 第二節 作用機轉）","id":"D9-034","h":"e10db286fa"},{"day":9,"date":"2026-10-16","number":35,"topic":"Day9｜針刺麻醉：臨床應用要點","group":"針刺麻醉","qtype":"臨床情境","stem":"某醫院計畫以「針藥複合麻醉」為一位甲狀腺手術病人施行針刺麻醉（電針合谷、內關、扶突等）。下列何者正確？","options":[["A","術前需約20–30分鐘的誘導期，讓鎮痛效應建立"],["B","鎮痛效果個體差異大，術前可先試針評估病人的反應"],["C","鎮痛常不完全，必要時須輔以藥物，不能保證完全無痛"],["D","病人術中保持清醒、可以配合（如發聲以確認喉返神經功能），對生理功能干擾較少"],["E","以上皆是"]],"answer":"E","difficulty":"中","explanation":"針刺麻醉的特點：需要約20–30分鐘誘導期；個體差異大，術前試針有助於篩選合適病人；鎮痛不全、肌肉鬆弛不足、內臟牽拉反應無法完全抑制，所以現代多採「針藥複合麻醉」，用針刺減少麻醉藥量。優點是病人清醒、生理干擾少、術後恢復快，甲狀腺手術中病人還能發聲，幫助確認喉返神經功能。\n長時間電針會產生耐受，也是限制之一。","source":"textbook_notes（新編彩圖 第八章 第十二節：誘導期約20–30分鐘、個體差異、耐受）；notes（特殊針法：電針）","id":"D9-035","h":"9eabc2950f"},{"day":9,"date":"2026-10-16","number":36,"topic":"其他｜《靈樞‧官能》針與灸的分工","group":"《靈樞‧官能》針與灸的分工","qtype":"經典填空","stem":"《靈樞‧官能》：「大寒在外，留而補之。入於中者，從合寫之。鍼所不為，____。上氣不足，推而揚之。」空格應填？","options":[["A","藥之所宜"],["B","灸之所宜"],["C","導引所宜"],["D","砭之所宜"]],"answer":"B","difficulty":"易","explanation":"原文是「鍼所不為，灸之所宜」：針刺力有未逮的病證，就適合用灸。同篇還有「陰陽皆虛，火自當之」「經陷下者，火則當之」「結絡堅緊，火所治之」，說明陰陽俱虛、經脈陷下、絡脈結聚堅緊時都宜用灸，也就是《靈樞‧經脈》「陷下則灸之」的延伸。\n同段「厥而寒甚，骨廉陷下，寒過於膝，下陵三里」是以足三里治寒厥。","source":"《靈樞經》卷十一‧官能第七十三","id":"D9-036","h":"cffeb21ed9"},{"day":9,"date":"2026-10-16","number":37,"topic":"其他｜《靈樞‧官能》方員補瀉","group":"《靈樞‧官能》方員補瀉","qtype":"經典填空","stem":"《靈樞‧官能》論補瀉：「寫必用____，切而轉之，其氣乃行，疾而徐出，邪氣乃出，伸而迎之，搖大其穴，氣出乃疾。補必用____，外引其皮，令當其門，左引其樞，右推其膚，微旋而徐推之……氣下而疾出之，推其皮，蓋其外門，真氣乃存。」兩空格依序應填？","options":[["A","方；員"],["B","迎；隨"],["C","員；方"],["D","疾；徐"]],"answer":"C","difficulty":"高","explanation":"〈官能〉原文是「寫必用員」「補必用方」。瀉法用「員」（圓活流動）：切按轉針使氣行，搖大針孔，出針時不按，讓邪氣外出。補法用「方」（端正安靜）：「必端以正，安以靜，堅心無解」，出針後推皮蓋住針孔，讓真氣保存。這一段同時包含捻轉、搖法、開闔補瀉的要素。\n提醒：《素問‧八正神明論》的方員用法和本篇相反（本資料庫沒有收《素問》原文，僅作辨識提醒）。考題若標明出自《靈樞‧官能》，以本篇為準。","source":"《靈樞經》卷十一‧官能第七十三","id":"D9-037","h":"df0f48951a"},{"day":9,"date":"2026-10-16","number":38,"topic":"其他｜《靈樞‧終始》脈實脈虛的刺法深淺","group":"《靈樞‧終始》脈實脈虛的刺法深淺","qtype":"經典填空","stem":"《靈樞‧終始》：「脈實者，____，以泄其氣。脈虛者，____，使精氣無得出，以養其脈，獨出其邪氣。」兩空格依序應填？","options":[["A","疾出之；久留之"],["B","淺刺之；深刺之"],["C","深刺之；淺刺之"],["D","刺出血；灸之"]],"answer":"C","difficulty":"中","explanation":"原文：「脈實者，深刺之，以泄其氣；脈虛者，淺刺之，使精氣無得出。」同篇前文：「一方實深取之，稀按其痏，以極出其邪氣；一方虛淺刺之，以養其脈，疾按其痏，無使邪氣得入。」\n重點：實證深刺、出針後不急著按針孔（開闔之瀉）；虛證淺刺、出針後快速按壓針孔（開闔之補）。這是依脈象決定深淺與開闔的補瀉原則。","source":"《靈樞經》卷二‧終始第九","id":"D9-038","h":"4f84d3eba0"},{"day":9,"date":"2026-10-16","number":39,"topic":"其他｜經絡總論：《靈樞‧營衛生會》","group":"經絡總論","qtype":"經典","stem":"依《靈樞‧營衛生會》原文，下列何者正確？","options":[["A","老人夜間不易入睡，是因為「氣血盛，其肌肉滑，氣道通」"],["B","「營出於中焦，衛出於下焦」（底本作「下焦」）"],["C","「其清者為衛，濁者為營，衛在脈中，營在脈外」"],["D","衛氣「行於陽五十度，行於陰五十度」，晝夜共百度"]],"answer":"B","difficulty":"中","explanation":"原文：「其清者為營，濁者為衛，營在脈中，衛在脈外，營周不休，五十而復大會」「衛氣行於陰二十五度，行於陽二十五度，分為晝夜」「營出於中焦，衛出於下焦」（後世有人主張應作「上焦」，但本資料庫底本作「下焦」）。\n老人「其肌肉枯，氣道澀……其營氣衰少，而衛氣內伐，故晝不精，夜不瞑」；氣血盛、肌肉滑、氣道通是壯年人「晝精而夜瞑」的原因。","source":"《靈樞經》卷四‧營衛生會第十八","id":"D9-039","h":"21a01d4d6f"},{"day":9,"date":"2026-10-16","number":40,"topic":"其他｜經絡總論：《靈樞‧經脈》論經脈的重要性","group":"經絡總論","qtype":"經典填空","stem":"《靈樞‧經脈》：「經脈者，所以能____，不可不通。」空格應填？","options":[["A","行血氣而榮陰陽，濡筋骨，利關節"],["B","溫分肉，充皮膚，肥腠理"],["C","內屬於府藏，外絡於肢節"],["D","決死生，處百病，調虛實"]],"answer":"D","difficulty":"易","explanation":"〈經脈〉原文：「經脈者，所以能決死生，處百病，調虛實，不可不通。」強調經脈在診斷（決死生）、治療（處百病、調虛實）上的地位。\n易混：「經脈者，所以行血氣而榮陰陽，濡筋骨，利關節者也」出自〈本藏〉（論經脈的生理功能）；「夫十二經脈者，內屬於府藏，外絡於肢節」出自〈海論〉；「溫分肉，充皮膚」是〈本藏〉講衛氣的功能。","source":"《靈樞經》卷三‧經脈第十；卷七‧本藏第四十七；卷六‧海論第三十三","id":"D9-040","h":"03ba472883"},{"day":9,"date":"2026-10-16","number":41,"topic":"其他｜骨度：《靈樞‧骨度》與現行標準","group":"骨度","qtype":"非題","stem":"下列《靈樞‧骨度》的記載，何者與現行骨度分寸（WHO 2008 標準）「不一致」？","options":[["A","「肘至腕長一尺二寸半」"],["B","「膝以下至外踝，長一尺六寸」"],["C","「內輔下廉下至內踝，長一尺三寸」"],["D","「橫骨上廉以下至內輔之上廉，長一尺八寸」"]],"answer":"A","difficulty":"中","explanation":"現行標準：肘橫紋至腕掌（背）側橫紋為12寸，〈骨度〉作12.5寸（一尺二寸半），兩者不同。\n一致的有：恥骨聯合上緣至股骨內上髁上緣18寸（橫骨上廉至內輔上廉一尺八寸）；脛骨內側髁下緣至內踝尖13寸（內輔下廉至內踝一尺三寸）；膕橫紋（膝中）至外踝尖16寸（膝以下至外踝一尺六寸）。另有「髀樞以下至膝中，長一尺九寸」，即股骨大轉子至膕橫紋19寸。","source":"《靈樞經》卷四‧骨度第十四；notes（腧穴定位法與骨度分寸）","id":"D9-041","h":"9633a8a939"},{"day":9,"date":"2026-10-16","number":42,"topic":"其他｜五輸穴：陰陽經五行配屬","group":"五輸穴","qtype":"非題","stem":"《針灸大成‧論子午流注法》：「陰井木而陽井金，陰榮火而陽榮水，陰俞土而陽俞木，陰經金而陽經火，陰合水而陽合土。」下列何者錯誤？","options":[["A","陽經合穴屬水"],["B","陽經輸穴屬木"],["C","陰經滎穴屬火"],["D","陰經經穴屬金"]],"answer":"A","difficulty":"易","explanation":"依原文：陽經合穴屬土，屬水的是陰經合穴。完整對照：陰經依井滎輸經合配木火土金水；陽經依井滎輸經合配金水木火土。陽經各穴都「剋」同位陰經（陽井金剋陰井木……），這就是「剛柔相配」。\n應用：如足三里為胃經合土、陰陵泉為脾經合水、陽陵泉為膽經合土。","source":"《針灸大成》卷七‧論子午流注法（徐氏）","id":"D9-042","h":"e20b2e9c14"},{"day":9,"date":"2026-10-16","number":43,"topic":"其他｜原穴：陰經以輸代原與《千金》陰經原穴","group":"原穴","qtype":"經典","stem":"《針灸大成‧論子午流注法》：「陽經有原，遇俞穴并過之，陰經無原，以俞穴即代之……又按千金云：六陰經亦有原穴」（底本作「陰經典原」）。依此段《千金》所列，肝經（乙）的原穴為何？","options":[["A","蠡溝"],["B","曲泉"],["C","中都"],["D","太衝"]],"answer":"C","difficulty":"中","explanation":"原文：「又按千金云：六陰經亦有原穴，乙中都，丁通里，己公孫，辛列缺，癸水泉。」依此說，肝經原穴是中都（郄穴），心經是通里，脾經是公孫，肺經是列缺，腎經是水泉。\n一般通行說法是陰經以輸代原：肝原太衝、心原神門、脾原太白、肺原太淵、腎原太谿。陽經則另有原穴，位於輸穴與經穴之間（如膽經丘墟），所以說「遇俞穴并過之」。考試多以「陰經以輸代原」為主，《千金》之說屬異說。","source":"《針灸大成》卷七‧論子午流注法（徐氏）","id":"D9-043","h":"068d062259"},{"day":9,"date":"2026-10-16","number":44,"topic":"其他｜特定穴：《難經》論俞募","group":"特定穴","qtype":"概念","stem":"《針灸大成》〈五臟募穴〉〈五臟俞穴〉引《難經》：「陽病行陰，故令募在陰」「陰病行陽，故令俞在陽」。下列理解何者最正確？","options":[["A","募穴在四肢肘膝以下，俞穴在頭面"],["B","五臟募穴都在任脈上，五臟俞穴都在督脈上"],["C","募穴只能治陽病，俞穴只能治陰病，兩者不可同用"],["D","募穴都在胸腹（屬陰），俞穴都在背腰（屬陽），陰陽經氣相互交通，臨床常前後配用（俞募配穴）"]],"answer":"D","difficulty":"中","explanation":"原注：「腹曰陰，募皆在腰」「背曰陽，俞皆在背」（前句「腰」當作「腹」，底本傳鈔之誤）。內臟、陰經的病氣常外行到屬陽的背部俞穴；腑、陽經的病氣常內行到屬陰的腹部募穴。所以後世概括為「臟病多取俞、腑病多取募」，或俞募前後配用。\n五臟募穴：中府（肺）、巨闕（心）、期門（肝）、章門（脾）、京門（腎），分屬不同經脈，只有巨闕在任脈。","source":"《針灸大成》卷九‧五臟募穴、五臟俞穴（聚英）","id":"D9-044","h":"b857ab2c8c"},{"day":9,"date":"2026-10-16","number":45,"topic":"其他｜灸法禁忌：《刺灸心法要訣》命門與關元","group":"灸法禁忌","qtype":"經典","stem":"《刺灸心法要訣》卷七注文中，有兩處和「絕子／無子」有關的刺灸禁忌。下列何者正確？","options":[["A","命門：禁針只宜灸百壯；關元：禁灸只宜針"],["B","兩穴都注明「灸以年為壯」，並無絕子之說"],["C","命門：「若年二十以上者不宜灸，灸恐絕子」；關元：引《千金》「婦人針之則無子」"],["D","命門：孕婦禁針；關元：男子灸之則無子"]],"answer":"C","difficulty":"高","explanation":"〈背部主病針灸要穴歌〉命門注：「主治老人腎虛腰疼。及久痔脫肛，腸風下血等證。針五分，灸三壯。若年二十以上者不宜灸，灸恐絕子。」〈胸腹部主病針灸要穴歌〉關元注：「針八分，留七呼，灸七壯。《千金》云：婦人針之則無子。」\n這些是古籍禁忌，考試常以「何穴有此記載」出題。現代臨床對孕婦或有生育計畫者，下腹與腰骶部穴位仍宜謹慎。","source":"《刺灸心法要訣》卷七‧背部主病針灸要穴歌、胸腹部主病針灸要穴歌","id":"D9-045","h":"3cd97ff0f0"},{"day":9,"date":"2026-10-16","number":46,"topic":"其他｜灸量：隨年壯","group":"灸量","qtype":"概念","stem":"《針灸大成‧小兒針》：「脫肛，灸臍中三壯，千金云：隨年壯。」《刺灸心法要訣》百勞穴也注「灸以年為壯」。「隨年壯」是什麼意思？","options":[["A","每年固定在同一天施灸一次"],["B","依患者年齡決定艾炷壯數，大約幾歲就灸幾壯"],["C","灸至皮膚起疱，一年後才能再灸"],["D","艾炷大小隨年齡增長而加大，壯數固定為三壯"]],"answer":"B","difficulty":"易","explanation":"「隨年壯」「以年為壯」是指壯數與年齡相同，例如7歲灸7壯。這是古代依體質、年齡調整灸量的方法。小兒施灸還要配合小艾炷（《針灸大成‧小兒針》標題注「用毫針艾炷如小麥或維雀大」），並注意燙傷。\n灸量的一般原則：頭面、胸部、四肢末端壯數少、艾炷小；腰腹、肌肉豐厚處壯數可多；老幼體弱者宜少。","source":"《針灸大成》卷十二‧小兒針；《刺灸心法要訣》卷七‧背部主病針灸要穴歌（百勞）","id":"D9-046","h":"4cc6953329"},{"day":9,"date":"2026-10-16","number":47,"topic":"其他｜禁穴：《刺灸心法要訣》背俞穴禁針","group":"禁穴","qtype":"非題","stem":"依《刺灸心法要訣‧背部主病針灸要穴歌》注文，下列哪一個背部穴位「沒有」注明禁針（注文給了針刺分寸）？","options":[["A","腎俞"],["B","膈俞"],["C","肺俞"],["D","肝俞"]],"answer":"C","difficulty":"高","explanation":"注文：肺俞「針三分，留七呼，灸三壯」，可針。註明「禁針」的有：膈俞（灸三壯，禁針）、肝俞（灸七壯，禁針）、膽俞（灸三壯，禁針）、脾俞（灸五壯，禁針）、腎俞（灸三壯，禁針）、神道（灸七壯，禁針）。膏肓也是「此穴禁針惟宜艾」；大杼則相反，「針五分，禁灸」。\n現代教材多允許背俞穴斜刺0.5–0.8寸，但古籍的記載反映背部深刺有氣胸風險，所以多主張用灸。","source":"《刺灸心法要訣》卷七‧背部主病針灸要穴歌","id":"D9-047","h":"0424575d06"},{"day":9,"date":"2026-10-16","number":48,"topic":"其他｜取穴原則：《靈樞‧終始》上病下取","group":"取穴原則","qtype":"經典填空","stem":"《靈樞‧終始》：「病在上者，下取之。病在下者，高取之。病在頭者，取之____。病在腰者，取之____。」兩空格依序應填？","options":[["A","腹；背"],["B","足；膕"],["C","手；足"],["D","項；臀"]],"answer":"B","difficulty":"易","explanation":"原文：「病在頭者，取之足。病在腰者，取之膕。」與「腰背委中求」（委中在膕窩）一致。同段還有「從腰以上者，手太陰陽明皆主之，從腰以下者，足太陰陽明皆主之」「治病者，先刺其病所從生者也」。\n這是遠道取穴、上病下取的經典根據，例如頭痛取太衝、至陰，腰痛取委中。","source":"《靈樞經》卷二‧終始第九","id":"D9-048","h":"1dca2c6a81"},{"day":9,"date":"2026-10-16","number":49,"topic":"其他｜刺法：《靈樞‧終始》判斷補瀉是否有效","group":"刺法","qtype":"經典","stem":"《靈樞‧終始》：「所謂氣至而有效者，寫則益虛，虛者，脈大如其故而不堅也……補則益實，實者，脈大如其故而益堅也。」據此，施行瀉法後如何判斷「有效」？","options":[["A","患者自覺針下酸麻脹重即為有效，不需診脈"],["B","脈搏次數明顯變快"],["C","脈的大小雖與原來相同，但已不再堅實"],["D","脈由大轉小，且更加堅實"]],"answer":"C","difficulty":"高","explanation":"原文：瀉法有效時，「脈大如其故而不堅」，脈形大小不變，但堅實之象已去；如果「堅如其故者，適雖言故，病未去也」。補法有效時，「脈大如其故而益堅」，脈形不變但更有力。\n同篇強調「凡刺之道，氣調而止」，又說「補則實，寫則虛，痛雖不隨鍼，病必衰去」：判斷療效要看脈氣的虛實變化，而不只看症狀當下是否消失。","source":"《靈樞經》卷二‧終始第九","id":"D9-049","h":"fda7c80b37"},{"day":9,"date":"2026-10-16","number":50,"topic":"其他｜灸法禁忌：孕產婦（大都）","group":"灸法禁忌","qtype":"經典","stem":"《刺灸心法要訣‧足部主病針灸要穴歌》：「大都主治溫熱病，傷寒厥逆嘔悶煩，胎產百日內禁灸，千金主灸大便難。」依注文，大都穴灸法的禁忌是什麼？","options":[["A","年三十以下不宜灸"],["B","小兒百日內不宜灸"],["C","溫熱病期間一律禁灸"],["D","婦人懷孕期間及產後未滿百日都不宜灸"]],"answer":"D","difficulty":"中","explanation":"注文：「凡婦人懷孕，及生產後未滿百日，俱不宜灸。」大都是足太陰脾經滎穴（屬火），主治溫熱病汗不出、傷寒手足逆冷、腹滿嘔吐、大便難。\n易混：「年三十以外方可灸」是足三里的記載；胸腹部要穴的注文中，上脘、中脘、水分、中極、天樞也都注明「孕婦不可灸」。","source":"《刺灸心法要訣》卷七‧足部主病針灸要穴歌、胸腹部主病針灸要穴歌","id":"D9-050","h":"f4bb3c4e2c"}]}</script>

S.sts = S.sts || null;         // 難題收藏練習進度
var U = S.ui;
if (!U.mode) U.mode = 'practice';

if (U.set === undefined) U.set = META.days.length ? 'day:' + META.days[META.days.length-1].day : 'all';

var MAXDAY = META.days.length ? META.days[META.days.length-1].day : 0;
if (U.seenDay !== undefined && U.seenDay !== MAXDAY && U.mode === 'practice' && U.set !== 'all' && U.set !== 'rand'){ U.set = 'day:' + MAXDAY; U.idx = 0; U.summary = false; }
U.seenDay = MAXDAY;
// 題目內容若改變（hash 不同）則丟棄舊紀錄
// （題目不在本檔時保留，例如從較新裝置匯入的紀錄）
Object.keys(S.wb).forEach(function(id){ if (BYID[id] && (!S.wb[id] || BYID[id].h !== S.wb[id].h)) delete S.wb[id]; });
function wbCount(){ var n = 0; Q.forEach(function(q){ if (S.wb[q.id]) n++; }); return n; }
function starCount(){ var n = 0; Q.forEach(function(q){ if (S.star[q.id]) n++; }); return n; }
function save(){
  if (!lsOK) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ lsOK = false; showLsWarn(); }
}

showLsWarn();

/* ---------- 小工具 ---------- */
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined && txt !== null) e.textContent = txt; return e; }
function opt(value, label, cur){ var o = el('option', null, label); o.value = value; if (String(value) === String(cur)) o.selected = true; return o; }
function mmdd(d){ var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(d || ''); return m ? (('0'+m[2]).slice(-2) + '/' + ('0'+m[3]).slice(-2)) : (d || ''); }
function dayLabel(n){ var d = META.days.filter(function(x){ return x.day === n; })[0]; return 'Day ' + n + (d && d.date ? '（' + mmdd(d.date) + '）' : ''); }
function shuffle(a, seed){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(a, b){ return b ? Math.round(a * 1000 / b) / 10 : 0; }
function isRight(q, s){ return !!s && q.answer.indexOf(s) >= 0; }
function getAns(map, id){ var a = map && map[id]; var q = BYID[id]; if (!a || !q || a.h !== q.h) return null; return a.s; }
function uniq(arr){ var seen = {}, out = []; arr.forEach(function(x){ if (x && !seen[x]){ seen[x] = 1; out.push(x); } }); return out; }
function diffSort(a, b){ var ia = DIFF_ORDER.indexOf(a), ib = DIFF_ORDER.indexOf(b); if (ia < 0) ia = 99; if (ib < 0) ib = 99; return ia - ib || (a < b ? -1 : a > b ? 1 : 0); }
function fmtTime(ms){ ms = Math.max(0, ms); var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + ('0'+m).slice(-2) : m) + ':' + ('0'+ss).slice(-2); }
function qLabel(q){ return 'Day ' + q.day + ' 第 ' + q.number + ' 題'; }

/* ---------- 題組 ---------- */
function setPool(set){
  if (set && set.indexOf('day:') === 0){ var n = +set.slice(4); return Q.filter(function(q){ return q.day === n; }); }
  return Q.slice();
}
function applyFilters(list){
  return list.filter(function(q){
    return (!U.diff || q.difficulty === U.diff) && (!U.topic || q.group === U.topic) && (!U.qtype || q.qtype === U.qtype);
  });
}
function practiceOrder(){
  if (U.set === 'rand'){
    var key = [U.diff, U.topic, U.qtype].join('|');
    var ok = U.rand && U.randKey === key && U.rand.length && U.rand.every(function(id){ return BYID[id]; });
    if (!ok){ U.rand = shuffle(applyFilters(Q)).slice(0, 50).map(function(q){ return q.id; }); U.randKey = key; save(); }
    return U.rand.map(function(id){ return BYID[id]; });
  }
  if (U.set !== 'all' && !(U.set && U.set.indexOf('day:') === 0 && META.days.some(function(d){ return 'day:' + d.day === U.set; }))) U.set = 'all';
  return applyFilters(setPool(U.set));
}

/* ---------- Session 抽象 ---------- */
function getSession(){
  if (U.mode === 'practice'){
    var list = practiceOrder();
    return { kind:'practice', list:list, map:S.ans, reveal:true, lock:true,
      getIdx:function(){ return U.idx; }, setIdx:function(i){ U.idx = i; },
      summary:function(v){ if (v === undefined) return !!U.summary; U.summary = v; },
      onAnswer:function(q, k){ S.ans[q.id] = {s:k, h:q.h, t:Date.now()}; var r = isRight(q, k); noteResult(q, r); if (!r) addWrong(q); }
    };
  }
  if (U.mode === 'wrong'){
    if (!S.wbs) S.wbs = newWrongSession();
    var w = S.wbs;
    return { kind:'wrong', list:w.order.map(function(id){ return BYID[id]; }).filter(Boolean), map:w.ans, reveal:true, lock:true,
      getIdx:function(){ return w.idx || 0; }, setIdx:function(i){ w.idx = i; },
      summary:function(v){ if (v === undefined) return !!w.summary; w.summary = v; },
      onAnswer:function(q, k){ w.ans[q.id] = {s:k, h:q.h}; var r = isRight(q, k); noteResult(q, r); if (r) delete S.wb[q.id]; else addWrong(q); }
    };
  }
  if (U.mode === 'star'){
    if (!S.sts) S.sts = newStarSession();
    var z = S.sts;
    return { kind:'star', list:z.order.map(function(id){ return BYID[id]; }).filter(Boolean), map:z.ans, reveal:true, lock:true,
      getIdx:function(){ return z.idx || 0; }, setIdx:function(i){ z.idx = i; },
      summary:function(v){ if (v === undefined) return !!z.summary; z.summary = v; },
      // 收藏練習：獨立作答紀錄，不覆寫「練習」；答對不會自動移出收藏
      onAnswer:function(q, k){ z.ans[q.id] = {s:k, h:q.h}; var r = isRight(q, k); noteResult(q, r); if (!r) addWrong(q); }
    };
  }
  var e = S.exam;
  if (!e || e.state === 'setup') return null;
  var done = e.state === 'done';
  return { kind:'exam', list:e.order.map(function(id){ return BYID[id]; }).filter(Boolean), map:e.ans, reveal:done, lock:done,
    getIdx:function(){ return e.idx || 0; }, setIdx:function(i){ e.idx = i; },
    summary:function(v){ if (v === undefined) return !!e.summary; e.summary = v; },
    onAnswer:function(q, k){ if (e.ans[q.id] && e.ans[q.id].s === k) delete e.ans[q.id]; else e.ans[q.id] = {s:k, h:q.h}; }
  };
}
function addWrong(q){ var w = S.wb[q.id]; S.wb[q.id] = {n:(w && w.h === q.h ? w.n : 0) + 1, h:q.h, t:Date.now()}; }
function noteResult(q, right){ var st = S.star[q.id]; if (!st) return; st.streak = right ? (st.streak || 0) + 1 : 0; st.tries = (st.tries || 0) + 1; st.u = Date.now(); }
function starFilteredIds(){
  return Q.filter(function(q){ return S.star[q.id] && (!U.stDay || 'day:' + q.day === U.stDay) && (!U.stTopic || q.group === U.stTopic); }).map(function(q){ return q.id; });
}
function newStarSession(){ return {order:starFilteredIds(), ans:{}, idx:0, summary:false}; }
var toastTimer = null;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600); }
function toggleStar(q, on){
  var has = !!S.star[q.id]; if (on === undefined) on = !has; if (on === has) return;
  if (on) S.star[q.id] = {t:Date.now(), u:Date.now(), streak:0, tries:0}; else delete S.star[q.id];
  save(); toast(on ? '★ 已加入難題收藏' : '已移出難題收藏');
  var sess = getSession(); renderTabs();
  if (U.mode === 'star') renderCtrl();
  if (sess){ var i = sess.list.indexOf(q), old = document.getElementById('card-' + i); if (old) old.parentNode.replaceChild(buildCard(q, i, sess), old); refreshGrid(sess); }
}
function newWrongSession(){
  var ids = Q.filter(function(q){ return S.wb[q.id]; }).map(function(q){ return q.id; });
  return {order:ids, ans:{}, idx:0, summary:false};
}
function stats(sess){
  var r = {total:sess.list.length, answered:0, right:0, wrong:0};
  sess.list.forEach(function(q){ var s = getAns(sess.map, q.id); if (s){ r.answered++; if (isRight(q, s)) r.right++; else r.wrong++; } });
  return r;
}

var ctrl = document.getElementById('ctrl'), main = document.getElementById('main'), sticky = document.getElementById('stickyBar');
function renderTabs(){

}
function filterSelects(box, onchange){
  var base = U.set === 'rand' ? Q : setPool(U.set);
  function mk(label, key, values, counter){
    var l = el('label', null, label), s = el('select');
    s.appendChild(opt('', '全部', U[key]));
    values.forEach(function(v){ s.appendChild(opt(v, v + '（' + counter(v) + '）', U[key])); });
    s.addEventListener('change', function(){ U[key] = s.value; onchange(); });
    l.appendChild(s); box.appendChild(l);
  }
  var diffs = uniq(base.map(function(q){ return q.difficulty; })).sort(diffSort);
  mk('難度', 'diff', diffs, function(v){ return base.filter(function(q){ return q.difficulty === v; }).length; });
  var groups = uniq(base.map(function(q){ return q.group; }));
  if (U.topic && groups.indexOf(U.topic) < 0) U.topic = '';
  if (U.diff && diffs.indexOf(U.diff) < 0) U.diff = '';
  mk('主題', 'topic', groups, function(v){ return base.filter(function(q){ return q.group === v; }).length; });
  var types = uniq(base.map(function(q){ return q.qtype; }));
  if (U.qtype && types.indexOf(U.qtype) < 0) U.qtype = '';
  if (types.length > 1) mk('題型', 'qtype', types, function(v){ return base.filter(function(q){ return q.qtype === v; }).length; });
}
function viewSeg(){

    b.addEventListener('click', function(){ U.view = p[0]; save(); render(); });

}

    r2.appendChild(clr);

/* ---------- 題目卡 ---------- */
function buildCard(q, i, sess){
  var card = el('article', 'card'); card.id = 'card-' + i; card.setAttribute('data-i', i);
  var sel = getAns(sess.map, q.id), shown = sess.reveal && (!!sel || sess.kind === 'exam');
  var starred = !!S.star[q.id], head = el('div', 'card-head'), hc = el('div', 'chips');
  hc.appendChild(el('span', 'chip num', (i + 1) + ' / ' + sess.list.length));
  hc.appendChild(el('span', 'chip', qLabel(q)));
  head.appendChild(hc);
  var sb = el('button', 'star-btn' + (starred ? ' on' : ''), starred ? '★ 已收藏' : '☆ 收藏難題'); sb.type = 'button';
  sb.title = '收藏難題（快捷鍵 S）'; sb.setAttribute('aria-pressed', starred ? 'true' : 'false');
  sb.addEventListener('click', function(){ toggleStar(q); });
  head.appendChild(sb); card.appendChild(head);
  var chips = el('div', 'chips');
  if (q.qtype) chips.appendChild(el('span', 'chip', q.qtype));
  if (q.group) chips.appendChild(el('span', 'chip', q.group));
  if (shown && q.difficulty) chips.appendChild(el('span', 'chip d-' + q.difficulty, '難度 ' + q.difficulty));
  if (sess.kind === 'wrong' && S.wb[q.id]) chips.appendChild(el('span', 'chip', '錯 ' + S.wb[q.id].n + ' 次'));
  if (sess.kind === 'star' && starred) chips.appendChild(el('span', 'chip', '已連續答對 ' + (S.star[q.id].streak || 0) + ' 次'));
  if (chips.childNodes.length) card.appendChild(chips);
  card.appendChild(el('div', 'stem', q.stem));
  var box = el('div', 'opts');
  q.options.forEach(function(o){
    var k = o[0], b = el('button', 'opt'); b.type = 'button'; b.setAttribute('data-k', k);
    b.appendChild(el('span', 'k', k)); b.appendChild(el('span', 't', o[1]));
    if (shown){
      if (q.answer.indexOf(k) >= 0){ b.classList.add('right'); b.appendChild(el('span', 'mk', '✓ 正解')); }
      else if (k === sel){ b.classList.add('wrong'); b.appendChild(el('span', 'mk', '✗')); }
    } else if (k === sel) b.classList.add('sel');
    if (sess.lock && (sel || shown)) b.disabled = true;
    b.setAttribute('aria-pressed', k === sel ? 'true' : 'false');
    b.addEventListener('click', function(){ answer(q, k); });
    box.appendChild(b);
  });
  card.appendChild(box);
  if (!sess.reveal && sel){
    if (!starred){ var qe = el('button', 'quick-star', '🤔 猜的／沒把握 → 加入難題收藏'); qe.type = 'button'; qe.addEventListener('click', function(){ toggleStar(q, true); }); card.appendChild(qe); }
    else card.appendChild(el('div', 'star-note', '★ 已收藏，交卷後可在「難題收藏」複習。'));
  }
  if (shown){
    var right = isRight(q, sel);

function answer(q, k){

  save();
  var i = sess.list.indexOf(q);

/* ---------- 進度列／計時 ---------- */
var timerId = null;
function renderSticky(sess){
  sticky.innerHTML = '';
  if (!sess || !sess.list.length || sess.summary()){ sticky.classList.add('hide'); return; }
  sticky.classList.remove('hide');
  var st = stats(sess), p = el('div', 'prog');
  if (sess.kind === 'exam' && S.exam.state === 'running'){
    p.appendChild(el('span', null, '已作答 ' + st.answered + ' / ' + st.total));
    var t = el('span', 'timer', ''); t.id = 'timer'; p.appendChild(t);
  } else {
    p.appendChild(el('span', null, '已作答 ' + st.answered + ' / ' + st.total));
    p.appendChild(el('span', null, '答對 ' + st.right + '　答錯 ' + st.wrong + (st.answered ? '　正確率 ' + pct(st.right, st.answered) + '%' : '')));
  }
  sticky.appendChild(p);

    var a = el('i', 'b-ok'); a.style.width = pct(st.right, st.total) + '%'; bar.appendChild(a);

  } else { var c = el('i', 'b-ans'); c.style.width = pct(st.answered, st.total) + '%'; bar.appendChild(c); }
  sticky.appendChild(bar);
  tickTimer();
}
function tickTimer(){
  var e = S.exam;
  if (!e || e.state !== 'running'){ if (timerId){ clearInterval(timerId); timerId = null; } return; }
  var left = e.start + e.dur * 60000 - Date.now();
  var t = document.getElementById('timer');
  if (t){ t.textContent = '⏱ ' + fmtTime(left); t.classList.toggle('low', left < 5 * 60000); }
  if (left <= 0){ submitExam(true); return; }
  if (!timerId) timerId = setInterval(tickTimer, 1000);
}
function submitExam(auto){
  var e = S.exam; if (!e || e.state !== 'running') return;
  if (!auto){
    var sess = getSession(), st = stats(sess), un = st.total - st.answered;
    if (!confirm(un ? '還有 ' + un + ' 題未作答，確定交卷？' : '確定交卷？')) return;
  }
  e.state = 'done'; e.end = Math.min(Date.now(), e.start + e.dur * 60000); e.summary = true; e.auto = !!auto;
  e.order.forEach(function(id){ var q = BYID[id], s = getAns(e.ans, id); if (!q || !s) return; var r = isRight(q, s); noteResult(q, r); if (!r) addWrong(q); });
  if (timerId){ clearInterval(timerId); timerId = null; }
  save(); render(); window.scrollTo(0, 0);
  if (auto) setTimeout(function(){ alert('時間到，已自動交卷。'); }, 50);
}

document.getElementById('tabs').addEventListener('click', function(ev){

  U.mode = m;

    // 錯題本若有新增題目且目前進度已全部作答完，自動載入最新錯題
    if (!cur || (cur.order.every(function(id){ return getAns(cur.ans, id); }) && ids.join() !== cur.order.join())) S.wbs = newWrongSession(); }
  if (m === 'star'){ var z = S.sts, sids = starFilteredIds();
    // 尚未作答或已全部作答完時，自動載入最新收藏清單
    if (!z || (sids.join() !== z.order.join() && (!Object.keys(z.ans).length || z.order.every(function(id){ return getAns(z.ans, id); })))) S.sts = newStarSession(); }

});
document.getElementById('wipeAll').addEventListener('click', function(){
  if (!confirm('確定清除所有作答紀錄、錯題本、難題收藏與模擬考？此動作無法復原。\n（建議先用「匯出／匯入紀錄」備份）')) return;
  S = {ans:{}, wb:{}, star:{}, ui:{mode:'practice', view:U.view, set:U.set, diff:'', topic:'', qtype:'', idx:0, seenDay:U.seenDay}, wbs:null, sts:null, exam:null}; U = S.ui;

document.addEventListener('keydown', function(ev){
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var tg = ev.target && ev.target.tagName; if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  if (document.getElementById('ioOverlay')) { if (ev.key === 'Escape') closeIO(); return; }
  var sess = getSession(); if (!sess || !sess.list.length || sess.summary() || U.view !== 'single') return;
  var idx = sess.getIdx(), q = sess.list[idx], key = ev.key;
  if (key === 's' || key === 'S'){ toggleStar(q); ev.preventDefault(); return; }
  if (key === 'ArrowRight'){ if (idx < sess.list.length - 1) goTo(idx + 1); ev.preventDefault(); return; }
  if (key === 'ArrowLeft'){ if (idx > 0) goTo(idx - 1); ev.preventDefault(); return; }
  var k = null;
  if (/^[1-8]$/.test(key)) k = q.options[+key - 1] && q.options[+key - 1][0];
  else if (/^[a-hA-H]$/.test(key)) k = key.toUpperCase();
  if (k && q.options.some(function(o){ return o[0] === k; })){ answer(q, k); ev.preventDefault(); }
});
/* ---------- 匯出／匯入 ---------- */
function safeKey(k){ return typeof k === 'string' && k.length > 0 && k.length <= 120 && k !== '__proto__' && k !== 'constructor' && k !== 'prototype'; }
function num(v){ return typeof v === 'number' && isFinite(v) ? v : 0; }
var CLEAN = {
  ans: function(v){ return (v && typeof v.s === 'string' && /^[A-H]$/.test(v.s) && typeof v.h === 'string') ? {s:v.s, h:v.h.slice(0, 40), t:num(v.t)} : null; },
  wb: function(v){ return (v && typeof v.h === 'string') ? {n:Math.max(1, Math.min(9999, Math.floor(num(v.n)) || 1)), h:v.h.slice(0, 40), t:num(v.t)} : null; },
  star: function(v){ return (v && typeof v === 'object') ? {t:num(v.t) || Date.now(), u:num(v.u) || num(v.t), streak:Math.max(0, Math.floor(num(v.streak))), tries:Math.max(0, Math.floor(num(v.tries)))} : null; }
};
function newer(kind, a, b){ // a 是否比 b 新
  if (kind === 'wb') return a.n > b.n || (a.n === b.n && a.t > (b.t || 0));
  if (kind === 'star') return a.u > (b.u || b.t || 0);
  return a.t > (b.t || 0);
}
function exportObj(){ return {app:'acuQuiz', v:1, exportedAt:new Date().toISOString(), data:{ans:S.ans, wb:S.wb, star:S.star}}; }
function doImport(text, mode){
  if (text.length > 5e6) throw new Error('內容過大');
  var o = JSON.parse(text);
  var d = o && o.data && typeof o.data === 'object' ? o.data : o;
  if (!d || typeof d !== 'object' || !(d.ans || d.wb || d.star)) throw new Error('不是本練習頁匯出的紀錄（找不到 ans／wb／star）');
  if (o.app && o.app !== 'acuQuiz') throw new Error('不是本練習頁匯出的紀錄');
  var next = mode === 'replace' ? {ans:{}, wb:{}, star:{}} : {ans:JSON.parse(JSON.stringify(S.ans)), wb:JSON.parse(JSON.stringify(S.wb)), star:JSON.parse(JSON.stringify(S.star))};
  var cnt = {ans:0, wb:0, star:0};
  ['ans', 'wb', 'star'].forEach(function(kind){
    var src = d[kind]; if (!src || typeof src !== 'object' || Array.isArray(src)) return;
    Object.keys(src).forEach(function(id){
      if (!safeKey(id)) return;
      var v = CLEAN[kind](src[id]); if (!v) return;
      var cur = Object.prototype.hasOwnProperty.call(next[kind], id) ? next[kind][id] : null;
      if (!cur || newer(kind, v, cur)) next[kind][id] = v;
      cnt[kind]++;
    });
  });
  S.ans = next.ans; S.wb = next.wb; S.star = next.star; S.wbs = null; S.sts = null;
  save(); return cnt;
}
function closeIO(){ var o = document.getElementById('ioOverlay'); if (o) o.parentNode.removeChild(o); render(); }
function openIO(){
  if (document.getElementById('ioOverlay')) return;
  var ov = el('div', 'overlay'); ov.id = 'ioOverlay';
  var m = el('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.appendChild(el('h3', null, '匯出／匯入紀錄'));
  m.appendChild(el('div', 'note', '包含：練習作答、錯題本、難題收藏。把匯出的檔案或文字帶到另一台裝置的同一個練習頁匯入即可。'));
  var json = JSON.stringify(exportObj());
  m.appendChild(el('h4', null, '匯出（目前：作答 ' + Object.keys(S.ans).length + '、錯題 ' + wbCount() + '、收藏 ' + starCount() + '）'));
  var ta = el('textarea'); ta.readOnly = true; ta.value = json; ta.id = 'ioExport'; m.appendChild(ta);
  var r1 = el('div', 'row'); r1.style.marginTop = '8px';
  var dl = el('button', 'btn sm pri', '下載 .json 檔'); dl.type = 'button';
  dl.addEventListener('click', function(){
    try {
      var blob = new Blob([json], {type:'application/json'}), a = document.createElement('a'), d = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = '針灸題庫紀錄_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch(e){ msg.className = 'msg ng'; msg.textContent = '無法下載，請改用「複製文字」。'; }
  });
  var cp = el('button', 'btn sm', '複製文字'); cp.type = 'button';
  cp.addEventListener('click', function(){
    function fallback(){ ta.focus(); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} msg.className = 'msg ' + (ok ? 'ok' : 'ng'); msg.textContent = ok ? '已複製。' : '請手動全選上方文字後複製。'; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(json).then(function(){ msg.className = 'msg ok'; msg.textContent = '已複製。'; }, fallback); else fallback();
  });
  r1.appendChild(dl); r1.appendChild(cp); m.appendChild(r1);
  m.appendChild(el('h4', null, '匯入'));
  var fi = el('input'); fi.type = 'file'; fi.accept = '.json,.txt,application/json,text/plain'; fi.id = 'ioFile'; fi.style.fontSize = '14px'; fi.style.maxWidth = '100%';
  m.appendChild(fi);
  var ti = el('textarea'); ti.id = 'ioImport'; ti.placeholder = '或把匯出的文字貼在這裡'; ti.style.marginTop = '8px'; m.appendChild(ti);
  fi.addEventListener('change', function(){ var f = fi.files && fi.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ ti.value = String(rd.result || ''); }; rd.readAsText(f); });
  var rw = el('div'); rw.style.marginTop = '6px';
  [['merge', '合併（保留兩邊，較新的優先）', true], ['replace', '取代（以匯入內容覆蓋本機）', false]].forEach(function(x){
    var lb = el('label', 'rad'), rb = el('input'); rb.type = 'radio'; rb.name = 'ioMode'; rb.value = x[0]; rb.checked = x[2];
    lb.appendChild(rb); lb.appendChild(document.createTextNode(x[1])); rw.appendChild(lb);
  });
  m.appendChild(rw);
  var r2 = el('div', 'row'); r2.style.marginTop = '8px';
  var im = el('button', 'btn sm pri', '匯入'); im.type = 'button'; im.id = 'ioDoImport';
  im.addEventListener('click', function(){
    var text = ti.value.trim(); if (!text){ msg.className = 'msg ng'; msg.textContent = '請先選擇檔案或貼上文字。'; return; }
    var mode = (m.querySelector('input[name=ioMode]:checked') || {}).value || 'merge';
    if (mode === 'replace' && !confirm('取代會清除本機現有的作答、錯題本與難題收藏，確定？')) return;
    try { var c = doImport(text, mode); msg.className = 'msg ok'; msg.textContent = '匯入完成：作答 ' + c.ans + '、錯題 ' + c.wb + '、收藏 ' + c.star + ' 筆。\n目前：錯題本 ' + wbCount() + ' 題、難題收藏 ' + starCount() + ' 題。'; renderTabs(); }
    catch(e){ msg.className = 'msg ng'; msg.textContent = '匯入失敗：' + (e && e.message ? e.message : e) + '\n本機紀錄未變更。'; }
  });
  var cl = el('button', 'btn sm', '關閉'); cl.type = 'button'; cl.id = 'ioClose'; cl.addEventListener('click', closeIO);
  r2.appendChild(im); r2.appendChild(cl); m.appendChild(r2);
  var msg = el('div', 'msg'); msg.id = 'ioMsg'; m.appendChild(msg);
  if (!lsOK) m.appendChild(el('div', 'warn', '注意：此瀏覽器無法永久儲存，匯入的紀錄關閉頁面後會消失。'));
  ov.appendChild(m);
  ov.addEventListener('click', function(ev){ if (ev.target === ov) closeIO(); });
  document.body.appendChild(ov);
}
document.getElementById('ioBtn').addEventListener('click', openIO);
document.getElementById('ioBtn2').addEventListener('click', openIO);
window.addEventListener('pageshow', tickTimer);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tickTimer(); });
render();
})();
</script>
